<script>
  (function() {
    // PALETA "SYNTHWAVE": Solo colores fríos y neones que combinan con la galaxia
    const colors = [
      "#00f3ff", "#0066ff", "#bc13fe", 
      "#ff0055", "#bc13fe", "#0066ff", "#00f3ff" 
    ];

    const animationDuration = 20000; 
    const intervalTime = 20; 
    const segments = colors.length - 1;
    const step = (intervalTime / animationDuration) * segments;

    let currentProgress = 0;
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if (!metaTag) {
      metaTag = document.createElement('meta');
      metaTag.name = "theme-color";
      document.head.appendChild(metaTag);
    }

    const hexToRgb = (hex) => {
      const bigint = parseInt(hex.slice(1), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    };
    
    const rgbToHex = (r, g, b) => {
      return "#" + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join('');
    };

    const lerp = (start, end, t) => start + (end - start) * t;
    
    setInterval(() => {
      currentProgress += step;
      if (currentProgress >= segments) {
        currentProgress = currentProgress % segments;
      }

      const index = Math.floor(currentProgress);
      const t = currentProgress - index;
      const colorStart = hexToRgb(colors[index]);
      const colorEnd = hexToRgb(colors[index + 1]);

      const r = lerp(colorStart[0], colorEnd[0], t);
      const g = lerp(colorStart[1], colorEnd[1], t);
      const b = lerp(colorStart[2], colorEnd[2], t);

      metaTag.setAttribute('content', rgbToHex(r, g, b));
    }, intervalTime);
  })();
</script>

    :root {
        --primary-color: #00fff7;
        --accent-color: #ff0055;
        --text-color: #ffffff;
        --glass-bg: rgba(0, 0, 0, 0.7);
        --glass-border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* --- ESTILOS GENERALES --- */
    body { 
        margin: 0;
        background: #050505; 
        color: var(--text-color); 
        font-family: 'Poppins', sans-serif; 
        overflow-x: hidden; 
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
        outline: none;
    }
   
    /* --- FONDO DE VIDEO --- */
    #bg-video { 
        position: fixed;
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        object-fit: cover;
        z-index: -10; 
        opacity: 0.5;
    }

    /* --- OVERLAY --- */
    #overlay {
      position: fixed;
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      z-index: -5;
      background: radial-gradient(circle at center, rgba(123, 44, 191, 0.15) 0%, #000000 90%);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    
    /* --- CONTENEDOR PRINCIPAL --- */
    .container { 
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 15px;
        position: relative;
        z-index: 10;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    /* --- NAVEGACIÓN SUPERIOR --- */
    .top-nav {
        display: flex;
        justify-content: space-between; 
        align-items: center;
        margin-bottom: 5px;
        flex-wrap: wrap;
        gap: 10px;
        background: linear-gradient(to bottom, rgba(140, 82, 255, 0.3), transparent);
        padding: 10px;
        border-radius: 0 0 15px 15px;
        border-bottom: 1px solid rgba(140, 82, 255, 0.2);
    }

    /* BOTÓN VOLVER (ESTILO NEON) */
    .back-btn { 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #eee;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 50px;
      border: 1px solid rgba(0, 255, 247, 0.3);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .back-btn:hover {
        background: rgba(0, 255, 247, 0.15);
        border-color: var(--primary-color);
        color: #fff;
        box-shadow: 0 0 20px var(--primary-color), inset 0 0 10px rgba(0, 255, 247, 0.2);
        transform: translateY(-2px);
        text-shadow: 0 0 5px var(--primary-color);
    }
   
    /* --- REPRODUCTOR --- */
    .player-wrapper { 
        position: relative;
        padding-bottom: 56.25%; /* 16:9 */
        height: 0; 
        width: 100%; 
        background: #000;
        overflow: hidden;
        z-index: 50;
        border-radius: 16px; 
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
   
    .player-wrapper iframe, .player-wrapper video { 
        position: absolute;
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        border: none;
    }

    /* --- TIRA PROTECTORA (LOGO BLOCKER) --- */
    .logo-blocker {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 14%; 
        min-height: 45px;
        background: linear-gradient(to bottom, rgba(5, 5, 5, 1) 0%, rgba(5, 5, 5, 0.85) 40%, transparent 100%);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 100; 
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 1.5%; 
        pointer-events: auto;
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        user-select: none; 
        opacity: 1;
        visibility: visible;
    }

    .logo-blocker::after {
        content: '';
        position: absolute;
        bottom: 25%;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
        opacity: 0.3;
    }

        display: flex;
        align-items: baseline;
        gap: 8px;
    }

        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: clamp(1rem, 2.5vw, 1.4rem); 
        color: #fff;
        letter-spacing: 5px;
        text-transform: uppercase;
        text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color);
        animation: neonPulse 2s infinite alternate;
    }

    .blocker-sub {
        font-family: 'Poppins', sans-serif;
        font-size: clamp(0.6rem, 1.2vw, 0.8rem);
        color: var(--accent-color);
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 0 8px var(--accent-color);
    }

    @keyframes neonPulse {
        0% { opacity: 0.8; text-shadow: 0 0 5px var(--primary-color), 0 0 10px var(--primary-color); }
        100% { opacity: 1; text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color), 0 0 30px var(--primary-color); }
    }

    /* --- OPCIONES DE SERVIDOR --- */
    .options { 
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }

        padding: 6px 14px;
        border: 1px solid rgba(255,255,255,0.2); 
        background: rgba(0, 0, 0, 0.6);
        color: #ccc;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-family: 'Poppins', sans-serif;
        font-weight: 500;
    }
    
    .opt-btn:hover {

        color: #fff;
    }

        color: #000;
        background: var(--primary-color);

        align-items: center;
        gap: 15px; 
        margin-top: 10px;
        padding-bottom: 20px;

        border: 1px solid rgba(255, 255, 255, 0.1);

        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        backdrop-filter: blur(5px);
        font-weight: 600;
        min-width: 100px;
    }
    
    .nav-btn { border-color: rgba(0, 255, 247, 0.3); }

    .nav-btn:hover {

        border-color: var(--primary-color);
        color: #fff;

        transform: scale(1.05);
        text-shadow: 0 0 8px var(--primary-color);
    }

    #downloadBtn {

        background: rgba(255, 0, 85, 0.05);
        min-width: 140px;
    }

    #downloadBtn:hover {

        border-color: var(--accent-color);
        color: #fff;
        box-shadow: 0 0 30px var(--accent-color), inset 0 0 10px rgba(255, 0, 85, 0.2);
        transform: scale(1.05);
        text-shadow: 0 0 8px var(--accent-color);
    }

    .btn-hidden { 
        visibility: hidden;
        pointer-events: none;
    }

    /* --- COMENTARIOS --- */
    .comments-section {
        margin-top: 30px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 16px;
        padding: 20px;
        border: 1px solid rgba(0, 255, 247, 0.2);
    }
    .comments-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--primary-color);
    }
    .comment-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 25px;
        background: rgba(0, 0, 0, 0.4);
        padding: 15px;
        border-radius: 12px;
    }
    .comment-input-wrapper {
        display: flex;
        gap: 10px;
        align-items: flex-start;
    }
    .comment-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--primary-color);
    }
    .comment-input {
        flex: 1;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 20px;
        padding: 10px 15px;
        color: white;
        font-family: 'Poppins', sans-serif;
        resize: vertical;
        font-size: 0.9rem;
    }
    .comment-input:focus {
        outline: none;
        border-color: var(--primary-color);
    }
    .comment-toolbar {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        align-items: center;
    }
    .tool-btn {
        background: rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 30px;
        padding: 6px 12px;
        color: #ccc;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .tool-btn:hover {
        background: rgba(0, 255, 247, 0.2);
        color: white;
        border-color: var(--primary-color);
    }
    .comment-submit {
        background: var(--primary-color);
        color: #000;
        border: none;
        padding: 8px 20px;
        border-radius: 30px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }
    .comment-submit:hover {
        transform: scale(1.02);
        box-shadow: 0 0 10px var(--primary-color);
    }
    /* Emoji picker */
    .emoji-picker {
        position: absolute;
        background: #1a1a2e;
        border: 1px solid var(--primary-color);
        border-radius: 12px;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        z-index: 200;
        max-width: 250px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .emoji-picker span {
        font-size: 1.5rem;
        cursor: pointer;
        text-align: center;
        transition: 0.1s;
    }
    .emoji-picker span:hover {
        transform: scale(1.2);
    }
    /* GIF Modal */
    .gif-modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }
    .gif-modal-content {
        background: #0f0f1a;
        border-radius: 16px;
        width: 90%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
        padding: 20px;
        border: 1px solid var(--primary-color);
    }
    .gif-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 15px;
    }
    .gif-item {
        cursor: pointer;
        border-radius: 8px;
        overflow: hidden;
        transition: 0.2s;
    }
    .gif-item img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
    }
    .gif-item:hover {
        transform: scale(1.05);
        border: 2px solid var(--primary-color);
    }
    .close-gif {
        float: right;
        font-size: 1.5rem;
        cursor: pointer;
        color: #aaa;
    }
    /* Lista de comentarios */
    .comments-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-height: 500px;
        overflow-y: auto;
        padding-right: 5px;
    }
    .comment-item {
        background: rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 12px;
        transition: 0.2s;
    }
    .comment-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
    }
    .comment-avatar-small {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
    }
    .comment-user {
        font-weight: 600;
        color: var(--primary-color);
    }
    .comment-date {
        font-size: 0.7rem;
        color: #aaa;
        margin-left: auto;
    }
    .comment-text {
        margin-left: 48px;
        word-break: break-word;
        white-space: pre-wrap;
        font-size: 0.9rem;
    }
    .comment-gif {
        margin-left: 48px;
        margin-top: 8px;
        max-width: 200px;
        border-radius: 8px;
    }
    .comment-delete {
        float: right;
        background: none;
        border: none;
        color: #ff0055;
        cursor: pointer;
        font-size: 0.8rem;
        opacity: 0.6;
        transition: 0.2s;
    }
    .comment-delete:hover {
        opacity: 1;
    }
    .no-comments {
        text-align: center;
        color: #aaa;
        padding: 20px;
        font-style: italic;
    }
    .load-more-btn {
        background: transparent;
        border: 1px solid var(--primary-color);
        color: var(--primary-color);
        padding: 8px;
        border-radius: 30px;
        margin-top: 15px;
        cursor: pointer;
        width: 100%;
        text-align: center;
    }

    /* --- MEDIA QUERIES --- */
    @media (max-width: 768px) {
        .container { padding: 10px; }
        .top-nav { justify-content: space-between; }
        .options {
            overflow-x: auto;
            white-space: nowrap;
            -ms-overflow-style: none;
            scrollbar-width: none;
            max-width: 60%;
        }
        .options::-webkit-scrollbar { display: none; }

        .controls {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto; 
            gap: 10px;
        }

        #prevBtn { grid-column: 1; grid-row: 1; justify-self: start; width: auto; }
        #nextBtn { grid-column: 2; grid-row: 1; justify-self: end; width: auto; }
        #downloadBtn { grid-column: 1 / -1; grid-row: 2; width: 100%; box-sizing: border-box; }
        
        .logo-blocker {
            height: 20%;
            min-height: 60px;
            padding-top: 4%;
        }
        .comment-input-wrapper {
            flex-direction: column;
        }
        .comment-avatar {
            display: none;
        }
        .comment-text {
            margin-left: 0;
        }
        .comment-gif {
            margin-left: 0;
        }
    }
  </style>
</head>

    function isTabletDevice() {
        const ua = navigator.userAgent.toLowerCase();
        const isIpad = /ipad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroidTablet = /android/i.test(ua) && !/mobile/i.test(ua);
        const isGenericTablet = /tablet/i.test(ua);
        return isIpad || isAndroidTablet || isGenericTablet;
    }

    function isMobileDevice() {
        return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent.toLowerCase());
    }

    // --- FORZAR LA DESCARGA OCULTA EN SEGUNDO PLANO ---
    function forceDownload(url) {
        let iframe = document.getElementById('hiddenDownloader');
        if (!iframe) {
            iframe = document.createElement('iframe');
            iframe.id = 'hiddenDownloader';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
        }
        iframe.src = url;
    }

    // --- LÓGICA DE DESCARGA ---
    function generateDirectDownloadLink(url) {
        if (!url) return "#";
        if (url.includes("drive.google.com")) {
            const match = url.match(/\/d\/(.+?)\//);
            if (match && match[1]) {
               return `https://drive.usercontent.google.com/download?id=${match[1]}&export=download&authuser=0`;
            }
            const altMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (altMatch && altMatch[1]) {
               return `https://drive.usercontent.google.com/download?id=${altMatch[1]}&export=download&authuser=0`;
            }
        }
        if (url.includes("dropbox.com") && url.includes("dl=0")) {
             return url.replace('dl=0', 'dl=1');
        }
        if (url.includes("ok.ru/")) {
            const match = url.match(/ok\.ru\/video(?:embed)?\/(\d+)/);
            if (match && match[1]) {
                return `https://anydownloader.com/en/#url=https://ok.ru/video/${match[1]}`;
            }
        }
        if (url.includes("odysee.com")) {
            let claimStr = url.split("/embed/")[1];
            if (claimStr) {
                if (claimStr.includes('/')) {
                    claimStr = claimStr.split('/').pop();
                }
                claimStr = claimStr.replace(':', '/');
                return `https://odysee.com/$/download/${claimStr}`;
            }
            return url;
        }
        return url;
    }

    function updateDownloadButton(url) {
        const dlBtn = document.getElementById('downloadBtn');
        dlBtn.onclick = null;
        dlBtn.removeAttribute("target");
        
        const directLink = generateDirectDownloadLink(url);
        dlBtn.href = directLink || '#';

        if(directLink && directLink !== '#') {
            if (directLink.includes("anydownloader.com")) {
                dlBtn.setAttribute("target", "_blank");
            } else if (url.includes("odysee.com")) {
                dlBtn.onclick = function(e) {
                    if (isTabletDevice()) {
                        e.preventDefault();
                        prompt("Tu dispositivo es una Tablet. Copia el siguiente enlace y pégalo manualmente en una nueva pestaña para descargar el episodio:", directLink);
                    } else if (isMobileDevice()) {
                        dlBtn.setAttribute("target", "_blank"); 
                    } else {
                        e.preventDefault();
                        forceDownload(directLink);
                    }
                };
            }
        }
    }

    function createOptionBtn(label, url, isActive) {
        const optContainer = document.getElementById('serverOptions');
        const btn = document.createElement('button');
        const isFirst = optContainer.children.length === 0;
        const shouldBeActive = isActive || isFirst;
        btn.className = 'opt-btn' + (shouldBeActive ? ' active' : '');
        btn.innerText = label;
        btn.onclick = () => {
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDownloadButton(url);
            loadVideo(url);
        };
        optContainer.appendChild(btn);
    }

    function loadVideo(url) {
        const container = document.getElementById('mediaContainer');
        container.innerHTML = ''; 
        if (!url) return;

        const isVideoFile = /\.(mp4|webm|ogg|mov|m3u8)$/i.test(url);
        const isDrive = url.includes('drive.google.com') && url.includes('/preview');
        
        if (isVideoFile && !isDrive) {
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.autoplay = false;
            video.playsInline = true; 
            video.style.width = "100%";
            video.style.height = "100%";
            video.onerror = function() { loadAsIframe(url, container); };
            container.appendChild(video);
        } else {
            loadAsIframe(url, container);
        }
    }

    function loadAsIframe(url, container) {
        container.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
        iframe.setAttribute("allowfullscreen", "true");
        iframe.style.position = "absolute";
        iframe.style.top = "0";
        iframe.style.left = "0";
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        container.appendChild(iframe);
    }

    function setupNavigation() {
        try {
            if (DB[animeId]) {
                let flatList = [];
                const seasons = Object.keys(DB[animeId]).sort((a, b) => Number(a) - Number(b));
                seasons.forEach(sKey => {
                    const episodes = Object.keys(DB[animeId][sKey]).sort((a, b) => Number(a) - Number(b));
                    episodes.forEach(eKey => {
                        flatList.push({ s: sKey, e: eKey });
                    });
                });
                
                const currentIndex = flatList.findIndex(item => String(item.s) === String(season) && String(item.e) === String(episode));
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                if (currentIndex > 0) {
                    const prevItem = flatList[currentIndex - 1];
                    prevBtn.classList.remove('btn-hidden');
                    prevBtn.href = `?anime=${animeId}&s=${prevItem.s}&e=${prevItem.e}`;
                } else {
                    prevBtn.classList.add('btn-hidden');
                }

                if (currentIndex !== -1 && currentIndex < flatList.length - 1) {
                    const nextItem = flatList[currentIndex + 1];
                    nextBtn.classList.remove('btn-hidden');
                    nextBtn.href = `?anime=${animeId}&s=${nextItem.s}&e=${nextItem.e}`;
                } else {
                    nextBtn.classList.add('btn-hidden');
                }
            }
        } catch (e) { console.error(e); }
    }

    // --- FUNCIONES DE HISTORIAL (Firestore + localStorage) ---
    let currentUserId = null;
    let currentUser = null;
    let authReady = false;

    async function markEpisodeWatched(animeId, seasonNum, epNum) {
        console.log('Player - markEpisodeWatched', { animeId, seasonNum, epNum, currentUserId });
        if (currentUserId) {
            try {
                const docRef = db.collection('watchHistory').doc(currentUserId);
                const doc = await docRef.get();
                let data = doc.exists ? doc.data() : {};
                let animeData = data[animeId] || {};
                let seasonData = animeData[seasonNum] || [];
                if (!seasonData.includes(epNum)) {
                    seasonData.push(epNum);
                    animeData[seasonNum] = seasonData;
                    data[animeId] = animeData;
                    await docRef.set(data, { merge: true });
                    console.log('Player - Marcado en Firestore');
                    showToast('Episodio marcado como visto');
                } else {
                    console.log('Player - Ya estaba marcado');
                }
            } catch (err) {
                console.error('Player - Error al marcar en Firestore:', err);
                showToast('Error al marcar: ' + err.message, true);
            }
        } else {
            const key = `watched_${animeId}_${seasonNum}_${epNum}`;
            localStorage.setItem(key, 'true');
            console.log('Player - Marcado en localStorage');
            showToast('Episodio marcado como visto (local)');
        }
    }

    function showToast(msg, isError = false) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.style.position = 'fixed';
            toast.style.bottom = '50px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = isError ? '#ff0055' : '#00fff7';
            toast.style.color = '#000';
            toast.style.padding = '8px 20px';
            toast.style.borderRadius = '20px';
            toast.style.zIndex = '999';
            toast.style.fontWeight = 'bold';
            toast.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            document.body.appendChild(toast);
        }
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    // -----------------------------------------------------------
    // SISTEMA DE COMENTARIOS
    // -----------------------------------------------------------
    let commentsRef = null;
    let lastCommentDoc = null;
    let loadingComments = false;
    let hasMoreComments = true;

    // Lista de emojis predefinidos
    const emojis = ['😀', '😂', '😍', '😎', '😢', '😡', '👍', '❤️', '🔥', '🎉', '✨', '💀', '👀', '😱', '🤔', '🍿', '🎬', '🙌', '💯', '👏'];

    // Lista de GIFs predefinidos (URLs públicas)
    const gifs = [
        'https://media.giphy.com/media/3o7abB06u9bNzA8LC8/giphy.gif',
        'https://media.giphy.com/media/l0MYEqEzwMWFCg8rm/giphy.gif',
        'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif',
        'https://media.giphy.com/media/3o7abB06u9bNzA8LC8/giphy.gif',
        'https://media.giphy.com/media/l0MYt5jH6gkTWwQwU/giphy.gif',
        'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif',
        'https://media.giphy.com/media/3o7abB06u9bNzA8LC8/giphy.gif',
        'https://media.giphy.com/media/l0MYEqEzwMWFCg8rm/giphy.gif',
        'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif',
        'https://media.giphy.com/media/3o7abB06u9bNzA8LC8/giphy.gif',
        'https://media.giphy.com/media/l0MYt5jH6gkTWwQwU/giphy.gif',
        'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif'
    ];

    function initComments() {
        if (!animeId || !season || !episode) return;
        commentsRef = db.collection('comments')
            .where('animeId', '==', animeId)
            .where('season', '==', parseInt(season))
            .where('episode', '==', parseInt(episode))
            .orderBy('timestamp', 'desc')
            .limit(15);
        
        document.getElementById('commentsSection').style.display = 'block';
        loadComments();
    }

    async function loadComments(reset = true) {
        if (loadingComments) return;
        loadingComments = true;
        if (reset) {
            lastCommentDoc = null;
            hasMoreComments = true;
            document.getElementById('commentsList').innerHTML = '<div class="no-comments">Cargando comentarios...</div>';
        }
        
        try {
            let query = commentsRef;
            if (!reset && lastCommentDoc) {
                query = commentsRef.startAfter(lastCommentDoc);
            }
            const snapshot = await query.get();
            if (snapshot.empty && reset) {
                document.getElementById('commentsList').innerHTML = '<div class="no-comments">No hay comentarios aún. ¡Sé el primero!</div>';
                hasMoreComments = false;
            } else {
                const comments = [];
                snapshot.forEach(doc => {
                    comments.push({ id: doc.id, ...doc.data() });
                    lastCommentDoc = doc;
                });
                if (snapshot.size < 15) hasMoreComments = false;
                
                if (reset) {
                    renderComments(comments);
                } else {
                    appendComments(comments);
                }
            }
            document.getElementById('loadMoreCommentsBtn').style.display = hasMoreComments ? 'block' : 'none';
        } catch (err) {
            console.error('Error loading comments:', err);
            if (reset) document.getElementById('commentsList').innerHTML = '<div class="no-comments">Error al cargar comentarios</div>';
        } finally {
            loadingComments = false;
        }
    }

    function renderComments(comments) {
        const container = document.getElementById('commentsList');
        if (comments.length === 0) {
            container.innerHTML = '<div class="no-comments">No hay comentarios aún. ¡Sé el primero!</div>';
            return;
        }
        container.innerHTML = comments.map(comment => renderCommentItem(comment)).join('');
        attachDeleteListeners();
    }

    function appendComments(comments) {
        const container = document.getElementById('commentsList');
        if (comments.length === 0) return;
        const existing = container.innerHTML;
        const newHtml = comments.map(comment => renderCommentItem(comment)).join('');
        container.innerHTML = existing + newHtml;
        attachDeleteListeners();
    }

    function renderCommentItem(comment) {
        const date = comment.timestamp ? new Date(comment.timestamp.toDate()) : new Date();
        const timeAgo = getTimeAgo(date);
        const isAdmin = currentUser && currentUser.email === 'archinime12@gmail.com';
        const canDelete = (currentUserId && comment.userId === currentUserId) || isAdmin;
        const deleteBtn = canDelete ? `<button class="comment-delete" data-id="${comment.id}"><i class="fas fa-trash-alt"></i></button>` : '';
        const gifHtml = comment.gifUrl ? `<img class="comment-gif" src="${comment.gifUrl}" alt="gif">` : '';
        return `
            <div class="comment-item" data-id="${comment.id}">
                <div class="comment-header">
                    <img class="comment-avatar-small" src="${comment.userAvatar || 'invitado.avif'}" alt="avatar">
                    <span class="comment-user">${escapeHtml(comment.userName)}</span>
                    <span class="comment-date">${timeAgo}</span>
                    ${deleteBtn}
                </div>
                <div class="comment-text">${escapeHtml(comment.text).replace(/\n/g, '<br>')}</div>
                ${gifHtml}
            </div>
        `;
    }

    function attachDeleteListeners() {
        document.querySelectorAll('.comment-delete').forEach(btn => {
            btn.removeEventListener('click', handleDelete);
            btn.addEventListener('click', handleDelete);
        });
    }

    async function handleDelete(e) {
        const commentId = e.currentTarget.getAttribute('data-id');
        if (!confirm('¿Eliminar este comentario?')) return;
        try {
            await db.collection('comments').doc(commentId).delete();
            showToast('Comentario eliminado');
            // Recargar comentarios desde cero
            lastCommentDoc = null;
            loadComments(true);
        } catch (err) {
            console.error(err);
            showToast('Error al eliminar', true);
        }
    }

    function getTimeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return 'ahora';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h`;
        const days = Math.floor(hours / 24);
        if (days < 7) return `${days}d`;
        return date.toLocaleDateString();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function submitComment(text, gifUrl = null) {
        if (!text.trim() && !gifUrl) {
            showToast('Escribe algo o añade un GIF', true);
            return;
        }
        if (!currentUserId) {
            showToast('Inicia sesión para comentar', true);
            return;
        }
        try {
            await db.collection('comments').add({
                animeId: animeId,
                season: parseInt(season),
                episode: parseInt(episode),
                userId: currentUserId,
                userName: currentUser.displayName || currentUser.email.split('@')[0] || 'Usuario',
                userAvatar: currentUser.photoURL || 'invitado.avif',
                text: text.trim() || '',
                gifUrl: gifUrl,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            showToast('Comentario publicado');
            document.getElementById('commentText').value = '';
            // Recargar comentarios
            lastCommentDoc = null;
            loadComments(true);
        } catch (err) {
            console.error(err);
            showToast('Error al publicar comentario', true);
        }
    }

    // Emoji picker
    let emojiPickerVisible = false;
    function toggleEmojiPicker() {
        const container = document.getElementById('emojiPickerContainer');
        if (emojiPickerVisible) {
            container.style.display = 'none';
            emojiPickerVisible = false;
        } else {
            container.innerHTML = `<div class="emoji-picker">${emojis.map(e => `<span>${e}</span>`).join('')}</div>`;
            container.style.display = 'block';
            emojiPickerVisible = true;
            container.querySelectorAll('.emoji-picker span').forEach(span => {
                span.addEventListener('click', () => {
                    const textarea = document.getElementById('commentText');
                    textarea.value += span.innerText;
                    textarea.focus();
                    container.style.display = 'none';
                    emojiPickerVisible = false;
                });
            });
        }
    }

    // GIF modal
    function showGifModal() {
        const modal = document.getElementById('gifModal');
        const grid = document.getElementById('gifGrid');
        grid.innerHTML = gifs.map(url => `<div class="gif-item"><img src="${url}" data-url="${url}"></div>`).join('');
        modal.style.display = 'flex';
        grid.querySelectorAll('.gif-item').forEach(item => {
            item.addEventListener('click', () => {
                const gifUrl = item.querySelector('img').getAttribute('data-url');
                submitComment(document.getElementById('commentText').value, gifUrl);
                modal.style.display = 'none';
            });
        });
    }

    // Actualizar avatar según usuario
    function updateCommentAvatar() {
        const avatarImg = document.getElementById('commentUserAvatar');
        if (currentUser && currentUser.photoURL) {
            avatarImg.src = currentUser.photoURL;
        } else if (currentUser && currentUser.email) {
            avatarImg.src = `https://ui-avatars.com/api/?background=00fff7&color=000&name=${encodeURIComponent(currentUser.email[0])}`;
        } else {
            avatarImg.src = 'invitado.avif';
        }
    }

    // --- EJECUTAR AL CARGAR LA PÁGINA ---
    if (epData) {
        document.title = `Ver ${epData.title} - Archinime`;
        document.getElementById('epTitle').innerText = epData.title;
        const initialLink = epData.link || epData.link2;
        
        updateDownloadButton(initialLink);
        loadVideo(initialLink);
        
        const optContainer = document.getElementById('serverOptions');
        optContainer.innerHTML = '';
        if(epData.link) createOptionBtn("Latino", epData.link, true);
        if(epData.link2) createOptionBtn("Opcion 2", epData.link2, !epData.link);
        
        setupNavigation();

        // Autenticación y marcado de visto
        auth.onAuthStateChanged(async (user) => {
            currentUserId = user ? user.uid : null;
            currentUser = user;
            authReady = true;
            console.log('Player - Usuario autenticado:', currentUserId);
            updateCommentAvatar();
            // Inicializar comentarios después de auth
            initComments();
            // Marcar como visto
            setTimeout(async () => {
                await markEpisodeWatched(animeId, parseInt(season), parseInt(episode));
            }, 800);
        });

        // Eventos de comentarios
        document.getElementById('submitCommentBtn').addEventListener('click', () => {
            const text = document.getElementById('commentText').value;
            submitComment(text, null);
        });
        document.getElementById('emojiBtn').addEventListener('click', toggleEmojiPicker);
        document.getElementById('gifBtn').addEventListener('click', showGifModal);
        document.getElementById('loadMoreCommentsBtn').addEventListener('click', () => loadComments(false));
        // Cerrar modal de GIF
        document.querySelector('.close-gif').addEventListener('click', () => {
            document.getElementById('gifModal').style.display = 'none';
        });
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('gifModal');
            if (e.target === modal) modal.style.display = 'none';
        });
        // Cerrar emoji picker al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!document.getElementById('emojiBtn').contains(e.target) && !document.getElementById('emojiPickerContainer').contains(e.target)) {
                document.getElementById('emojiPickerContainer').style.display = 'none';
                emojiPickerVisible = false;
            }
        });
    } else {
        document.getElementById('epTitle').innerText = "No encontrado";
    }
  </script>
