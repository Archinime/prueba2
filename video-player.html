<script>
  (function() {
    // PALETA "SYNTHWAVE": Solo colores fríos y neones que combinan con la galaxia
    const colors = [
      "#00f3ff", // Cian Neón (Inicio)
      "#0066ff", // Azul Eléctrico
      "#bc13fe", // Morado Protagonista
      "#ff0055", // Rosa Neón (Acento)
      "#bc13fe", // Morado (Regreso)
      "#0066ff", // Azul [cite: 2]
      "#00f3ff"  // Cian (Final para loop perfecto)
    ];

    const animationDuration = 20000; // 6 segundos (igual que el CSS nuevo)
    const intervalTime = 20; 
    const segments = colors.length - 1;
    const step = (intervalTime / animationDuration) * segments;

    let currentProgress = 0;
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if (!metaTag) { [cite: 3]
      metaTag = document.createElement('meta');
      metaTag.name = "theme-color";
      document.head.appendChild(metaTag);
    } [cite: 4]

    const hexToRgb = (hex) => {
      const bigint = parseInt(hex.slice(1), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255]; [cite: 5]
    };
    const rgbToHex = (r, g, b) => { [cite: 6]
      return "#" + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join('');
    }; [cite: 7]

    const lerp = (start, end, t) => start + (end - start) * t; [cite: 8]
    setInterval(() => {
      currentProgress += step;
      if (currentProgress >= segments) {
        currentProgress = currentProgress % segments;
      }

      const index = Math.floor(currentProgress);
      const t = currentProgress - index;
      const colorStart = hexToRgb(colors[index]);
      const colorEnd = hexToRgb(colors[index + 1]);

      const r = lerp(colorStart[0], colorEnd[0], t);
      const g = lerp(colorStart[1], colorEnd[1], t); [cite: 9]
      const b = lerp(colorStart[2], colorEnd[2], t);

      metaTag.setAttribute('content', rgbToHex(r, g, b));
    }, intervalTime);
  })(); [cite: 10]
</script>

  <script>
    let activityTimeout;
    let hasInteracted = false;  [cite: 109]
    let canRegisterPlay = false;
    let iframeIsPlaying = false;
    let autoNextTimer = null;
    // Variable para el contador [cite: 110]

    function wakeUpUI() {
        const overlays = document.querySelectorAll('.touch-overlay');
        overlays.forEach(o => o.classList.add('inactive')); [cite: 111]

        clearTimeout(activityTimeout);
        const videoElem = document.querySelector('#playerContainer video');
        const isNativePaused = videoElem ? videoElem.paused : false;
        if (hasInteracted && !isNativePaused) { [cite: 112]
            activityTimeout = setTimeout(() => {
                overlays.forEach(o => o.classList.remove('inactive')); 
            }, 4500);
        } [cite: 113]
    }

    window.addEventListener('mousemove', wakeUpUI);
    window.addEventListener('touchstart', wakeUpUI, {passive: true});
    window.addEventListener('touchmove', wakeUpUI, {passive: true});
    window.addEventListener('touchend', wakeUpUI, {passive: true}); [cite: 114]
    window.addEventListener('click', wakeUpUI);
    window.addEventListener('scroll', wakeUpUI, {passive: true});
    window.addEventListener('keydown', wakeUpUI);
    window.addEventListener('focus', wakeUpUI);
    window.addEventListener('blur', () => { [cite: 115]
        if (canRegisterPlay && document.activeElement && document.activeElement.tagName === 'IFRAME') {
            iframeIsPlaying = !iframeIsPlaying; 
            hasInteracted = iframeIsPlaying;    
            wakeUpUI();
            setTimeout(() => window.focus(), 100); 
        }
    });
    // ----------------------------------------------------------- [cite: 116]
    
    const DB = (typeof players !== 'undefined') ?
    players : {}; [cite: 117]
    
    const params = new URLSearchParams(location.search);
    const animeId = params.get('anime');
    const season = params.get('s');
    const episode = params.get('e');
    const backLink = document.getElementById('backLink'); [cite: 118]

    if (animeId && season && episode) {
        const viewedKey = `watched_${animeId}_${season}_${episode}`;
        localStorage.setItem(viewedKey, 'true'); [cite: 119]
    }
    
    if (backLink && animeId) {
        backLink.href = `anime-detail.html?id=${animeId}`;
    } [cite: 120]

    const epData = DB[animeId]?.[season]?.[episode];
    if (epData) {
        document.title = `Ver ${epData.title} - Archinime`;
        document.getElementById('epTitle').innerText = epData.title; [cite: 121]
        const initialLink = epData.link || epData.link2;
        loadVideo(initialLink);
        
        const optContainer = document.getElementById('serverOptions');
        optContainer.innerHTML = '';
        if(epData.link) createOptionBtn("Latino", epData.link, true); [cite: 122]
        if(epData.link2) createOptionBtn("Opcion 2", epData.link2, !epData.link);
        
        updateDownloadButton(initialLink);
        setupNavigation();
    } else { [cite: 123]
        document.getElementById('epTitle').innerText = "No encontrado";
    } [cite: 124]

    function addLogoBlocker(container) {
        const touchOverlay = document.createElement('div');
        touchOverlay.className = 'touch-overlay inactive';  [cite: 125]
        
        touchOverlay.addEventListener('mousemove', wakeUpUI);
        touchOverlay.addEventListener('click', (e) => {
            e.preventDefault();
            wakeUpUI();
        });
        touchOverlay.addEventListener('touchstart', (e) => { [cite: 126]
            wakeUpUI();
        }, {passive: true});
        container.appendChild(touchOverlay); [cite: 127]

        const blocker = document.createElement('div');
        blocker.className = 'logo-blocker';
        blocker.innerHTML = `
            <div class="blocker-content">
                <span class="blocker-text">ARCHINIME</span>
                <span class="blocker-sub">HD</span>
            </div>
        `;
        blocker.addEventListener('click', (e) => { [cite: 128]
            e.preventDefault();
            e.stopPropagation();
            wakeUpUI(); 
        });
        blocker.addEventListener('touchstart', (e) => { [cite: 129]
            wakeUpUI(); 
        }, {passive: true});
        container.appendChild(blocker); [cite: 130]
        
        wakeUpUI();
    }

    function generateDirectDownloadLink(url) {
        if (!url) return "#";
        if (url.includes("drive.google.com")) { [cite: 131]
            const match = url.match(/\/d\/(.+?)\//);
            if (match && match[1]) { [cite: 132]
               return `https://drive.usercontent.google.com/download?id=${match[1]}&export=download&authuser=0`;
            } [cite: 133]
            const altMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (altMatch && altMatch[1]) { [cite: 134]
               return `https://drive.usercontent.google.com/download?id=${altMatch[1]}&export=download&authuser=0`;
            } [cite: 135]
        }
        if (url.includes("dropbox.com") && url.includes("dl=0")) {
             return url.replace('dl=0', 'dl=1');
        } [cite: 136]
        if (url.includes("ok.ru/")) {
            const match = url.match(/ok\.ru\/video(?:embed)?\/(\d+)/);
            if (match && match[1]) { [cite: 137]
                return `https://anydownloader.com/en/#url=https://ok.ru/video/${match[1]}`;
            } [cite: 138]
        }
        if (url.includes("odysee.com")) {
            return url.replace('/$/embed/', '/$/download/');
        } [cite: 139]
        return url;
    } [cite: 140]

    function updateDownloadButton(url) {
        const dlBtn = document.getElementById('downloadBtn');
        const directLink = generateDirectDownloadLink(url); [cite: 141]
        dlBtn.href = directLink || '#';
        
        if(directLink && directLink !== '#') {
            dlBtn.setAttribute("target", "_blank");
            dlBtn.setAttribute("download", "");  [cite: 142]
        } else {
            dlBtn.removeAttribute("target");
            dlBtn.removeAttribute("download");
        } [cite: 143]
    }

    function createOptionBtn(label, url, isActive) {
        const optContainer = document.getElementById('serverOptions');
        const btn = document.createElement('button'); [cite: 144]
        const isFirst = optContainer.children.length === 0;
        const shouldBeActive = isActive || isFirst;
        btn.className = 'opt-btn' + (shouldBeActive ? ' active' : ''); [cite: 145]
        btn.innerText = label;
        btn.onclick = () => { [cite: 146]
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadVideo(url); [cite: 147]
            updateDownloadButton(url);
        };
        optContainer.appendChild(btn);
    }

    function startAutoNextCountdown() {
        const nextBtn = document.getElementById('nextBtn');
        // Solo si hay un episodio siguiente disponible [cite: 148]
        if(nextBtn && !nextBtn.classList.contains('btn-hidden')) {
            const autoScreen = document.getElementById('autoNextScreen');
            const progressBar = document.getElementById('autoNextBar'); [cite: 149]
            const cancelBtn = document.getElementById('cancelAutoNextBtn');
            
            autoScreen.classList.add('visible');
            
            let progress = 0;
            const duration = 5000;
            // 5 segundos [cite: 150]
            const interval = 50;
            // Actualizar cada 50ms [cite: 151]
            const step = (interval / duration) * 100;
            // Función para cancelar [cite: 152]
            const cancelAutoNext = () => {
                clearInterval(autoNextTimer);
                autoScreen.classList.remove('visible'); [cite: 153]
            };

            cancelBtn.onclick = cancelAutoNext;

            autoNextTimer = setInterval(() => {
                progress += step;
                progressBar.style.width = `${progress}%`;
                
                if (progress >= 100) {
                   
                 clearInterval(autoNextTimer); [cite: 154]
                    window.location.href = nextBtn.href;
                }
            }, interval);
        } [cite: 155]
    }

    function loadVideo(url) {
        const container = document.getElementById('playerContainer');
        // Preservar la pantalla de auto-next al limpiar el contenedor [cite: 156]
        const autoNextScreen = document.getElementById('autoNextScreen');
        container.innerHTML = '';  [cite: 157]
        if(autoNextScreen) container.appendChild(autoNextScreen);

        if (!url) return;

        hasInteracted = false;
        canRegisterPlay = false;
        iframeIsPlaying = false;
        if(autoNextTimer) clearInterval(autoNextTimer);
        autoNextScreen.classList.remove('visible');
        document.getElementById('autoNextBar').style.width = '0%'; [cite: 158]

        setTimeout(() => { canRegisterPlay = true; }, 1500);
        const isVideoFile = /\.(mp4|webm|ogg|mov|m3u8)$/i.test(url);
        const isDrive = url.includes('drive.google.com') && url.includes('/preview'); [cite: 159]
        
        if (isVideoFile && !isDrive) {
            const video = document.createElement('video');
            video.src = url; [cite: 160]
            video.controls = true;
            video.autoplay = false;
            video.playsInline = true; 
            video.style.width = "100%";
            video.style.height = "100%";
            video.onerror = function() { loadAsIframe(url, container); }; [cite: 161]
            
            video.addEventListener('pause', () => {
                hasInteracted = false; 
                wakeUpUI();
            });
            video.addEventListener('play', () => { [cite: 162]
                hasInteracted = true;
                wakeUpUI();
            });
            // EL EVENTO CLAVE PARA VIDEOS NATIVOS [cite: 163]
            video.addEventListener('ended', () => {
                startAutoNextCountdown();
            });
            container.appendChild(video); [cite: 164]
            addLogoBlocker(container);
        } else {
            loadAsIframe(url, container);
        } [cite: 165]
    }

    function loadAsIframe(url, container) {
        const iframe = document.createElement('iframe');
        iframe.src = url; [cite: 166]
        iframe.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
        iframe.setAttribute("allowfullscreen", "true");
        iframe.style.position = "absolute";
        iframe.style.top = "0";
        iframe.style.left = "0";
        iframe.style.width = "100%"; [cite: 167]
        iframe.style.height = "100%";
        iframe.style.border = "none";
        
        container.insertBefore(iframe, document.getElementById('autoNextScreen'));
        addLogoBlocker(container); [cite: 168]

        // --- NUEVA LÓGICA: BOTÓN DE ODYSEE AL CENTRO ---
        if (url.includes('odysee.com')) { [cite: 139]
            const odyseeBtn = document.createElement('button');
            odyseeBtn.className = 'odysee-center-btn';
            odyseeBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                Ver en Odysee
            `;
            
            odyseeBtn.addEventListener('click', () => {
                // Copia la URL al portapapeles y luego abre la pestaña
                navigator.clipboard.writeText(url).then(() => {
                    window.open(url, '_blank');
                }).catch(err => {
                    console.error('Error copiando al portapapeles:', err);
                    window.open(url, '_blank'); // Abrir de todos modos si falla el copiado
                });
            });

            // Insertarlo en el contenedor para que quede flotando
            container.appendChild(odyseeBtn);
        }
    }

    function setupNavigation() {
        try {
            if (DB[animeId]) {
                let flatList = [];
                const seasons = Object.keys(DB[animeId]).sort((a, b) => Number(a) - Number(b)); [cite: 169]
                seasons.forEach(sKey => {
                    const episodes = Object.keys(DB[animeId][sKey]).sort((a, b) => Number(a) - Number(b));
                    episodes.forEach(eKey => {
                        flatList.push({ s: sKey, e: eKey });
          
                    }); [cite: 170]
                });
                const currentIndex = flatList.findIndex(item => String(item.s) === String(season) && String(item.e) === String(episode)); [cite: 171]
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                if (currentIndex > 0) { [cite: 172]
                    const prevItem = flatList[currentIndex - 1];
                    prevBtn.classList.remove('btn-hidden'); [cite: 173]
                    prevBtn.href = `?anime=${animeId}&s=${prevItem.s}&e=${prevItem.e}`;
                } else {
                    prevBtn.classList.add('btn-hidden');
                } [cite: 174]

                if (currentIndex !== -1 && currentIndex < flatList.length - 1) {
                    const nextItem = flatList[currentIndex + 1];
                    nextBtn.classList.remove('btn-hidden'); [cite: 175]
                    nextBtn.href = `?anime=${animeId}&s=${nextItem.s}&e=${nextItem.e}`;
                } else {
                    nextBtn.classList.add('btn-hidden');
                } [cite: 176]
            }
        } catch (e) { console.error(e);
        } [cite: 177]
    }
  </script>
