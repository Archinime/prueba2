<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reproductor - Archinime</title>
  <link rel="icon" href="Logo_Archinime.png" type="image/png">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    /* ===== ESTILOS BASE Y VARIABLES ===== */
    :root {
        --primary-color: #00fff7;
        --accent-color: #ff0055;
        --neon-purple: #bc13fe;
        --bg-dark: #050505;
        --glass-bg: rgba(15, 15, 20, 0.75);
        --glass-border: rgba(0, 255, 247, 0.15);
    }
    
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
    }
    
    html {
        scroll-behavior: smooth;
    }

    /* Scrollbar personalizado */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
        background: var(--primary-color);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--neon-purple);
    }

    html, body { 
        background: var(--bg-dark);
        font-family: 'Poppins', sans-serif;
        color: white;
        min-height: 100vh;
        overflow-x: hidden; 
        width: 100%;
        -webkit-font-smoothing: antialiased;
    }
    
    #bg-video { 
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%; 
        object-fit: cover; z-index: 1; opacity: 0.3; /* Ligeramente más oscuro para profesionalismo */
    }
    
    #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, rgba(123, 44, 191, 0.05) 0%, #000000 95%);
        z-index: 2;
        pointer-events: none;
    }
    
    .container { 
        max-width: 1200px;
        margin: 0 auto; 
        padding: 20px;
        position: relative; 
        z-index: 10;
        display: flex; 
        flex-direction: column; 
        gap: 20px;
        animation: fadeUp 0.8s ease-out forwards;
    }

    @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    
    /* ===== NAVEGACIÓN ===== */
    .top-nav {
        display: flex;
        justify-content: space-between; 
        align-items: center;
        background: rgba(10, 10, 10, 0.85); /* Más oscuro y solido */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 12px 25px;
        border-radius: 12px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        gap: 15px;
    }
    
    .back-btn { 
        display: inline-flex;
        align-items: center; 
        gap: 8px;
        color: #eee; 
        text-decoration: none; 
        font-weight: 600; 
        font-size: 0.9rem;
        background: rgba(0, 0, 0, 0.7); 
        padding: 8px 18px;
        border-radius: 50px;
        border: 1px solid rgba(0, 255, 247, 0.3);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        white-space: nowrap;
    }
    
    .back-btn:hover {
        background: rgba(0, 255, 247, 0.15);
        border-color: var(--primary-color);
        color: #fff;
        box-shadow: 0 0 15px rgba(0, 255, 247, 0.3);
    }
    
    /* ===== SERVIDORES ===== */
    .options { 
        display: flex;
        gap: 10px; 
        justify-content: flex-end; 
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none; /* Firefox */
        padding-bottom: 2px; /* Evitar corte de sombra */
    }
    .options::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
    }
    
    .opt-btn { 
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1); 
        color: #ccc;
        cursor: pointer; 
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.3s ease;
        white-space: nowrap;
        flex-shrink: 0;
    }
    
    .opt-btn.active { 
        border-color: var(--primary-color);
        background: rgba(0, 255, 247, 0.1); 
        color: var(--primary-color);
        box-shadow: 0 0 10px rgba(0, 255, 247, 0.15);
    }

    .opt-btn:hover:not(.active) {
        background: rgba(255, 255, 247, 0.05);
        border-color: rgba(0, 255, 247, 0.5);
        color: #fff;
    }
    
    /* ===== REPRODUCTOR ===== */
    .player-wrapper { 
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* Relación de aspecto estricta 16:9 */
        height: 0;
        background: #000; 
        border-radius: 12px;
        border: 1px solid rgba(0, 255, 247, 0.2);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        overflow: hidden;
        animation: fadeUp 0.8s ease-out forwards;
        animation-delay: 0.1s;
        opacity: 0;
    }

    #mediaContainer {
        position: absolute;
        top: 0; 
        left: 0;
        width: 100%; 
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
    }
    
    #mediaContainer iframe, #mediaContainer video { 
        position: absolute;
        top: 0; 
        left: 0;
        width: 100%; 
        height: 100%; 
        border: none;
        object-fit: contain; /* Evita recortes y asegura centrado en videos nativos */
    }
    
    .logo-blocker {
        position: absolute;
        top: 0; left: 0; width: 100%;
        height: 12%; 
        min-height: 40px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
        z-index: 100;
        display: flex; 
        justify-content: center; 
        align-items: flex-start;
        padding-top: 10px; 
        pointer-events: none; 
    }
    
    .blocker-text {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: clamp(1rem, 2.5vw, 1.5rem);
        color: rgba(255, 255, 255, 0.8); 
        letter-spacing: 6px; 
        text-transform: uppercase;
        animation: neonPulse 2s infinite alternate;
    }
    
    @keyframes neonPulse {
        0% { text-shadow: 0 0 5px var(--primary-color); opacity: 0.7; }
        100% { text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color); opacity: 1; }
    }
    
    h1 { 
        text-align: center; 
        font-size: clamp(1.2rem, 3.5vw, 1.8rem);
        font-weight: 700;
        margin: 5px 0; 
        text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }
    
    /* ===== BOTONES PREMIUM CYBERPUNK ===== */
    .controls { 
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 15px; 
        animation: fadeUp 0.8s ease-out forwards;
        animation-delay: 0.2s;
        opacity: 0;
    }
    
    #prevBtn { justify-self: start; }
    #nextBtn { justify-self: end; }
    #downloadBtn { justify-self: center; }
    
    .btn { 
        padding: 12px 25px;
        background: #000; /* Fondo más sólido */
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff; 
        text-decoration: none; 
        border-radius: 50px;
        display: inline-flex;
        align-items: center; 
        justify-content: center; 
        gap: 8px;
        transition: all 0.3s ease;
        font-weight: 800; 
        font-family: 'Orbitron', sans-serif; 
        letter-spacing: 1px;
        text-transform: uppercase; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        cursor: pointer;
        font-size: 0.9rem;
    }

    .nav-btn { 
        border-color: rgba(0, 255, 247, 0.4);
        color: var(--primary-color);
    }
    
    .nav-btn:hover {
        background: rgba(0, 255, 247, 0.1);
        border-color: var(--primary-color); 
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 255, 247, 0.3);
        transform: translateY(-2px);
    }
    
    #downloadBtn {
        border-color: rgba(255, 0, 85, 0.5);
        color: var(--accent-color);
        background: rgba(20, 0, 5, 0.9); 
    }

    #downloadBtn:hover {
        background: rgba(255, 0, 85, 0.15); 
        color: #fff;
        border-color: var(--accent-color);
        box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        transform: translateY(-2px);
    }
    
    .btn-hidden { 
        visibility: hidden; 
        pointer-events: none;
        opacity: 0;
    }
    
    /* =========================================
       SISTEMA DE COMENTARIOS (FONDO NEGRO)
       ========================================= */
    .comentarios-section {
        margin-top: 20px;
        padding: 30px; 
        background: #000000; /* Fondo negro profesional */
        border-radius: 16px; 
        border: 1px solid rgba(0, 255, 247, 0.2);
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        position: relative;
        animation: fadeUp 0.8s ease-out forwards;
        animation-delay: 0.3s;
        opacity: 0;
    }
    
    .comentarios-header {
        display: flex;
        align-items: center; 
        gap: 12px; 
        margin-bottom: 25px; 
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(0, 255, 247, 0.2);
    }
    
    .comentarios-header i { 
        font-size: 1.8rem; 
        color: var(--primary-color); 
    }
    
    .comentarios-header h3 { 
        font-size: clamp(1.2rem, 2.5vw, 1.4rem); 
        font-weight: 800; 
        font-family: 'Orbitron', sans-serif; 
        letter-spacing: 1px;
        color: #fff;
    }
    
    .comentarios-list { 
        margin-bottom: 20px; 
        display: flex; 
        flex-direction: column; 
        gap: 15px;
    }

    .comentario-login-message {
        background: #050505;
        border: 1px dashed rgba(0, 255, 247, 0.3);
        border-radius: 12px; 
        padding: 30px 20px; 
        text-align: center; 
        margin-bottom: 30px;
    }
    
    .login-link-btn {
        background: transparent;
        border: 1px solid var(--primary-color); 
        color: var(--primary-color); 
        font-weight: 700;
        padding: 10px 24px; 
        border-radius: 30px; 
        cursor: pointer; 
        display: inline-flex; 
        align-items: center;
        gap: 8px; 
        margin-top: 15px; 
        transition: all 0.2s;
        font-family: 'Poppins', sans-serif;
    }

    .login-link-btn:hover { 
        background: var(--primary-color); 
        color: #000;
        box-shadow: 0 0 15px rgba(0,255,247,0.4); 
    }
    
    .comentario-form-container {
        background: #050505; /* Contenedor oscuro */
        border-radius: 16px; 
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.05); 
        margin-top: 15px; 
        margin-bottom: 15px;
        transition: border-color 0.3s;
    }

    .comentario-form-container:focus-within {
        border-color: rgba(0, 255, 247, 0.4);
    }

    .comentario-user-info {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
    }

    .comentario-user-info img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--primary-color);
        object-fit: cover;
    }

    .comentario-user-info span {
        font-weight: 600;
        color: #fff;
        font-size: 1rem;
    }
    
    .comentario-input-wrapper { 
        display: flex; 
        gap: 10px; 
        margin-bottom: 15px;
    }
    
    .comentario-input-wrapper textarea {
        flex: 1;
        background: #000000; /* Área de texto puramente negra */
        border: 1px solid rgba(255, 255, 255, 0.15); 
        border-radius: 12px; 
        padding: 15px; 
        color: white;
        font-family: 'Poppins', sans-serif; 
        font-size: 0.95rem;
        resize: vertical; 
        min-height: 100px; 
        transition: all 0.3s;
        width: 100%;
    }
    
    .comentario-input-wrapper textarea:focus { 
        outline: none; 
        border-color: var(--primary-color);
        box-shadow: 0 0 10px rgba(0, 255, 247, 0.1) inset;
    }
    
    .emoji-btn, .sticker-btn {
        background: #0a0a0a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px; 
        padding: 0 20px; 
        cursor: pointer; 
        font-size: 1.3rem; 
        transition: all 0.2s;
        color: #ccc; 
        display: flex; 
        align-items: center; 
        justify-content: center;
    }
    
    .emoji-btn:hover, .sticker-btn:hover { 
        background: rgba(0, 255, 247, 0.1);
        border-color: var(--primary-color); 
        color: var(--primary-color); 
    }
    
    /* Resto de estilos de panel de emojis y stickers simplificados para mantener negro */
    .emoji-panel, .sticker-panel-full {
        background: #000; 
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px; 
    }

    .emoji-panel {
        display: none;
        padding: 15px; 
        margin-bottom: 15px; 
        flex-wrap: wrap; 
        gap: 8px;
        max-height: 200px; 
        overflow-y: auto; 
    }
    
    .emoji-panel.active { display: flex; }
    
    .emoji-option { 
        font-size: 1.5rem; cursor: pointer; padding: 5px; 
        border-radius: 8px; width: 40px; text-align: center; transition: 0.2s; 
    }
    
    .emoji-option:hover { background: rgba(255,255,255,0.1); transform: scale(1.2); }
    
    .enviar-comentario-btn {
        background: var(--primary-color);
        border: none; 
        color: #000; 
        font-weight: 800; 
        font-family: 'Orbitron', sans-serif; 
        padding: 14px 25px; 
        border-radius: 12px; /* Menos redondeado, más profesional */
        cursor: pointer; 
        display: flex;
        align-items: center; 
        gap: 10px; 
        transition: all 0.2s; 
        justify-content: center;
        width: 100%;
        font-size: 1rem;
    }
    
    .enviar-comentario-btn:hover { 
        background: #fff; 
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }
    
    .empty-comments { 
        text-align: center; padding: 40px 20px; color: #666; font-size: 0.95rem; 
        background: #050505; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.1);
    }
    
    /* ===== STICKERS MODAL Y UI ===== */
    .sticker-panel-full { 
        display: none;
        margin-bottom: 15px; 
    }
    .sticker-panel-full.active { display: block; }
    
    .sticker-tabs { 
        display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); background: #050505; 
    }
    .sticker-tab { 
        flex: 1; padding: 15px 10px; background: none; border: none; color: #888; 
        cursor: pointer; font-size: 0.9rem; font-weight: 600; font-family: 'Poppins'; transition: 0.2s;
    }
    .sticker-tab.active { 
        color: var(--primary-color); border-bottom: 2px solid var(--primary-color); 
    }
    .sticker-tab-content { display: none; padding: 20px; max-height: 300px; overflow-y: auto; }
    .sticker-tab-content.active { display: block; }
    .stickers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
    
    .sticker-item { 
        position: relative; background: #050505; border-radius: 8px; padding: 5px; 
        cursor: pointer; text-align: center; border: 1px solid rgba(255,255,255,0.05); 
    }
    .sticker-item:hover { border-color: var(--primary-color); }
    .sticker-img { width: 100%; aspect-ratio: 1/1; object-fit: contain; border-radius: 6px; }
    
    .sticker-delete-btn { 
        position: absolute; top: -5px; right: -5px; background: #ff0055; border: none;
        color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 10px; cursor: pointer;
    }
    .sticker-empty { grid-column: 1/-1; text-align: center; color: #666; font-size: 0.9rem; padding: 20px;}
    
    .add-sticker-container {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        padding: 30px 15px; background: #050505; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2);
    }
    .add-sticker-desc { font-size: 1rem; color: #fff; margin-bottom: 5px; }
    .add-sticker-hint { font-size: 0.8rem; color: #666; margin-bottom: 20px; }
    .upload-sticker-label {
        background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); 
        padding: 10px 25px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: 0.2s;
    }
    .upload-sticker-label:hover { background: rgba(0, 255, 247, 0.1); }
    .upload-preview { margin-top: 15px; width: 100%; display: flex; justify-content: center;}
    
    /* ===== STICKER PREVIEW ===== */
    .preview-sticker-wrapper { position: relative; display: inline-block; margin-top: 10px; }
    .preview-sticker-wrapper img, .preview-sticker-wrapper video {
        max-width: 100px !important; max-height: 100px !important; border-radius: 8px;
        object-fit: contain; border: 1px solid var(--primary-color);
    }
    .remove-sticker-btn {
        position: absolute; top: -8px; right: -8px; background: #ff0055; color: #fff; border: none;
        border-radius: 50%; width: 24px; height: 24px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* ===== MODAL LOGIN ===== */
    .auth-modal { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.9); z-index: 10001; display: flex; 
        justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; padding: 15px; 
    }
    .auth-modal.show { opacity: 1; pointer-events: auto; }
    .auth-card { 
        background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; 
        width: 100%; max-width: 400px; padding: 30px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,1);
    }
    .auth-close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #666; }
    .auth-tabs { display: flex; gap: 20px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .auth-tab { padding: 10px 0; cursor: pointer; color: #666; border-bottom: 2px solid transparent; font-size: 0.95rem; }
    .auth-tab.active { color: #fff; border-bottom-color: var(--primary-color); }
    .auth-form { display: flex; flex-direction: column; gap: 15px; }
    .auth-form input { background: #0a0a0a; border: 1px solid #222; padding: 15px; border-radius: 8px; color: white; }
    .auth-form button { background: var(--primary-color); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 5px; }
    .auth-providers { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .provider-btn { background: #0a0a0a; border: 1px solid #222; padding: 14px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; color: white; font-size: 0.9rem; }
    .auth-error { color: #ff4757; font-size: 0.85rem; margin-top: 15px; text-align: center; }
    
    /* ===== RESPONSIVE MÓVIL ESTRICTO ===== */
    @media (max-width: 768px) {
        .container { 
            padding: 10px; 
            gap: 15px;
        }
        
        .top-nav {
            padding: 8px 12px;
            gap: 10px;
        }

        .back-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        
        .options { 
            flex: 1;
            /* Permite scroll horizontal en móviles para que no ocupe múltiples líneas */
            overflow-x: auto;
            justify-content: flex-start;
        }

        .opt-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .logo-blocker {
            height: 15%;
        }

        .blocker-text {
            font-size: 1.1rem;
            letter-spacing: 4px;
        }
        
        .controls { 
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: auto auto; 
            gap: 10px;
        }
        
        #prevBtn { grid-column: 1; grid-row: 1; }
        #nextBtn { grid-column: 2; grid-row: 1; }
        #downloadBtn { grid-column: 1/-1; grid-row: 2; width: 100%; }
        
        .btn { 
            padding: 10px; 
            font-size: 0.8rem;
        }

        .comentarios-section { 
            padding: 20px 15px;
            border-radius: 12px;
        }

        .comentario-form-container { 
            padding: 15px;
        }

        .comentario-input-wrapper {
            flex-direction: column;
            gap: 8px;
        }

        .emoji-btn, .sticker-btn { 
            width: 100%;
            padding: 10px;
        }
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay muted loop playsinline poster="galaxia-morado1.avif">
    <source src="galaxia.mp4" type="video/mp4">
  </video>
  <div id="overlay"></div>

  <div class="container">
    <div class="top-nav">
       <a href="#" id="backLink" class="back-btn">
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
         Volver
       </a>
       <div class="options" id="serverOptions"></div>
    </div>

    document.querySelectorAll('.auth-tab').forEach(tab => {

        document.getElementById('authLoginForm').style.display = tabName === 'login' ? 'flex' : 'none';
        document.getElementById('authRegisterForm').style.display = tabName === 'register' ? 'flex' : 'none';
        document.getElementById('authError').innerText = '';
      });
    });
    
    async function loginWithEmail() {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        closeAuthModal();
      } catch (err) {
        document.getElementById('authError').innerText = err.message;

    }
    
    async function registerWithEmail() {
      const email = document.getElementById('registerEmail').value;
      const pass = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;
      if (pass !== confirm) {
        document.getElementById('authError').innerText = 'Las contraseñas no coinciden';
        return;
      }
      try {
        await auth.createUserWithEmailAndPassword(email, pass);
        closeAuthModal();
      } catch (err) {
        document.getElementById('authError').innerText = err.message;
      }
    }

  <script>

    document.write('<script src="video-player-data.js?v=' + version + '"><\/script>');
    document.write('<script src="stickers-system.js?v=' + version + '"><\/script>');

  <script>
    const DB = (typeof players !== 'undefined') ? players : {};
    const params = new URLSearchParams(location.search);
    const animeId = params.get('anime');
    const season = params.get('s');
    const episode = params.get('e');
    const backLink = document.getElementById('backLink');
    
    window.comentariosAnimeId = animeId;
    window.comentariosSeason = season;
    window.comentariosEpisode = episode;
    
    if (backLink && animeId) backLink.href = `anime-detail.html?id=${animeId}`;
    const epData = DB[animeId]?.[season]?.[episode];
    
    function isMobileDevice() {
      return /android|webos|iphone|ipad|ipod|blackberry/i.test(navigator.userAgent.toLowerCase());
    }
    
    function generateDirectDownloadLink(url) {
      if (!url) return "#";
      if (url.includes("drive.google.com")) {
        const match = url.match(/\/d\/(.+?)\//);
        if (match) return `https://drive.usercontent.google.com/download?id=${match[1]}&export=download`;
      }
      if (url.includes("dropbox.com") && url.includes("dl=0")) return url.replace('dl=0', 'dl=1');
      return url;
    }
    
    function updateDownloadButton(url) {
      const dlBtn = document.getElementById('downloadBtn');
      const directLink = generateDirectDownloadLink(url);
      dlBtn.href = directLink;
      if (isMobileDevice()) dlBtn.setAttribute("target", "_blank");
    }
    
    function createOptionBtn(label, url, isActive) {
      const container = document.getElementById('serverOptions');
      const btn = document.createElement('button');
      const isFirst = container.children.length === 0;
      btn.className = 'opt-btn' + ((isActive || isFirst) ? ' active' : '');
      btn.innerText = label;
      btn.onclick = () => {
        document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateDownloadButton(url);
        loadVideo(url);
      };
      container.appendChild(btn);
    }
    
    function loadVideo(url) {
      const container = document.getElementById('mediaContainer');
      container.innerHTML = '';
      if (!url) return;
      const isVideoFile = /\.(mp4|webm|ogg|mov|m3u8)$/i.test(url);
      if (isVideoFile && !url.includes('drive.google.com')) {
        const video = document.createElement('video');
        video.src = url;
        video.controls = true;
        // Permite que el reproductor nativo se maneje correctamente y el botón play quede centrado
        video.style.width = '100%';
        video.style.height = '100%';
        container.appendChild(video);
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.allow = "autoplay; fullscreen";
        iframe.allowFullscreen = true;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        container.appendChild(iframe);
      }
    }
    
    function setupNavigation() {
      if (!DB[animeId]) return;
      let flatList = [];
      Object.keys(DB[animeId]).sort((a,b)=>Number(a)-Number(b)).forEach(sKey => {
        Object.keys(DB[animeId][sKey]).sort((a,b)=>Number(a)-Number(b)).forEach(eKey => {
          flatList.push({ s: sKey, e: eKey });
        });
      });
      const idx = flatList.findIndex(i => String(i.s) === String(season) && String(i.e) === String(episode));
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      if (idx > 0) {
        prevBtn.classList.remove('btn-hidden');
        prevBtn.href = `?anime=${animeId}&s=${flatList[idx-1].s}&e=${flatList[idx-1].e}`;
      }
      if (idx < flatList.length - 1) {
        nextBtn.classList.remove('btn-hidden');
        nextBtn.href = `?anime=${animeId}&s=${flatList[idx+1].s}&e=${flatList[idx+1].e}`;
      }
    }
    
    const autoMarkEpisodeWatched = () => {
        const aId = params.get('anime');
        const sNum = parseInt(params.get('s'));
        const eNum = parseInt(params.get('e'));

        if (!aId || isNaN(sNum) || isNaN(eNum)) return;
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const docRef = db.collection('watchHistory').doc(user.uid);
                    const doc = await docRef.get();
                   
                    let data = doc.exists ? doc.data() : {};
                    let animeData = data[aId] || {};
                    let seasonData = animeData[sNum] || [];

                    if (!seasonData.includes(eNum)) {
                        seasonData.push(eNum);
                        animeData[sNum] = seasonData;
                        data[aId] = animeData;
                        await docRef.set(data, { merge: true });
                        console.log("Episodio auto-marcado como visto en Firestore");
                    }
                } catch (e) {
                    console.error("Error al auto-marcar episodio en Firestore:", e);
                }
            } else {
                localStorage.setItem(`watched_${aId}_${sNum}_${eNum}`, 'true');
                console.log("Episodio auto-marcado como visto en modo Local");
            }
        });
    };
    
    if (epData) {
      document.title = `Ver ${epData.title} - Archinime`;
      document.getElementById('epTitle').innerText = epData.title;
      const initialLink = epData.link || epData.link2;
      updateDownloadButton(initialLink);
      loadVideo(initialLink);
      document.getElementById('serverOptions').innerHTML = '';
      if(epData.link) createOptionBtn("Latino", epData.link, true);
      if(epData.link2) createOptionBtn("Opcion 2", epData.link2, !epData.link);
      setupNavigation();
      autoMarkEpisodeWatched();
      
      const checkScriptsInterval = setInterval(() => {
        if (typeof initStickersSystem === 'function' && typeof initComentariosSystem === 'function') {
          clearInterval(checkScriptsInterval);
          initStickersSystem(db, auth);
          initComentariosSystem(db, auth);
        }
      }, 100);
    } else {
      document.getElementById('epTitle').innerText = "No encontrado";
    }
  </script>
