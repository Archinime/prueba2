<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Reproductor Cyberpunk - Archinime</title>
  <link rel="icon" href="Logo_Archinime.png" type="image/png">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    /* ===== VARIABLES CYBERPUNK (coherentes con index y anime-detail) ===== */
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --neon-yellow: #f1c40f;
      --dark-bg: #050505;
      --glass-bg: rgba(10, 12, 16, 0.75);
      --text: #ffffff;
      --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: var(--dark-bg);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Fondo vídeo + overlays (mismo estilo que index) */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      background: url('galaxia-morado1.avif') center/cover no-repeat;
      opacity: 1;
      transition: opacity 1.2s ease;
      filter: contrast(1.2) brightness(0.7) saturate(1.1);
      pointer-events: none;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 30% 40%, rgba(188, 19, 254, 0.12) 0%, rgba(0,0,0,0.85) 90%);
      z-index: -1;
      pointer-events: none;
    }
    #scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 6px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.25;
    }

    /* ===== CONTENEDOR PRINCIPAL GLASS ===== */
    .main-container {
      max-width: 1400px;
      margin: 30px auto 60px;
      padding: 20px 25px;
      position: relative;
      z-index: 10;
    }

    /* ===== NAVBAR CYBERPUNK ===== */
    .cyber-nav {
      background: rgba(5, 5, 10, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      border-radius: 0 0 24px 24px;
      margin-bottom: 30px;
      position: relative;
      padding: 12px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }
    .cyber-nav::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
      background-size: 200% 100%;
      animation: borderFlow 3s linear infinite;
      opacity: 0.9;
    }
    @keyframes borderFlow {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .nav-logo:hover {
      transform: scale(1.02);
    }
    .nav-logo img {
      height: 44px;
      width: 44px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(188, 19, 254, 0.5);
    }
    .nav-logo-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff, var(--neon-cyan), var(--neon-purple));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nav-actions {
      display: flex;
      gap: 12px;
    }
    .back-btn-modern, .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0, 243, 255, 0.5);
      padding: 8px 20px;
      border-radius: 40px;
      color: var(--neon-cyan);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .back-btn-modern:hover, .share-btn:hover {
      background: rgba(0, 243, 255, 0.2);
      box-shadow: 0 0 12px var(--neon-cyan);
      transform: translateY(-2px);
      border-color: var(--neon-cyan);
    }

    /* ===== REPRODUCTOR MEJORADO ===== */
    .player-card {
      background: rgba(5, 5, 10, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0, 243, 255, 0.1);
      overflow: hidden;
      margin-bottom: 25px;
      transition: all 0.3s ease;
    }
    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
    }
    .player-wrapper iframe, .player-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    /* Logo blocker con dimensiones originales (perfectas para todos los dispositivos) */
    .logo-blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 14%;
      min-height: 45px;
      background: linear-gradient(to bottom, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.7) 50%, transparent 100%);
      z-index: 15;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 1.5%;
      pointer-events: none;
    }
    .blocker-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(0.9rem, 3vw, 1.4rem);
      color: white;
      letter-spacing: 5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--neon-cyan);
      animation: neonPulse 2s infinite alternate;
    }
    @keyframes neonPulse {
      0% { opacity: 0.8; text-shadow: 0 0 5px var(--neon-cyan); }
      100% { opacity: 1; text-shadow: 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-purple); }
    }

    /* Servidores */
    .servers-bar {
      padding: 15px 20px;
      background: rgba(0,0,0,0.5);
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-end;
    }
    .opt-btn {
      padding: 8px 22px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 40px;
      color: #ccc;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn.active {
      background: rgba(0, 243, 255, 0.2);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }
    .opt-btn:hover {
      transform: translateY(-2px);
      background: rgba(0, 243, 255, 0.1);
    }

    /* Título episodio */
    .episode-title {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 18px 20px;
      margin: 0;
      background: linear-gradient(135deg, #fff, var(--neon-cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(188, 19, 254, 0.3);
    }

    /* Controles neón */
    .controls-neon {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 20px;
      flex-wrap: wrap;
    }
    .cyber-btn {
      padding: 12px 28px;
      background: rgba(10, 10, 15, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.5);
      border-radius: 60px;
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s var(--transition-smooth);
      cursor: pointer;
    }
    .cyber-btn:hover {
      background: rgba(0, 243, 255, 0.2);
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.5);
      transform: translateY(-3px);
      border-color: var(--neon-cyan);
      color: white;
    }
    .cyber-btn.download {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
    }
    .cyber-btn.download:hover {
      background: rgba(255, 0, 85, 0.2);
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.5);
      border-color: var(--neon-pink);
    }
    .btn-hidden {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
    }

    /* ===== COMENTARIOS REDISEÑADOS (funcional completo) ===== */
    .comentarios-section {
      margin-top: 40px;
      background: rgba(10, 12, 16, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 30px;
      transition: all 0.3s;
    }
    .comentarios-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      padding-bottom: 15px;
    }
    .comentarios-header i {
      font-size: 2rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    .comentarios-header h3 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff, var(--neon-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .comentario-login-message {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
    }
    .login-link-btn {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
      margin-top: 15px;
    }
    .login-link-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
      transform: translateY(-2px);
    }
    .comentario-form-container {
      background: rgba(5, 5, 10, 0.6);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(188, 19, 254, 0.4);
    }
    .comentario-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .comentario-user-info img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--neon-cyan);
      object-fit: cover;
    }
    .comentario-input-wrapper {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .comentario-input-wrapper textarea {
      flex: 1;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 20px;
      padding: 15px;
      color: white;
      font-family: 'Poppins', sans-serif;
      resize: vertical;
      transition: 0.2s;
    }
    .comentario-input-wrapper textarea:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }
    .emoji-btn, .sticker-btn {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 16px;
      padding: 0 20px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .emoji-btn:hover, .sticker-btn:hover {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--neon-cyan);
      transform: translateY(-2px);
    }
    .enviar-comentario-btn {
      background: linear-gradient(135deg, var(--neon-cyan), #0066ff);
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
      color: #000;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 15px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .enviar-comentario-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
    }
    .comentarios-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .comentario-item {
      background: rgba(0,0,0,0.4);
      border-radius: 16px;
      padding: 15px;
      border-left: 3px solid var(--neon-cyan);
    }
    .comentario-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .comentario-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--neon-purple);
    }
    .comentario-nombre {
      font-weight: 700;
      color: var(--neon-cyan);
    }
    .comentario-fecha {
      font-size: 0.7rem;
      color: #aaa;
      margin-left: auto;
    }
    .comentario-texto {
      color: #ddd;
      line-height: 1.4;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .comentario-sticker {
      max-width: 120px;
      max-height: 120px;
      border-radius: 12px;
      margin-top: 8px;
    }
    .empty-comments {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-container {
        padding: 12px;
        margin: 15px auto;
      }
      .cyber-nav {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .nav-actions {
        justify-content: center;
      }
      .controls-neon {
        gap: 12px;
      }
      .cyber-btn {
        padding: 8px 18px;
        font-size: 0.75rem;
      }
      .comentarios-section {
        padding: 18px;
      }
      .logo-blocker {
        min-height: 35px;
        padding-top: 2%;
      }
      .blocker-text {
        letter-spacing: 3px;
        font-size: clamp(0.7rem, 3vw, 1rem);
      }
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay muted loop playsinline poster="galaxia-morado1.avif">
    <source src="galaxia.mp4" type="video/mp4">
  </video>
  <div id="overlay"></div>
  <div id="scanlines"></div>

  <div class="main-container">
    <!-- Barra de navegación cyberpunk con botón compartir -->
    <div class="cyber-nav">
      <a href="index.html" class="nav-logo">
        <img src="Logo_Archinime.avif" alt="Archinime">
        <span class="nav-logo-text">ARCHINIME</span>
      </a>
      <div class="nav-actions">
        <a href="#" id="backLink" class="back-btn-modern">
          <i class="fas fa-arrow-left"></i> Volver
        </a>
        <button id="shareEpisodeBtn" class="share-btn">
          <i class="fas fa-share-alt"></i> Compartir
        </button>
      </div>
    </div>

    <!-- Tarjeta del reproductor -->
    <div class="player-card">
      <div class="player-wrapper">
        <div class="logo-blocker">
          <span class="blocker-text">ARCHINIME HD</span>
        </div>
        <div id="mediaContainer" style="width:100%;height:100%;"></div>
      </div>
      <div class="servers-bar" id="serverOptions"></div>
      <h2 id="epTitle" class="episode-title">Cargando...</h2>
      <div class="controls-neon">
        <a id="prevBtn" class="cyber-btn btn-hidden"><i class="fas fa-backward"></i> Anterior</a>
        <a id="downloadBtn" class="cyber-btn download" href="#"><i class="fas fa-download"></i> Descargar</a>
        <a id="nextBtn" class="cyber-btn btn-hidden">Siguiente <i class="fas fa-forward"></i></a>
      </div>
    </div>

    <!-- Sección comentarios -->
    <div class="comentarios-section">
      <div class="comentarios-header">
        <i class="fas fa-comments"></i>
        <h3>FORO NERÓN</h3>
      </div>
      <div id="comentarioLoginMessage" class="comentario-login-message" style="display: none;">
        <i class="fas fa-lock" style="font-size: 2rem; color: var(--neon-purple);"></i>
        <p style="margin: 10px 0;">Accede para comentar y compartir stickers animados</p>
        <button class="login-link-btn" onclick="openAuthModal()">
          <i class="fas fa-sign-in-alt"></i> Iniciar sesión
        </button>
      </div>

      <div id="comentarioFormContainer" class="comentario-form-container" style="display: none;">
        <div class="comentario-user-info">
          <img id="comentarioUserAvatar" src="invitado.avif" alt="avatar">
          <span id="comentarioUserName" style="font-weight: 600;">Usuario</span>
        </div>
        <div class="comentario-input-wrapper">
          <textarea id="comentarioTexto" placeholder="Escribe tu comentario... (Enter para enviar)" maxlength="500"></textarea>
          <button type="button" class="emoji-btn" id="emojiBtn">😊</button>
          <button type="button" class="sticker-btn" id="stickerBtn"><i class="fas fa-sticky-note"></i></button>
        </div>
        <div id="emojiPanel" style="display: none; background: #0f0f13; border-radius: 16px; padding: 15px; margin: 15px 0; flex-wrap: wrap; gap: 8px; max-height: 200px; overflow-y: auto;"></div>
        <button id="enviarComentarioBtn" class="enviar-comentario-btn">
          <i class="fas fa-paper-plane"></i> ENVIAR COMENTARIO
        </button>
      </div>

      <div id="comentariosList" class="comentarios-list">
        <div class="empty-comments"><i class="fas fa-spinner fa-pulse"></i> Cargando comunidad...</div>
      </div>
    </div>
  </div>

  <!-- Modal de autenticación -->
  <div id="authModal" style="position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 10001; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s;">
    <div style="background: #0f0f13; border: 1px solid var(--neon-purple); border-radius: 28px; max-width: 440px; width: 90%; padding: 35px; position: relative;">
      <div style="position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer;" onclick="closeAuthModal()">&times;</div>
      <div style="display: flex; gap: 20px; margin-bottom: 25px;">
        <div class="auth-tab active" data-tab="login" style="color: var(--neon-cyan); border-bottom: 2px solid var(--neon-cyan); cursor: pointer;">Iniciar sesión</div>
        <div class="auth-tab" data-tab="register" style="cursor: pointer;">Registrarse</div>
      </div>
      <div id="authLoginForm" style="display: flex; flex-direction: column; gap: 15px;">
        <input type="email" id="loginEmail" placeholder="Correo electrónico" style="background: #181920; border: none; padding: 14px; border-radius: 16px; color: white;">
        <input type="password" id="loginPassword" placeholder="Contraseña" style="background: #181920; border: none; padding: 14px; border-radius: 16px; color: white;">
        <button onclick="loginWithEmail()" style="background: var(--neon-cyan); color: #000; font-weight: 900; padding: 14px; border-radius: 40px;">Entrar</button>
      </div>
      <div id="authRegisterForm" style="display: none; flex-direction: column; gap: 15px;">
        <input type="email" id="registerEmail" placeholder="Correo electrónico" style="background: #181920; border: none; padding: 14px; border-radius: 16px;">
        <input type="password" id="registerPassword" placeholder="Contraseña" style="background: #181920; border: none; padding: 14px; border-radius: 16px;">
        <input type="password" id="registerConfirm" placeholder="Confirmar" style="background: #181920; border: none; padding: 14px; border-radius: 16px;">
        <button onclick="registerWithEmail()" style="background: var(--neon-cyan); color: #000; font-weight: 900;">Registrarse</button>
      </div>
      <div style="margin-top: 20px;">
        <div onclick="loginWithGoogle()" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 40px; text-align: center; margin-bottom: 10px; cursor: pointer;"><i class="fab fa-google"></i> Google</div>
        <div onclick="loginWithGitHub()" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 40px; text-align: center; cursor: pointer;"><i class="fab fa-github"></i> GitHub</div>
      </div>
      <div id="authError" style="color: var(--neon-pink); text-align: center; margin-top: 15px;"></div>
    </div>
  </div>

  <!-- Firebase config (ya inicializado arriba) -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpzYARIxaJijLbbL-2S6F9MWecbAbvK_I",
      authDomain: "login-admin-archinime.firebaseapp.com",
      projectId: "login-admin-archinime",
      storageBucket: "login-admin-archinime.firebasestorage.app",
      messagingSenderId: "938164660242",
      appId: "1:938164660242:web:648e0dce0e0d18dd78d0cb"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    const providerGoogle = new firebase.auth.GoogleAuthProvider();
    const providerGitHub = new firebase.auth.GithubAuthProvider();

    // Variables globales
    let currentUser = null;
    let currentAnimeId = null, currentSeason = null, currentEpisode = null;

    // Obtener parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    currentAnimeId = urlParams.get('anime');
    currentSeason = urlParams.get('s');
    currentEpisode = urlParams.get('e');

    // --- Funciones de autenticación y modal ---
    window.openAuthModal = function() {
      document.getElementById('authModal').style.opacity = '1';
      document.getElementById('authModal').style.pointerEvents = 'auto';
    };
    window.closeAuthModal = function() {
      document.getElementById('authModal').style.opacity = '0';
      document.getElementById('authModal').style.pointerEvents = 'none';
    };
    window.loginWithEmail = async () => {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        closeAuthModal();
      } catch (err) { document.getElementById('authError').innerText = err.message; }
    };
    window.registerWithEmail = async () => {
      const email = document.getElementById('registerEmail').value;
      const pass = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;
      if (pass !== confirm) { document.getElementById('authError').innerText = 'Las contraseñas no coinciden'; return; }
      try {
        await auth.createUserWithEmailAndPassword(email, pass);
        closeAuthModal();
      } catch (err) { document.getElementById('authError').innerText = err.message; }
    };
    window.loginWithGoogle = async () => {
      try { await auth.signInWithPopup(providerGoogle); closeAuthModal(); } 
      catch (err) { document.getElementById('authError').innerText = err.message; }
    };
    window.loginWithGitHub = async () => {
      try { await auth.signInWithPopup(providerGitHub); closeAuthModal(); } 
      catch (err) { document.getElementById('authError').innerText = err.message; }
    };

    // Tabs de autenticación
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.getAttribute('data-tab');
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('authLoginForm').style.display = tabName === 'login' ? 'flex' : 'none';
        document.getElementById('authRegisterForm').style.display = tabName === 'register' ? 'flex' : 'none';
      });
    });

    // --- Sistema de comentarios (Firestore) ---
    async function loadComments() {
      if (!currentAnimeId || !currentSeason || !currentEpisode) return;
      const commentsRef = db.collection('comments').where('animeId', '==', currentAnimeId)
        .where('season', '==', parseInt(currentSeason))
        .where('episode', '==', parseInt(currentEpisode));
      const snapshot = await commentsRef.orderBy('timestamp', 'desc').get();
      const listDiv = document.getElementById('comentariosList');
      if (snapshot.empty) {
        listDiv.innerHTML = '<div class="empty-comments">💬 No hay comentarios aún. ¡Sé el primero!</div>';
        return;
      }
      let html = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const fecha = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString() : 'reciente';
        html += `
          <div class="comentario-item">
            <div class="comentario-header">
              <img class="comentario-avatar" src="${data.userAvatar || 'invitado.avif'}" alt="avatar">
              <span class="comentario-nombre">${escapeHtml(data.userName || 'Anónimo')}</span>
              <span class="comentario-fecha">${fecha}</span>
            </div>
            <div class="comentario-texto">${escapeHtml(data.texto || '')}</div>
            ${data.stickerURL ? `<img class="comentario-sticker" src="${data.stickerURL}" alt="sticker">` : ''}
          </div>
        `;
      });
      listDiv.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    async function enviarComentarioTexto() {
      if (!currentUser) { openAuthModal(); return; }
      const texto = document.getElementById('comentarioTexto').value.trim();
      if (!texto) return;
      try {
        await db.collection('comments').add({
          animeId: currentAnimeId,
          season: parseInt(currentSeason),
          episode: parseInt(currentEpisode),
          userId: currentUser.uid,
          userName: currentUser.displayName || currentUser.email.split('@')[0],
          userAvatar: currentUser.photoURL || 'invitado.avif',
          texto: texto,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('comentarioTexto').value = '';
        loadComments();
      } catch (err) { console.error(err); alert('Error al enviar comentario'); }
    }

    // Emojis simples
    const emojisList = ['😀','😂','😍','🥰','😎','🤔','😭','🔥','✨','💀','🎉','❤️','👍','👎','🤣','😘','😱','🥳'];
    const emojiPanel = document.getElementById('emojiPanel');
    emojiPanel.innerHTML = emojisList.map(e => `<span style="font-size:1.8rem; cursor:pointer; padding:5px;" onclick="agregarEmoji('${e}')">${e}</span>`).join('');
    window.agregarEmoji = function(emoji) {
      const textarea = document.getElementById('comentarioTexto');
      textarea.value += emoji;
      textarea.focus();
    };
    document.getElementById('emojiBtn').onclick = () => {
      const panel = document.getElementById('emojiPanel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    };
    document.getElementById('stickerBtn').onclick = () => alert('Función de stickers próximamente en esta versión mejorada');

    // --- Lógica del reproductor (original funcional) ---
    // Cargar video-player-data.js que define la variable 'players'
    const scriptData = document.createElement('script');
    scriptData.src = `video-player-data.js?v=${Date.now()}`;
    document.head.appendChild(scriptData);
    
    let players = {};
    scriptData.onload = () => {
      players = window.players || {};
      initPlayer();
    };
    scriptData.onerror = () => {
      console.error('No se pudo cargar video-player-data.js');
      document.getElementById('epTitle').innerText = "Error al cargar datos del reproductor";
    };

    function initPlayer() {
      const DB = players;
      const epData = DB[currentAnimeId]?.[currentSeason]?.[currentEpisode];
      const backLink = document.getElementById('backLink');
      if (backLink && currentAnimeId) backLink.href = `anime-detail.html?id=${currentAnimeId}`;

      function isMobileDevice() { return /android|webos|iphone|ipad|ipod|blackberry/i.test(navigator.userAgent.toLowerCase()); }
      function generateDirectDownloadLink(url) {
        if (!url) return "#";
        if (url.includes("drive.google.com")) { const match = url.match(/\/d\/(.+?)\//); if (match) return `https://drive.usercontent.google.com/download?id=${match[1]}&export=download`; }
        if (url.includes("dropbox.com") && url.includes("dl=0")) return url.replace('dl=0', 'dl=1');
        return url;
      }
      function updateDownloadButton(url) { const dlBtn = document.getElementById('downloadBtn'); dlBtn.href = generateDirectDownloadLink(url); if (isMobileDevice()) dlBtn.setAttribute("target", "_blank"); }
      function createOptionBtn(label, url, isActive) {
        const container = document.getElementById('serverOptions');
        const btn = document.createElement('button');
        btn.className = 'opt-btn' + (isActive ? ' active' : '');
        btn.innerText = label;
        btn.onclick = () => { document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); updateDownloadButton(url); loadVideo(url); };
        container.appendChild(btn);
      }
      function loadVideo(url) {
        const container = document.getElementById('mediaContainer');
        container.innerHTML = '';
        if (!url) return;
        const isVideoFile = /\.(mp4|webm|ogg|mov|m3u8)$/i.test(url);
        if (isVideoFile && !url.includes('drive.google.com')) {
          const video = document.createElement('video'); video.src = url; video.controls = true; video.style.width = '100%'; video.style.height = '100%';
          container.appendChild(video);
        } else {
          const iframe = document.createElement('iframe'); iframe.src = url; iframe.allow = "autoplay; fullscreen"; iframe.allowFullscreen = true;
          iframe.style.width = '100%'; iframe.style.height = '100%';
          container.appendChild(iframe);
        }
      }
      function setupNavigation() {
        if (!DB[currentAnimeId]) return;
        let flatList = [];
        Object.keys(DB[currentAnimeId]).sort((a,b)=>Number(a)-Number(b)).forEach(sKey => {
          Object.keys(DB[currentAnimeId][sKey]).sort((a,b)=>Number(a)-Number(b)).forEach(eKey => { flatList.push({ s: sKey, e: eKey }); });
        });
        const idx = flatList.findIndex(i => String(i.s) === String(currentSeason) && String(i.e) === String(currentEpisode));
        const prevBtn = document.getElementById('prevBtn'); const nextBtn = document.getElementById('nextBtn');
        if (idx > 0) { prevBtn.classList.remove('btn-hidden'); prevBtn.href = `?anime=${currentAnimeId}&s=${flatList[idx-1].s}&e=${flatList[idx-1].e}`; }
        if (idx < flatList.length - 1) { nextBtn.classList.remove('btn-hidden'); nextBtn.href = `?anime=${currentAnimeId}&s=${flatList[idx+1].s}&e=${flatList[idx+1].e}`; }
      }
      const autoMarkEpisodeWatched = () => {
        auth.onAuthStateChanged(async (user) => {
          if (user && currentAnimeId && currentSeason && currentEpisode) {
            try {
              const docRef = db.collection('watchHistory').doc(user.uid);
              const doc = await docRef.get();
              let data = doc.exists ? doc.data() : {};
              let animeData = data[currentAnimeId] || {};
              let seasonData = animeData[currentSeason] || [];
              if (!seasonData.includes(parseInt(currentEpisode))) {
                seasonData.push(parseInt(currentEpisode));
                animeData[currentSeason] = seasonData;
                data[currentAnimeId] = animeData;
                await docRef.set(data, { merge: true });
              }
            } catch(e) { console.error(e); }
          } else if (currentAnimeId && currentSeason && currentEpisode) {
            localStorage.setItem(`watched_${currentAnimeId}_${currentSeason}_${currentEpisode}`, 'true');
          }
        });
      };

      if (epData) {
        document.title = `${epData.title} - Archinime Cyberpunk`;
        document.getElementById('epTitle').innerText = epData.title;
        const initialLink = epData.link || epData.link2;
        updateDownloadButton(initialLink);
        loadVideo(initialLink);
        document.getElementById('serverOptions').innerHTML = '';
        if(epData.link) createOptionBtn("Latino", epData.link, true);
        if(epData.link2) createOptionBtn("Opción 2", epData.link2, !epData.link);
        setupNavigation();
        autoMarkEpisodeWatched();
      } else {
        document.getElementById('epTitle').innerText = "Episodio no encontrado";
      }
    }

    // Compartir episodio
    document.getElementById('shareEpisodeBtn').onclick = () => {
      const url = window.location.href;
      navigator.clipboard.writeText(url);
      alert('¡Enlace copiado al portapapeles!');
    };

    // --- Observador de autenticación para comentarios ---
    auth.onAuthStateChanged(user => {
      currentUser = user;
      const loginMsg = document.getElementById('comentarioLoginMessage');
      const formContainer = document.getElementById('comentarioFormContainer');
      if (user) {
        loginMsg.style.display = 'none';
        formContainer.style.display = 'block';
        document.getElementById('comentarioUserAvatar').src = user.photoURL || 'invitado.avif';
        document.getElementById('comentarioUserName').innerText = user.displayName || user.email.split('@')[0];
      } else {
        loginMsg.style.display = 'block';
        formContainer.style.display = 'none';
      }
      if (currentAnimeId && currentSeason && currentEpisode) loadComments();
    });

    // Forzar reproducción del video de fondo
    const bgVideo = document.getElementById('bg-video');
    bgVideo.play().catch(() => { document.body.addEventListener('click', () => bgVideo.play(), { once: true }); });
    
    // Botón enviar comentario
    document.getElementById('enviarComentarioBtn').onclick = enviarComentarioTexto;
  </script>
</body>
</html>
