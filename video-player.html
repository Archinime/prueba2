<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reproductor - Archinime (fix)</title>
  <link rel="icon" href="Logo_Archinime.png" type="image/png">

<script>
  (function() {
    // PALETA "SYNTHWAVE" (sin cambios funcionales)
    const colors = [
      "#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"
    ];
    const animationDuration = 20000;
    const intervalTime = 20;
    const segments = colors.length - 1;
    const step = (intervalTime / animationDuration) * segments;
    let currentProgress = 0;
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if (!metaTag) {
      metaTag = document.createElement('meta');
      metaTag.name = "theme-color";
      document.head.appendChild(metaTag);
    }
    const hexToRgb = (hex) => {
      const bigint = parseInt(hex.slice(1), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    };
    const rgbToHex = (r, g, b) => {
      return "#" + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join('');
    };
    const lerp = (start, end, t) => start + (end - start) * t;
    setInterval(() => {
      currentProgress += step;
      if (currentProgress >= segments) currentProgress = currentProgress % segments;
      const index = Math.floor(currentProgress);
      const t = currentProgress - index;
      const colorStart = hexToRgb(colors[index]);
      const colorEnd = hexToRgb(colors[index + 1]);
      const r = lerp(colorStart[0], colorEnd[0], t);
      const g = lerp(colorStart[1], colorEnd[1], t);
      const b = lerp(colorStart[2], colorEnd[2], t);
      metaTag.setAttribute('content', rgbToHex(r, g, b));
    }, intervalTime);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  /* --- VARIABLES --- */
  :root {
      --primary-color: #00fff7;
      --accent-color: #ff0055;
      --text-color: #ffffff;
      --glass-bg: rgba(0, 0, 0, 0.7);
      --glass-border: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* --- ESTILOS GENERALES --- */
  body {
      margin: 0;
      background: #050505;
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
  }

  /* --- FONDO / OVERLAY (sin cambios) --- */
  #bg-video { position: fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-10; opacity:0.5; }
  #overlay { position: fixed; top:0; left:0; width:100%; height:100%; z-index:-5; background: radial-gradient(circle at center, rgba(123, 44, 191, 0.15) 0%, #000000 90%); backdrop-filter: blur(8px); pointer-events:none; }

  .container { width:100%; max-width:1200px; margin:0 auto; padding:15px; position:relative; z-index:10; display:flex; flex-direction:column; gap:15px; box-sizing: border-box; }

  .top-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; gap:10px; background: linear-gradient(to bottom, rgba(140,82,255,0.3), transparent); padding:10px; border-radius:0 0 15px 15px; border-bottom:1px solid rgba(140,82,255,0.2); }

  .back-btn { display:inline-flex; align-items:center; gap:8px; color:#eee; text-decoration:none; font-weight:600; font-size:0.85rem; background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); padding:8px 18px; border-radius:50px; border:1px solid rgba(0,255,247,0.3); transition:all 0.3s; }
  .back-btn:hover { background: rgba(0,255,247,0.15); border-color: var(--primary-color); transform: translateY(-2px); text-shadow: 0 0 5px var(--primary-color); }

  /* --- REPRODUCTOR --- */
  .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      width: 100%;
      background: #000;
      overflow: hidden;
      z-index: 50;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      transition: cursor 0.3s ease;
  }

  .player-wrapper:fullscreen,
  .player-wrapper:-webkit-full-screen {
      padding-bottom: 0 !important;
      height: 100vh !important;
      width: 100vw !important;
      border-radius: 0 !important;
      border: none !important;
  }

  #playerContainer { position:absolute; top:0; left:0; width:100%; height:100%; }

  .player-wrapper iframe, .player-wrapper video { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }

  /* --- PARCHES DE INTERFAZ (OVERLAY MASK) --- 
     IMPORTANT: en la versión original estas patches tenían z-index por encima del iframe
     y comentaban que podían bloquear clics. Para evitar que tapen toques en tablets,
     por defecto las hacemos 'pointer-events: none' en pantallas táctiles. En puntero fino (desktop)
     mantenemos el comportamiento original. */
  .player-patch {
      position: absolute;
      z-index: 60;
      background: transparent;
      cursor: default;
      /* por defecto no bloquear interacciones (se activará en desktop via media query) */
      pointer-events: none;
  }

  /* En pantallas con puntero 'fino' (mouse/desktop) permitimos pointer-events */
  @media (hover: hover) and (pointer: fine) {
    .player-patch { pointer-events: auto; }
  }

  .main-patch { width: 100%; left: 0; top: 0; height: 10%; }
  .corner-patch { bottom: 0; right: 0; width: 100px; height: 70px; }

  .player-wrapper.hide-cursor { cursor: none; }
  .player-wrapper.hide-cursor #customFullscreenBtn { opacity: 0; pointer-events: none; }

  .fullscreen-btn {
      position: absolute;
      bottom: 0 !important;
      right: 0 !important;
      background: #000 !important;
      border: 1.5px solid rgba(255,255,255,0.4);
      color:#fff;
      padding:16px;
      border-radius: 10px 0 0 0;
      cursor: pointer;
      z-index: 100;
      display:flex; align-items:center; justify-content:center;
      transition: all 0.2s ease;
  }
  .fullscreen-btn:hover { background: var(--primary-color); color:#000; box-shadow: 0 0 15px var(--primary-color); border-color: var(--primary-color); }

  h1 { color:#fff; font-size:1.3rem; margin:5px 0 15px; text-align:center; font-weight:700; }
  .controls { display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:15px; margin-top:10px; padding-bottom:40px; width:100%; }
  .btn { padding:12px 28px; background: rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.1); color:#fff; text-decoration:none; border-radius:50px; font-size:0.95rem; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:all 0.3s; }
  .nav-btn:hover { background: rgba(0,255,247,0.15); border-color: var(--primary-color); transform: scale(1.05); }
  .btn-hidden { visibility:hidden; pointer-events:none; }

  @media (max-width: 768px) {
      .fullscreen-btn { padding:10px !important; border-radius:6px 0 0 0; }
      .fullscreen-btn svg { width:22px !important; height:22px !important; }
      .corner-patch { width:45px; height:50px; }
      .controls { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap:10px; }
      #downloadBtn { grid-column: 1 / -1; width:100%; }
  }

  .options { display:flex; gap:10px; justify-content:flex-end; }

</style>
</head>
<body>

  <!-- opcional: video de fondo (igual que antes) -->
  <video id="bg-video" autoplay muted loop playsinline style="display:none;">
    <source src="galaxia.mp4" type="video/mp4">
  </video>

  <div id="overlay"></div>

  <div class="container">
    <div class="top-nav">
       <a href="#" id="backLink" class="back-btn">
         <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
         Volver
       </a>
       <div class="options" id="serverOptions"></div>
    </div>

    <div class="player-wrapper" id="playerWrapper">
        <div id="playerContainer"></div>

        <!-- Estas patches quedan en DOM por compatibilidad visual, 
             pero NO bloquearán toques en pantallas táctiles (ver CSS). -->
        <div class="player-patch main-patch"></div>
        <div class="player-patch corner-patch"></div>

        <button id="customFullscreenBtn" class="fullscreen-btn" title="Pantalla Completa">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
        </button>
    </div>

    <h1 id="epTitle">Cargando.</h1>

    <div class="controls">
        <a id="prevBtn" class="btn nav-btn btn-hidden">⏮ Ant.</a>
        <a id="downloadBtn" class="btn" href="#" target="_blank" download>⬇ Descargar</a>
        <a id="nextBtn" class="btn nav-btn btn-hidden">Sig. ⏭</a>
    </div>
  </div>

  <!-- cargamos los datos (tu archivo original) -->
  <script>
    var version = new Date().getTime();
    document.write('<script src="video-player-data.js?v=' + version + '"><\/script>');
  </script>

  <script>
    // -----------------------------------------------------------
    // LÓGICA DEL REPRODUCTOR (adaptada)
    // -----------------------------------------------------------

    function isTablet() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const uaL = ua.toLowerCase();
        const isIpad = /ipad/.test(uaL) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroidTablet = /android/.test(uaL) && !/mobile/.test(uaL);
        const isWindowsTablet = /windows/.test(uaL) && /touch/.test(uaL) && !/phone/.test(uaL);
        const maxSide = Math.max(screen.width || 0, screen.height || 0);
        const tabletSize = maxSide >= 768 && maxSide <= 1366;
        return isIpad || isAndroidTablet || isWindowsTablet || tabletSize;
    }

    // DB viene de video-player-data.js
    const DB = (typeof players !== 'undefined') ? players : {};

    const params = new URLSearchParams(location.search);
    const animeId = params.get('anime');
    const season = params.get('s');
    const episode = params.get('e');
    const backLink = document.getElementById('backLink');

    if (animeId && season && episode) {
        const viewedKey = `watched_${animeId}_${season}_${episode}`;
        localStorage.setItem(viewedKey, 'true');
    }
    if (backLink && animeId) backLink.href = `anime-detail.html?id=${animeId}`;

    const epData = DB[animeId]?.[season]?.[episode];
    if (epData) {
        document.title = `Ver ${epData.title} - Archinime`;
        document.getElementById('epTitle').innerText = epData.title;
        const initialLink = epData.link || epData.link2;

        // ---------- CAMBIO IMPORTANTE ----------
        // Antes: si era TABLET automáticamente se abría en nueva pestaña y NO se cargaba el iframe.
        // Ahora: por defecto cargamos inline (igual que en la página "aqui") para que el usuario
        // pueda reproducir en la tablet dentro del mismo reproductor.
        // Si quieres la vieja conducta (abrir nueva pestaña en tablet) añade ?tablet_open=1 a la URL.
        const forceTabletOpen = params.get('tablet_open') === '1';
        if (initialLink && isTablet() && forceTabletOpen) {
            try {
                let tUrl = initialLink;
                if (tUrl.startsWith('http://')) tUrl = tUrl.replace('http://', 'https://');
                const newWin = window.open(tUrl, '_blank');
                if (newWin) try { newWin.opener = null; } catch(e) {}
            } catch(e) { console.warn('No se pudo abrir en nueva pestaña:', e); }
        } else {
            loadVideo(initialLink);
        }

        const optContainer = document.getElementById('serverOptions');
        optContainer.innerHTML = '';
        if(epData.link) createOptionBtn("Latino", epData.link, true);
        if(epData.link2) createOptionBtn("Sub", epData.link2, !epData.link);

        updateDownloadButton(initialLink);
        setupNavigation();
    } else {
        document.getElementById('epTitle').innerText = "No encontrado";
    }

    function generateDirectDownloadLink(url) {
        if (!url) return "#";
        if (url.includes("drive.google.com")) {
            const match = url.match(/\/d\/(.+?)\//);
            if (match && match[1]) {
               return `https://drive.usercontent.google.com/download?id=${match[1]}&export=download&authuser=0`;
            }
        }
        if (url.includes("dropbox.com") && url.includes('dl=0')) {
             return url.replace('dl=0', 'dl=1');
        }
        return url;
    }

    function updateDownloadButton(url) {
        const dlBtn = document.getElementById('downloadBtn');
        const directLink = generateDirectDownloadLink(url);
        dlBtn.href = directLink;
    }

    function createOptionBtn(label, url, isActive) {
        const optContainer = document.getElementById('serverOptions');
        const elementTag = isTablet() ? 'button' : 'button'; // siempre botón; en tablet no abrimos por defecto
        const btn = document.createElement(elementTag);
        const isFirst = optContainer.children.length === 0;
        const shouldBeActive = isActive || isFirst;
        btn.className = 'opt-btn' + (shouldBeActive ? ' active' : '');
        btn.innerText = label;

        btn.type = 'button';
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDownloadButton(url);
            // Siempre intentamos cargar inline; en caso de que la fuente sea un enlace que requiera abrir
            // en nueva pestaña (por ejemplo el servidor lo exige), el iframe fallback lo abrirá.
            loadVideo(url);
        });

        optContainer.appendChild(btn);
    }

    function loadVideo(url) {
        const container = document.getElementById('playerContainer');
        container.innerHTML = '';
        if (!url) return;

        const isVideoFile = /\.(mp4|webm|ogg|mov|m3u8)$/i.test(url);
        const isDrive = url.includes('drive.google.com') && url.includes('/preview');

        if (isVideoFile && !isDrive) {
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.autoplay = false;
            video.playsInline = true;
            video.style.width = "100%";
            video.style.height = "100%";
            video.onerror = function() { loadAsIframe(url, container); };
            container.appendChild(video);
        } else {
            loadAsIframe(url, container);
        }
    }

    function loadAsIframe(url, container) {
        container.innerHTML = '';
        let finalUrl = url;
        if (finalUrl && finalUrl.startsWith('http://')) finalUrl = finalUrl.replace('http://', 'https://');

        // CREAMOS el iframe igual que en "aqui" pero con atributos completos:
        const iframe = document.createElement('iframe');
        iframe.src = finalUrl;
        iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; encrypted-media');
        iframe.setAttribute('scrolling', 'no');
        iframe.setAttribute('allowfullscreen', ''); // permitir fullscreen
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.loading = 'lazy';

        // si el embed falla (CSP o restricciones), fallback abre nueva pestaña
        iframe.onerror = function() {
            try {
                const newWin = window.open(finalUrl, '_blank');
                if (newWin) try { newWin.opener = null; } catch(e) {}
            } catch(e) { console.warn('No se pudo abrir en nueva pestaña (fallback):', e); }
        };

        container.appendChild(iframe);
    }

    // -----------------------------------------------------------
    // Navegación y controles (se mantienen mayormente igual)
    // -----------------------------------------------------------
    function setupNavigation() {
        // Encontrar prev/next basados en DB (simplificado)
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        // búsqueda sencilla de indices en objeto (si existe)
        try {
            const seasonObj = DB[animeId]?.[season] || {};
            const keys = Object.keys(seasonObj).sort((a,b)=>Number(a)-Number(b));
            const idx = keys.indexOf(String(episode));
            if (idx > 0) {
                prevBtn.classList.remove('btn-hidden');
                prevBtn.onclick = () => { location.search = `?anime=${animeId}&s=${season}&e=${keys[idx-1]}`; };
            }
            if (idx >=0 && idx < keys.length-1) {
                nextBtn.classList.remove('btn-hidden');
                nextBtn.onclick = () => { location.search = `?anime=${animeId}&s=${season}&e=${keys[idx+1]}`; };
            }
        } catch(e) { console.warn(e); }
    }

    // Fullscreen button
    const wrapper = document.getElementById('playerWrapper');
    const fsBtn = document.getElementById('customFullscreenBtn');
    function updateFsButton() {
        // actualizado visualmente (no obligatorio)
    }
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (wrapper.requestFullscreen) wrapper.requestFullscreen();
            else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    });
    document.addEventListener('fullscreenchange', updateFsButton);
    document.addEventListener('webkitfullscreenchange', updateFsButton);

    // Auto-hide cursor logic (mejor soporte para touch)
    let hideTimeout;
    function resetInactivityTimer() {
        wrapper.classList.remove('hide-cursor');
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => { wrapper.classList.add('hide-cursor'); }, 3000);
    }
    wrapper.addEventListener('mousemove', resetInactivityTimer);
    wrapper.addEventListener('click', resetInactivityTimer);
    document.addEventListener('touchstart', resetInactivityTimer, { passive: true });
    document.addEventListener('touchmove', resetInactivityTimer, { passive: true });
    window.addEventListener('blur', () => { resetInactivityTimer(); });
    wrapper.addEventListener('mouseleave', () => { clearTimeout(hideTimeout); wrapper.classList.add('hide-cursor'); });
    resetInactivityTimer();

    // Safety: si detectamos pantalla táctil, forzamos que las patches no bloqueen interacciones.
    // (esto supera cualquier regla CSS en navegadores que no soporten la media query)
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      document.querySelectorAll('.player-patch').forEach(el => el.style.pointerEvents = 'none');
    }

  </script>
</body>
</html>
