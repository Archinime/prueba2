<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <title>Reproductor - Archinime</title>
  <link rel="icon" href="Logo_Archinime.png" type="image/png">

<script>
  (function() {
    // PALETA "SYNTHWAVE": Solo colores fríos y neones que combinan con la galaxia
    const colors = [
      "#00f3ff", // Cian Neón (Inicio)
      "#0066ff", // Azul Eléctrico
      "#bc13fe", // Morado Protagonista
      "#ff0055", // Rosa Neón (Acento)
      "#bc13fe", // Morado (Regreso)
      "#0066ff", // Azul
      "#00f3ff"  // Cian (Final para loop perfecto)
    ];

    const animationDuration = 20000; // 20 segundos
    const intervalTime = 20; 
    const segments = colors.length - 1;
    const step = (intervalTime / animationDuration) * segments;

    let currentProgress = 0;
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if (!metaTag) {
      metaTag = document.createElement('meta');
      metaTag.name = "theme-color";
      document.head.appendChild(metaTag);
    }

    const hexToRgb = (hex) => {
      const bigint = parseInt(hex.slice(1), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    };
    const rgbToHex = (r, g, b) => {
      return "#" + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join('');
    };

    const lerp = (start, end, t) => start + (end - start) * t;
    setInterval(() => {
      currentProgress += step;
      if (currentProgress >= segments) {
        currentProgress = currentProgress % segments;
      }

      const index = Math.floor(currentProgress);
      const t = currentProgress - index;
      const colorStart = hexToRgb(colors[index]);
      const colorEnd = hexToRgb(colors[index + 1]);

      const r = lerp(colorStart[0], colorEnd[0], t);
      const g = lerp(colorStart[1], colorEnd[1], t);
      const b = lerp(colorStart[2], colorEnd[2], t);

      metaTag.setAttribute('content', rgbToHex(r, g, b));
    }, intervalTime);
  })();
</script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* --- VARIABLES --- */
    :root {
        --primary-color: #00fff7;
        --accent-color: #ff0055;
        --text-color: #ffffff;
        --glass-bg: rgba(0, 0, 0, 0.7);
        --glass-border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* --- ESTILOS GENERALES --- */
    body { 
        margin: 0;
        background: #050505; 
        color: var(--text-color); 
        font-family: 'Poppins', sans-serif; 
        overflow-x: hidden; 
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
    }
   
    /* --- FONDO DE VIDEO --- */
    #bg-video { 
        position: fixed;
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        object-fit: cover;
        z-index: -10; 
        opacity: 0.5;
    }

    /* --- OVERLAY --- */
    #overlay {
      position: fixed;
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      z-index: -5;
      background: radial-gradient(circle at center, rgba(123, 44, 191, 0.15) 0%, #000000 90%);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    
    /* --- CONTENEDOR PRINCIPAL --- */
    .container { 
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 15px;
        position: relative;
        z-index: 10;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    /* --- NAVEGACIÓN SUPERIOR --- */
    .top-nav {
        display: flex;
        justify-content: space-between; 
        align-items: center;
        margin-bottom: 5px;
        flex-wrap: wrap;
        gap: 10px;
        background: linear-gradient(to bottom, rgba(140, 82, 255, 0.3), transparent);
        padding: 10px;
        border-radius: 0 0 15px 15px;
        border-bottom: 1px solid rgba(140, 82, 255, 0.2);
    }

    .back-btn { 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #eee;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 50px;
      border: 1px solid rgba(0, 255, 247, 0.3);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .back-btn:hover {
        background: rgba(0, 255, 247, 0.15);
        border-color: var(--primary-color);
        color: #fff;
        box-shadow: 0 0 20px var(--primary-color), inset 0 0 10px rgba(0, 255, 247, 0.2);
        transform: translateY(-2px);
        text-shadow: 0 0 5px var(--primary-color);
    }
   
    /* --- REPRODUCTOR --- */
    .player-wrapper { 
        position: relative;
        padding-bottom: 56.25%; /* 16:9 */
        height: 0; 
        width: 100%; 
        background: #000;
        overflow: hidden;
        z-index: 50;
        border-radius: 16px; 
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
   
    .player-wrapper iframe, .player-wrapper video { 
        position: absolute;
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        border: none;
    }

    .touch-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 90;
        cursor: pointer;
    }
    .touch-overlay.inactive {
        display: none;
    }

    /* --- TIRA PROTECTORA PERMANENTE --- */
    .logo-blocker {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 14%;
        min-height: 45px;
        background: linear-gradient(to bottom, rgba(5, 5, 5, 1) 0%, rgba(5, 5, 5, 0.85) 40%, transparent 100%);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 1.5%;
        pointer-events: auto;
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        user-select: none; 
        opacity: 1 !important;
        visibility: visible !important;
    }

    .logo-blocker::after {
        content: '';
        position: absolute;
        bottom: 25%;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
        opacity: 0.3;
    }

    .blocker-content {
        display: flex;
        align-items: baseline;
        gap: 8px;
    }

    .blocker-text {
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: clamp(1rem, 2.5vw, 1.4rem);
        color: #fff;
        letter-spacing: 5px;
        text-transform: uppercase;
        text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color);
        animation: neonPulse 2s infinite alternate;
    }

    .blocker-sub {
        font-family: 'Poppins', sans-serif;
        font-size: clamp(0.6rem, 1.2vw, 0.8rem);
        color: var(--accent-color);
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 0 8px var(--accent-color);
    }

    @keyframes neonPulse {
        0% { opacity: 0.8; text-shadow: 0 0 5px var(--primary-color), 0 0 10px var(--primary-color); }
        100% { opacity: 1; text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color), 0 0 30px var(--primary-color); }
    }

    /* --- OVERLAY DE SIGUIENTE EPISODIO (NUEVO) --- */
    .next-episode-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 200; /* Por encima de todo */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease;
        pointer-events: none;
    }

    .next-episode-overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto; /* Para que se puedan clickear los botones */
    }

    .next-title {
        font-size: clamp(1.2rem, 4vw, 2rem);
        color: #fff;
        font-weight: 700;
        margin-bottom: 25px;
        text-shadow: 0 0 15px var(--primary-color);
        text-align: center;
        letter-spacing: 1px;
    }

    .countdown-number {
        color: var(--accent-color);
        font-size: 1.2em;
        text-shadow: 0 0 15px var(--accent-color);
    }

    .countdown-wrapper {
        width: 80%;
        max-width: 400px;
        height: 8px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 30px;
        position: relative;
        border: 1px solid rgba(0, 255, 247, 0.2);
    }

    .countdown-bar {
        height: 100%;
        width: 0%;
        background: var(--primary-color);
        box-shadow: 0 0 15px var(--primary-color);
        transition: width 0.05s linear;
    }

    .countdown-actions {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* --- OPCIONES DE SERVIDOR --- */
    .options { 
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }
    
    .opt-btn { 
        font-size: 0.8rem;
        padding: 6px 14px;
        border: 1px solid rgba(255,255,255,0.2); 
        background: rgba(0, 0, 0, 0.6);
        color: #ccc;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-family: 'Poppins', sans-serif;
        font-weight: 500;
    }
    
    .opt-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
    }

    .opt-btn.active { 
        border-color: var(--primary-color);
        color: #000;
        background: var(--primary-color); 
        font-weight: 700;
        box-shadow: 0 0 15px var(--primary-color);
    }

    /* --- TÍTULO DEL EPISODIO --- */
    h1 { 
        color: #fff;
        font-size: 1.3rem; 
        margin: 5px 0 15px 0;
        text-align: center;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* --- CONTROLES --- */
    .controls { 
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 15px; 
        margin-top: 10px;
        padding-bottom: 40px;
        width: 100%;
    }
    
    #prevBtn { justify-self: start; }
    #nextBtn { justify-self: end; }
    #downloadBtn { justify-self: center; }

    /* ESTILOS DE LOS BOTONES */
    .btn { 
        padding: 12px 28px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        text-decoration: none; 
        border-radius: 50px; 
        font-size: 0.95rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        backdrop-filter: blur(5px);
        font-weight: 600;
        min-width: 100px;
        cursor: pointer;
    }
    
    .nav-btn {
        border-color: rgba(0, 255, 247, 0.3);
    }

    .nav-btn:hover {
        background: rgba(0, 255, 247, 0.15);
        border-color: var(--primary-color);
        color: #fff;
        box-shadow: 0 0 25px var(--primary-color), inset 0 0 10px rgba(0, 255, 247, 0.2);
        transform: scale(1.05);
        text-shadow: 0 0 8px var(--primary-color);
    }

    #downloadBtn {
        border-color: rgba(255, 0, 85, 0.4);
        background: rgba(255, 0, 85, 0.05);
        min-width: 140px;
    }

    #downloadBtn:hover {
        background: rgba(255, 0, 85, 0.2);
        border-color: var(--accent-color);
        color: #fff;
        box-shadow: 0 0 30px var(--accent-color), inset 0 0 10px rgba(255, 0, 85, 0.2);
        transform: scale(1.05);
        text-shadow: 0 0 8px var(--accent-color);
    }
    
    /* Botón Especial de Siguiente en el Overlay */
    #playNextNowBtn {
        background: rgba(0, 255, 247, 0.2);
        border-color: var(--primary-color);
        box-shadow: 0 0 15px rgba(0, 255, 247, 0.4);
    }

    #playNextNowBtn:hover {
        background: var(--primary-color);
        color: #000;
        box-shadow: 0 0 30px var(--primary-color);
        text-shadow: none;
    }

    .btn-hidden { 
        display: none !important; /* Usamos display none para que no estorbe en la lógica */
    }

    /* --- MEDIA QUERIES --- */
    @media (max-width: 768px) {
        .container { padding: 10px; }
        .top-nav { justify-content: space-between; }
        .options {
            overflow-x: auto;
            white-space: nowrap;
            -ms-overflow-style: none;
            scrollbar-width: none;
            max-width: 60%;
        }
        .options::-webkit-scrollbar { display: none; }

        .controls {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto; 
            gap: 10px;
        }

        #prevBtn { grid-column: 1; grid-row: 1; justify-self: start; width: auto; }
        #nextBtn { grid-column: 2; grid-row: 1; justify-self: end; width: auto; }
        #downloadBtn { grid-column: 1 / -1; grid-row: 2; width: 100%; box-sizing: border-box; }
        
        .logo-blocker {
            height: 18%;
            min-height: 55px; 
            padding-top: 3%;
        }

        .countdown-actions {
            flex-direction: column-reverse;
            width: 80%;
        }
        .countdown-actions .btn {
            width: 100%;
        }
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay muted loop playsinline poster="galaxia-morado1.avif">
    <source src="galaxia.mp4" type="video/mp4">
  </video>

  <div id="overlay"></div>

  <div class="container">
   
    <div class="top-nav">
       <a href="#" id="backLink" class="back-btn">
         <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
         Volver
       </a>
       <div class="options" id="serverOptions"></div>
    </div>

    <div class="player-wrapper" id="playerContainer"></div>

    <h1 id="epTitle">Cargando...</h1>

    <div class="controls">
        <a id="prevBtn" class="btn nav-btn btn-hidden">⏮ Ant.</a>
        
        <a id="downloadBtn" class="btn" href="#" target="_blank">
            ⬇ Descargar
        </a>
        
        <a id="nextBtn" class="btn nav-btn btn-hidden">Sig. ⏭</a>
    </div>

  </div>

  <script>
    var version = new Date().getTime();
    document.write('<script src="video-player-data.js?v=' + version + '"><\/script>');
  </script>

  <script>
    // -----------------------------------------------------------
    // LÓGICA DE INACTIVIDAD Y ESCUDO DE TOQUES
    // -----------------------------------------------------------
    let activityTimeout;
    let hasInteracted = false; 
    let canRegisterPlay = false;
    let iframeIsPlaying = false;
    let countdownInterval;

    function wakeUpUI() {
        const overlays = document.querySelectorAll('.touch-overlay');
        overlays.forEach(o => o.classList.add('inactive'));
        clearTimeout(activityTimeout);
        
        const videoElem = document.querySelector('#playerContainer video');
        const isNativePaused = videoElem ? videoElem.paused : false;

        if (hasInteracted && !isNativePaused) {
            activityTimeout = setTimeout(() => {
                overlays.forEach(o => o.classList.remove('inactive')); 
            }, 4500);
        }
    }

    window.addEventListener('mousemove', wakeUpUI);
    window.addEventListener('touchstart', wakeUpUI, {passive: true});
    window.addEventListener('touchmove', wakeUpUI, {passive: true});
    window.addEventListener('touchend', wakeUpUI, {passive: true});
    window.addEventListener('click', wakeUpUI);
    window.addEventListener('scroll', wakeUpUI, {passive: true});
    window.addEventListener('keydown', wakeUpUI);
    window.addEventListener('focus', wakeUpUI);

    window.addEventListener('blur', () => {
        if (canRegisterPlay && document.activeElement && document.activeElement.tagName === 'IFRAME') {
            iframeIsPlaying = !iframeIsPlaying; 
            hasInteracted = iframeIsPlaying;    
            wakeUpUI();
            setTimeout(() => window.focus(), 100); 
        }
    });

    // -----------------------------------------------------------
    // LÓGICA DEL REPRODUCTOR Y AUTO-PLAY
    // -----------------------------------------------------------
    
    const DB = (typeof players !== 'undefined') ? players : {};
    
    const params = new URLSearchParams(location.search);
    const animeId = params.get('anime');
    const season = params.get('s');
    const episode = params.get('e');
    const backLink = document.getElementById('backLink');

    if (animeId && season && episode) {
        const viewedKey = `watched_${animeId}_${season}_${episode}`;
        localStorage.setItem(viewedKey, 'true');
    }
    
    if (backLink && animeId) {
        backLink.href = `anime-detail.html?id=${animeId}`;
    }

    const epData = DB[animeId]?.[season]?.[episode];
    if (epData) {
        document.title = `Ver ${epData.title} - Archinime`;
        document.getElementById('epTitle').innerText = epData.title;
        const initialLink = epData.link || epData.link2;
        
        setupNavigation(); // Configuramos botones de navegación primero
        loadVideo(initialLink);
        
        const optContainer = document.getElementById('serverOptions');
        optContainer.innerHTML = '';
        if(epData.link) createOptionBtn("Latino", epData.link, true);
        if(epData.link2) createOptionBtn("Opcion 2", epData.link2, !epData.link);
        
        updateDownloadButton(initialLink);
    } else {
        document.getElementById('epTitle').innerText = "No encontrado";
    }

    // --- CREADOR DE LA TIRA PROTECTORA ---
    function addLogoBlocker(container) {
        const touchOverlay = document.createElement('div');
        touchOverlay.className = 'touch-overlay inactive'; 
        touchOverlay.addEventListener('mousemove', wakeUpUI);
        touchOverlay.addEventListener('click', (e) => { e.preventDefault(); wakeUpUI(); });
        touchOverlay.addEventListener('touchstart', (e) => { wakeUpUI(); }, {passive: true});
        container.appendChild(touchOverlay);

        const blocker = document.createElement('div');
        blocker.className = 'logo-blocker';
        blocker.innerHTML = `
            <div class="blocker-content">
                <span class="blocker-text">ARCHINIME</span>
                <span class="blocker-sub">HD</span>
            </div>
        `;
        blocker.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); wakeUpUI(); });
        blocker.addEventListener('touchstart', (e) => { wakeUpUI(); }, {passive: true});
        container.appendChild(blocker);
        
        wakeUpUI();
    }

    // --- CREADOR DE PANTALLA AUTO-PLAY ---
    function addNextEpisodeOverlay(container) {
        const nextBtn = document.getElementById('nextBtn');
        // Solo creamos el overlay si hay un siguiente episodio disponible
        if(nextBtn.classList.contains('btn-hidden')) return;

        const overlay = document.createElement('div');
        overlay.id = 'nextEpisodeOverlay';
        overlay.className = 'next-episode-overlay';
        overlay.innerHTML = `
            <div class="next-title">Siguiente episodio en <span class="countdown-number" id="countdownSecs">5</span>...</div>
            <div class="countdown-wrapper">
                <div class="countdown-bar" id="countdownBar"></div>
            </div>
            <div class="countdown-actions">
                <button class="btn nav-btn" id="cancelNextBtn">Cancelar</button>
                <button class="btn" id="playNextNowBtn">Siguiente Ahora</button>
            </div>
        `;
        container.appendChild(overlay);

        document.getElementById('cancelNextBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            cancelCountdown();
        });
        
        document.getElementById('playNextNowBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            clearInterval(countdownInterval);
            if(nextBtn && nextBtn.href) window.location.href = nextBtn.href;
        });
    }

    function showNextEpisodeCountdown() {
        const overlay = document.getElementById('nextEpisodeOverlay');
        const nextBtn = document.getElementById('nextBtn');
        if (!overlay || nextBtn.classList.contains('btn-hidden')) return; // No hace nada si no hay siguiente capítulo

        overlay.classList.add('active'); // Muestra la pantalla de cristal oscuro
        
        const duration = 5000; // 5 Segundos
        let timeLeft = duration;
        const bar = document.getElementById('countdownBar');
        const secsDisplay = document.getElementById('countdownSecs');

        countdownInterval = setInterval(() => {
            timeLeft -= 50; // Se actualiza rápido para que la barra se mueva fluido
            const percent = ((duration - timeLeft) / duration) * 100;
            bar.style.width = percent + '%';
            secsDisplay.innerText = Math.ceil(timeLeft / 1000);

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.href = nextBtn.href; // Redirige al siguiente episodio
            }
        }, 50);
    }

    function cancelCountdown() {
        clearInterval(countdownInterval);
        const overlay = document.getElementById('nextEpisodeOverlay');
        if (overlay) overlay.classList.remove('active'); // Oculta la pantalla y te deja en el video
    }

    // --- LÓGICA DE DESCARGA Y ENLACES ---
    function generateDirectDownloadLink(url) {
        if (!url) return "#";
        if (url.includes("drive.google.com")) {
            const match = url.match(/\/d\/(.+?)\//);
            if (match && match[1]) return `https://drive.usercontent.google.com/download?id=${match[1]}&export=download&authuser=0`;
            const altMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (altMatch && altMatch[1]) return `https://drive.usercontent.google.com/download?id=${altMatch[1]}&export=download&authuser=0`;
        }
        if (url.includes("dropbox.com") && url.includes("dl=0")) return url.replace('dl=0', 'dl=1');
        if (url.includes("ok.ru/")) {
            const match = url.match(/ok\.ru\/video(?:embed)?\/(\d+)/);
            if (match && match[1]) return `https://anydownloader.com/en/#url=https://ok.ru/video/${match[1]}`;
        }
        if (url.includes("odysee.com")) return url.replace('/$/embed/', '/$/download/');
        return url;
    }

    function updateDownloadButton(url) {
        const dlBtn = document.getElementById('downloadBtn');
        const directLink = generateDirectDownloadLink(url);
        dlBtn.href = directLink || '#';
        
        if(directLink && directLink !== '#') {
            dlBtn.setAttribute("target", "_blank");
            dlBtn.setAttribute("download", ""); 
        } else {
            dlBtn.removeAttribute("target");
            dlBtn.removeAttribute("download");
        }
    }

    function createOptionBtn(label, url, isActive) {
        const optContainer = document.getElementById('serverOptions');
        const btn = document.createElement('button');
        const isFirst = optContainer.children.length === 0;
        const shouldBeActive = isActive || isFirst;
        btn.className = 'opt-btn' + (shouldBeActive ? ' active' : '');
        btn.innerText = label;
        btn.onclick = () => {
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadVideo(url);
            updateDownloadButton(url);
        };
        optContainer.appendChild(btn);
    }

    function loadVideo(url) {
        const container = document.getElementById('playerContainer');
        container.innerHTML = ''; 
        if (!url) return;
        
        clearInterval(countdownInterval); // Limpiar cualquier cuenta regresiva activa

        hasInteracted = false;
        canRegisterPlay = false;
        iframeIsPlaying = false;
        setTimeout(() => { canRegisterPlay = true; }, 1500);

        // --- EL TRUCO PARA ODYSEE ---
        // Convertimos el link de iframe de Odysee a un link de descarga directa (.mp4)
        // Esto fuerza a que se use el reproductor nativo limpio y sin publicidad/endscreens
        let isNativePlayer = /\.(mp4|webm|ogg|mov|m3u8)$/i.test(url);
        const isDrive = url.includes('drive.google.com') && url.includes('/preview');
        
        if (url.includes("odysee.com")) {
            url = url.replace('/$/embed/', '/$/download/');
            isNativePlayer = true; // Forzamos reproductor nativo
        }

        if (isNativePlayer && !isDrive) {
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.autoplay = false;
            video.playsInline = true; 
            video.style.width = "100%";
            video.style.height = "100%";
            video.onerror = function() { loadAsIframe(url, container); }; // Fallback por si acaso
            
            video.addEventListener('pause', () => { hasInteracted = false; wakeUpUI(); });
            video.addEventListener('play', () => { hasInteracted = true; wakeUpUI(); });
            
            // EL EVENTO CLAVE: Cuando termina el video, activamos la cuenta regresiva
            video.addEventListener('ended', showNextEpisodeCountdown);

            container.appendChild(video);
            addLogoBlocker(container);
            addNextEpisodeOverlay(container); // Añadimos el HTML del overlay oculto
        } else {
            loadAsIframe(url, container);
        }
    }

    function loadAsIframe(url, container) {
        container.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
        iframe.setAttribute("allowfullscreen", "true");
        iframe.style.position = "absolute";
        iframe.style.top = "0";
        iframe.style.left = "0";
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        container.appendChild(iframe);
        addLogoBlocker(container);
        // Nota: No se puede detectar cuándo termina un Iframe de terceros (como Mega u Ok.ru)
        // por reglas de seguridad de navegadores (Cross-Origin), así que el Auto-Play aplica a Odysee y videos nativos.
    }

    function setupNavigation() {
        try {
            if (DB[animeId]) {
                let flatList = [];
                const seasons = Object.keys(DB[animeId]).sort((a, b) => Number(a) - Number(b));
                seasons.forEach(sKey => {
                    const episodes = Object.keys(DB[animeId][sKey]).sort((a, b) => Number(a) - Number(b));
                    episodes.forEach(eKey => {
                        flatList.push({ s: sKey, e: eKey });
                    });
                });
                const currentIndex = flatList.findIndex(item => String(item.s) === String(season) && String(item.e) === String(episode));
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                if (currentIndex > 0) {
                    const prevItem = flatList[currentIndex - 1];
                    prevBtn.classList.remove('btn-hidden');
                    prevBtn.href = `?anime=${animeId}&s=${prevItem.s}&e=${prevItem.e}`;
                } else {
                    prevBtn.classList.add('btn-hidden');
                }

                if (currentIndex !== -1 && currentIndex < flatList.length - 1) {
                    const nextItem = flatList[currentIndex + 1];
                    nextBtn.classList.remove('btn-hidden');
                    nextBtn.href = `?anime=${animeId}&s=${nextItem.s}&e=${nextItem.e}`;
                } else {
                    nextBtn.classList.add('btn-hidden');
                }
            }
        } catch (e) { console.error(e); }
    }
  </script>
