<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor - Archinime</title>
  <link rel="icon" href="Logo_Archinime.png" type="image/png">
  
  <!-- Precargas críticas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://www.gstatic.com">
  
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase (carga diferida) -->
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    /* ===== ESTILOS OPTIMIZADOS (MENOS BRILLO, MÁS ELEGANTES) ===== */
    :root {
      --primary-color: #00f3ff;
      --accent-color: #bc13fe;
      --dark-bg: #050505;
      --glass-bg: rgba(10, 12, 16, 0.85);
      --border-glow: 0 0 8px rgba(0, 243, 255, 0.3);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      background: var(--dark-bg);
      font-family: 'Poppins', sans-serif;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
    }
    
    #bg-video { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      object-fit: cover; z-index: 1; opacity: 0.4; filter: brightness(0.7);
      background: url('galaxia-morado1.avif') center/cover no-repeat;
    }
    
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(123, 44, 191, 0.1) 0%, #000000 90%);
      z-index: 2; pointer-events: none;
    }
    
    .container { 
      max-width: 1200px; margin: 0 auto; padding: 15px;
      position: relative; z-index: 10;
      display: flex; flex-direction: column; gap: 15px;
    }
    
    /* ===== NAVEGACIÓN (más limpia) ===== */
    .top-nav {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
      background: rgba(5, 5, 10, 0.9);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      padding: 12px 20px; border-radius: 16px;
      border: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: var(--border-glow);
    }
    
    .back-btn { 
      display: inline-flex; align-items: center; gap: 8px;
      color: #e0e0e0; text-decoration: none; font-weight: 600; font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.5); 
      padding: 8px 18px; border-radius: 40px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      transition: all 0.2s ease;
    }
    
    .back-btn:hover {
      background: rgba(0, 243, 255, 0.1); border-color: var(--primary-color);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); color: white;
    }
    
    /* ===== REPRODUCTOR (marco sutil) ===== */
    .player-wrapper { 
      position: relative; padding-bottom: 56.25%; height: 0;
      background: #000; border-radius: 16px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
      overflow: hidden;
    }
    
    .player-wrapper iframe, .player-wrapper video { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
    }
    
    .logo-blocker {
      position: absolute; top: 0; left: 0; width: 100%;
      height: 14%; min-height: 45px;
      background: linear-gradient(to bottom, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.7) 40%, transparent 100%);
      z-index: 100; display: flex; justify-content: center; align-items: flex-start;
      padding-top: 1.5%; border-radius: 16px 16px 0 0; pointer-events: none;
    }
    
    .blocker-text {
      font-weight: 800; font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: #fff; letter-spacing: 5px; text-transform: uppercase;
      text-shadow: 0 0 8px var(--primary-color); opacity: 0.9;
    }
    
    /* ===== SERVIDORES ===== */
    .options { display: flex; gap: 8px; justify-content: flex-end; }
    .opt-btn { 
      padding: 6px 14px; background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 243, 255, 0.25); color: #ccc;
      cursor: pointer; border-radius: 8px; font-family: 'Poppins', sans-serif;
      transition: all 0.2s; font-size: 0.85rem;
    }
    .opt-btn.active { 
      border-color: var(--primary-color); background: rgba(0, 243, 255, 0.15);
      color: var(--primary-color); font-weight: 600;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
    }
    .opt-btn:hover:not(.active) {
      background: rgba(0, 243, 255, 0.08); border-color: rgba(0, 243, 255, 0.5);
    }
    
    h1 { text-align: center; font-size: 1.3rem; margin: 5px 0; font-weight: 600; }
    
    /* ===== BOTONES DE CONTROL ===== */
    .controls { 
      display: grid; grid-template-columns: 1fr auto 1fr;
      gap: 15px; margin-top: 10px;
    }
    #prevBtn { justify-self: start; } #nextBtn { justify-self: end; }
    #downloadBtn { justify-self: center; }
    
    .btn { 
      padding: 12px 28px; background: rgba(10, 10, 15, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff; text-decoration: none; border-radius: 40px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s ease; font-weight: 700; font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px; text-transform: uppercase; backdrop-filter: blur(4px);
    }
    .nav-btn { border-color: rgba(0, 243, 255, 0.4); color: var(--primary-color); }
    .nav-btn:hover {
      background: rgba(0, 243, 255, 0.1); border-color: var(--primary-color);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3); transform: translateY(-2px);
    }
    #downloadBtn { border-color: var(--accent-color); color: var(--accent-color); }
    #downloadBtn:hover {
      background: rgba(188, 19, 254, 0.1); border-color: var(--accent-color);
      box-shadow: 0 0 12px rgba(188, 19, 254, 0.3); transform: translateY(-2px);
    }
    .btn-hidden { visibility: hidden; pointer-events: none; }
    
    /* ===== COMENTARIOS (estilo más limpio) ===== */
    .comentarios-section {
      margin-top: 40px; padding: 25px;
      background: rgba(5, 5, 10, 0.9); backdrop-filter: blur(8px);
      border-radius: 20px; border: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
    }
    .comentarios-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 25px;
      padding-bottom: 15px; border-bottom: 1px solid rgba(0, 243, 255, 0.2);
    }
    .comentarios-header i { font-size: 2rem; color: var(--primary-color); }
    .comentarios-header h3 { font-size: 1.5rem; font-weight: 800; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    
    .comentario-login-message {
      background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 16px; padding: 30px; text-align: center; margin-bottom: 30px;
    }
    .login-link-btn {
      background: rgba(0, 243, 255, 0.1); border: 1px solid var(--primary-color);
      color: var(--primary-color); font-weight: 700; padding: 10px 24px;
      border-radius: 30px; cursor: pointer; display: inline-flex; align-items: center;
      gap: 8px; margin-top: 15px; transition: 0.2s;
    }
    .login-link-btn:hover { background: var(--primary-color); color: #000; }
    
    .comentario-form-container {
      background: rgba(10, 10, 15, 0.8); border-radius: 16px; padding: 20px;
      border: 1px solid rgba(0, 243, 255, 0.3); margin-bottom: 20px;
    }
    .comentario-user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .comentario-user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary-color); }
    
    .comentario-input-wrapper { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .comentario-input-wrapper textarea {
      flex: 1; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; padding: 15px; color: white; font-family: 'Poppins', sans-serif;
      resize: vertical; min-height: 90px; transition: 0.2s;
    }
    .comentario-input-wrapper textarea:focus { 
      outline: none; border-color: var(--primary-color); background: rgba(0, 0, 0, 0.8);
    }
    
    .emoji-btn, .sticker-btn {
      background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; padding: 12px 18px; cursor: pointer; font-size: 1.3rem;
      color: white; transition: 0.2s;
    }
    .emoji-btn:hover, .sticker-btn:hover { 
      background: rgba(0, 243, 255, 0.15); border-color: var(--primary-color);
    }
    
    .emoji-panel {
      display: none; background: #0a0a0f; border: 1px solid var(--primary-color);
      border-radius: 12px; padding: 15px; margin-bottom: 15px; flex-wrap: wrap;
      gap: 8px; max-height: 200px; overflow-y: auto;
    }
    .emoji-panel.active { display: flex; }
    .emoji-option { font-size: 1.5rem; cursor: pointer; padding: 5px; width: 40px; text-align: center; }
    
    .enviar-comentario-btn {
      background: var(--primary-color); border: none; color: #000; font-weight: 800;
      font-family: 'Orbitron', sans-serif; padding: 12px 25px; border-radius: 30px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      transition: 0.2s; text-transform: uppercase;
    }
    .enviar-comentario-btn:hover { background: #fff; transform: translateY(-2px); }
    
    .comentarios-list { display: flex; flex-direction: column; gap: 15px; }
    .empty-comments { text-align: center; padding: 40px; color: #888; }
    
    /* ===== STICKERS PANEL ===== */
    .sticker-panel-full {
      display: none; background: #0a0a0f; border: 1px solid var(--primary-color);
      border-radius: 12px; margin-bottom: 15px; overflow: hidden;
    }
    .sticker-panel-full.active { display: block; }
    .sticker-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .sticker-tab {
      flex: 1; padding: 12px; background: none; border: none; color: #aaa;
      cursor: pointer; font-weight: 600; transition: 0.2s;
    }
    .sticker-tab.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); }
    .sticker-tab-content { display: none; padding: 20px; max-height: 350px; overflow-y: auto; }
    .sticker-tab-content.active { display: block; }
    .stickers-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .sticker-item {
      background: rgba(0,0,0,0.5); border-radius: 10px; padding: 8px; cursor: pointer;
      text-align: center; border: 1px solid rgba(255,255,255,0.05);
    }
    .sticker-item:hover { background: rgba(0, 243, 255, 0.1); border-color: var(--primary-color); }
    .sticker-img { width: 100%; aspect-ratio: 1/1; object-fit: contain; }
    .sticker-delete-btn {
      position: absolute; top: -6px; right: -6px; background: #ff4757;
      border: none; color: white; border-radius: 50%; width: 22px; height: 22px;
      font-size: 11px; cursor: pointer;
    }
    
    .add-sticker-container { text-align: center; padding: 20px; }
    .upload-sticker-label {
      background: rgba(0, 243, 255, 0.1); border: 1px solid var(--primary-color);
      color: var(--primary-color); padding: 10px 25px; border-radius: 30px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    }
    
    /* ===== MODAL LOGIN ===== */
    .auth-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 10001;
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px;
    }
    .auth-modal.show { opacity: 1; pointer-events: auto; }
    .auth-card {
      background: #0a0a0f; border: 1px solid var(--accent-color); border-radius: 20px;
      width: 100%; max-width: 400px; padding: 30px; position: relative;
    }
    .auth-close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; }
    .auth-tabs { display: flex; gap: 20px; margin-bottom: 25px; }
    .auth-tab { padding: 8px 0; cursor: pointer; font-weight: 700; color: #aaa; }
    .auth-tab.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-form input { background: #101016; border: 1px solid #2a2b35; padding: 14px; border-radius: 10px; color: white; }
    .auth-form button { background: var(--primary-color); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 800; cursor: pointer; }
    .provider-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; margin-top: 10px; }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .comentarios-section { padding: 20px 15px; }
      .controls { grid-template-columns: 1fr 1fr; }
      #downloadBtn { grid-column: 1/-1; }
      .btn { padding: 10px 15px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline poster="galaxia-morado1.avif">
  <source src="galaxia.mp4" type="video/mp4">
</video>
<div id="overlay"></div>

<div class="container">
  <div class="top-nav">
    <a href="#" id="backLink" class="back-btn">
      <i class="fas fa-arrow-left"></i> Volver
    </a>
    <div class="options" id="serverOptions"></div>
  </div>

  <div class="player-wrapper">
    <div class="logo-blocker">
      <span class="blocker-text">ARCHINIME</span>
    </div>
    <div id="mediaContainer" style="width:100%;height:100%;"></div>
  </div>

  <h1 id="epTitle">Cargando...</h1>

  <div class="controls">
    <a id="prevBtn" class="btn nav-btn btn-hidden"><i class="fas fa-step-backward"></i> Ant.</a>
    <a id="downloadBtn" class="btn" href="#"><i class="fas fa-download"></i> Descargar</a>
    <a id="nextBtn" class="btn nav-btn btn-hidden">Sig. <i class="fas fa-step-forward"></i></a>
  </div>

  <div class="comentarios-section">
    <div class="comentarios-header">
      <i class="fas fa-comments"></i>
      <h3>COMENTARIOS</h3>
    </div>

    <div id="comentarioLoginMessage" class="comentario-login-message" style="display: none;">
      <i class="fas fa-lock" style="font-size: 2rem; opacity: 0.7;"></i>
      <p>Inicia sesión para comentar y usar stickers</p>
      <button class="login-link-btn" onclick="window.videoPlayer?.openLoginModal()">
        <i class="fas fa-sign-in-alt"></i> Iniciar sesión
      </button>
    </div>

    <div id="comentarioFormContainer" class="comentario-form-container" style="display: none;">
      <div class="comentario-user-info">
        <img id="comentarioUserAvatar" src="invitado.avif" alt="Avatar">
        <span id="comentarioUserName">Usuario</span>
      </div>
      
      <div class="comentario-input-wrapper">
        <textarea id="comentarioTexto" placeholder="Escribe un comentario... (Enter para enviar)" maxlength="500"></textarea>
        <button type="button" class="emoji-btn" onclick="window.videoPlayer?.toggleEmojiPanel()">😊</button>
        <button type="button" class="sticker-btn" onclick="window.videoPlayer?.toggleStickerPanel()">
          <i class="fas fa-sticky-note"></i>
        </button>
      </div>
      
      <div id="comentarioStickerPreview" class="comentario-sticker-preview" style="display: none;">
        <!-- Preview de sticker seleccionado -->
      </div>
      
      <div id="emojiPanel" class="emoji-panel"></div>
      
      <div id="stickerPanelFull" class="sticker-panel-full">
        <div class="sticker-tabs">
          <button class="sticker-tab active" data-tab="mis">Mis stickers</button>
          <button class="sticker-tab" data-tab="subir">Subir</button>
        </div>
        <div id="misStickersTab" class="sticker-tab-content active">
          <div id="userStickersContainer" class="stickers-grid"></div>
        </div>
        <div id="subirStickersTab" class="sticker-tab-content">
          <div class="add-sticker-container">
            <p>Sube imágenes o videos (máx. 2 MB)</p>
            <label for="stickerFileInput" class="upload-sticker-label">
              <i class="fas fa-cloud-upload-alt"></i> Seleccionar archivo
            </label>
            <input type="file" id="stickerFileInput" accept="image/*,video/mp4,video/webm" style="display:none">
          </div>
        </div>
      </div>
      
      <button id="enviarComentarioBtn" class="enviar-comentario-btn" onclick="window.videoPlayer?.enviarComentario()">
        <i class="fas fa-paper-plane"></i> Enviar
      </button>
    </div>

    <div id="comentariosList" class="comentarios-list">
      <div class="empty-comments"><i class="fas fa-spinner fa-pulse"></i> Cargando...</div>
    </div>
  </div>
</div>

<!-- Modal de autenticación -->
<div id="authModal" class="auth-modal">
  <div class="auth-card">
    <div class="auth-close" onclick="window.videoPlayer?.closeAuthModal()">&times;</div>
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login">Iniciar sesión</div>
      <div class="auth-tab" data-tab="register">Registrarse</div>
    </div>
    <div id="authLoginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Correo electrónico">
      <input type="password" id="loginPassword" placeholder="Contraseña">
      <button onclick="window.videoPlayer?.loginWithEmail()">Iniciar sesión</button>
    </div>
    <div id="authRegisterForm" class="auth-form" style="display:none;">
      <input type="email" id="registerEmail" placeholder="Correo electrónico">
      <input type="password" id="registerPassword" placeholder="Contraseña">
      <input type="password" id="registerConfirm" placeholder="Confirmar contraseña">
      <button onclick="window.videoPlayer?.registerWithEmail()">Registrarse</button>
    </div>
    <div class="auth-providers">
      <div class="provider-btn" onclick="window.videoPlayer?.loginWithGoogle()">
        <i class="fab fa-google"></i> Continuar con Google
      </div>
      <div class="provider-btn" onclick="window.videoPlayer?.loginWithGitHub()">
        <i class="fab fa-github"></i> Continuar con GitHub
      </div>
    </div>
    <div id="authError" class="auth-error" style="color:#ff4757; margin-top:15px;"></div>
  </div>
</div>

<!-- Carga de datos externos -->
<script defer src="video-player-data.js?v=20250406"></script>
<script defer src="stickers-system.js?v=20250406"></script>
<script defer src="reacciones.js?v=20250406"></script>
<script defer src="comentarios.js?v=20250406"></script>

<!-- Núcleo del reproductor (optimizado) -->
<script defer src="video-player-core.js?v=20250406"></script>
</body>
</html>
