<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subir música a Firestore</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>Subiendo canciones a Firestore...</h1>
  <pre id="log"></pre>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpzYARIxaJijLbbL-2S6F9MWecbAbvK_I",
      authDomain: "login-admin-archinime.firebaseapp.com",
      projectId: "login-admin-archinime",
      storageBucket: "login-admin-archinime.firebasestorage.app",
      messagingSenderId: "938164660242",
      appId: "1:938164660242:web:648e0dce0e0d18dd78d0cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Lista copiada de musica_fondo.txt
    const musicList = [
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20%20-%20How%20Do%20You%20Do%20(Remix)%20✕.mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20Battlecry%20(Heart%20of%20Courage)%20(Lyrics).mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20Centuries.mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20Go%20Go%20Go%20Go!.mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20How%20Do%20You%20Do%20(Remix)%20✕.mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20Monster%20%5BNMV%5D.mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20PLAY%20x%20Unity%20x%20Faded%20%20Alan%20Walker%20(Mashup%20%20Switching%20Vocals)%20Lyrics.mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20Sweet%20Little%20Bumblebee%20(lyric%20video).mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20Take%20A%20Hint.mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20Thunder%20(Gabry%20Ponte%2C%20LUM!X%2C%20Prezioso)%20-%20(Lyrics).mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20When%20You%20Leave%20(Numa%20Numa).mp3',
      'https://cdn.jsdelivr.net/gh/Archinime/Archivos-data@main/Nightcore%20-%20Yo%20y%20los%20que%20tuvieron%20etapa%20Vocaloid%20cuando%20suena%20😼✨.mp3'
    ];

    function extraerNombre(url) {
      // Decodifica la URL y extrae el nombre del archivo sin extensión
      const decoded = decodeURIComponent(url);
      const partes = decoded.split('/');
      const nombreArchivo = partes[partes.length - 1];
      // Quita la extensión .mp3 y reemplaza %20 por espacios
      return nombreArchivo.replace(/\.mp3$/i, '').replace(/%20/g, ' ');
    }

    async function subirMusica() {
      const log = document.getElementById('log');
      log.textContent = 'Iniciando subida...\n';

      const batch = db.batch();
      const collectionRef = db.collection('musica_fondo');

      for (const url of musicList) {
        const nombre = extraerNombre(url);
        const docRef = collectionRef.doc(); // auto-ID
        batch.set(docRef, {
          url: url,
          nombre: nombre,
          activa: true,
          fechaSubida: firebase.firestore.FieldValue.serverTimestamp()
        });
        log.textContent += `✅ Preparado: ${nombre}\n`;
      }

      try {
        await batch.commit();
        log.textContent += '\n🎉 ¡Todas las canciones se han subido correctamente!';
      } catch (error) {
        log.textContent += `\n❌ Error: ${error.message}`;
        console.error(error);
      }
    }

    subirMusica();
  </script>
</body>
</html>
