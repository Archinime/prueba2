  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const segments = colors.length - 1;
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }
      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      const rgbToHex = (r, g, b) => "#" + [r, g, b].map(x => Math.round(x).toString(16).padStart(2,'0')).join('');
      const lerp = (start, end, t) => start + (end - start) * t;
      let startTimestamp = null, lastUpdate = 0;
      function step(timestamp) {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = timestamp - startTimestamp;
        if (timestamp - lastUpdate > 100) {
          let currentProgress = (progress / animationDuration) * segments;
          currentProgress %= segments;
          const index = Math.floor(currentProgress);
          const t = currentProgress - index;
          const colorStart = hexToRgb(colors[index]);
          const colorEnd = hexToRgb(colors[index + 1]);
          const r = lerp(colorStart[0], colorEnd[0], t);
          const g = lerp(colorStart[1], colorEnd[1], t);
          const b = lerp(colorStart[2], colorEnd[2], t);
          metaTag.setAttribute('content', rgbToHex(r, g, b));
          lastUpdate = timestamp;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

  const providerGitHub = new firebase.auth.GithubAuthProvider();
  
  // ========== LÓGICA DEL BOTÓN DINÁMICO (INSTALAR vs YOUTUBE) ==========
  let deferredPrompt = null;
  const dynamicBtn = document.getElementById('dynamicActionBtn');
  const iosModalEl = document.getElementById('iosInstallModal');
  
  function isStandaloneMode() {
    // Detecta si la app se ejecuta como PWA instalada (standalone)
    return (window.matchMedia('(display-mode: standalone)').matches) || 
           (window.navigator.standalone === true);
  }
  
  function updateDynamicButton() {
    if (isStandaloneMode()) {
      // Modo app instalada: mostrar botón de YouTube
      dynamicBtn.innerHTML = '<img src="youtube.avif" alt="YT" style="width: 100%; height: 100%; border-radius: 50%;">';
      dynamicBtn.title = "YouTube Canal";
      dynamicBtn.classList.remove('dynamic-install-btn');
      dynamicBtn.onclick = () => window.open('https://www.youtube.com/@Archinime-k2g', '_blank');
    } else {
      // Modo web: mostrar botón de descarga con brillo
      dynamicBtn.innerHTML = '<i class="fas fa-download"></i>';
      dynamicBtn.title = "Instalar App (Más rápido)";
      dynamicBtn.classList.add('dynamic-install-btn');
      dynamicBtn.onclick = triggerInstall;
    }
  }
  
  function triggerInstall() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') console.log("Usuario instaló la app");
        deferredPrompt = null;
      });
    } else {
      // Si no hay deferredPrompt, puede ser iOS o navegador sin soporte
      const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
      if (isIos && !isStandaloneMode()) {
        iosModalEl.classList.add('active');
      } else {
        alert("Para una experiencia más rápida, usa Chrome o Edge en Android, o añade a pantalla de inicio en iOS.");
      }
    }
  }
  
  function closeIosModal() { iosModalEl.classList.remove('active'); }
  window.closeIosModal = closeIosModal;
  
  // Escuchar el evento beforeinstallprompt
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    updateDynamicButton(); // refrescar por si acaso
  });
  
  // Detectar cambios en el modo display (por si el usuario abre la app instalada)
  const displayModeMedia = window.matchMedia('(display-mode: standalone)');
  displayModeMedia.addEventListener('change', updateDynamicButton);
  
  // Inicializar al cargar
  window.addEventListener('DOMContentLoaded', updateDynamicButton);
  
  // Registrar Service Worker (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => console.log('SW registrado', reg)).catch(err => console.warn('SW error', err));
    });
  }

  // --- SIMULACIÓN de variables/objetos que vienen de scripts externos (para que no haya errores) ---
  window.videoList = window.videoList || [{ id: 1, src: "https://cdn.pixabay.com/video/2021/04/06/70827-534018391_large.mp4", keyColor: "green" }];
  window.musicListGlobal = window.musicListGlobal || ["https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"];
  window.listaDeGifs = window.listaDeGifs || ["chica_corriendo.gif"];
  window.listaAnuncios = window.listaAnuncios || [];
  function toggleNotifMenu() { const menu = document.getElementById('notifMenu'); if(menu) menu.classList.toggle('active'); }
  function aplicarTiltANuevasCards() { /* efecto tilt opcional */ }
  let currentFilters = { search: '', genre: '', demographic: '', rating: '' };
  let cachedAdCard = null;

  window.resetearFiltrosGlobal = function() { location.reload(); };

</script>
