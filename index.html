  <!-- Theme color animado -->
  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const intervalTime = 20;
      const segments = colors.length - 1;
      const step = (intervalTime / animationDuration) * segments;
      let currentProgress = 0;
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }
      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      const rgbToHex = (r, g, b) => "#" + [r, g, b].map(x => Math.round(x).toString(16).padStart(2,'0')).join('');
      const lerp = (start, end, t) => start + (end - start) * t;
      setInterval(() => {
        currentProgress += step;
        if (currentProgress >= segments) currentProgress = currentProgress % segments;
        const index = Math.floor(currentProgress);
        const t = currentProgress - index;
        const colorStart = hexToRgb(colors[index]);
        const colorEnd = hexToRgb(colors[index + 1]);
        const r = lerp(colorStart[0], colorEnd[0], t);
        const g = lerp(colorStart[1], colorEnd[1], t);
        const b = lerp(colorStart[2], colorEnd[2], t);
        metaTag.setAttribute('content', rgbToHex(r, g, b));
      }, intervalTime);
    })();
  </script>

  <style>
    /* ===== VARIABLES ===== */
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --neon-yellow: #f1c40f;
      --dark-bg: #050505;
      --glass-bg: rgba(10, 12, 16, 0.75);
      --header-height: 72px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--dark-bg);
      background-image: url('galaxia-morado1.avif');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Poppins', sans-serif;
      color: white;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body.modal-open, html.modal-open { overflow: hidden !important; position: relative; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020202; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--neon-purple), var(--neon-cyan)); border-radius: 4px; }

    /* ===== LOADER (ESTILO ANTIGUO CON GLITCH) ===== */
    #page-loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #050505; z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }
    .loader-glitch-wrapper { position: relative; display: inline-block; }
    .loader-glitch {
      font-family: 'Orbitron', sans-serif; font-size: 3rem; color: white; font-weight: 900;
      letter-spacing: 6px; text-transform: uppercase; position: relative; text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }
    .loader-glitch::before, .loader-glitch::after {
      content: 'Archinime'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505;
    }
    .loader-glitch::before {
      left: 3px; text-shadow: -2px 0 var(--neon-pink); clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
      animation: trueGlitch 2.5s infinite linear alternate-reverse; z-index: -1;
    }
    .loader-glitch::after {
      left: -3px; text-shadow: -2px 0 var(--neon-cyan); clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
      animation: trueGlitch2 3s infinite linear alternate-reverse; z-index: -2;
    }
    .loader-sub {
      font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--neon-cyan); letter-spacing: 3px;
      margin-top: 5px; opacity: 0.8; animation: pulseText 1.5s infinite;
    }
    .loader-line-container { width: 260px; height: 3px; background: rgba(255,255,255,0.05); margin-top: 15px; overflow: hidden; border-radius: 2px; }
    .loader-line { width: 0; height: 3px; background: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); border-radius: 2px; animation: loadLine 1s forwards cubic-bezier(0.7, 0, 0.3, 1); }

    /* ===== FONDO (MÁS CLARO) ===== */
    #bg-video {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -5;
      opacity: 0; filter: contrast(1.1) brightness(0.85); transition: opacity 1.2s ease;
      background: url('galaxia-morado1.avif') no-repeat center center / cover;
    }
    #bg-video.loaded { opacity: 1; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(188, 19, 254, 0.12) 0%, rgba(0,0,0,0.8) 90%);
      z-index: -4; pointer-events: none; transition: opacity 0.6s ease;
    }
    #scanlines {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.5));
      background-size: 100% 3px; z-index: -3; pointer-events: none; opacity: 0.12;
    }

    /* ===== NAVBAR (LOGO ARCOIRIS) ===== */
    .cyber-nav {
      position: sticky; top: 0; z-index: 1000; background: var(--glass-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 0 3%; display: flex; justify-content: space-between; align-items: center;
      height: var(--header-height); border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .cyber-nav::after {
      content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
      background-size: 200% 100%; animation: borderFlow 4s linear infinite; opacity: 0.8;
    }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
    .nav-logo img { height: 42px; width: 42px; object-fit: contain; border-radius: 8px; box-shadow: 0 0 10px rgba(188, 19, 254, 0.3); transition: transform 0.3s; }
    .nav-logo:hover img { transform: rotate(10deg) scale(1.1); }
    @keyframes rainbowNeon {
      0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
    }
    .nav-logo-text {
      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.4rem; letter-spacing: 1px;
      background: linear-gradient(90deg, #ff0055, #ff0000, #ff9900, #ffff00, #33ff00, #00ff99, #00f3ff, #0000ff, #9900ff, #ff00cc, #ff0055);
      background-size: 400% 400%; animation: rainbowNeon 5s ease infinite;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .search-wrapper { position: relative; margin: 0 25px; flex-grow: 1; max-width: 450px; }
    .search-input {
      width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px;

      transition: all 0.3s;

    .search-input:focus { background: rgba(0, 0, 0, 0.6); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); }

    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .cyber-btn-icon {

      border: 1px solid rgba(255,255,255,0.1); color: #ccc; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s ease; position: relative; font-size: 1.1rem; overflow: visible;
    }
    .cyber-btn-icon:hover { color: white; border-color: var(--neon-purple); box-shadow: 0 0 15px rgba(188, 19, 254, 0.4); transform: translateY(-2px); }
    #installBtn { display: none; }
    .install-pulse { animation: pulseBorder 2s infinite; color: var(--neon-cyan); }

    /* ===== NOTIFICACIONES ===== */
    .notif-wrapper { position: relative; overflow: visible; }
    .notif-badge {
      position: absolute; top: -6px; right: -6px; z-index: 10; background: var(--neon-pink);

    .notif-dropdown {
      position: absolute; top: 55px; right: -10px; width: 360px; background: #0f0f13;
      border: 1px solid var(--neon-purple); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      opacity: 0; pointer-events: none; transform: translateY(-10px) scale(0.95);

    }
    .notif-dropdown.active { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .notif-header { padding: 12px; background: rgba(188, 19, 254, 0.1); color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 0.85rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); letter-spacing: 2px; }
    .notif-list { max-height: 400px; overflow-y: auto; }
    .notif-item { display: flex; gap: 15px; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; cursor: pointer; align-items: center; }
    .notif-item:hover { background: rgba(255,255,255,0.05); }
    .notif-img-box { width: 50px; height: 70px; flex-shrink: 0; border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
    .notif-img-box img { width: 100%; height: 100%; object-fit: cover; }
    .notif-content { flex: 1; min-width: 0; }
    .n-title { font-size: 0.9rem; font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .n-type { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
    .n-meta { font-size: 0.75rem; color: #aaa; }
    .tag-final { background: #ff0000; color: white; padding: 1px 4px; border-radius: 2px; font-size: 0.55em; }

    /* ===== USUARIO ===== */
    .user-menu { position: relative; display: flex; align-items: center; }
    #userAvatarBtn { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon-cyan); cursor: pointer; transition: 0.2s; background: #111; }
    #userAvatarBtn:hover { transform: scale(1.08); box-shadow: 0 0 15px var(--neon-cyan); }
    .user-dropdown {
      position: absolute; top: 55px; right: 0; width: 280px; background: rgba(15, 15, 20, 0.98);
      border: 1px solid var(--neon-purple); border-radius: 16px; backdrop-filter: blur(20px);
      box-shadow: 0 20px 35px rgba(0,0,0,0.8); opacity: 0; pointer-events: none;
      transform: translateY(-15px); transition: all 0.25s; z-index: 2000;
    }
    .user-dropdown.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .user-dropdown-header { padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .user-dropdown-header:hover { background: rgba(188, 19, 254, 0.15); }
    .user-dropdown-header img { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--neon-cyan); }
    .user-dropdown-item { padding: 14px 18px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; color: #ddd; }
    .user-dropdown-item:hover { background: rgba(188, 19, 254, 0.15); color: white; padding-left: 22px; }

    /* ===== CONTROLES (SELECTS ESTILO ANTIGUO) ===== */
    .controls-container {
      padding: 20px 3%; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    select {
      appearance: none; -webkit-appearance: none; background-color: rgba(20, 20, 25, 0.9);
      color: #e0e0e0; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 0.5px;
      cursor: pointer; outline: none; padding: 12px 35px 12px 20px; min-width: 160px;
      border: 1px solid rgba(188, 19, 254, 0.4); border-radius: 0;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23bc13fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: calc(100% - 12px) center; background-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: all 0.3s ease;
    }
    select:hover, select:focus { color: white; background-color: rgba(30, 30, 40, 0.95); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); transform: translateY(-2px); }
    select option { background: #0b0c10; color: white; }

    /* ===== GRID Y CARDS ===== */
    .container { max-width: 1600px; margin: 0 auto; padding: 10px 20px 80px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
    .card {
      position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 2/3; cursor: pointer;
      transition: transform 0.1s ease-out, box-shadow 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      background: #111; transform-style: preserve-3d;
    }
    .card::before { content: ''; position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; z-index: 2; pointer-events: none; }
    .card:hover::before { border-color: var(--neon-purple); box-shadow: 0 0 20px rgba(188, 19, 254, 0.2) inset; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .card:hover img { transform: scale(1.08); }
    .card .info {
      position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #000 0%, rgba(5,5,5,0.95) 60%, transparent 100%);
      padding: 70px 15px 15px; display: flex; flex-direction: column; gap: 4px; transform: translateY(10px); opacity: 0.9; transition: 0.3s;
    }
    .card:hover .info { transform: translateY(0); opacity: 1; }
    .card .info strong { font-size: 1rem; color: white; text-shadow: 0 2px 4px black; }
    .card .info span { font-size: 0.75rem; color: var(--neon-cyan); font-family: 'Orbitron'; }

    /* Anuncios */
    .card-ad { cursor: default; background: #0a0a0c; }
    .card-ad > div { width: 100% !important; height: 100% !important; display: flex; flex-direction: column; align-items: stretch; justify-content: center; }
    .card-ad .info { display: none; }

    /* ===== MODALES (AUTH, PROFILE, EVENTO) ===== */
    .auth-modal, .profile-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
      z-index: 10001; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none;
      transition: 0.3s; padding: 20px;
    }
    .auth-modal.show, .profile-modal.show { opacity: 1; pointer-events: auto; }
    .auth-card, .profile-card {
      background: rgba(15, 15, 19, 0.98); border: 1px solid var(--neon-purple); border-radius: 28px;
      width: 100%; max-width: 440px; padding: 30px; position: relative; transform: scale(0.96);
      transition: transform 0.3s; box-shadow: 0 25px 45px rgba(0,0,0,0.9);
    }
    .auth-modal.show .auth-card, .profile-modal.show .profile-card { transform: scale(1); }
    .auth-close, .profile-close {
      position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; background: rgba(255,255,255,0.05);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      cursor: pointer; color: #aaa; transition: 0.2s;
    }
    .auth-close:hover, .profile-close:hover { color: white; background: var(--neon-pink); transform: rotate(90deg); }
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .auth-tab { padding: 12px; cursor: pointer; font-weight: 800; color: #aaa; border-bottom: 2px solid transparent; flex: 1; text-align: center; }
    .auth-tab.active { color: var(--neon-cyan); border-bottom-color: var(--neon-cyan); }
    .auth-form { display: flex; flex-direction: column; gap: 15px; }
    .auth-form input { background: #181920; border: 1px solid #2a2b35; padding: 14px; border-radius: 16px; color: white; }
    .auth-form input:focus { border-color: var(--neon-cyan); outline: none; }
    .auth-form button, .profile-save-btn {
      background: linear-gradient(135deg, var(--neon-cyan), #0066ff); color: #000; border: none; padding: 14px;
      border-radius: 40px; font-weight: 900; cursor: pointer; transition: 0.2s;
    }
    .auth-form button:hover, .profile-save-btn:hover { background: var(--neon-cyan); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,243,255,0.3); }
    .auth-providers { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .provider-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px;
      border-radius: 40px; display: flex; align-items: center; justify-content: center; gap: 12px;
      cursor: pointer; color: white; font-weight: 600;
    }
    .provider-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--neon-cyan); }

    .profile-avatar { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 20px; }
    .profile-avatar img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon-cyan); }
    .profile-upload-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 8px 20px; border-radius: 20px; color: white; cursor: pointer; }
    .profile-field { margin-bottom: 20px; }
    .profile-field label { display: block; font-size: 0.9rem; color: #ccc; margin-bottom: 8px; }
    .profile-field input[type="text"] { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; }
    .color-picker { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

    /* ===== CHROMA KEY (PERSONAJE) ===== */
    .stage { pointer-events: none; position: fixed; inset: 0; z-index: 8; }
    #fgContainer {
      position: fixed; pointer-events: auto; display: flex; align-items: center; justify-content: center;
      right: 20px; bottom: 20px; width: 280px; max-height: 350px; overflow: hidden;
      background: transparent; border-radius: 10px; filter: drop-shadow(0 0 10px rgba(0,243,255,0.2));
      z-index: 50; transition: transform 0.6s, opacity 0.6s; cursor: pointer;
    }
    #fgContainer.poof { transform: scale(1.15); opacity: 0; filter: drop-shadow(0 0 20px var(--neon-pink)) brightness(1.5) blur(4px); }
    #fgCanvas { width: 100%; height: 100%; display: block; object-fit: contain; }

<!-- Lógica principal (Firestore, auth, perfil, chroma, etc.) -->
<script>
  // ========== CONFIGURACIÓN INICIAL ==========
  if (typeof listaDeGifs !== 'undefined' && listaDeGifs.length) {
    document.getElementById('personaje-gif')?.setAttribute('src', listaDeGifs[Math.floor(Math.random() * listaDeGifs.length)]);
  }

  // Loader
  const loader = document.getElementById('page-loader');
  let loadingCompleted = false;
  function finishLoading() {
    if (loadingCompleted) return;
    loadingCompleted = true;
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.visibility = 'hidden'; }, 400);
  }
  setTimeout(finishLoading, 1500);
  window.addEventListener('firstAnimesLoaded', finishLoading);

  // Ratings desde Firestore
  let firestoreRatings = new Map();
  async function loadRatings() {
    try {
      const snapshot = await db.collection('animeRatings').get();
      snapshot.forEach(doc => {
        const data = doc.data();
        if (typeof data.avg === 'number') firestoreRatings.set(parseInt(doc.id), { avg: data.avg, count: data.count || 0 });
      });
    } catch (e) { console.warn('Error ratings:', e); }
  }
  loadRatings();

  function getDisplayRating(anime) {
    const id = parseInt(anime.id);
    if (firestoreRatings.has(id)) return firestoreRatings.get(id).avg.toFixed(1);
    return (anime.rating != null && !isNaN(anime.rating)) ? anime.rating.toFixed(1) : '—';
  }
  function getNumericRating(anime) {
    const id = parseInt(anime.id);
    if (firestoreRatings.has(id)) return firestoreRatings.get(id).avg;
    return (anime.rating != null && typeof anime.rating === 'number') ? anime.rating : 0;
  }

  // Anuncios
  let anuncioActual = null;
  let cachedAdCard = null;
  function inicializarAnuncio() {
    if (typeof window.listaAnuncios !== 'undefined' && window.listaAnuncios.length) {
      anuncioActual = window.listaAnuncios[Math.floor(Math.random() * window.listaAnuncios.length)];
    }
  }
  function crearTarjetaAnuncio() {
    if (cachedAdCard) return cachedAdCard;
    if (!anuncioActual) return null;
    const card = document.createElement('div'); card.className = 'card card-ad'; card.dataset.id = anuncioActual.id;
    const inner = document.createElement('div'); inner.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;';
    inner.innerHTML = anuncioActual.codigo;
    inner.querySelectorAll('script').forEach(s => { const ns = document.createElement('script'); if (s.src) ns.src = s.src; else ns.textContent = s.textContent; inner.appendChild(ns); s.remove(); });
    card.appendChild(inner);
    cachedAdCard = card;
    return card;
  }

  // Renderizado
  const grid = document.getElementById('grid');
  function renderAnimes(animes, append = false) {
    if (!append) grid.innerHTML = '';
    if (!animes.length && !append) { mostrarNoResultados(); return; }
    const frag = document.createDocumentFragment();
    const hasFilters = currentFilters.search || currentFilters.genre || currentFilters.demographic || currentFilters.rating;
    const shouldInsertAd = !append && !hasFilters && anuncioActual;
    let adPos = -1;
    if (shouldInsertAd && animes.length >= 5) adPos = Math.floor(Math.random() * (animes.length - 4)) + 4;
    for (let i = 0; i < animes.length; i++) {
      if (shouldInsertAd && i === adPos) {
        const adCard = crearTarjetaAnuncio();
        if (adCard) { if (adCard.parentNode) adCard.remove(); frag.appendChild(adCard); }
      }
      const a = animes[i];
      const card = document.createElement('div'); card.className = 'card'; card.dataset.id = a.id;
      card.setAttribute('onclick', `location='anime-detail.html?id=${a.id}'`);
      card.innerHTML = `<img src="${a.img || 'placeholder.webp'}" alt="${a.title}" loading="lazy"><div class="info"><strong>${a.title}</strong><span>⭐ ${getDisplayRating(a)}</span></div>`;
      frag.appendChild(card);
    }
    grid.appendChild(frag);
    aplicarTilt();
  }

  function mostrarNoResultados() {
    grid.innerHTML = `<div class="cyber-no-results" style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;padding:60px;background:rgba(10,12,16,0.7);border:1px solid var(--neon-purple);border-radius:16px;">
      <i class="fas fa-satellite-dish" style="font-size:3rem;color:var(--neon-cyan);"></i><h2 style="font-family:Orbitron;margin:20px 0;">Sin Resultados</h2>
      <p>Prueba con otros filtros o busca por alias.</p>
      <button onclick="resetearFiltros()" style="margin-top:20px;background:transparent;border:2px solid var(--neon-pink);color:#fff;padding:12px 30px;border-radius:8px;cursor:pointer;">Restaurar Radares</button>
    </div>`;
  }

  // Paginación Firestore
  let lastVisible = null, isLoading = false, hasMore = true;
  let currentFilters = { search: '', genre: '', demographic: '', rating: '' };
  let debounceTimer = null;

  async function cargarAnimes(reset = true) {
    if (isLoading) return;
    if (!reset && !hasMore) return;
    isLoading = true;
    if (reset) { grid.innerHTML = ''; lastVisible = null; hasMore = true; }
    try {
      let query = db.collection('catalogo');
      if (currentFilters.genre) query = query.where('genres', 'array-contains', currentFilters.genre);
      query = query.orderBy('title').limit(20);
      if (lastVisible && !reset) query = query.startAfter(lastVisible);
      const snapshot = await query.get();
      if (snapshot.empty) { hasMore = false; if (reset) mostrarNoResultados(); return; }
      lastVisible = snapshot.docs[snapshot.docs.length - 1];
      let animes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if (currentFilters.demographic) animes = animes.filter(a => (a.genres||[]).some(g => norm(g) === norm(currentFilters.demographic)));
      if (currentFilters.search) {
        const term = norm(currentFilters.search);
        animes = animes.filter(a => [a.title, ...(a.aliases||[])].some(t => norm(t).startsWith(term)));
      }
      if (currentFilters.rating) {
        animes = animes.filter(a => {
          const r = getNumericRating(a);
          if (currentFilters.rating === 'excellent') return r >= 4.8;
          if (currentFilters.rating === 'good') return r >= 4.6 && r < 4.8;
          return r < 4.6;
        });
      }
      renderAnimes(animes, !reset);
      if (reset) window.dispatchEvent(new CustomEvent('firstAnimesLoaded'));
    } catch (e) { console.error(e); grid.innerHTML = `<div style="color:red;">Error: ${e.message}</div>`; }
    finally { isLoading = false; }
  }

  function debouncedCargar() { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => cargarAnimes(true), 300); }
  window.resetearFiltros = () => {
    ['search','genre-select','demographic-select','rating-select'].forEach(id => document.getElementById(id).value = '');
    currentFilters = { search: '', genre: '', demographic: '', rating: '' };
    cargarAnimes(true);
  };

  // Event listeners
  document.getElementById('search').addEventListener('input', e => { currentFilters.search = e.target.value; debouncedCargar(); });
  ['genre-select','demographic-select','rating-select'].forEach(id => document.getElementById(id).addEventListener('change', e => { currentFilters[id.replace('-select','')] = e.target.value; cargarAnimes(true); }));
  window.addEventListener('scroll', () => { if (!isLoading && hasMore && !(currentFilters.search||currentFilters.genre||currentFilters.demographic||currentFilters.rating) && window.innerHeight+window.scrollY >= document.body.offsetHeight-500) cargarAnimes(false); });

  // Tilt
  function aplicarTilt() {
    document.querySelectorAll('.card:not([data-tilt-init])').forEach(c => {
      c.dataset.tiltInit = 'true';
      c.addEventListener('mousemove', e => {
        const rect = c.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        c.style.transform = `perspective(1200px) rotateX(${((y - rect.height/2) / (rect.height/2)) * -6}deg) rotateY(${((x - rect.width/2) / (rect.width/2)) * 6}deg) scale(1.02)`;
      });
      c.addEventListener('mouseleave', () => c.style.transform = '');
    });
  }

  // ========== AUTENTICACIÓN Y PERFIL ==========
  let currentUser = null, newAvatarUrl = null, lastProfileUpdate = 0;
  const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dbcqcai1q/upload', CLOUDINARY_PRESET = 'stickers_archinime';
  function getNeonColorFallback(s) {
    const colors = ['#00fff7','#ff0055','#bc13fe','#00ff33','#ffff00','#ffaa00','#ff00aa','#00aaff'];
    let hash = 0; for (let i=0;i<s.length;i++) hash = s.charCodeAt(i) + ((hash<<5)-hash);
    return colors[Math.abs(hash) % colors.length];
  }
  function showProfileModal() {
    if (!currentUser) { showAuthModal(); return; }
    document.getElementById('profileAvatar').src = currentUser.photoURL || 'invitado.avif';
    newAvatarUrl = currentUser.photoURL;
    document.getElementById('profileUid').value = currentUser.uid;
    document.getElementById('profileDisplayName').value = currentUser.displayName || currentUser.email.split('@')[0];
    db.collection('users').doc(currentUser.uid).get().then(doc => {
      let color = (doc.exists && doc.data().customColor) ? doc.data().customColor : getNeonColorFallback(currentUser.uid);
      document.getElementById('profileNameColor').value = color;
      if (doc.exists && doc.data().lastProfileUpdate) lastProfileUpdate = doc.data().lastProfileUpdate.toMillis();
    });
    document.getElementById('profileModal').classList.add('show');
  }
  function closeProfileModal() { document.getElementById('profileModal').classList.remove('show'); }
  function copiarUID() {
    const input = document.getElementById('profileUid');
    if (input.value) navigator.clipboard.writeText(input.value);
  }
  document.getElementById('profileAvatarInput').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    if (file.size > 2*1024*1024) { alert('Máximo 2 MB'); return; }
    const btn = document.querySelector('#profileModal .profile-upload-btn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo...';
    try {
      const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', CLOUDINARY_PRESET);
      const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: fd });
      const data = await res.json();
      if (data.secure_url) { newAvatarUrl = data.secure_url; document.getElementById('profileAvatar').src = newAvatarUrl; }
    } catch(err) { alert('Error subiendo imagen'); }
    finally { btn.innerHTML = '<i class="fas fa-upload"></i> Subir nuevo avatar'; }
  });
  async function guardarCambiosPerfil() {
    if (!currentUser) return;
    const newName = document.getElementById('profileDisplayName').value.trim();
    const newColor = document.getElementById('profileNameColor').value;
    if (!newName) return;
    const isAdmin = currentUser.email === 'archinime12@gmail.com';
    if (!isAdmin && lastProfileUpdate && Date.now() - lastProfileUpdate < 5*24*60*60*1000) {
      document.getElementById('profileStatusMsg').innerText = '⏳ Solo puedes cambiar tu perfil cada 5 días.';
      return;
    }
    try {
      await currentUser.updateProfile({ displayName: newName, photoURL: newAvatarUrl });
      await db.collection('users').doc(currentUser.uid).set({ customColor: newColor, lastProfileUpdate: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      const batch = db.batch();
      (await db.collection('comments').where('userId','==',currentUser.uid).get()).forEach(d => batch.update(d.ref, { userName: newName, userAvatar: newAvatarUrl, customColor: newColor }));
      await batch.commit();
      document.getElementById('profileStatusMsg').innerText = '¡Cambios guardados!';
      updateUserUI(currentUser);
    } catch(e) { console.error(e); }
  }
  function showAuthModal() { document.getElementById('authModal').classList.add('show'); }
  function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); }
  async function loginWithEmail() {
    try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); closeAuthModal(); }
    catch(e) { document.getElementById('authError').innerText = e.message; }
  }
  async function registerWithEmail() {
    const pass = document.getElementById('registerPassword').value;
    if (pass !== document.getElementById('registerConfirm').value) { document.getElementById('authError').innerText = 'Contraseñas no coinciden'; return; }
    try { await auth.createUserWithEmailAndPassword(document.getElementById('registerEmail').value, pass); closeAuthModal(); }
    catch(e) { document.getElementById('authError').innerText = e.message; }
  }
  async function loginWithGoogle() { try { await auth.signInWithPopup(providerGoogle); closeAuthModal(); } catch(e) { document.getElementById('authError').innerText = e.message; } }
  async function loginWithGitHub() { try { await auth.signInWithPopup(providerGitHub); closeAuthModal(); } catch(e) { document.getElementById('authError').innerText = e.message; } }
  function logoutUser() { auth.signOut().then(() => location.reload()); }
  function updateUserUI(user) {
    currentUser = user;
    const avatarBtn = document.getElementById('userAvatarBtn'), dropdownAvatar = document.getElementById('dropdownAvatar'), dropdownName = document.getElementById('dropdownName'), loginItem = document.getElementById('loginBtnItem');
    if (user) {
      const photo = user.photoURL || 'invitado.avif';
      avatarBtn.src = photo; dropdownAvatar.src = photo;
      dropdownName.innerText = user.displayName || user.email.split('@')[0];
      loginItem.innerHTML = '<i class="fas fa-sign-out-alt"></i> Cerrar sesión'; loginItem.onclick = logoutUser;
      db.collection('users').doc(user.uid).get().then(doc => {
        let color = (doc.exists && doc.data().customColor) ? doc.data().customColor : getNeonColorFallback(user.uid);
        avatarBtn.style.borderColor = color; avatarBtn.style.boxShadow = `0 0 15px ${color}`;
        dropdownAvatar.style.borderColor = color; dropdownAvatar.style.boxShadow = `0 0 15px ${color}`;
        dropdownName.style.color = color; dropdownName.style.textShadow = `0 0 8px ${color}`;
      });
    } else {
      avatarBtn.src = 'invitado.avif'; dropdownAvatar.src = 'invitado.avif'; dropdownName.innerText = 'Invitado';
      loginItem.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión'; loginItem.onclick = showAuthModal;
      avatarBtn.style.borderColor = 'var(--neon-cyan)'; avatarBtn.style.boxShadow = 'none';
    }
  }
  auth.onAuthStateChanged(updateUserUI);
  document.querySelectorAll('.auth-tab').forEach(t => t.addEventListener('click', function() {
    document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.remove('active'));
    this.classList.add('active');
    const isLogin = this.dataset.tab === 'login';
    document.getElementById('authLoginForm').style.display = isLogin ? 'flex' : 'none';
    document.getElementById('authRegisterForm').style.display = isLogin ? 'none' : 'flex';
  }));
  document.getElementById('profileDropdownBtn').addEventListener('click', e => { e.stopPropagation(); showProfileModal(); });
  document.getElementById('userAvatarBtn').addEventListener('click', e => { e.stopPropagation(); document.getElementById('userDropdown').classList.toggle('active'); });
  document.addEventListener('click', e => { if (!e.target.closest('.user-menu')) document.getElementById('userDropdown').classList.remove('active'); });

  window.loginWithEmail = loginWithEmail; window.registerWithEmail = registerWithEmail;
  window.loginWithGoogle = loginWithGoogle; window.loginWithGitHub = loginWithGitHub;
  window.showAuthModal = showAuthModal; window.closeAuthModal = closeAuthModal;
  window.guardarCambiosPerfil = guardarCambiosPerfil; window.closeProfileModal = closeProfileModal; window.copiarUID = copiarUID;

  // ========== POPUP MÓVIL (ESTILO ANTIGUO) ==========
  (function() {
    const isMobile = () => window.matchMedia('(max-width:780px)').matches;
    const ids = ['genre-select','demographic-select','rating-select'];
    let activePopup = null;
    function closePopup() { if (activePopup) { activePopup.remove(); activePopup = null; } }
    function openPopup(select) {
      closePopup();
      const rect = select.getBoundingClientRect();
      const pop = document.createElement('div'); pop.className = 'mobile-select-popup';
      pop.style.maxHeight = '300px'; pop.style.minWidth = Math.max(150, rect.width) + 'px';
      let top = rect.bottom + 6;
      if (top + 300 > window.innerHeight) top = rect.top - 300 - 6;
      pop.style.left = Math.max(8, rect.left) + 'px'; pop.style.top = Math.max(8, top) + 'px';
      Array.from(select.options).forEach(opt => {
        const d = document.createElement('div'); d.className = 'opt'; d.textContent = opt.textContent;
        if (opt.selected) d.setAttribute('aria-selected','true');
        d.addEventListener('click', () => { select.value = opt.value; select.dispatchEvent(new Event('change')); closePopup(); });
        pop.appendChild(d);
      });
      document.body.appendChild(pop); activePopup = pop;
      setTimeout(() => document.addEventListener('click', function outside(e) {
        if (!pop.contains(e.target) && e.target !== select) { closePopup(); document.removeEventListener('click', outside); }
      }), 10);
    }
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('mousedown', e => { if (isMobile()) { e.preventDefault(); openPopup(el); } });
    });
  })();

  // ========== CHROMA KEY (PERSONAJE) ==========
  const fgContainer = document.getElementById('fgContainer'), fgVideo = document.getElementById('fgVideo'), fgCanvas = document.getElementById('fgCanvas');
  const fgCtx = fgCanvas.getContext('2d', { willReadFrequently: true });
  let currentAnim = (typeof videoList !== 'undefined' && videoList.length) ? videoList[Math.floor(Math.random() * videoList.length)] : null;
  let isTransitioning = false;
  if (currentAnim) {
    fgVideo.src = currentAnim.src;
    fgVideo.addEventListener('loadedmetadata', () => {
      const maxW = 300, ratio = fgVideo.videoWidth / fgVideo.videoHeight;
      fgCanvas.width = maxW; fgCanvas.height = maxW / ratio;
    });
    function processChroma() {
      if (fgVideo.paused || fgVideo.ended || isTransitioning) { requestAnimationFrame(processChroma); return; }
      fgCtx.drawImage(fgVideo, 0, 0, fgCanvas.width, fgCanvas.height);
      const frame = fgCtx.getImageData(0, 0, fgCanvas.width, fgCanvas.height);
      const data = frame.data, key = currentAnim.keyColor || 'green', thresh = (currentAnim.preset?.threshold || 0.4) * 255;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        if (key === 'blue') { if (b > r + thresh && b > g + thresh) data[i+3] = 0; }
        else { if (g > r + thresh && g > b + thresh) data[i+3] = 0; }
      }
      fgCtx.putImageData(frame, 0, 0);
      requestAnimationFrame(processChroma);
    }
    fgVideo.addEventListener('play', processChroma);
    fgVideo.play().catch(()=>{});
    document.getElementById('bg-video').play().catch(()=>{});
  }
  fgContainer.addEventListener('click', () => {
    if (isTransitioning) return;
    isTransitioning = true;
    fgContainer.classList.add('poof');
    setTimeout(() => {
      let newAnim;
      do { newAnim = videoList[Math.floor(Math.random() * videoList.length)]; } while (newAnim.id === currentAnim.id && videoList.length > 1);
      currentAnim = newAnim;
      fgVideo.src = currentAnim.src;
      fgVideo.play().then(() => { isTransitioning = false; fgContainer.classList.remove('poof'); });
    }, 600);
  });

  // ========== INICIALIZACIÓN FINAL ==========
  inicializarAnuncio();
  cargarAnimes(true);
  window.addEventListener('load', () => { if (window.startNotificationSequence) window.startNotificationSequence(); });
</script>
