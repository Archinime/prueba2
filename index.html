<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Archinime OS | Next Gen Platform</title>
  
  <link rel="icon" href="Logo_Archinime.avif" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050505">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
  /* =========================================
     1. ESTILOS CORE (DISEÑO CYBERPUNK)
     ========================================= */
  :root {
    --neon-cyan: #00f3ff;
    --neon-purple: #bc13fe;
    --neon-pink: #ff0055;
    --dark-bg: #050505;
    --glass-bg: rgba(20, 20, 30, 0.6);
    --text: #ffffff;
  }

  body { 
    margin: 0; padding: 0;
    background-color: var(--dark-bg); 
    font-family: 'Poppins', sans-serif; 
    overflow-x: hidden;
    color: white;
  }
  
  a { text-decoration: none; transition: 0.3s; color: inherit; }
  
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }

  /* LOADER */
  #page-loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 9999;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    transition: opacity 0.5s ease-out, visibility 0.5s;
  }
  .loader-glitch {
    font-family: 'Orbitron', sans-serif; font-size: 2rem; color: white;
    position: relative; animation: glitch 1s infinite;
  }
  .loader-line {
    width: 0; height: 2px; background: var(--neon-cyan); margin-top: 10px;
    animation: loadLine 2s forwards ease-in-out;
  }

  /* FONDO */
  #bg-video {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -5; opacity: 0.4;
    filter: contrast(1.2) saturate(1.2);
  }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(82, 0, 255, 0.1) 0%, #000 90%);
    z-index: -4; pointer-events: none;
  }
  #scanlines {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
    background-size: 100% 4px;
    z-index: -3; pointer-events: none; opacity: 0.7;
  }

  /* NAVBAR */
  .cyber-nav {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(5, 5, 5, 0.7);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding: 15px 5%;
    display: flex; justify-content: space-between; align-items: center;
    transition: 0.3s;
  }
  .cyber-nav.scrolled {
    background: rgba(0,0,0,0.95);
    box-shadow: 0 5px 20px rgba(0, 243, 255, 0.1);
  }
  .nav-logo { 
    display: flex; align-items: center; gap: 10px; 
    font-family: 'Orbitron', sans-serif; font-weight: 800; 
    font-size: 1.5rem; color: white; letter-spacing: 2px; cursor: pointer;
  }
  .nav-logo img { height: 40px; filter: drop-shadow(0 0 5px var(--neon-cyan)); }
  .nav-center { display: flex; gap: 20px; align-items: center;}

  /* CONTROLES */
  .control-group { display: flex; gap: 10px; align-items: center; }
  .search-container { position: relative; }
  .search-input {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 8px 15px 8px 35px; color: white; outline: none;
    width: 180px; transition: 0.3s; font-family: 'Poppins';
  }
  .search-input:focus { width: 280px; border-color: var(--neon-purple); box-shadow: 0 0 10px rgba(188, 19, 254, 0.3); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 0.8rem;}
  
  .cyber-select {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; color: #ccc; padding: 8px 15px;
    font-family: 'Poppins'; font-size: 0.85rem; outline: none; cursor: pointer; transition: 0.3s;
  }
  .cyber-select:hover { border-color: var(--neon-cyan); color: white; background: rgba(0,0,0,0.8); }

  /* BOTONES NAV E INSTALAR */
  .nav-icon-btn {
    background: transparent; border: none; color: white;
    font-size: 1.2rem; cursor: pointer; position: relative;
    transition: 0.3s; margin-left: 10px;
  }
  .nav-icon-btn:hover { color: var(--neon-cyan); transform: scale(1.1); text-shadow: 0 0 10px var(--neon-cyan); }
  
  /* Animación Pulso PWA */
  .install-pulse { animation: pulse-green 2s infinite; color: var(--neon-cyan) !important; text-shadow: 0 0 10px var(--neon-cyan); }
  @keyframes pulse-green {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* HERO */
  .hero-container {
    padding: 80px 20px 40px; text-align: center; max-width: 1200px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
  }
  .hero-badge {
    padding: 6px 20px; border-radius: 50px;
    background: rgba(0, 243, 255, 0.05); border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan); font-size: 0.8rem; font-weight: 700; margin-bottom: 25px;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); text-transform: uppercase; letter-spacing: 2px;
  }
  .glitch-title {
    font-size: 4rem; line-height: 1; margin-bottom: 20px; text-transform: uppercase;
    font-family: 'Orbitron', sans-serif; position: relative;
    text-shadow: 2px 2px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan);
  }
  .cta-btn {
    padding: 14px 35px; border-radius: 50px;
    background: var(--neon-cyan); color: #000; font-weight: 800;
    text-transform: uppercase; font-size: 0.9rem;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); cursor: pointer; display: inline-flex; align-items: center; gap: 10px; border: none;
    transition: 0.3s;
  }
  .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 0 40px rgba(0, 243, 255, 0.6); }

  /* FILTROS */
  .advanced-filters {
    display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;
    margin-bottom: 40px; padding: 20px;
    background: rgba(255,255,255,0.02); border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* GRID */
  .grid-section { padding: 0 5%; max-width: 1400px; margin: 0 auto 80px; }
  .section-header { 
    display: flex; justify-content: space-between; align-items: end;
    margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; 
  }
  .section-title { font-size: 1.8rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px; width: 100%; }
  #grid > div, #grid > a {
    position: relative; border-radius: 16px; overflow: hidden;
    aspect-ratio: 2/3; cursor: pointer; 
    transition: transform 0.3s ease-out, box-shadow 0.3s;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: block;
  }
  #grid img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; transform: scale(1.01); }
  #grid > div:hover, #grid > a:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 0 25px rgba(0, 243, 255, 0.3); z-index: 10; }

  /* =========================================
     2. ELEMENTOS PARA ANIMACIONES VERDES (IMPORTANTE)
     ========================================= */
  #fgContainer {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 9000; pointer-events: none; /* Dejar pasar clics */
    display: block; /* Debe estar visible para que el canvas pinte */
  }
  #fgCanvas { width: 100%; height: 100%; display: block; }
  #fgVideo { display: none; } /* El video se oculta, se pinta en canvas */

  /* =========================================
     3. NOTIFICACIONES Y POPUP (ESTILO)
     ========================================= */
  .notif-badge {
    position: absolute; top: -5px; right: -5px;
    background: var(--neon-pink); color: white;
    font-size: 0.6rem; padding: 2px 5px; border-radius: 50%; font-weight: bold;
  }
  .notif-dropdown {
    position: absolute; top: 60px; right: 0;
    width: 320px; background: rgba(15, 15, 20, 0.98);
    border: 1px solid var(--neon-purple); border-radius: 12px;
    backdrop-filter: blur(10px); display: none; z-index: 2000;
    box-shadow: 0 0 30px rgba(188, 19, 254, 0.2); overflow: hidden;
  }
  .notif-dropdown.active { display: block; }
  .notif-header { padding: 12px; background: rgba(255,255,255,0.05); font-weight: bold; text-align: center; color: var(--neon-cyan); border-bottom: 1px solid rgba(255,255,255,0.1); }
  .notif-list { max-height: 400px; overflow-y: auto; }
  .notif-item { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; position: relative;}
  .notif-item:hover { background: rgba(255,255,255,0.05); }
  .notif-item img { width: 50px; height: 70px; object-fit: cover; border-radius: 4px; }
  .notif-item-content { display: flex; flex-direction: column; justify-content: center; }
  .notif-item-title { font-size: 0.9rem; font-weight: 600; color: white; }
  .notif-item-info { font-size: 0.75rem; margin-top: 2px; }
  .notif-final-badge {
      position: absolute; bottom: 5px; right: 5px;
      width: 40px; filter: drop-shadow(0 0 2px red);
  }

  /* POPUP MODAL (AVISO NUEVO CAP) */
  #eventModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 10000;
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: 0.3s;
  }
  #eventModal.show { opacity: 1; pointer-events: all; }
  
  .event-card {
      background: #111; width: 90%; max-width: 700px;
      display: flex; border-radius: 20px; overflow: hidden;
      border: 1px solid var(--neon-purple);
      box-shadow: 0 0 50px rgba(188, 19, 254, 0.3); position: relative;
  }
  .event-visuals { width: 40%; position: relative; overflow: hidden; }
  .bg-blur-cover { width: 100%; height: 100%; object-fit: cover; filter: blur(8px) brightness(0.4); transform: scale(1.1); }
  .covers-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; }
  .main-cover-img { width: 130px; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.8); position: relative; z-index: 2; }
  
  /* ESTILOS ESPECÍFICOS PARA FINAL.PNG Y BADGES */
  .final-img-overlay {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      width: 80%; z-index: 10; pointer-events: none; filter: drop-shadow(0 0 10px rgba(255,0,0,0.8));
  }
  .lang-badge {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(0,0,0,0.8); color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
      padding: 3px 8px; font-size: 0.7rem; font-weight: bold; border-radius: 4px;
      z-index: 5; text-transform: uppercase;
  }

  .event-inner { width: 60%; padding: 30px; display: flex; flex-direction: column; justify-content: center; background: linear-gradient(to right, #111, #1a1a20); position: relative; }
  .event-close { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
  .event-title { font-family: 'Orbitron'; font-size: 1.8rem; margin-bottom: 10px; color: white; line-height: 1.2; }
  .event-chapter-info { color: var(--neon-cyan); font-weight: 600; margin-bottom: 15px; font-size: 1rem; }
  .event-btn {
      padding: 10px 25px; background: var(--neon-purple); border: none;
      color: white; font-weight: bold; border-radius: 30px; cursor: pointer;
      font-size: 0.9rem; width: fit-content; margin-top: 15px;
      box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
  }

  /* MODAL iOS */
  .ios-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; }
  .ios-content { background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid var(--neon-cyan); color: white; text-align: center; max-width: 300px; }

  @media (max-width: 768px) {
    .cyber-nav { flex-direction: column; gap: 15px; }
    .nav-center { flex-direction: column; width: 100%; }
    .search-input { width: 100%; }
    .event-card { flex-direction: column; height: 85vh; overflow-y: auto; }
    .event-visuals, .event-inner { width: 100%; }
    .event-visuals { height: 250px; }
  }
  
  @keyframes glitch {
    0% { text-shadow: 2px 2px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan); }
    100% { text-shadow: -2px -2px 0px var(--neon-purple), 2px 2px 0px var(--neon-cyan); }
  }
  @keyframes loadLine { to { width: 100%; } }
</style>
</head>

</script>

<script src="pwa-handler.js"></script> <script>
/* ========================================================
   NOTIFICATION SYSTEM (Versión Modificada para Index Cyberpunk)
   - Soporte para final.png
   - Detección de Latino/Sub
   ======================================================== */
let notificationQueue = []; 
let notificationsHistory = []; 
let isMenuOpen = false;

document.addEventListener('DOMContentLoaded', () => {
    if (typeof animes === 'undefined') return;
    loadHistoryFromStorage();
    checkForNewUpdates();
    renderNotificationList();
    updateBellBadge();
});

function loadHistoryFromStorage() {
    const stored = localStorage.getItem('archinime_notif_history');
    if (stored) {
        try { notificationsHistory = JSON.parse(stored); } catch (e) { notificationsHistory = []; }
    }
}
function saveHistoryToStorage() {
    localStorage.setItem('archinime_notif_history', JSON.stringify(notificationsHistory));
    updateBellBadge();
}

function checkForNewUpdates() {
    const updatedAnimes = animes.filter(a => a.lastUpdate && a.updateType);
    updatedAnimes.sort((a, b) => b.lastUpdate - a.lastUpdate);

    let newItemsFound = [];
    updatedAnimes.forEach(anime => {
        if (anime.updateType.includes("ACTUALIZACIÓN")) return;
        if (anime.updateType === "Ninguna") return; 

        const notifId = `${anime.id}_${anime.lastUpdate}`;
        const exists = notificationsHistory.find(n => n.notifId === notifId);
        
        if (!exists) {
            const newNotif = {
                notifId: notifId,
                animeId: anime.id,
                title: anime.title,
                img: anime.img, 
                seasonCover: anime.latestSeasonCover || anime.img, 
                blockName: anime.latestBlockName || "",
                epTitle: anime.latestEpTitle || "Nuevo Contenido", 
                type: anime.updateType,
                date: anime.lastUpdate,
                seen: false,
                isFinal: anime.isFinal || false // Aquí detectamos el FINAL del CMS
            };
            notificationsHistory.unshift(newNotif); 
            newItemsFound.push(newNotif);
        }
    });

    if (newItemsFound.length > 0) {
        if (notificationsHistory.length > 50) notificationsHistory = notificationsHistory.slice(0, 50);
        saveHistoryToStorage();
        if (newItemsFound.length > 5) newItemsFound = newItemsFound.slice(0, 5);
        notificationQueue = newItemsFound;
        showNextPopup();
    }
}

function showNextPopup() {
    if (notificationQueue.length === 0) return;
    const notif = notificationQueue[0];
    createPopupHTML(notif);
}

function createPopupHTML(notif) {
    const existing = document.getElementById('eventModal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'eventModal';
    let infoString = notif.epTitle;
    if (notif.blockName && notif.blockName !== "Novedad") {
        infoString = `${notif.blockName} - ${notif.epTitle}`;
    }

    // LÓGICA DE DETECCIÓN DE IDIOMA (Basado en título o tipo)
    let langLabel = "SUB ESP"; // Por defecto
    let langColor = "var(--neon-purple)";
    const lowerInfo = infoString.toLowerCase();
    const lowerTitle = notif.title.toLowerCase();
    
    // Si dice "Latino" en el título del cap o del anime, o si el usuario puso "Audio Latino" manualmente
    if (lowerInfo.includes("latino") || lowerTitle.includes("latino") || notif.type.includes("LATINO")) {
        langLabel = "LATINO";
        langColor = "var(--neon-pink)";
    }

    // LÓGICA DE IMAGEN FINAL
    let finalImgHTML = '';
    if (notif.isFinal) {
        finalImgHTML = `<img src="final.png" class="final-img-overlay" alt="FINAL">`;
    }

    modal.innerHTML = `
        <div class="event-card">
            <button class="event-close" onclick="closePopup()"><i class="fas fa-times"></i></button>
            <div class="event-visuals">
                <img src="${notif.img}" class="bg-blur-cover">
                <div class="covers-wrapper">
                    <img src="${notif.seasonCover}" class="main-cover-img">
                </div>
                ${finalImgHTML}
                <div class="lang-badge" style="color:${langColor}; border-color:${langColor}">${langLabel}</div>
            </div>
            <div class="event-inner">
                 <div class="event-details">
                    <div style="color:var(--neon-cyan); font-weight:bold; margin-bottom:5px;">${notif.type}</div>
                    <div class="event-title">${notif.title}</div>
                    <div class="event-chapter-info">${infoString}</div>
                    <p style="color:#aaa; font-size:0.9rem;">Ya disponible en la plataforma.</p>
                    <button class="event-btn" onclick="goToAnimeFromPopup('${notif.animeId}', '${notif.notifId}')">
                        <i class="fas fa-play"></i> VER AHORA
                    </button>
                </div>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    setTimeout(() => modal.classList.add('show'), 50);
}

function closePopup() {
    const modal = document.getElementById('eventModal');
    if(modal) {
        modal.classList.remove('show');
        setTimeout(() => {
            modal.remove();
            const processed = notificationQueue.shift();
            markAsRead(processed.notifId);
            showNextPopup();
        }, 300);
    }
}

function goToAnimeFromPopup(animeId, notifId) {
    markAsRead(notifId);
    notificationQueue = [];
    window.location.href = `anime-detail.html?id=${animeId}`;
}

function toggleNotifMenu() {
    const menu = document.getElementById('notifMenu');
    isMenuOpen = !isMenuOpen;
    if (isMenuOpen) {
        menu.classList.add('active');
        renderNotificationList();
        document.getElementById('notifBadge').style.display = 'none';
    } else {
        menu.classList.remove('active');
    }
}

document.addEventListener('click', (e) => {
    const wrapper = document.querySelector('.notif-wrapper');
    if (wrapper && !wrapper.contains(e.target) && isMenuOpen) {
        isMenuOpen = false;
        document.getElementById('notifMenu').classList.remove('active');
    }
});

function renderNotificationList() {
    const listContainer = document.getElementById('notifList');
    listContainer.innerHTML = '';
    if (notificationsHistory.length === 0) {
        listContainer.innerHTML = '<div style="padding:20px; text-align:center;">Sin novedades.</div>';
        return;
    }

    const sortedHistory = [...notificationsHistory].sort((a, b) => b.date - a.date);
    sortedHistory.forEach(item => {
        const div = document.createElement('div');
        div.className = 'notif-item';
        
        let infoString = item.epTitle;
        if (item.blockName && item.blockName !== "Novedad") infoString = `${item.blockName} - ${item.epTitle}`;

        // Lógica visual pequeña para la lista
        let finalBadge = item.isFinal ? `<img src="final.png" class="notif-final-badge">` : '';
        
        // Detección idioma en lista
        let langSmall = "SUB";
        if (infoString.toLowerCase().includes("latino") || item.title.toLowerCase().includes("latino")) langSmall = "LAT";
        let langColor = langSmall === "LAT" ? "#ff0055" : "#bc13fe";

        div.innerHTML = `
            <div style="position:relative;">
                <img src="${item.seasonCover}">
                ${finalBadge}
            </div>
            <div class="notif-item-content" onclick="window.location.href='anime-detail.html?id=${item.animeId}'">
                <div class="notif-item-title">${item.title}</div>
                 <div class="notif-item-info">
                    <span style="color:${langColor}; font-weight:bold;">${langSmall}</span> • ${item.type}
                 </div>
                <div class="notif-item-date">${infoString}</div>
            </div>
        `;
        listContainer.appendChild(div);
    });
}

function updateBellBadge() {
    const unread = notificationsHistory.filter(n => !n.seen).length;
    const badge = document.getElementById('notifBadge');
    if (unread > 0) badge.style.display = 'block';
    else badge.style.display = 'none';
}
function markAsRead(notifId) {
    const target = notificationsHistory.find(n => n.notifId === notifId);
    if (target) {
        target.seen = true;
        saveHistoryToStorage();
    }
}
</script>

  if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fallo: ', err));
      });
  }
</script>
