  <script>
    /* OPTIMIZADO: Animación del theme-color movida a requestAnimationFrame para no bloquear la CPU */
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const segments = colors.length - 1;
      let currentProgress = 0;
      let metaTag = document.querySelector('meta[name="theme-color"]');
      
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }
      
      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      
      const rgbToHex = (r, g, b) => {
        return "#" + [r, g, b].map(x => {
          const hex = Math.round(x).toString(16);
          return hex.length === 1 ? "0" + hex : hex;
        }).join('');
      };
      
      const lerp = (start, end, t) => start + (end - start) * t;
      
      let lastTime = 0;
      const fpsInterval = 150; // Acelera el rendimiento limitando la actualización a ~6 fps
      
      function updateThemeColor(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const elapsed = timestamp - lastTime;
        
        if (elapsed > fpsInterval) {
          const step = (elapsed / animationDuration) * segments;
          currentProgress += step;
          if (currentProgress >= segments) currentProgress = currentProgress % segments;
          
          const index = Math.floor(currentProgress);
          const t = currentProgress - index;
          const colorStart = hexToRgb(colors[index]);
          const colorEnd = hexToRgb(colors[index + 1]);
          const r = lerp(colorStart[0], colorEnd[0], t);
          const g = lerp(colorStart[1], colorEnd[1], t);
          const b = lerp(colorStart[2], colorEnd[2], t);
          
          metaTag.setAttribute('content', rgbToHex(r, g, b));
          lastTime = timestamp;
        }
        requestAnimationFrame(updateThemeColor);
      }
      requestAnimationFrame(updateThemeColor);
    })();
  </script>

<style>

  /* Loader optimizado con aceleración de hardware */
  #page-loader {

    z-index: 99999;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    transition: opacity 0.6s var(--transition-smooth), visibility 0.6s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transform: translateZ(0);
    will-change: opacity, visibility;
  }
  .loader-glitch-wrapper { position: relative; display: inline-block; filter: drop-shadow(0 0 15px var(--neon-cyan)); transform: translateZ(0); }
  .loader-glitch { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; color: white;

  .loader-glitch::before, .loader-glitch::after { content: 'Archinime'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; transform: translateZ(0); }

  .loader-glitch::after { left: -4px; text-shadow: 2px 0 var(--neon-cyan); clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); animation: trueGlitch2 2.5s infinite linear alternate-reverse; }

  /* Grid y Cards - Optimizado GPU */
  .container { max-width: 1600px; margin: 0 auto; padding: 10px 20px 80px; transform: translateZ(0); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px; }
  .card { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 2/3; cursor: pointer;
    transition: all 0.35s var(--transition-smooth); background: #0a0a0c; box-shadow: 0 12px 25px rgba(0,0,0,0.6);
    transform: translateZ(0); will-change: transform, box-shadow; backface-visibility: hidden; }
  .card::before { content: ''; position: absolute; inset: 0; border-radius: 16px; padding: 2px;
    background: linear-gradient(135deg, rgba(0,243,255,0.3), rgba(188,19,254,0.3));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.3s; pointer-events: none; will-change: opacity; }
  .card:hover { transform: scale(1.03) translateY(-8px); box-shadow: 0 20px 30px rgba(0,0,0,0.8); }
  .card:hover::before { opacity: 1; }
  .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; will-change: transform; transform: translateZ(0); }
  .card:hover img { transform: scale(1.08); }
  .card .info { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #000000e6 0%, rgba(5,5,5,0.9) 60%, transparent 100%);

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpzYARIxaJijLbbL-2S6F9MWecbAbvK_I",
      authDomain: "login-admin-archinime.firebaseapp.com",
      projectId: "login-admin-archinime",
      storageBucket: "login-admin-archinime.firebasestorage.app",
      messagingSenderId: "938164660242",
      appId: "1:938164660242:web:648e0dce0e0d18dd78d0cb"
    };
    firebase.initializeApp(firebaseConfig);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const providerGoogle = new firebase.auth.GoogleAuthProvider();
    const providerGitHub = new firebase.auth.GithubAuthProvider();
  </script>

  <script>
    let notificationQueue = [];
    let notificationsHistory = [];
    let isMenuOpen = false;
    let repliesUnsubscribe = null;
    let isFirstTimeSetup = false;

    if (typeof disableBodyScroll !== 'function') {
      window.disableBodyScroll = function() {
        document.body.classList.add('modal-open');
        document.documentElement.classList.add('modal-open');
      };
      window.enableBodyScroll = function() {
        document.body.classList.remove('modal-open');
        document.documentElement.classList.remove('modal-open');
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadHistoryFromStorage();
        if (typeof animes !== 'undefined') {
            checkForNewUpdates();
        } else {
            console.warn('Sistema de Notificaciones: index-data.js no cargado.');
        }
        renderNotificationList();
        updateBellBadge();

        if (typeof firebase !== 'undefined' && typeof auth !== 'undefined' && typeof db !== 'undefined') {
            auth.onAuthStateChanged(user => {
                if (user) {
                    syncNotificationsWithCloud(user.uid);
                    listenForReplies(user.uid);
                } else {
                    if (repliesUnsubscribe) repliesUnsubscribe();
                }
            });
        }
    });

    function loadHistoryFromStorage() {
        const stored = localStorage.getItem('archinime_notif_history');
        if (stored) {
            try { 
                notificationsHistory = JSON.parse(stored);
                if (notificationsHistory.length > 50) notificationsHistory = notificationsHistory.slice(0, 50);
            } catch(e) { 
                notificationsHistory = [];
            }
        }
    }

    function saveHistoryToStorage() {
        localStorage.setItem('archinime_notif_history', JSON.stringify(notificationsHistory));
        let seenNotifIds = JSON.parse(localStorage.getItem('archinime_seen_notif_ids')) || [];
        updateBellBadge();
        if (typeof auth !== 'undefined' && auth.currentUser && typeof db !== 'undefined') {
            db.collection('users').doc(auth.currentUser.uid).set({
                notifHistory: notificationsHistory,
                seenNotifIds: seenNotifIds
            }, { merge: true }).catch(e => console.error("Error guardando notifs en la nube", e));
        }
    }

    async function syncNotificationsWithCloud(uid) {
        try {
            const docRef = db.collection('users').doc(uid);
            const doc = await docRef.get();
            if (doc.exists) {
                const data = doc.data();
                if (data.seenNotifIds) {
                    let localSeen = JSON.parse(localStorage.getItem('archinime_seen_notif_ids')) || [];
                    let mergedSeen = Array.from(new Set([...localSeen, ...data.seenNotifIds]));
                    if (mergedSeen.length > 1000) mergedSeen = mergedSeen.slice(-1000);
                    localStorage.setItem('archinime_seen_notif_ids', JSON.stringify(mergedSeen));
                }
                if (data.notifHistory) {
                    const cloudHistory = data.notifHistory || [];
                    let localSeen = JSON.parse(localStorage.getItem('archinime_seen_notif_ids')) || [];
                    let newQueue = [];
                    notificationQueue.forEach(q => {
                        const inCloud = cloudHistory.find(c => c.notifId === q.notifId);
                        if (!inCloud && !localSeen.includes(q.notifId)) {
                            newQueue.push(q);
                        }
                    });
                    notificationQueue = newQueue;
                    let merged = [...notificationsHistory, ...cloudHistory];
                    let uniqueMap = new Map();
                    merged.forEach(n => {
                        if (uniqueMap.has(n.notifId)) {
                            if (n.seen) uniqueMap.set(n.notifId, n);
                        } else {
                            uniqueMap.set(n.notifId, n);
                        }
                    });
                    notificationsHistory = Array.from(uniqueMap.values()).sort((a,b) => b.date - a.date).slice(0, 50);
                }
            }
            saveHistoryToStorage();
            renderNotificationList();
            updateBellBadge();
        } catch (e) {
            console.error("Error sincronizando notificaciones:", e);
        }
    }

    function listenForReplies(uid) {
        if (repliesUnsubscribe) repliesUnsubscribe();
        repliesUnsubscribe = db.collection('comments')
            .where('replyToUserId', '==', uid)
            .orderBy('timestamp', 'desc')
            .limit(20)
            .onSnapshot(snapshot => {
                let hasNew = false;
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const data = change.doc.data();
                        if (data.userId === uid) return;
                        const docId = change.doc.id;
                        const notifId = `reply_${docId}`;
                        const alreadyExists = notificationsHistory.some(n => n.notifId === notifId);
                        if (!alreadyExists) {
                            let rawText = data.texto || "";
                            let cleanText = rawText.replace(/\[Sticker\]\([^)]+\)/g, '🖼️ (Sticker)').trim();
                            if (cleanText.length === 0) cleanText = "🖼️ (Sticker)";
                            const newNotif = {
                                notifId: notifId,
                                type: 'RESPUESTA',
                                animeId: data.animeId,
                                title: `¡${data.userName} te respondió!`,
                                img: data.userAvatar || 'invitado.avif',
                                seasonCover: data.userAvatar || 'invitado.avif',
                                blockName: 'Foro',
                                epTitle: `"${cleanText.substring(0, 35)}${cleanText.length > 35 ? '...' : ''}"`,
                                date: data.timestamp ? data.timestamp.toMillis() : Date.now(),
                                seen: false,
                                isFinal: false,
                                url: `video-player.html?anime=${data.animeId}&s=${data.season}&e=${data.episode}&targetComment=${docId}`
                            };
                            notificationsHistory.unshift(newNotif);
                            hasNew = true;
                        }
                    }
                });
                if (hasNew) {
                    if (notificationsHistory.length > 50) notificationsHistory = notificationsHistory.slice(0, 50);
                    saveHistoryToStorage();
                    renderNotificationList();
                    if (!isMenuOpen) updateBellBadge();
                }
            }, error => {
                console.error("Error al escuchar respuestas:", error);
            });
    }

    function checkForNewUpdates() {
        const updatedAnimes = animes.filter(a => a.lastUpdate && a.updateType);
        updatedAnimes.sort((a, b) => b.lastUpdate - a.lastUpdate);

        let seenNotifIds = JSON.parse(localStorage.getItem('archinime_seen_notif_ids')) || [];
        let hasChanges = false;
        const isFirstVisit = (notificationsHistory.length === 0 && seenNotifIds.length === 0);

        if (isFirstVisit) {
            const newNotifsToAdd = [];
            const popupsToQueue = [];
            const latestFive = updatedAnimes.slice(0, 5);
            const rest = updatedAnimes.slice(5);

            latestFive.forEach(anime => {
                const notifId = `${anime.id}_${anime.lastUpdate}`;
                if (!seenNotifIds.includes(notifId)) {
                    seenNotifIds.push(notifId);
                    hasChanges = true;
                    const newNotif = {
                        notifId: notifId,
                        animeId: anime.id,
                        title: anime.title,
                        img: anime.img,
                        seasonCover: anime.latestSeasonCover || anime.img,
                        blockName: anime.latestBlockName || "",
                        epTitle: anime.latestEpTitle || "Nuevo Contenido",
                        type: anime.updateType,
                        date: anime.lastUpdate,
                        seen: true,
                        isFinal: anime.isFinal || false,
                        popupShown: true
                    };
                    newNotifsToAdd.push(newNotif);
                    popupsToQueue.push(newNotif);
                }
            });

            rest.forEach(anime => {
                const notifId = `${anime.id}_${anime.lastUpdate}`;
                if (!seenNotifIds.includes(notifId)) {
                    seenNotifIds.push(notifId);
                    hasChanges = true;
                    const newNotif = {
                        notifId: notifId,
                        animeId: anime.id,
                        title: anime.title,
                        img: anime.img,
                        seasonCover: anime.latestSeasonCover || anime.img,
                        blockName: anime.latestBlockName || "",
                        epTitle: anime.latestEpTitle || "Nuevo Contenido",
                        type: anime.updateType,
                        date: anime.lastUpdate,
                        seen: true,
                        isFinal: anime.isFinal || false,
                        popupShown: false
                    };
                    newNotifsToAdd.push(newNotif);
                }
            });

            if (newNotifsToAdd.length > 0) {
                notificationsHistory = [...newNotifsToAdd, ...notificationsHistory];
                if (notificationsHistory.length > 50) notificationsHistory = notificationsHistory.slice(0, 50);
                saveHistoryToStorage();
                notificationQueue = notificationQueue.concat(popupsToQueue.slice(0, 5));
            }
        } 
        else {
            updatedAnimes.forEach(anime => {
                if (anime.updateType.includes("ACTUALIZACIÓN")) return;
                if (anime.updateType === "Ninguna") return;
                const notifId = `${anime.id}_${anime.lastUpdate}`;
                if (!seenNotifIds.includes(notifId)) {
                    seenNotifIds.push(notifId);
                    hasChanges = true;
                    const existsInHistory = notificationsHistory.some(n => n.notifId === notifId);
                    if (!existsInHistory) {
                        const newNotif = {
                            notifId: notifId,
                            animeId: anime.id,
                            title: anime.title,
                            img: anime.img,
                            seasonCover: anime.latestSeasonCover || anime.img,
                            blockName: anime.latestBlockName || "",
                            epTitle: anime.latestEpTitle || "Nuevo Contenido",
                            type: anime.updateType,
                            date: anime.lastUpdate,
                            seen: false,
                            isFinal: anime.isFinal || false,
                            popupShown: true
                        };
                        notificationsHistory.unshift(newNotif);
                        notificationQueue.push(newNotif);
                    }
                }
            });
            if (hasChanges) {
                if (notificationsHistory.length > 50) notificationsHistory = notificationsHistory.slice(0, 50);
                saveHistoryToStorage();
            }
        }
        
        if (hasChanges) {
            if (seenNotifIds.length > 1000) seenNotifIds = seenNotifIds.slice(-1000);
            localStorage.setItem('archinime_seen_notif_ids', JSON.stringify(seenNotifIds));
        }
    }

    window.startNotificationSequence = function() {
        showNextPopup();
    };
    function showNextPopup() {
        if (notificationQueue.length === 0) return;
        const notif = notificationQueue[0];
        createPopupHTML(notif);
    }

    function createPopupHTML(notif) {
        const existing = document.getElementById('eventModal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'eventModal';
        const indieMessage = "¡Ya disponible en la plataforma! Disfruta del estreno.";
        let infoString = "";
        if (notif.blockName && notif.blockName !== "Novedad") {
            infoString += `<span style="color:var(--neon-cyan)">${notif.blockName}</span>`;
        }
        if (notif.epTitle && notif.epTitle !== "Nuevo Contenido") {
            if (infoString !== "") infoString += " • ";
            infoString += `<span style="color:#fff">${notif.epTitle}</span>`;
        } else if (infoString === "") {
            infoString = "Nuevo Contenido";
        }

        let badgeColor = "#bc13fe";
        if (notif.type.includes("ESTRENO")) {
            badgeColor = "#ff0055";
        } else if (notif.type.includes("PRÓXIMAMENTE")) {
            badgeColor = "#f1c40f";
        }
        
        let finalImgHTML = '';
        if (notif.isFinal) {
            finalImgHTML = `<div class="final-stamp">FINALIZADO</div>`;
        }

        modal.innerHTML = `
            <div class="event-card">
                <button class="event-close" onclick="closePopup()" aria-label="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
                <div class="event-visuals">
                    <div class="visual-bg" style="background-image: url('${notif.img}');"></div>
                    <div class="covers-container">
                        <img src="${notif.img}" class="cover-back" alt="Poster" loading="lazy">
                        <img src="${notif.seasonCover}" class="cover-front" alt="Season" loading="lazy">
                    </div>
                    <div class="event-type-badge" style="background: ${badgeColor}; box-shadow: 0 0 15px ${badgeColor};">${notif.type}</div>
                    ${finalImgHTML}
                </div>
                <div class="event-info">
                    <h2 class="event-title">${notif.title}</h2>
                    <div class="event-meta">${infoString}</div>
                    <p class="event-desc">${indieMessage}</p>
                    <button class="event-btn" onclick="goToAnimeFromPopup('${notif.animeId}', '${notif.notifId}')">
                        <i class="fas fa-play"></i> VER AHORA
                    </button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        if (typeof disableBodyScroll === 'function') disableBodyScroll();
        setTimeout(() => modal.classList.add('show'), 50);
    }

    function closePopup() {
        const modal = document.getElementById('eventModal');
        if (modal) {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.remove();
                const processed = notificationQueue.shift();
                if (processed && !processed.seen) {
                    markAsRead(processed.notifId);
                }
                if (typeof enableBodyScroll === 'function') enableBodyScroll();
                showNextPopup();
            }, 300);
        }
    }

    function goToAnimeFromPopup(animeId, notifId) {
        if (!notificationsHistory.find(n => n.notifId === notifId)?.seen) {
            markAsRead(notifId);
        }
        notificationQueue = [];
        if (typeof enableBodyScroll === 'function') enableBodyScroll();
        window.location.href = `anime-detail.html?id=${animeId}`;
    }

    function toggleNotifMenu() {
        const menu = document.getElementById('notifMenu');
        isMenuOpen = !isMenuOpen;
        if (isMenuOpen) {
            menu.classList.add('active');
            renderNotificationList();
        } else {
            menu.classList.remove('active');
        }
    }

    document.addEventListener('click', (e) => {
        const wrapper = document.querySelector('.notif-wrapper');
        const menu = document.getElementById('notifMenu');
        if (wrapper && !wrapper.contains(e.target) && isMenuOpen) {
            isMenuOpen = false;
            if(menu) menu.classList.remove('active');
        }
    });

    function renderNotificationList() {
        const listContainer = document.getElementById('notifList');
        if (!listContainer) return;
        requestAnimationFrame(() => {
            if (notificationsHistory.length === 0) {
                listContainer.innerHTML = '<div class="empty-notif"><i class="fas fa-satellite-dish"></i><br>Sin novedades por ahora.</div>';
                return;
            }

            const visibleCount = Math.min(notificationsHistory.length, 30);
            const sortedHistory = [...notificationsHistory].sort((a, b) => b.date - a.date).slice(0, visibleCount);
            const fragment = document.createDocumentFragment();
            
            sortedHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'notif-item';
                
                let imgBoxClass = 'notif-img-box';
                if (item.type === 'RESPUESTA') {
                    imgBoxClass += ' rounded-avatar';
                }
                
                let infoString = "";
                if (item.blockName && item.blockName !== "Novedad") {
                    infoString += `<span class="n-block">${item.blockName}</span>`;
                }
                if (item.epTitle && item.epTitle !== "Nuevo Contenido") {
                    if (infoString !== "") infoString += " ";
                    infoString += `<span class="n-ep-title">${item.epTitle}</span>`;
                } else if (infoString === "") {
                    infoString = `<span class="n-ep-title">Nuevo Contenido</span>`;
                }

                let typeColor = "var(--neon-purple)";
                if (item.type.includes("ESTRENO")) typeColor = "var(--neon-pink)";
                else if (item.type.includes("PRÓXIMAMENTE")) typeColor = "var(--neon-yellow)";
                else if (item.type === "RESPUESTA") typeColor = "var(--neon-cyan)";
                
                let finalLabel = item.isFinal ? `<span class="tag-final">FINALIZADO</span>` : "";
                const unreadDot = !item.seen ?
                    '<div class="unread-dot" style="position: absolute; top: -4px; left: -4px; width: 12px; height: 12px; background: #ff0000; border-radius: 50%; box-shadow: 0 0 8px #ff0000; z-index: 20; border: 1px solid #fff;"></div>' : '';
                
                div.innerHTML = `
                    <div style="position: relative; display: inline-block;">
                        ${unreadDot}
                        <div class="${imgBoxClass}">
                            <img src="${item.seasonCover}" alt="cover" loading="lazy">
                        </div>
                    </div>
                    <div class="notif-content">
                        <div class="notif-header-line">
                            <span class="n-title">${item.title}</span>
                        </div>
                        <div class="n-type" style="color:${typeColor}">${item.type} ${finalLabel}</div>
                        <div class="n-meta">${infoString}</div>
                    </div>
                `;
                
                div.addEventListener('click', (e) => {
                    if (!item.seen) {
                        markAsRead(item.notifId);
                        item.seen = true;
                        updateBellBadge();
                        const dot = div.querySelector('.unread-dot');
                        if (dot) dot.remove();
                    }
                    if (item.url) {
                        window.location.href = item.url;
                    } else {
                        window.location.href = `anime-detail.html?id=${item.animeId}`;
                    }
                });
                fragment.appendChild(div);
            });
            
            listContainer.innerHTML = '';
            listContainer.appendChild(fragment);
            
            if (notificationsHistory.length > 30) {
                const moreDiv = document.createElement('div');
                moreDiv.className = 'notif-item';
                moreDiv.style.justifyContent = 'center';
                moreDiv.style.opacity = '0.7';
                moreDiv.innerHTML = `<div style="text-align:center; width:100%;"><i class="fas fa-ellipsis-h"></i> ${notificationsHistory.length - 30} notificaciones antiguas</div>`;
                fragment.appendChild(moreDiv);
            }
        });
    }

    function updateBellBadge() {
        const unread = notificationsHistory.filter(n => !n.seen).length;
        const badge = document.getElementById('notifBadge');
        if (badge) {
            if (unread > 0) {
                badge.style.display = 'flex';
                badge.textContent = unread > 9 ? '+9' : unread;
            } else {
                badge.style.display = 'none';
            }
        }
    }

    function markAsRead(notifId) {
        const target = notificationsHistory.find(n => n.notifId === notifId);
        if (target && !target.seen) {
            target.seen = true;
            saveHistoryToStorage();
            updateBellBadge();
            renderNotificationList();
        }
    }

    window.toggleNotifMenu = toggleNotifMenu;
    window.closePopup = closePopup;
    window.goToAnimeFromPopup = goToAnimeFromPopup;
  </script>

  <script>
    const version = Date.now();
    const scriptsToLoad = ['index-data.js', 'animaciones.js', 'musica_fondo.js', 'script-index.js'];
    
    scriptsToLoad.forEach(src => {
        const script = document.createElement('script');
        script.src = `${src}?v=${version}`;
        if (src !== 'index-data.js') script.defer = true; // index-data carga de inmediato, los demás esperan
        document.body.appendChild(script);
    });
  </script>

  <script>
    function disableBodyScroll() {
      document.body.classList.add('modal-open');
      document.documentElement.classList.add('modal-open');
    }
    function enableBodyScroll() {
      document.body.classList.remove('modal-open');
      document.documentElement.classList.remove('modal-open');
    }

    (function() {
      const selects = ['genre-select', 'demographic-select', 'rating-select'];
      const isMobile = window.matchMedia('(max-width: 768px)').matches;

      function updateTriggerText(trigger, selectEl) {
        const selected = selectEl.options[selectEl.selectedIndex];
        trigger.textContent = selected ? selected.textContent : selectEl.options[0].textContent;
      }

      selects.forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;

        const trigger = document.createElement('div');
        trigger.className = 'custom-select-trigger';
        updateTriggerText(trigger, select);
        select.parentNode.insertBefore(trigger, select);
        
        const openSelector = () => {
          if (isMobile) {
            const overlay = document.createElement('div');
            overlay.className = 'select-popup-overlay';
            const popup = document.createElement('div');
            popup.className = 'select-popup';
            const header = document.createElement('div');
            header.className = 'select-popup-header';
            header.textContent = select.getAttribute('aria-label') || 'Seleccionar';
            popup.appendChild(header);
            
            Array.from(select.options).forEach(opt => {
              const optDiv = document.createElement('div');
              optDiv.className = 'select-popup-option';
              if (opt.value === select.value) optDiv.classList.add('selected');
              optDiv.textContent = opt.textContent;
              optDiv.addEventListener('click', () => {
                select.value = opt.value;
                select.dispatchEvent(new Event('change'));
                updateTriggerText(trigger, select);
                closePopup();
              });
              popup.appendChild(optDiv);
            });
            
            overlay.appendChild(popup);
            document.body.appendChild(overlay);
            
            function closePopup() {
              overlay.classList.remove('active');
              enableBodyScroll();
              setTimeout(() => overlay.remove(), 300);
            }
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closePopup(); });
            
            disableBodyScroll();
            setTimeout(() => overlay.classList.add('active'), 10);
          } else {
            const existing = document.querySelector('.custom-select-dropdown');
            if (existing) existing.remove();
            
            const rect = trigger.getBoundingClientRect();
            const dropdown = document.createElement('div');
            dropdown.className = 'custom-select-dropdown';
            dropdown.style.top = (rect.bottom + window.scrollY) + 'px';
            dropdown.style.left = (rect.left + window.scrollX) + 'px';
            dropdown.style.minWidth = rect.width + 'px';
            
            Array.from(select.options).forEach(opt => {
              const optDiv = document.createElement('div');
              optDiv.className = 'custom-select-option';
              optDiv.textContent = opt.textContent;
              if (opt.value === select.value) {
                optDiv.style.background = 'rgba(0, 243, 255, 0.15)';
                optDiv.style.color = 'var(--neon-cyan)';
              }
              optDiv.addEventListener('click', () => {
                select.value = opt.value;
                select.dispatchEvent(new Event('change'));
                updateTriggerText(trigger, select);
                dropdown.remove();
              });
              dropdown.appendChild(optDiv);
            });
            
            document.body.appendChild(dropdown);
            const closeDropdown = (e) => {
              if (!dropdown.contains(e.target) && e.target !== trigger) {
                dropdown.remove();
                document.removeEventListener('click', closeDropdown);
                document.removeEventListener('scroll', closeDropdown);
              }
            };
            setTimeout(() => {
              document.addEventListener('click', closeDropdown);
              document.addEventListener('scroll', closeDropdown);
            }, 10);
          }
        };
        trigger.addEventListener('click', openSelector);
      });
    })();
  </script>

  <script>
    let currentUser = null;
    function goToProfile() { if (!currentUser) { showAuthModal(); document.getElementById('authError').innerText = "⚠️ Inicia sesión para configurar tu perfil."; return; } location.href = 'opciones.html'; }
    function showAuthModal() { document.getElementById('authModal').classList.add('show'); disableBodyScroll(); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); enableBodyScroll(); document.getElementById('authError').innerText = ''; }
    
    document.querySelectorAll('.auth-tab').forEach(tab => { tab.addEventListener('click', () => { const tabName = tab.getAttribute('data-tab'); document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); document.getElementById('authLoginForm').style.display = tabName === 'login' ? 'flex' : 'none'; document.getElementById('authRegisterForm').style.display = tabName === 'register' ? 'flex' : 'none'; document.getElementById('authError').innerText = ''; }); });
    
    async function loginWithEmail() { const email = document.getElementById('loginEmail').value; const pass = document.getElementById('loginPassword').value; try { await auth.signInWithEmailAndPassword(email, pass); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; } }
    async function registerWithEmail() { const email = document.getElementById('registerEmail').value; const pass = document.getElementById('registerPassword').value; const confirm = document.getElementById('registerConfirm').value; if (pass !== confirm) { document.getElementById('authError').innerText = 'Las contraseñas no coinciden'; return; } try { await auth.createUserWithEmailAndPassword(email, pass); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; } }
    async function loginWithGoogle() { try { await auth.signInWithPopup(providerGoogle); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; } }
    async function loginWithGitHub() { try { await auth.signInWithPopup(providerGitHub); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; } }
    function logoutUser() { auth.signOut().then(() => { location.reload(); }); }
    
    function getNeonColorFallback(str) { const neonColors = ['#00fff7', '#ff0055', '#bc13fe', '#00ff33', '#ffff00', '#ffaa00', '#ff00aa', '#00aaff']; let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash); return neonColors[Math.abs(hash) % neonColors.length]; }
    
    function updateUserUI(user) { 
      currentUser = user;
      const avatarBtn = document.getElementById('userAvatarBtn'); 
      const dropdownAvatar = document.getElementById('dropdownAvatar'); 
      const dropdownName = document.getElementById('dropdownName'); 
      const loginItem = document.getElementById('loginBtnItem');
      
      if (user) { 
        const photoURL = user.photoURL || 'invitado.avif'; 
        avatarBtn.src = photoURL;
        dropdownAvatar.src = photoURL; 
        dropdownName.innerText = user.displayName || user.email.split('@')[0]; 
        loginItem.innerHTML = '<i class="fas fa-sign-out-alt"></i> Cerrar sesión'; 
        loginItem.onclick = () => logoutUser();
        
        db.collection('users').doc(user.uid).get().then(doc => { 
          let color = (doc.exists && doc.data().customColor) ? doc.data().customColor : getNeonColorFallback(user.uid || user.displayName || user.email); 
          avatarBtn.style.borderColor = color; 
          avatarBtn.style.boxShadow = `0 0 15px ${color}`; 
          dropdownAvatar.style.borderColor = color; 
          dropdownAvatar.style.boxShadow = `0 0 15px ${color}`; 
          dropdownName.style.color = color; 
          dropdownName.style.textShadow = `0 0 8px ${color}`; 
        }).catch(e => console.log(e));
      } else { 
        avatarBtn.src = 'invitado.avif'; 
        dropdownAvatar.src = 'invitado.avif'; 
        dropdownName.innerText = 'Invitado';
        loginItem.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión'; 
        loginItem.onclick = () => showAuthModal(); 
        avatarBtn.style.borderColor = 'var(--neon-cyan)'; 
        avatarBtn.style.boxShadow = 'none';
        dropdownAvatar.style.borderColor = 'var(--neon-cyan)'; 
        dropdownAvatar.style.boxShadow = 'none'; 
        dropdownName.style.color = 'var(--neon-cyan)'; 
        dropdownName.style.textShadow = 'none';
      } 
    }
    
    const userAvatarBtn = document.getElementById('userAvatarBtn'); 
    const userDropdown = document.getElementById('userDropdown');
    userAvatarBtn.addEventListener('click', (e) => { e.stopPropagation(); userDropdown.classList.toggle('active'); }); 
    document.addEventListener('click', (e) => { if (!userAvatarBtn.contains(e.target) && !userDropdown.contains(e.target)) userDropdown.classList.remove('active'); });
    
    auth.onAuthStateChanged(user => { updateUserUI(user); });
    
    window.addEventListener('load', () => { 
        const loader = document.getElementById('page-loader'); 
        const bgVideo = document.getElementById('bg-video'); 
        const forcePlayVideo = () => { 
            bgVideo.muted = true; 
            bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(() => { document.body.addEventListener('click', () => bgVideo.play(), { once: true }); }); 
        }; 
        forcePlayVideo(); 
        const isFirstVisit = !sessionStorage.getItem('archinime_loaded'); 
        const delay = isFirstVisit ? 1400 : 50; 
        setTimeout(() => { 
            loader.style.opacity = '0'; 
            setTimeout(() => { 
                loader.style.visibility = 'hidden'; 
                sessionStorage.setItem('archinime_loaded', 'true'); 
                if (window.startNotificationSequence) window.startNotificationSequence(); 
            }, 400); 
        }, delay); 
    });

    /* OPTIMIZADO: Tilt Effect para las Cards. Se guarda en caché el ClientRect para evitar Layout Thrashing */
    const gridObserver = new MutationObserver(() => { 
        document.querySelectorAll('.card').forEach(card => { 
            if (card.dataset.tiltInit) return; 
            card.dataset.tiltInit = 'true'; 
            
            card.addEventListener('mouseenter', () => {
                card.cachedRect = card.getBoundingClientRect();
            });

            card.addEventListener('mousemove', (e) => { 
                if (!card.cachedRect) card.cachedRect = card.getBoundingClientRect();
                
                if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF); 
                card.tiltRAF = requestAnimationFrame(() => { 
                    const x = e.clientX - card.cachedRect.left; 
                    const y = e.clientY - card.cachedRect.top; 
                    const rotateX = ((y - card.cachedRect.height/2) / card.cachedRect.height/2) * -6; 
                    const rotateY = ((x - card.cachedRect.width/2) / card.cachedRect.width/2) * 6; 
                    card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`; 
                }); 
            }); 

            card.addEventListener('mouseleave', () => { 
                if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF); 
                card.style.transform = ''; 
                card.cachedRect = null;
            }); 
        }); 
    });
    
    const gridEl = document.getElementById('grid'); 
    if (gridEl) gridObserver.observe(gridEl, { childList: true });
  </script>

  <script>
    (async function updateRatingsFromFirestore() {
        if (typeof animes === 'undefined') {
            console.warn('animes no cargado aún');
            return;
        }
        const db = firebase.firestore();
        const snapshot = await db.collection('animeRatings').get();
       
        const ratingsMap = new Map();
        snapshot.forEach(doc => {
            const data = doc.data();
            ratingsMap.set(parseInt(doc.id), {
                avg: data.avg,
                count: data.count
            });
        });
   
        function updateCards() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const animeId = card.dataset.id;
                if (animeId && ratingsMap.has(parseInt(animeId))) {
                    const ratingObj = ratingsMap.get(parseInt(animeId));
                    const ratingSpan = card.querySelector('.rating-value');
                    if (ratingSpan) {
                        ratingSpan.innerHTML = `⭐ ${ratingObj.avg.toFixed(1)}`;
                    }
                }
            });
        }
        
        const observer = new MutationObserver((mutations, obs) => {
            if (document.querySelector('.card')) {
                updateCards();
                obs.disconnect(); // OPTIMIZADO: Detenemos el observador una vez que las cards están renderizadas
            }
        });
        observer.observe(document.getElementById('grid'), { childList: true, subtree: true });
        setTimeout(updateCards, 500);
    })();
  </script>
