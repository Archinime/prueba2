<script>
  (function() {
    const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
    const animationDuration = 20000;
    const intervalTime = 20; 
    const segments = colors.length - 1;
    const step = (intervalTime / animationDuration) * segments;
    let currentProgress = 0;
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if (!metaTag) {
      metaTag = document.createElement('meta');
      metaTag.name = "theme-color";
      document.head.appendChild(metaTag);
    }
    const hexToRgb = (hex) => {
      const bigint = parseInt(hex.slice(1), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    };
    const rgbToHex = (r, g, b) => {
      return "#" + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join('');
    };
    const lerp = (start, end, t) => start + (end - start) * t;
    setInterval(() => {
      currentProgress += step;
      if (currentProgress >= segments) currentProgress = currentProgress % segments;
      const index = Math.floor(currentProgress);
      const t = currentProgress - index;
      const colorStart = hexToRgb(colors[index]);
      const colorEnd = hexToRgb(colors[index + 1]);
      const r = lerp(colorStart[0], colorEnd[0], t);
      const g = lerp(colorStart[1], colorEnd[1], t);
      const b = lerp(colorStart[2], colorEnd[2], t);
      metaTag.setAttribute('content', rgbToHex(r, g, b));
    }, intervalTime);
  })();
</script>

  <!-- SISTEMA DE NOTIFICACIONES (MEJORADO) -->
  <script>
    // ===================== SISTEMA DE NOTIFICACIONES CON POPUPS ASEGURADOS =====================
    let notificationQueue = [];
    let notificationsHistory = [];
    let isMenuOpen = false;
    let repliesUnsubscribe = null;

    function loadHistoryFromStorage() {
      const stored = localStorage.getItem('archinime_notif_history');
      if (stored) {
        try { notificationsHistory = JSON.parse(stored); } catch(e) { notificationsHistory = []; }
      }
    }

    function saveHistoryToStorage() {
      localStorage.setItem('archinime_notif_history', JSON.stringify(notificationsHistory));
      updateBellBadge();
    }

    // Función mejorada para detectar novedades y forzar popups
    function checkForNewUpdates() {
      if (typeof animes === 'undefined') {
        console.warn('Notificaciones: animes no definido aún');
        return;
      }
      let updatedAnimes = animes.filter(a => a.lastUpdate && a.updateType && a.updateType !== 'Ninguna');
      updatedAnimes.sort((a, b) => b.lastUpdate - a.lastUpdate);
      const latestFive = updatedAnimes.slice(0, 5);
      
      let newItemsFound = [];
      latestFive.forEach(anime => {
        const notifId = `${anime.id}_${anime.lastUpdate}`;
        const alreadyExists = notificationsHistory.some(n => n.notifId === notifId);
        
        if (!alreadyExists) {
          const newNotif = {
            notifId: notifId,
            animeId: anime.id,
            title: anime.title,
            img: anime.img,
            seasonCover: anime.latestSeasonCover || anime.img,
            blockName: anime.latestBlockName || "",
            epTitle: anime.latestEpTitle || "Nuevo Contenido",
            type: anime.updateType,
            date: anime.lastUpdate,
            seen: false,
            isFinal: anime.isFinal || false
          };
          notificationsHistory.unshift(newNotif);
          newItemsFound.push(newNotif);
        }
      });

      if (notificationsHistory.length > 50) notificationsHistory = notificationsHistory.slice(0, 50);
      
      if (newItemsFound.length > 0) {
        saveHistoryToStorage();
        // Agregar a la cola de popups (solo los nuevos)
        notificationQueue = notificationQueue.concat(newItemsFound.slice(0, 5));
        console.log(`📢 Nuevas notificaciones detectadas: ${newItemsFound.length}`, newItemsFound);
      } else {
        console.log('No hay novedades nuevas que mostrar');
      }
    }

    function startNotificationSequence() {
      if (notificationQueue.length === 0) {
        // Si la cola está vacía, forzar una verificación adicional
        console.log('Cola vacía, reintentando detección...');
        checkForNewUpdates();
        if (notificationQueue.length === 0) return;
      }
      showNextPopup();
    }

    function showNextPopup() {
      if (notificationQueue.length === 0) return;
      const notif = notificationQueue[0];
      createPopupHTML(notif);
    }

    function createPopupHTML(notif) {
      const existing = document.getElementById('eventModal');
      if (existing) existing.remove();
      const modal = document.createElement('div');
      modal.id = 'eventModal';
      
      const indieMessage = notif.type === 'RESPUESTA' ? "Alguien interactuó contigo en los comentarios." : "¡Ya disponible en la plataforma! Disfruta del estreno.";
      let infoString = "";
      
      if (notif.blockName && notif.blockName !== "Novedad") {
        infoString += `<span style="color:var(--neon-cyan)">${notif.blockName}</span>`;
      }
      if (notif.epTitle && notif.epTitle !== "Nuevo Contenido") {
        if (infoString !== "") infoString += " • ";
        infoString += `<span style="color:#fff">${notif.epTitle}</span>`;
      } else if (infoString === "") {
        infoString = "Nuevo Contenido";
      }

      let badgeClass = "badge-default";
      if (notif.type.includes("ESTRENO")) badgeClass = "badge-estreno";
      else if (notif.type.includes("PRÓXIMAMENTE")) badgeClass = "badge-prox";
      else if (notif.type === "RESPUESTA") badgeClass = "badge-estreno";

      let finalImgHTML = '';
      if (notif.isFinal) {
        finalImgHTML = `<div class="final-stamp">FINALIZADO</div>`;
      }

      modal.innerHTML = `
        <div class="event-card">
          <button class="event-close" onclick="closePopup()" aria-label="Cerrar">
            <i class="fas fa-times"></i>
          </button>
          <div class="event-visuals">
            <div class="visual-bg" style="background-image: url('${notif.img}');"></div>
            <div class="covers-container">
              <img src="${notif.img}" class="cover-back" alt="Poster">
              <img src="${notif.seasonCover}" class="cover-front" alt="Season">
            </div>
            <div class="event-type-badge ${badgeClass}">${notif.type}</div>
            ${finalImgHTML}
          </div>
          <div class="event-info">
            <h2 class="event-title">${notif.title}</h2>
            <div class="event-meta">${infoString}</div>
            <p class="event-desc">${indieMessage}</p>
            <button class="event-btn" onclick="goToAnimeFromPopup('${notif.animeId}', '${notif.notifId}', '${notif.url || ''}')">
              <i class="fas fa-play"></i> VER AHORA
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      setTimeout(() => modal.classList.add('show'), 50);
    }

    function closePopup() {
      const modal = document.getElementById('eventModal');
      if (modal) {
        modal.classList.remove('show');
        setTimeout(() => {
          modal.remove();
          const processed = notificationQueue.shift();
          if (processed) markAsRead(processed.notifId);
          showNextPopup();
        }, 300);
      }
    }

    function goToAnimeFromPopup(animeId, notifId, customUrl) {
      markAsRead(notifId);
      notificationQueue = [];
      if (customUrl && customUrl !== '') {
        window.location.href = customUrl;
      } else {
        window.location.href = `anime-detail.html?id=${animeId}`;
      }
    }

    function toggleNotifMenu() {
      const menu = document.getElementById('notifMenu');
      isMenuOpen = !isMenuOpen;
      if (isMenuOpen) {
        menu.classList.add('active');
        renderNotificationList();
        notificationsHistory.forEach(n => n.seen = true);
        saveHistoryToStorage();
      } else {
        menu.classList.remove('active');
      }
    }

    function renderNotificationList() {
      const listContainer = document.getElementById('notifList');
      if (!listContainer) return;
      listContainer.innerHTML = '';
      
      if (notificationsHistory.length === 0) {
        listContainer.innerHTML = '<div class="empty-notif"><i class="fas fa-satellite-dish"></i><br>Sin novedades por ahora.</div>';
        return;
      }
      
      const sortedHistory = [...notificationsHistory].sort((a, b) => b.date - a.date);
      
      sortedHistory.forEach(item => {
        const div = document.createElement('div');
        div.className = 'notif-item';
        let infoString = "";
        if (item.blockName && item.blockName !== "Novedad") {
          infoString += `<span class="n-block">${item.blockName}</span>`;
        }
        if (item.epTitle && item.epTitle !== "Nuevo Contenido") {
          if (infoString !== "") infoString += " ";
          infoString += `<span class="n-ep-title">${item.epTitle}</span>`;
        } else if (infoString === "") {
          infoString = `<span class="n-ep-title">Nuevo Contenido</span>`;
        }
        
        let typeColor = "var(--neon-purple)";
        if (item.type.includes("ESTRENO")) typeColor = "var(--neon-pink)";
        else if (item.type.includes("PRÓXIMAMENTE")) typeColor = "var(--neon-yellow)";
        else if (item.type === "RESPUESTA") typeColor = "var(--neon-cyan)";
      
        let finalLabel = item.isFinal ? `<span class="tag-final">FINALIZADO</span>` : "";
        div.innerHTML = `
          <div class="notif-img-box">
            <img src="${item.seasonCover}" alt="cover">
          </div>
          <div class="notif-content">
            <div class="notif-header-line">
               <span class="n-title">${item.title}</span>
            </div>
            <div class="n-type" style="color:${typeColor}">${item.type} ${finalLabel}</div>
            <div class="n-meta">${infoString}</div>
          </div>
        `;
        
        div.addEventListener('click', () => {
          if (item.url) window.location.href = item.url;
          else window.location.href = `anime-detail.html?id=${item.animeId}`;
        });
        listContainer.appendChild(div);
      });
    }

    function updateBellBadge() {
      const unread = notificationsHistory.filter(n => !n.seen).length;
      const badge = document.getElementById('notifBadge');
      if (badge) {
        if (unread > 0) {
          badge.style.display = 'block';
          badge.textContent = unread > 9 ? '+9' : unread;
        } else {
          badge.style.display = 'none';
        }
      }
    }

    function markAsRead(notifId) {
      const target = notificationsHistory.find(n => n.notifId === notifId);
      if (target) {
        target.seen = true;
        saveHistoryToStorage();
      }
    }

    // Inicializar notificaciones al cargar
    document.addEventListener('DOMContentLoaded', () => {
      loadHistoryFromStorage();
      if (typeof animes !== 'undefined') {
        checkForNewUpdates();
      } else {
        console.warn('Sistema de Notificaciones: animes no cargado aún, reintentando...');
        setTimeout(() => {
          if (typeof animes !== 'undefined') checkForNewUpdates();
        }, 500);
      }
      renderNotificationList();
      updateBellBadge();
    });

    // Exponer funciones globales
    window.toggleNotifMenu = toggleNotifMenu;
    window.closePopup = closePopup;
    window.goToAnimeFromPopup = goToAnimeFromPopup;
    window.startNotificationSequence = startNotificationSequence;
  </script>

  <!-- SCRIPTS ADICIONALES (animaciones, música, etc.) -->
  <script>
    // ===================== SCRIPT-INDEX (Filtros y renderizado) =====================
    function render(list) {
      const grid = document.getElementById('grid');
      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="no-results" role="status" aria-live="polite">
          <div class="title shimmer">¡Ups! No se encontraron resultados que coincidan con la búsqueda.</div>
          <div class="subtitle">¿No lo encuentras? Puede que lo hayas escrito con un error o que todavía no lo haya subido.</div>
          <div class="sparkles"><button class="btn-reset" id="btn-reset">Entiendo</button></div>
        </div>`;
        const btn = document.getElementById('btn-reset');
        if (btn) btn.addEventListener('click', () => {
          document.getElementById('search').value = '';
          document.getElementById('genre-select').value = '';
          document.getElementById('demographic-select') && (document.getElementById('demographic-select').value = '');
          document.getElementById('rating-select').value = '';
          filtro();
          document.getElementById('search').focus();
        });
        return;
      }
      grid.innerHTML = list.map(a => `
        <div class="card" onclick="location='anime-detail.html?id=${a.id}'" role="link" tabindex="0">
          <img src="${a.img}" alt="${a.title}">
          <div class="info"><strong>${a.title}</strong><span>⭐ ${a.rating ? (a.rating.toFixed ? a.rating.toFixed(1) : a.rating) : '—'}</span></div>
        </div>
      `).join('');
    }

    function updateResultsCount(count) { const el = document.getElementById('results-count'); if (el) el.textContent = count; }

    function debounce(fn, wait) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), wait); }; }

    const debouncedFiltro = debounce(filtro, 200);
    function normalizeText(s) {
      try { return (s || '').toLowerCase().normalize('NFD').replace(/\p{M}/gu, ''); } catch(e) { return (s || '').toLowerCase().replace(/[\u0300-\u036f]/g, ''); }
    }

    function getBestTitleForSort(a) {
      const titles = [a.title].concat(a.aliases || []);
      const norm = titles.map(t => normalizeText(t));
      norm.sort();
      return norm[0];
    }

    function filtro() {
      const qRaw = document.getElementById('search').value || '';
      const q = qRaw.trim(); const qn = normalizeText(q);
      const g = document.getElementById('genre-select').value;
      const d = document.getElementById('demographic-select') ? document.getElementById('demographic-select').value : '';
      const cat = document.getElementById('rating-select').value;

      const filtrados = animes.filter(a => {
        const titles = [a.title].concat(a.aliases || []);
        const matchesText = !qn || titles.some(t => normalizeText(t).startsWith(qn));
        const byGenre = !g || (a.genres && a.genres.includes(g));
        const byDemo  = !d || (a.genres && a.genres.includes(d));
        let byRating = true;
        if (cat === 'excellent') byRating = a.rating >= 4.8;
        else if (cat === 'good') byRating = a.rating >= 4.6 && a.rating < 4.8;
        else if (cat === 'regular') byRating = a.rating < 4.6;
        return matchesText && byGenre && byDemo && byRating;
      });

      let resultList = filtrados.slice();
      if (qn) {
        resultList.sort((A, B) => {
          const titlesA = [A.title].concat(A.aliases || []).map(t => normalizeText(t));
          const titlesB = [B.title].concat(B.aliases || []).map(t => normalizeText(t));
          const aStarts = titlesA.some(t => t.startsWith(qn));
          const bStarts = titlesB.some(t => t.startsWith(qn));
          if (aStarts !== bStarts) return aStarts ? -1 : 1;
          const na = getBestTitleForSort(A); const nb = getBestTitleForSort(B);
          return na < nb ? -1 : na > nb ? 1 : 0;
        });
      } else {
        resultList.sort((A, B) => normalizeText(A.title) < normalizeText(B.title) ? -1 : normalizeText(A.title) > normalizeText(B.title) ? 1 : 0);
      }
      render(resultList);
      updateResultsCount(resultList.length);
    }

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    if (typeof animes !== 'undefined') {
      render(shuffleArray(animes));
      updateResultsCount(animes.length);
    } else {
      console.error("Error: No se encontró la lista 'animes'.");
    }

    document.getElementById('search').addEventListener('input', debouncedFiltro);
    document.getElementById('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); filtro(); } });
    ['genre-select', 'rating-select', 'demographic-select'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('change', filtro); });

    // ===================== LÓGICA DE MÚSICA SIMPLIFICADA =====================
    window.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('bg-music');
      if (audio) {
        audio.volume = 0.5;
        // Intento de reproducción automática (puede ser bloqueado por el navegador)
        audio.play().catch(() => {
          document.addEventListener('click', () => audio.play().catch(()=>{}), { once: true });
        });
      }
    });

    // ===================== FUNCIONES DE USUARIO Y AUTENTICACIÓN =====================
    let currentUser = null;
    function goToProfile() {
      if (!currentUser) {
        showAuthModal();
        document.getElementById('authError').innerText = "⚠️ Debes iniciar sesión para configurar tu perfil.";
        return;
      }
      location.href = 'opciones.html';
    }
    function showAuthModal() { document.getElementById('authModal').classList.add('show'); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); document.getElementById('authError').innerText = ''; }

    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.getAttribute('data-tab');
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        if (tabName === 'login') {
          document.getElementById('authLoginForm').style.display = 'flex';
          document.getElementById('authRegisterForm').style.display = 'none';
        } else {
          document.getElementById('authLoginForm').style.display = 'none';
          document.getElementById('authRegisterForm').style.display = 'flex';
        }
        document.getElementById('authError').innerText = '';
      });
    });

    async function loginWithEmail() {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        closeAuthModal();
        updateUserUI(auth.currentUser);
      } catch (err) { document.getElementById('authError').innerText = err.message; }
    }
    async function registerWithEmail() {
      const email = document.getElementById('registerEmail').value;
      const pass = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;
      if (pass !== confirm) { document.getElementById('authError').innerText = 'Las contraseñas no coinciden'; return; }
      try {
        await auth.createUserWithEmailAndPassword(email, pass);
        closeAuthModal();
        updateUserUI(auth.currentUser);
      } catch (err) { document.getElementById('authError').innerText = err.message; }
    }
    async function loginWithGoogle() {
      try { await auth.signInWithPopup(providerGoogle); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; }
    }
    async function loginWithGitHub() {
      try { await auth.signInWithPopup(providerGitHub); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; }
    }
    function logoutUser() { auth.signOut().then(() => location.reload()); }

    function getNeonColorFallback(str) {
      const neonColors = ['#00fff7', '#ff0055', '#bc13fe', '#00ff33', '#ffff00', '#ffaa00', '#ff00aa', '#00aaff'];
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      return neonColors[Math.abs(hash) % neonColors.length];
    }

    function updateUserUI(user) {
      currentUser = user;
      const avatarBtn = document.getElementById('userAvatarBtn');
      const dropdownAvatar = document.getElementById('dropdownAvatar');
      const dropdownName = document.getElementById('dropdownName');
      const loginItem = document.getElementById('loginBtnItem');
      if (user) {
        const photoURL = user.photoURL || 'invitado.avif';
        avatarBtn.src = photoURL;
        dropdownAvatar.src = photoURL;
        dropdownName.innerText = user.displayName || user.email.split('@')[0];
        loginItem.innerHTML = '<i class="fas fa-sign-out-alt"></i> Cerrar sesión';
        loginItem.onclick = () => logoutUser();
        if (user.email === 'archinime12@gmail.com') document.getElementById('adminBtn').style.display = 'flex';
        else document.getElementById('adminBtn').style.display = 'none';
        db.collection('users').doc(user.uid).get().then(doc => {
          let color = (doc.exists && doc.data().customColor) ? doc.data().customColor : getNeonColorFallback(user.uid || user.displayName || user.email);
          avatarBtn.style.borderColor = color;
          avatarBtn.style.boxShadow = `0 0 15px ${color}`;
          dropdownAvatar.style.borderColor = color;
          dropdownAvatar.style.boxShadow = `0 0 15px ${color}`;
          dropdownName.style.color = color;
          dropdownName.style.textShadow = `0 0 10px ${color}`;
        }).catch(e => console.log(e));
      } else {
        avatarBtn.src = 'invitado.avif';
        dropdownAvatar.src = 'invitado.avif';
        dropdownName.innerText = 'Invitado';
        loginItem.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
        loginItem.onclick = () => showAuthModal();
        document.getElementById('adminBtn').style.display = 'none';
        avatarBtn.style.borderColor = 'var(--neon-cyan)';
        avatarBtn.style.boxShadow = 'none';
        dropdownAvatar.style.borderColor = 'var(--neon-cyan)';
        dropdownAvatar.style.boxShadow = 'none';
        dropdownName.style.color = 'var(--neon-cyan)';
        dropdownName.style.textShadow = 'none';
      }
    }

    const userAvatarBtn = document.getElementById('userAvatarBtn');
    const userDropdown = document.getElementById('userDropdown');
    userAvatarBtn.addEventListener('click', (e) => { e.stopPropagation(); userDropdown.classList.toggle('active'); });
    document.addEventListener('click', (e) => { if (!userAvatarBtn.contains(e.target) && !userDropdown.contains(e.target)) userDropdown.classList.remove('active'); });
    auth.onAuthStateChanged(user => updateUserUI(user));
    document.getElementById('adminBtn').addEventListener('click', () => window.open('Archinime%20CMS%20-%20Creador.html', '_blank'));

    // ===================== LOADER Y VIDEO DE FONDO =====================
    window.addEventListener('load', () => {
      const loader = document.getElementById('page-loader');
      const bgVideo = document.getElementById('bg-video');
      const forcePlayVideo = () => {
        bgVideo.muted = true;
        bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(() => {
          document.body.addEventListener('click', () => bgVideo.play(), { once: true });
        });
      };
      forcePlayVideo();
      const isFirstVisit = !sessionStorage.getItem('archinime_loaded');
      const delay = isFirstVisit ? 1400 : 50;
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.visibility = 'hidden';
          sessionStorage.setItem('archinime_loaded', 'true');
          // INICIAR NOTIFICACIONES DESPUÉS DE CARGAR
          if (typeof window.startNotificationSequence === 'function') {
            setTimeout(() => window.startNotificationSequence(), 500);
          } else {
            console.warn('startNotificationSequence no está definida');
          }
        }, 400);
      }, delay);
    });

    // Efecto tilt en tarjetas
    const gridObserver = new MutationObserver(() => {
      document.querySelectorAll('.card').forEach(card => {
        if (card.dataset.tiltInit) return;
        card.dataset.tiltInit = 'true';
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const rotateX = ((y - rect.height/2) / rect.height/2) * -8;
          const rotateY = ((x - rect.width/2) / rect.width/2) * 8;
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        });
        card.addEventListener('mouseleave', () => { card.style.transform = ''; });
      });
    });
    const gridEl = document.getElementById('grid');
    if (gridEl) gridObserver.observe(gridEl, { childList: true });
  </script>
</body>
