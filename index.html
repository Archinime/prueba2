<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archinime OS | Next Gen Platform</title>
  
  <link rel="icon" href="Logo_Archinime.avif" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8c52ff">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    /* --- ESTILOS CYBERPUNK GENERALES --- */
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --dark-bg: #050505;
      --glass-bg: rgba(20, 20, 30, 0.6);
      --text: #ffffff;
    }

    body { 
      margin: 0; padding: 0;
      background-color: var(--dark-bg); 
      font-family: 'Poppins', sans-serif; 
      overflow-x: hidden;
      color: white;
    }

    a { text-decoration: none; transition: 0.3s; color: inherit; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }

    /* --- LOADER --- */
    #page-loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 9999;
      display: flex; justify-content: center; align-items: center; flex-direction: column;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }
    .loader-glitch {
      font-family: 'Orbitron', sans-serif; font-size: 2rem; color: white;
      animation: glitch 1s infinite;
    }
    .loader-line {
      width: 0; height: 2px; background: var(--neon-cyan); margin-top: 10px;
      animation: loadLine 2s forwards ease-in-out;
    }

    /* --- FONDOS --- */
    #bg-video {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -5; opacity: 0.6;
      filter: contrast(1.2) saturate(1.2);
    }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(82, 0, 255, 0.1) 0%, #000 90%);
      z-index: -4; pointer-events: none;
    }
    #scanlines {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
      background-size: 100% 4px; z-index: -3; pointer-events: none; opacity: 0.7;
    }

    /* --- NAVBAR --- */
    .cyber-nav {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(5, 5, 5, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 15px 5%;
      display: flex; justify-content: space-between; align-items: center;
      transition: 0.3s;
    }
    .nav-logo { 
      display: flex; align-items: center; gap: 10px; 
      font-family: 'Orbitron', sans-serif; font-weight: 800; 
      font-size: 1.5rem; color: white; letter-spacing: 2px; cursor: pointer;
    }
    .nav-logo img { height: 40px; filter: drop-shadow(0 0 5px var(--neon-cyan)); }

    /* --- BOTONES DE ICONO (NOTIFICACIONES / INSTALL / YOUTUBE) --- */
    .header-actions {
        display: flex; align-items: center; gap: 20px;
    }

    /* Estilo corregido para que se vea grande y bien como en el original */
    .nav-icon-btn {
        background: transparent; 
        border: none; 
        color: #fff; 
        font-size: 1.6rem; /* Tamaño aumentado para corregir el error */
        cursor: pointer; 
        padding: 5px;
        position: relative; 
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .nav-icon-btn:hover { 
        color: var(--neon-cyan); 
        transform: scale(1.1);
        text-shadow: 0 0 10px var(--neon-cyan); 
    }
    
    .install-pulse { animation: pulseBtn 2s infinite; color: var(--neon-cyan); }
    @keyframes pulseBtn { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }

    /* Wrapper de notificación para posicionamiento relativo */
    .notif-wrapper {
        position: relative;
        display: inline-block;
    }

    /* Badge de notificación */
    .notif-badge {
        position: absolute; top: 0; right: 0;
        background: var(--neon-pink); color: white;
        font-size: 0.7rem; padding: 2px 5px; border-radius: 50%;
        box-shadow: 0 0 10px var(--neon-pink);
        font-weight: bold;
    }

    /* Menú de Notificaciones (Estilo corregido) */
    .notif-dropdown {
        display: none; /* Se activa con JS (display: block) */
        position: absolute; 
        top: 150%; /* Justo debajo del botón */
        right: -10px; /* Alineado a la derecha */
        width: 280px; 
        background: rgba(15, 15, 20, 0.98); /* Fondo oscuro sólido */
        border: 1px solid var(--neon-purple); 
        border-radius: 8px;
        z-index: 9999; /* Z-index alto para que aparezca SIEMPRE encima */
        box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        overflow: hidden;
    }
    
    /* Clase que usa tu script original para mostrarlo, si aplica toggle de clase */
    .notif-dropdown.show { display: block; } 

    .notif-header {
        padding: 12px; 
        background: rgba(188, 19, 254, 0.15);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        text-align: center; 
        font-family: 'Poppins'; 
        font-weight: 600;
        color: var(--neon-cyan);
    }
    .notif-list { max-height: 300px; overflow-y: auto; }
    .notif-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; color: #ddd; }
    .notif-item:hover { background: rgba(255,255,255,0.1); }
    .empty-notif { padding: 20px; text-align: center; color: #aaa; font-style: italic; }

    /* --- CONTROLES Y FILTROS --- */
    .controls-container {
        display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;
        padding: 20px 5%; max-width: 1200px; margin: 0 auto;
        position: relative; z-index: 10;
    }
    
    select {
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: 1px solid var(--neon-purple);
        padding: 10px 15px;
        border-radius: 20px;
        font-family: 'Poppins';
        outline: none; cursor: pointer;
        backdrop-filter: blur(5px);
        transition: 0.3s;
    }
    select:hover, select:focus {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    #search {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px; padding: 10px 20px 10px 40px; 
        color: white; outline: none; width: 200px; transition: 0.3s;
        font-family: 'Poppins';
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>');
        background-repeat: no-repeat;
        background-position: 10px center;
        background-size: 15px;
    }
    #search:focus { width: 300px; border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); }

    /* --- GRID --- */
    .grid {
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px;
        padding: 20px 5%;
        max-width: 1400px; margin: 0 auto 80px;
    }

    .card, .anime-card { 
        border-radius: 12px; overflow: hidden; position: relative;
        transition: transform 0.3s; border: 1px solid rgba(255,255,255,0.1);
        background: rgba(20,20,30,0.5); aspect-ratio: 2/3;
    }
    .card img, .anime-card img { width: 100%; height: 100%; object-fit: cover; }
    .card:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(188, 19, 254, 0.4); z-index: 2; }

    /* --- STAGE (ANIMACIONES) --- */
    .stage {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 990; overflow: hidden;
    }
    #fgContainer { width: 100%; height: 100%; position: relative; }
    #fgCanvas { position: absolute; bottom: 0; right: 0; max-height: 80vh; width: auto; }
    #fgVideo { display: none; }

    .play-overlay { position: fixed; bottom: 20px; right: 20px; z-index: 1002; }
    .play-btn {
        background: var(--neon-cyan); border: none; padding: 10px 20px;
        border-radius: 20px; font-weight: bold; cursor: pointer;
        box-shadow: 0 0 10px var(--neon-cyan);
    }

    #decorations { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
    .shooting-star { position: absolute; animation: shoot 3s linear infinite; }
    @keyframes shoot { 0% {transform: translate(-100px, -100px) rotate(45deg); opacity: 1;} 100% {transform: translate(100vw, 100vh) rotate(45deg); opacity: 0;} }

    /* --- MODAL IOS --- */
    .ios-modal {
        display: none; position: fixed; bottom: 0; left: 0; width: 100%;
        background: rgba(20, 20, 30, 0.95); backdrop-filter: blur(10px);
        border-top: 1px solid var(--neon-cyan); z-index: 2000;
        padding: 20px; box-sizing: border-box; text-align: center;
        animation: slideUp 0.5s ease;
    }
    .ios-content { max-width: 600px; margin: 0 auto; position: relative; }
    .ios-close { position: absolute; top: -10px; right: 0; font-size: 1.5rem; cursor: pointer; }
    
    @keyframes glitch {
      0% { text-shadow: 2px 2px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan); }
      50% { text-shadow: 2px -2px 0px var(--neon-purple), -2px 2px 0px var(--neon-cyan); }
      100% { text-shadow: 2px 2px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan); }
    }
    @keyframes loadLine { to { width: 100%; } }
    @keyframes slideUp { from {transform: translateY(100%);} to {transform: translateY(0);} }

    .hero-container { text-align: center; margin-top: 40px; margin-bottom: 20px; }
    .glitch-title {
        font-family: 'Orbitron', sans-serif; font-size: 3rem; 
        text-transform: uppercase; margin: 0;
        text-shadow: 2px 2px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan);
    }

    @media (max-width: 768px) {
        .controls-container { flex-direction: column; align-items: stretch; }
        #search { width: 100%; }
        select { width: 100%; }
        .glitch-title { font-size: 2rem; }
    }
  </style>
</head>

  <script>
    // --- UI: LOADER & SW ---
    window.addEventListener('load', () => {
        const loader = document.getElementById('page-loader');
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.visibility = 'hidden'; }, 500);
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(registration => console.log('SW registrado: ', registration.scope))
                .catch(err => console.log('SW fallo: ', err));
        }
    });

    // --- UI: NAVBAR ---
    window.addEventListener('scroll', () => {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 50) nav.style.background = 'rgba(0,0,0,0.9)';
        else nav.style.background = 'rgba(5,5,5,0.7)';
    });

    // --- HELPER OPEN TAB ---
    function openInNewTab(url) {
        window.open(url, '_blank');
    }
    
    // --- HELPER IOS ---
    function closeIosModal() {
        document.getElementById('iosInstallModal').style.display = 'none';
    }

    // --- EFECTO 3D EN CARDS (OPCIONAL, PERO MANTIENE ESTILO CYBER) ---
    const observerGrid = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.addedNodes.length) {
                mutation.addedNodes.forEach(node => {
                    if (node.nodeType === 1) { 
                        addTiltEffect(node);
                        node.classList.add('anime-card');
                    }
                });
            }
        });
    });
    const gridContainer = document.getElementById('grid');
    if(gridContainer) observerGrid.observe(gridContainer, { childList: true });

    function addTiltEffect(card) {
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -5;
            const rotateY = ((x - centerX) / centerX) * 5;
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
        });
    }
  </script>
