  <script>
    // DESTRUCTOR DE SERVICE WORKERS VIEJOS (Esto arregla el problema de la versión antigua)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // OPTIMIZACIÓN DEL THEME COLOR
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const intervalTime = 100; 
      const segments = colors.length - 1;
      const step = (intervalTime / animationDuration) * segments;
      let currentProgress = 0;
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }
      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      const rgbToHex = (r, g, b) => {
        return "#" + [r, g, b].map(x => {
          const hex = Math.round(x).toString(16);
          return hex.length === 1 ? "0" + hex : hex;
        }).join('');
      };
      const lerp = (start, end, t) => start + (end - start) * t;
      
      setInterval(() => {
        requestAnimationFrame(() => {
          currentProgress += step;
          if (currentProgress >= segments) currentProgress = currentProgress % segments;
          const index = Math.floor(currentProgress);
          const t = currentProgress - index;
          const colorStart = hexToRgb(colors[index]);
          const colorEnd = hexToRgb(colors[index + 1]);
          const r = lerp(colorStart[0], colorEnd[0], t);
          const g = lerp(colorStart[1], colorEnd[1], t);
          const b = lerp(colorStart[2], colorEnd[2], t);
          metaTag.setAttribute('content', rgbToHex(r, g, b));
        });
      }, intervalTime);
    })();
  </script>

  <script>
    const version = Date.now();
    const scriptsToLoad = [
      'index-data.js',
      'animaciones.js',
      'musica_fondo.js',
      'notification-system.js',
      'script-index.js'

  <script>
    let currentUser = null;
    function goToProfile() {
      if (!currentUser) {
        showAuthModal();
        document.getElementById('authError').innerText = "⚠️ Debes iniciar sesión para configurar tu perfil.";
        return;
      }
      location.href = 'opciones.html';
    }

    function showAuthModal() {
      document.getElementById('authModal').classList.add('show');
    }
    function closeAuthModal() {
      document.getElementById('authModal').classList.remove('show');
      document.getElementById('authError').innerText = '';
    }

    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.getAttribute('data-tab');
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        if (tabName === 'login') {
          document.getElementById('authLoginForm').style.display = 'flex';
          document.getElementById('authRegisterForm').style.display = 'none';
        } else {
          document.getElementById('authLoginForm').style.display = 'none';
          document.getElementById('authRegisterForm').style.display = 'flex';
        }
        document.getElementById('authError').innerText = '';
      });
    });

    async function loginWithEmail() {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        closeAuthModal();
        updateUserUI(auth.currentUser);
      } catch (err) {
        document.getElementById('authError').innerText = err.message;
      }
    }

    async function registerWithEmail() {
      const email = document.getElementById('registerEmail').value;
      const pass = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;
      if (pass !== confirm) {
        document.getElementById('authError').innerText = 'Las contraseñas no coinciden';
        return;
      }
      try {
        await auth.createUserWithEmailAndPassword(email, pass);
        closeAuthModal();
        updateUserUI(auth.currentUser);
      } catch (err) {
        document.getElementById('authError').innerText = err.message;
      }
    }

    async function loginWithGoogle() {
      try {
        await auth.signInWithPopup(providerGoogle);
        closeAuthModal();
        updateUserUI(auth.currentUser);
      } catch (err) {
        document.getElementById('authError').innerText = err.message;
      }
    }

    async function loginWithGitHub() {
      try {
        await auth.signInWithPopup(providerGitHub);
        closeAuthModal();
        updateUserUI(auth.currentUser);
      } catch (err) {
        document.getElementById('authError').innerText = err.message;
      }
    }

    function logoutUser() {
      auth.signOut().then(() => {
        location.reload(); 
      });
    }

    function getNeonColorFallback(str) {
      const neonColors = ['#00fff7', '#ff0055', '#bc13fe', '#00ff33', '#ffff00', '#ffaa00', '#ff00aa', '#00aaff'];
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      return neonColors[Math.abs(hash) % neonColors.length];
    }

    function updateUserUI(user) {
      currentUser = user;
      const avatarBtn = document.getElementById('userAvatarBtn');
      const dropdownAvatar = document.getElementById('dropdownAvatar');
      const dropdownName = document.getElementById('dropdownName');
      const loginItem = document.getElementById('loginBtnItem');
      
      if (user) {
        const photoURL = user.photoURL || 'invitado.avif';
        avatarBtn.src = photoURL;
        dropdownAvatar.src = photoURL;
        dropdownName.innerText = user.displayName || user.email.split('@')[0];
        loginItem.innerHTML = '<i class="fas fa-sign-out-alt"></i> Cerrar sesión';
        loginItem.onclick = () => logoutUser();
        
        if (user.email === 'archinime12@gmail.com') {
          document.getElementById('adminBtn').style.display = 'flex';
        } else {
          document.getElementById('adminBtn').style.display = 'none';
        }

        db.collection('users').doc(user.uid).get().then(doc => {
            let color = (doc.exists && doc.data().customColor) ? doc.data().customColor : getNeonColorFallback(user.uid || user.displayName || user.email);
            
            avatarBtn.style.borderColor = color;
            avatarBtn.style.boxShadow = `0 0 15px ${color}`;
            
            dropdownAvatar.style.borderColor = color;
            dropdownAvatar.style.boxShadow = `0 0 15px ${color}`;
            
            dropdownName.style.color = color;
            dropdownName.style.textShadow = `0 0 10px ${color}`;
            
        }).catch(e => console.log(e));
      } else {
        avatarBtn.src = 'invitado.avif';
        dropdownAvatar.src = 'invitado.avif';
        dropdownName.innerText = 'Invitado';
        loginItem.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
        loginItem.onclick = () => showAuthModal();
        document.getElementById('adminBtn').style.display = 'none';
        
        avatarBtn.style.borderColor = 'var(--neon-cyan)';
        avatarBtn.style.boxShadow = 'none';
        
        dropdownAvatar.style.borderColor = 'var(--neon-cyan)';
        dropdownAvatar.style.boxShadow = 'none';
        
        dropdownName.style.color = 'var(--neon-cyan)';
        dropdownName.style.textShadow = 'none';
      }
    }

    const userAvatarBtn = document.getElementById('userAvatarBtn');
    const userDropdown = document.getElementById('userDropdown');
    userAvatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('active');
    });
    document.addEventListener('click', (e) => {
      if (!userAvatarBtn.contains(e.target) && !userDropdown.contains(e.target)) {
        userDropdown.classList.remove('active');
      }
    });

    auth.onAuthStateChanged(user => {
      updateUserUI(user);
    });

    document.getElementById('adminBtn').addEventListener('click', () => {
      window.open('Archinime%20CMS%20-%20Creador.html', '_blank');
    });

    window.toggleNotifMenu = function() {
      const menu = document.getElementById('notifMenu');
      menu.classList.toggle('active');
    };

    window.addEventListener('load', () => {
      const loader = document.getElementById('page-loader');
      const bgVideo = document.getElementById('bg-video');
      const forcePlayVideo = () => {
        bgVideo.muted = true;
        bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(() => {
          document.body.addEventListener('click', () => bgVideo.play(), { once: true });
        });
      };
      forcePlayVideo();
      const isFirstVisit = !sessionStorage.getItem('archinime_loaded');
      const delay = isFirstVisit ? 1400 : 50;
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.visibility = 'hidden';
          sessionStorage.setItem('archinime_loaded', 'true');
          if (window.startNotificationSequence) window.startNotificationSequence();
        }, 400);
      }, delay);
    });

    const gridObserver = new MutationObserver(() => {
      document.querySelectorAll('.card').forEach(card => {
        if (card.dataset.tiltInit) return;
        card.dataset.tiltInit = 'true';
        card.addEventListener('mousemove', (e) => {
          if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF);
          card.tiltRAF = requestAnimationFrame(() => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateX = ((y - rect.height/2) / rect.height/2) * -8;
            const rotateY = ((x - rect.width/2) / rect.width/2) * 8;
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
          });
        });
        card.addEventListener('mouseleave', () => {
          if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF);
          card.style.transform = '';
        });
      });
    });

    const gridEl = document.getElementById('grid');
    if (gridEl) gridObserver.observe(gridEl, { childList: true });
  </script>
