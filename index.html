  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const segments = colors.length - 1;
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }
 
      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      const rgbToHex = (r, g, b) => "#" + [r, g, b].map(x => Math.round(x).toString(16).padStart(2,'0')).join('');
      const lerp = (start, end, t) => start + (end - start) * t;
      let startTimestamp = null, lastUpdate = 0;
  
      function step(timestamp) {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = timestamp - startTimestamp;
        if (timestamp - lastUpdate > 100) {
          let currentProgress = (progress / animationDuration) * segments;
          currentProgress %= segments;
          const index = Math.floor(currentProgress);
          const t = currentProgress - index;
          const colorStart = hexToRgb(colors[index]);
          const colorEnd = hexToRgb(colors[index + 1]);
          const r = lerp(colorStart[0], colorEnd[0], t);
          const g = lerp(colorStart[1], colorEnd[1], t);
          const b = lerp(colorStart[2], colorEnd[2], t);
          metaTag.setAttribute('content', rgbToHex(r, g, b));
          lastUpdate = timestamp;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>

    /* Grid y Cards */

    .card { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 2/3; cursor: pointer; transition: all 0.35s var(--transition-smooth);

      background: linear-gradient(135deg, rgba(0,243,255,0.3), rgba(188,19,254,0.3)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.3s; pointer-events: none;
      will-change: opacity; }
    .card:hover { transform: scale(1.03) translateY(-8px) translateZ(0); box-shadow: 0 20px 30px rgba(0,0,0,0.8); }

    .card .info strong { font-size: 1rem; font-weight: 700; color: white; text-shadow: 0 2px 5px black; }
    .card .info span { font-size: 0.8rem; color: var(--neon-cyan); font-family: 'Orbitron'; font-weight: 600;
      letter-spacing: 1px; background: rgba(0,0,0,0.5); display: inline-block; padding: 2px 8px; border-radius: 20px; width: fit-content; }

    /* Modal de autenticación */
    .auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 10001; display: flex; justify-content: center; align-items: center; opacity: 0;
      pointer-events: none; transition: 0.3s; padding: 20px; will-change: opacity; }
    .auth-modal.show { opacity: 1; pointer-events: auto; }

      max-width: 440px; padding: 35px; position: relative; transform: scale(0.96) translateZ(0); transition: transform 0.3s; box-shadow: 0 25px 45px rgba(0,0,0,0.9); display: flex;
      flex-direction: column; will-change: transform; }
    .auth-modal.show .auth-card { transform: scale(1) translateZ(0); }
    .auth-close { position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; background: rgba(255,255,255,0.05); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; color: #aaa; transition: 0.2s; border: 1px solid transparent; z-index: 10;
      will-change: transform; }
    .auth-close:hover { color: white; background: var(--neon-pink); border-color: var(--neon-pink); transform: rotate(90deg); box-shadow: 0 0 15px var(--neon-pink); }
    .auth-tabs { display: flex; justify-content: space-around; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
    .auth-tab { padding: 12px 15px; cursor: pointer; font-weight: 800; color: #aaa; border-bottom: 2px solid transparent; transition: 0.2s; font-size: 1.1rem; flex-grow: 1; text-align: center; }
    .auth-tab.active { color: var(--neon-cyan); border-bottom-color: var(--neon-cyan); }
    .auth-form { display: flex; flex-direction: column; gap: 15px; width: 100%; }
    .auth-form input { width: 100%; box-sizing: border-box; background: #181920;
      border: 1px solid #2a2b35; padding: 14px; border-radius: 16px; color: white; font-size: 1rem; transition: 0.2s; will-change: border-color, box-shadow; }
    .auth-form input:focus { border-color: var(--neon-cyan); outline: none; box-shadow: 0 0 12px rgba(0,243,255,0.2); }

    .provider-btn { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 40px; display: flex;
      align-items: center; justify-content: center; gap: 12px; cursor: pointer; transition: 0.2s; color: white; font-weight: 600; box-sizing: border-box; will-change: transform; }
    .provider-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--neon-cyan); transform: translateY(-2px); }

    /* Modal de opciones de perfil */
    .profile-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 10002; display: flex; justify-content: center; align-items: center; opacity: 0;
      pointer-events: none; transition: 0.3s; padding: 20px; }
    .profile-modal.show { opacity: 1; pointer-events: auto; }

    .profile-field input[type="text"] { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; font-family: 'Poppins'; outline: none; transition: 0.3s; }
    .profile-field input[type="text"]:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,255,247,0.2); }
    .color-picker-wrapper { display: flex; align-items: center; gap: 15px; }
    .color-picker { -webkit-appearance: none; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; background: none; padding: 0; }
    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; }
    .profile-save-btn { width: 100%; background: var(--neon-cyan); color: #000; border: none; padding: 16px; border-radius: 10px; font-weight: 900;
      font-family: 'Orbitron'; letter-spacing: 1px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .profile-save-btn:hover { background: #fff; box-shadow: 0 0 20px rgba(0,243,255,0.5); transform: translateY(-2px); }
    .profile-save-btn:disabled { background: #555; cursor: not-allowed; transform: none; }
    .profile-status { text-align: center; margin-top: 15px; font-size: 0.9rem; }

    /* ===== STAGE (ANIMACIONES FRONTALES OPTIMIZADAS) ===== */
    .stage { pointer-events: none; position: fixed; inset: 0; z-index: 8; }
    
    #fgContainer {
      position: absolute;
      pointer-events: auto; display: flex; align-items: center; justify-content: center;
      right: 20px; bottom: 20px; 
      width: 280px;
      height: auto;
      max-height: 350px;
      overflow: hidden;
      background: transparent; border-radius: 10px;
      filter: drop-shadow(0 0 10px rgba(0,243,255,0.2));
      z-index: 50;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease, filter 0.6s;
      transform-origin: center bottom;
      cursor: pointer;
    }

    #fgContainer.poof {
      transform: scale(0.8) translateY(40px) translateZ(0);
      opacity: 0;
      filter: drop-shadow(0 0 10px var(--neon-pink)) brightness(1.2);
    }

    #fgCanvas { width: 100%; height: 100%; display: block; object-fit: contain; }
    #fgVideo { display: none; }

    /* Estilos para el sistema de partículas (Chispitas) */
    .spark {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999;
      animation: sparkAnim 0.6s ease-out forwards;
    }
    @keyframes sparkAnim {
      0% { transform: scale(1) translate(0, 0); opacity: 1; }
      100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
    }
    
    .play-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 900; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }
    .play-btn {
      padding: 15px 40px; border-radius: 4px; border: 1px solid var(--neon-cyan);
      background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); 
      font-weight: 800; font-family: 'Orbitron'; letter-spacing: 2px;
      cursor: pointer; box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); transition: 0.3s; text-transform: uppercase;
    }
    .play-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 40px rgba(0, 243, 255, 0.6); transform: scale(1.05); }

    /* Event Modal */
    #eventModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 99999; display: flex; justify-content: center; align-items: center; opacity: 0;
      pointer-events: none; transition: 0.4s; padding: 20px; will-change: opacity; }
    #eventModal.show { opacity: 1; pointer-events: auto; }
    .event-card { background: #0e0e12; width: 100%; max-width: 460px; border-radius: 32px; overflow: hidden; border: 1px solid rgba(0, 243, 255, 0.5); box-shadow: 0 0 50px rgba(188, 19, 254, 0.3); transform: scale(0.9) translateY(30px) translateZ(0);
      transition: transform 0.4s var(--transition-smooth); position: relative; will-change: transform; }
    #eventModal.show .event-card { transform: scale(1) translateY(0) translateZ(0); }
    .event-close { position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; z-index: 50; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; font-size: 1.3rem;
      will-change: transform;}
    .event-close:hover { background: var(--neon-pink); border-color: var(--neon-pink); transform: rotate(90deg); box-shadow: 0 0 15px var(--neon-pink); }
    .event-visuals { position: relative; height: 280px; background: #000; }
    .visual-bg { position: absolute; inset: 0; background-size: cover; filter: blur(20px) brightness(0.5); transform: scale(1.2) translateZ(0); will-change: transform; }
    .covers-container { position: relative; display: flex; justify-content: center; align-items: flex-end; height: 100%; gap: 15px; padding-bottom: 20px; transform: translateZ(0); }
    .cover-back { width: 110px; height: 165px; object-fit: cover; border-radius: 12px; opacity: 0.8; transform: rotate(-8deg) translateX(15px); border: 1px solid rgba(255,255,255,0.3); }
    .cover-front { width: 130px; height: 195px; object-fit: cover; border-radius: 16px; border: 2px solid var(--neon-cyan); transform: rotate(3deg) translateX(-15px); box-shadow: 0 10px 25px black; z-index: 2; }
    .event-type-badge { position: absolute; top: 18px; left: 18px; padding: 6px 16px; border-radius: 30px; background: var(--neon-pink); color: white; font-weight: 800; font-size: 0.7rem; letter-spacing: 1px; box-shadow: 0 0 15px var(--neon-pink); z-index: 3; }
    .event-info { padding: 25px; text-align: center; background: linear-gradient(to top, #0a0a0e, #111116); transform: translateZ(0); }
    .event-title { font-family: 'Orbitron'; font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }
    .event-meta { color: var(--neon-cyan); font-weight: 600; margin-bottom: 15px; letter-spacing: 1px; }
    .event-desc { color: #aaa; margin-bottom: 25px; font-size: 0.9rem; }
    .event-btn { background: white; color: black; border: none; padding: 14px; width: 100%; border-radius: 40px; font-weight: 900; font-family: 'Orbitron'; cursor: pointer; transition: 0.2s; display: flex;
      align-items: center; justify-content: center; gap: 10px; will-change: transform, box-shadow; }
    .event-btn:hover { background: var(--neon-cyan); box-shadow: 0 0 20px var(--neon-cyan); transform: scale(1.02); }

    /* ====== OPTIMIZACIÓN MÓVIL: DESACTIVAR FILTROS PESADOS ====== */
    @media (max-width: 768px) {
      .controls-container { gap: 10px; padding: 12px 16px; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }

      .card .info strong { font-size: 0.8rem; }
      .card .info span { font-size: 0.6rem; }
      .profile-card { padding: 20px; }

        width: 180px; bottom: 10px; right: 10px;

      .search-input { background: rgba(0, 0, 0, 0.8); }
    }
    
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }

    @keyframes pulseText { 0%,100% { opacity: 0.8; } 50% { opacity: 0.4; } }
    @keyframes loadLine { to { width: 280px; } }
    @keyframes borderFlow { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    @keyframes pulseBorder { 0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); } }

      </div>
      <button id="profileSaveBtn" class="profile-save-btn" onclick="guardarCambiosPerfil()">GUARDAR CAMBIOS</button>
      <div id="profileStatusMsg" class="profile-status"></div>
    </div>
  </div>

  <div class="controls-container controls" id="controls">
    <select id="genre-select">
        <option value="">🎭 Todos los géneros</option>
        <option>Acción</option><option>Animación</option><option>Aventura</option><option>Ciencia ficción</option>
        <option>Comedia</option><option>Drama</option><option>Fantasía</option><option>Horror</option>
        <option>Isekai</option><option>Mecha</option><option>Misterio</option><option>Romance</option>
        <option>Shōnen</option><option>Sobrenatural</option><option>Terror</option><option>Thriller</option>
    </select>
    <select id="demographic-select">
      <option value="">👥 Todas las demografías</option>
      <option>Josei</option><option>Kodomo</option><option>Seijin</option><option>Seinen</option><option>Shōjo</option><option>Shōnen</option>
    </select>
    <select id="rating-select">
      <option value="">⭐ RANKING GLOBAL</option>
      <option value="excellent">🏆 S-TIER (4.8+)</option>
      <option value="good">🔥 A-TIER (4.6+)</option>
      <option value="regular">📀 B-TIER (&lt;4.5)</option>
    </select>
  </div>

  <main class="container">
    <div class="grid" id="grid"></div>
  </main>

  <div class="stage" aria-hidden="true">
    <div id="fgContainer" aria-label="Vídeo frontal">
      <canvas id="fgCanvas"></canvas>
      <video id="fgVideo" muted loop playsinline></video>
    </div>
  </div>

  <!-- Scripts modulares (orden correcto) -->
  <script src="app-core.js"></script>
  <script src="notification-system.js"></script>
  <script src="gifs.js"></script>
  <script src="animaciones.js"></script>
  <script src="musica_fondo.js"></script>
  <script src="anime-loader.js"></script>

  <script>
    // Esta función será llamada desde anime-loader.js
    window.renderAnimes = function(animes, append = false) {
      const grid = document.getElementById('grid');
      if (!append) grid.innerHTML = '';
      if (!animes.length && !append) {
        mostrarNoResultados();
        return;
      }
      const frag = document.createDocumentFragment();
      animes.forEach(anime => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = anime.id;
        card.setAttribute('onclick', `location='anime-detail.html?id=${anime.id}'`);
        const rating = getDisplayRating(anime);
        card.innerHTML = `<img src="${anime.img}" alt="${anime.title}" loading="lazy"><div class="info"><strong>${anime.title}</strong><span class="rating-value">⭐ ${rating}</span></div>`;
        frag.appendChild(card);
      });
      grid.appendChild(frag);
      
      // Efecto tilt solo en desktop
      const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      if (!isTouch) {
        document.querySelectorAll('.card:not([data-tilt-init])').forEach(c => {
          c.dataset.tiltInit = 'true';
          c.addEventListener('mousemove', (e) => {
            if (c.tiltRAF) cancelAnimationFrame(c.tiltRAF);
            c.tiltRAF = requestAnimationFrame(() => {
              const rect = c.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              const rotX = ((y - rect.height/2) / (rect.height/2)) * -6;
              const rotY = ((x - rect.width/2) / (rect.width/2)) * 6;
              c.style.transform = `perspective(1200px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
            });
          });
          c.addEventListener('mouseleave', () => {
            if (c.tiltRAF) cancelAnimationFrame(c.tiltRAF);
            c.style.transform = '';
          });
        });
      }
    };

    // Funciones auxiliares para ratings (deben coincidir con las de anime-loader.js)
    let firestoreRatings = new Map();
    function getDisplayRating(anime) {
      const animeId = parseInt(anime.id);
      if (firestoreRatings.has(animeId)) {
        const avg = firestoreRatings.get(animeId).avg;
        if (typeof avg === 'number') return avg.toFixed(1);
      }
      if (anime.rating != null && typeof anime.rating === 'number') return anime.rating.toFixed(1);
      return '—';
    }

    function getNumericRating(anime) {
      const animeId = parseInt(anime.id);
      if (firestoreRatings.has(animeId)) return firestoreRatings.get(animeId).avg;
      if (anime.rating != null && typeof anime.rating === 'number') return anime.rating;
      return 0;
    }

    function mostrarNoResultados() {
      const grid = document.getElementById('grid');
      grid.innerHTML = `<div class="cyber-no-results" style="grid-column:1/-1; display:flex; flex-direction:column; align-items:center; padding:60px; background:rgba(10,12,16,0.7); border:1px solid var(--neon-purple); border-radius:16px;">
        <i class="fas fa-satellite-dish" style="font-size:3rem; color:var(--neon-cyan);"></i><h2 style="font-family:Orbitron; margin:20px 0;">Sin Resultados</h2>
        <p>Prueba con otros filtros o busca por alias.</p><button onclick="resetearFiltros()" style="margin-top:20px; background:transparent; border:2px solid var(--neon-pink); color:#fff; padding:12px 30px; border-radius:8px; cursor:pointer;">Restaurar Radares</button>
      </div>`;
    }

    window.resetearFiltros = function() {
      document.getElementById('search').value = '';
      document.getElementById('genre-select').value = '';
      document.getElementById('demographic-select').value = '';
      document.getElementById('rating-select').value = '';
      currentFilters = { search: '', genre: '', demographic: '', rating: '' };
      // Reiniciar paginación
      if (typeof reiniciarPaginacion === 'function') reiniciarPaginacion();
      else location.reload();
    };

    // Filtros (se integran con anime-loader.js)
    let currentFilters = { search: '', genre: '', demographic: '', rating: '' };
    let debounceTimer = null;
    const searchInput = document.getElementById('search');
    const genreSelect = document.getElementById('genre-select');
    const demographicSelect = document.getElementById('demographic-select');
    const ratingSelect = document.getElementById('rating-select');

    function aplicarFiltros() {
      const hasActive = currentFilters.search || currentFilters.genre || currentFilters.demographic || currentFilters.rating;
      if (hasActive) {
        // Llamar a la función de filtrado que debe estar en anime-loader.js
        if (typeof filtrarAnimes === 'function') filtrarAnimes(currentFilters);
        else console.warn('filtrarAnimes no definida');
      } else {
        if (typeof reiniciarPaginacion === 'function') reiniciarPaginacion();
        else location.reload();
      }
    }

    function debouncedAplicarFiltros() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => aplicarFiltros(), 300);
    }

    searchInput.addEventListener('input', e => { currentFilters.search = e.target.value; debouncedAplicarFiltros(); });
    genreSelect.addEventListener('change', e => { currentFilters.genre = e.target.value; aplicarFiltros(); });
    demographicSelect.addEventListener('change', e => { currentFilters.demographic = e.target.value; aplicarFiltros(); });
    ratingSelect.addEventListener('change', e => { currentFilters.rating = e.target.value; aplicarFiltros(); });

    // Cargar ratings desde Firestore al inicio
    db.collection('animeRatings').get().then(snapshot => {
      snapshot.forEach(doc => {
        const data = doc.data();
        if (typeof data.avg === 'number') firestoreRatings.set(parseInt(doc.id), { avg: data.avg, count: data.count || 0 });
      });
    }).catch(e => console.warn('Error cargando ratings:', e));

    // Pantalla de carga (simulada hasta que anime-loader.js termine la primera carga)
    let loadingCompleted = false;
    const loadingScreen = document.getElementById('loadingScreen');
    const percentEl = document.getElementById('loadingPercentage');
    const lineEl = document.getElementById('loaderLine');
    function updateProgress(percent) {
      const p = Math.min(99, Math.max(0, Math.floor(percent)));
      if (percentEl) percentEl.innerText = p + '%';
      if (lineEl) lineEl.style.width = p + '%';
    }
    function finishLoading() {
      if (loadingCompleted) return;
      loadingCompleted = true;
      updateProgress(100);
      percentEl.innerText = "SISTEMA LISTO";
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        document.body.style.overflow = '';
      }, 800);
    }
    let progressValue = 0;
    const interval = setInterval(() => {
      if (loadingCompleted) { clearInterval(interval); return; }
      if (progressValue < 85) {
        progressValue += Math.random() * 8;
        if (progressValue > 85) progressValue = 85;
        updateProgress(progressValue);
      }
    }, 200);
    // Esperar a que se cargue la primera página de animes
    window.addEventListener('firstAnimesLoaded', () => {
      clearInterval(interval);
      updateProgress(100);
      finishLoading();
    });
    // Fallback después de 5 segundos
    setTimeout(() => {
      if (!loadingCompleted) finishLoading();
    }, 5000);

    // Inicializar GIF aleatorio
    if (typeof listaDeGifs !== 'undefined' && listaDeGifs.length > 0) {
      const gifElegido = listaDeGifs[Math.floor(Math.random() * listaDeGifs.length)];
      document.getElementById('personaje-gif').src = gifElegido;
    }

    // Inicializar sistema de notificaciones
    if (window.startNotificationSequence) window.startNotificationSequence();

    // Selects personalizados (copia del código original)
    (function() {
      const selects = ['genre-select', 'demographic-select', 'rating-select'];
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      function updateTriggerText(trigger, selectEl) {
        trigger.textContent = selectEl.options[selectEl.selectedIndex]?.textContent || selectEl.options[0].textContent;
      }
      selects.forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;
        const trigger = document.createElement('div');
        trigger.className = 'custom-select-trigger';
        updateTriggerText(trigger, select);
        select.parentNode.insertBefore(trigger, select);
        trigger.addEventListener('click', () => {
          if (isMobile) {
            const overlay = document.createElement('div');
            overlay.className = 'select-popup-overlay';
            const popup = document.createElement('div');
            popup.className = 'select-popup';
            const header = document.createElement('div');
            header.className = 'select-popup-header';
            header.textContent = select.getAttribute('aria-label') || 'Seleccionar';
            popup.appendChild(header);
            Array.from(select.options).forEach(opt => {
              const optDiv = document.createElement('div');
              optDiv.className = 'select-popup-option';
              if (opt.value === select.value) optDiv.classList.add('selected');
              optDiv.textContent = opt.textContent;
              optDiv.addEventListener('click', () => {
                select.value = opt.value;
                select.dispatchEvent(new Event('change'));
                updateTriggerText(trigger, select);
                overlay.classList.remove('active');
                enableBodyScroll();
                setTimeout(() => overlay.remove(), 300);
              });
              popup.appendChild(optDiv);
            });
            overlay.appendChild(popup);
            document.body.appendChild(overlay);
            overlay.addEventListener('click', e => {
              if (e.target === overlay) {
                overlay.classList.remove('active');
                enableBodyScroll();
                setTimeout(() => overlay.remove(), 300);
              }
            });
            disableBodyScroll();
            setTimeout(() => overlay.classList.add('active'), 10);
          } else {
            const existing = document.querySelector('.custom-select-dropdown');
            if (existing) existing.remove();
            const rect = trigger.getBoundingClientRect();
            const dropdown = document.createElement('div');
            dropdown.className = 'custom-select-dropdown';
            dropdown.style.top = (rect.bottom + window.scrollY) + 'px';
            dropdown.style.left = (rect.left + window.scrollX) + 'px';
            dropdown.style.minWidth = rect.width + 'px';
            Array.from(select.options).forEach(opt => {
              const optDiv = document.createElement('div');
              optDiv.className = 'custom-select-option';
              optDiv.textContent = opt.textContent;
              if (opt.value === select.value) {
                optDiv.style.background = 'rgba(0, 243, 255, 0.15)';
                optDiv.style.color = 'var(--neon-cyan)';
              }
              optDiv.addEventListener('click', () => {
                select.value = opt.value;
                select.dispatchEvent(new Event('change'));
                updateTriggerText(trigger, select);
                dropdown.remove();
              });
              dropdown.appendChild(optDiv);
            });
            document.body.appendChild(dropdown);
            const closeDropdown = e => {
              if (!dropdown.contains(e.target) && e.target !== trigger) {
                dropdown.remove();
                document.removeEventListener('click', closeDropdown);
                document.removeEventListener('scroll', closeDropdown);
              }
            };
            setTimeout(() => {
              document.addEventListener('click', closeDropdown);
              document.addEventListener('scroll', closeDropdown, { passive: true });
            }, 10);
          }
        });
      });
    })();

    // Funciones de utilidad para scroll (disable/enable)
    function disableBodyScroll() {
      const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
      document.body.style.paddingRight = scrollbarWidth + 'px';
      document.body.classList.add('modal-open');
      document.documentElement.classList.add('modal-open');
    }
    function enableBodyScroll() {
      document.body.style.paddingRight = '';
      document.body.classList.remove('modal-open');
      document.documentElement.classList.remove('modal-open');
    }

    // Integración con las animaciones y música (debe definirse después de cargar los scripts)
    if (typeof startVisualMedia === 'function') startVisualMedia();
    document.addEventListener('click', () => {
      if (typeof startAudioMedia === 'function') startAudioMedia();
    }, { once: true });
    document.addEventListener('touchstart', () => {
      if (typeof startAudioMedia === 'function') startAudioMedia();
    }, { once: true });
  </script>
</body>
</html>
