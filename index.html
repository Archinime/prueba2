  <script>
    // --- PWA SERVICE WORKER: AUTO-UPDATE ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(registration => {
                console.log('SW Registrado: OK');
                registration.update(); 
                registration.onupdatefound = () => {
                    const installingWorker = registration.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed') {
                            if (navigator.serviceWorker.controller) {
                                console.log('Nueva versión encontrada. Recargando...');
                                window.location.reload();
                            }
                        }
                    };
                };
            }).catch(e => console.log('SW Error:', e));
        });
    }

    // --- PWA INSTALL HANDLER ---
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const iosModal = document.getElementById('iosInstallModal');
    
    const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);
    const isMobile = () => window.matchMedia('(max-width: 780px)').matches;

    function checkInstallVisibility() {
        if (isMobile() && !isInStandaloneMode()) {
            installBtn.style.display = 'flex';
        } else {
            installBtn.style.display = 'none';
        }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      checkInstallVisibility();
    });

    installBtn.addEventListener('click', () => {
        if (isIos()) {
            iosModal.style.display = 'block';
        } else if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((res) => {
                deferredPrompt = null;
            });
        } else {
            alert("App ya instalada o no soportada en este navegador.");
        }
    });

    function closeIosModal() { iosModal.style.display = 'none'; }
    window.addEventListener('DOMContentLoaded', checkInstallVisibility);
    window.addEventListener('resize', checkInstallVisibility);

    // --- LOADER & VIDEO AUTOPLAY FIX ---
    window.addEventListener('load', () => {
      const loader = document.getElementById('page-loader');
      const bgVideo = document.getElementById('bg-video');

      const forcePlayVideo = () => {
        if (bgVideo) {
            bgVideo.muted = true;
            let playPromise = bgVideo.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    bgVideo.classList.add('loaded'); 
                })
                .catch(error => {
                    console.log("Autoplay bloqueado. Esperando interacción.");
                    document.body.addEventListener('click', () => {
                        bgVideo.play();
                        bgVideo.classList.add('loaded');
                    }, { once: true });
                    document.body.addEventListener('touchstart', () => {
                        bgVideo.play();
                        bgVideo.classList.add('loaded');
                    }, { once: true });
                });
            }
        }
      };
      forcePlayVideo();

      setTimeout(() => { 
        loader.style.opacity = '0'; 
        setTimeout(() => {
            loader.style.visibility = 'hidden';
            if (window.startNotificationSequence) {
                window.startNotificationSequence();
            }
        }, 500);
      }, 800);
    });

    // --- EFECTO TILT 3D PARA CARDS ---
    const gridObserver = new MutationObserver(() => {
       const cards = document.querySelectorAll('.card');
       cards.forEach(card => {
          if(card.dataset.tiltInit) return;
          card.dataset.tiltInit = "true";
          
          card.addEventListener('mousemove', (e) => {
             const rect = card.getBoundingClientRect();
             const x = e.clientX - rect.left;
             const y = e.clientY - rect.top;
             const centerX = rect.width / 2;
             const centerY = rect.height / 2;
             const rotateX = ((y - centerY) / centerY) * -8;
             const rotateY = ((x - centerX) / centerX) * 8;
             
             card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
          });
          
          card.addEventListener('mouseleave', () => {
             card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
          });
       });
    });
    const gridEl = document.getElementById('grid');
    if(gridEl) gridObserver.observe(gridEl, { childList: true });
  </script>
