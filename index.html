  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const segments = colors.length - 1;
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }
      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      const rgbToHex = (r, g, b) => "#" + [r, g, b].map(x => Math.round(x).toString(16).padStart(2,'0')).join('');
      const lerp = (start, end, t) => start + (end - start) * t;
      let startTimestamp = null, lastUpdate = 0;
      function step(timestamp) {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = timestamp - startTimestamp;
        if (timestamp - lastUpdate > 100) {
          let currentProgress = (progress / animationDuration) * segments;
          currentProgress %= segments;
          const index = Math.floor(currentProgress);
          const t = currentProgress - index;
          const colorStart = hexToRgb(colors[index]);
          const colorEnd = hexToRgb(colors[index + 1]);
          const r = lerp(colorStart[0], colorEnd[0], t);
          const g = lerp(colorStart[1], colorEnd[1], t);
          const b = lerp(colorStart[2], colorEnd[2], t);
          metaTag.setAttribute('content', rgbToHex(r, g, b));
          lastUpdate = timestamp;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>

    const imgGif = document.getElementById('personaje-gif');
    if (imgGif) imgGif.src = gifElegido;
  }

  // ========== PANTALLA DE CARGA ==========
  let loadingCompleted = false;
  const loadingScreen = document.getElementById('loadingScreen');
  const percentEl = document.getElementById('loadingPercentage');
  const lineEl = document.getElementById('loaderLine');
  function updateProgress(percent) {
    const p = Math.min(99, Math.max(0, Math.floor(percent)));
    if (percentEl) percentEl.innerText = p + '%';
    if (lineEl) lineEl.style.width = p + '%';
  }
  function finishLoading() {
    if (loadingCompleted) return;
    loadingCompleted = true;
    updateProgress(100);
    percentEl.innerText = "SISTEMA LISTO";
    setTimeout(() => {
      loadingScreen.classList.add('hidden');
      document.body.style.overflow = '';
    }, 800);
  }
  let progressValue = 0;
  const interval = setInterval(() => {
    if (loadingCompleted) { clearInterval(interval); return; }
    if (progressValue < 85) {
      progressValue += Math.random() * 8;
      if (progressValue > 85) progressValue = 85;
      updateProgress(progressValue);
    }
  }, 200);
  window.addEventListener('firstAnimesLoaded', () => {
    clearInterval(interval);
    updateProgress(100);
    finishLoading();
  });
  setTimeout(() => {
    if (!loadingCompleted) finishLoading();
  }, 8000);

  // ========== RATINGS ==========
  let firestoreRatings = new Map();
  async function loadRatings() {
    try {
      const snapshot = await db.collection('animeRatings').get();
      snapshot.forEach(doc => {
        const data = doc.data();
        if (typeof data.avg === 'number') {
          firestoreRatings.set(parseInt(doc.id), { avg: data.avg, count: data.count || 0 });
        }
      });
    } catch (e) { console.warn('Error cargando ratings:', e); }
  }
  loadRatings();

  // ========== FUNCIONES AUXILIARES ==========
  function normalizeText(s) {

  function getDisplayRating(anime) {
    const animeId = parseInt(anime.id);
    if (firestoreRatings.has(animeId)) {
      const ratingObj = firestoreRatings.get(animeId);
      if (ratingObj && typeof ratingObj.avg === 'number') return ratingObj.avg.toFixed(1);
    }
    if (anime.rating != null && typeof anime.rating === 'number' && !isNaN(anime.rating)) return anime.rating.toFixed(1);
    return '—';
  }
  function getNumericRating(anime) {
    const animeId = parseInt(anime.id);
    if (firestoreRatings.has(animeId)) return firestoreRatings.get(animeId).avg;
    if (anime.rating != null && typeof anime.rating === 'number') return anime.rating;

  // ========== PAGINACIÓN CON CURSOR ==========

  async function cargarAnimesPaginado(reset = false) {
    if (reset) {
      lastVisibleAnime = null;
      hasMoreAnimes = true;
      isFetchingAnimes = false;
      document.getElementById('grid').innerHTML = '';
    }
    if (isFetchingAnimes || !hasMoreAnimes) return;
    isFetchingAnimes = true;
    try {
      let query = db.collection('catalogo').orderBy('title').limit(ANIMES_PER_PAGE);
      if (lastVisibleAnime && !reset) {
        query = query.startAfter(lastVisibleAnime);
      }
      const snapshot = await query.get();
      if (snapshot.empty) {
        hasMoreAnimes = false;
        return;
      }
      lastVisibleAnime = snapshot.docs[snapshot.docs.length - 1];
      const animes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderAnimes(animes, !reset);
      if (reset) {
        const event = new CustomEvent('firstAnimesLoaded');
        window.dispatchEvent(event);
      }
    } catch (error) {
      console.error('Error en paginación:', error);
      document.getElementById('grid').innerHTML = `<div style="text-align:center; padding:40px; color:red;">Error al cargar animes: ${error.message}</div>`;
    } finally {
      isFetchingAnimes = false;

  // ========== FILTROS ==========
  let currentFilters = { search: '', genre: '', demographic: '', rating: '' };
  let debounceTimer = null;

  async function aplicarFiltros() {
    const hasActive = currentFilters.search || currentFilters.genre || currentFilters.demographic || currentFilters.rating;
    if (!hasActive) {
      cargarAnimesPaginado(true);
      return;
    }
    document.getElementById('grid').innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-spin"></i> Filtrando...</div>';
    try {
      let query = db.collection('catalogo');
      if (currentFilters.genre) query = query.where('genres', 'array-contains', currentFilters.genre);
      query = query.orderBy('title');
      const snapshot = await query.limit(200).get();
      let animes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (currentFilters.demographic) animes = animes.filter(a => a.genres && a.genres.includes(currentFilters.demographic));
      if (currentFilters.search) {
        const searchTerm = normalizeText(currentFilters.search);
        animes = animes.filter(a => {
          const titles = [a.title, ...(a.aliases || [])];
          return titles.some(t => normalizeText(t).startsWith(searchTerm));
        });
      }
      if (currentFilters.rating) {
        animes = animes.filter(a => {
          const r = getNumericRating(a);
          if (currentFilters.rating === 'excellent') return r >= 4.8;
          if (currentFilters.rating === 'good') return r >= 4.6 && r < 4.8;
          if (currentFilters.rating === 'regular') return r < 4.6;
          return true;
        });
      }
      renderAnimes(animes, false);
      if (animes.length === 0) mostrarNoResultados();
    } catch (e) {
      console.error('Error en filtros:', e);
      document.getElementById('grid').innerHTML = `<div class="error-message">Error: ${e.message}</div>`;
    }
  }

  function disableBodyScroll() { const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth; document.body.style.paddingRight = scrollbarWidth + 'px'; document.body.classList.add('modal-open'); document.documentElement.classList.add('modal-open'); }

            popup.appendChild(optDiv);
          });
          overlay.appendChild(popup); document.body.appendChild(overlay); overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.classList.remove('active'); enableBodyScroll(); setTimeout(() => overlay.remove(), 300); } }); disableBodyScroll();
          setTimeout(() => overlay.classList.add('active'), 10);
        } else {
          const existing = document.querySelector('.custom-select-dropdown'); if (existing) existing.remove();
          const rect = trigger.getBoundingClientRect(), dropdown = document.createElement('div'); dropdown.className = 'custom-select-dropdown';
          dropdown.style.top = (rect.bottom + window.scrollY) + 'px'; dropdown.style.left = (rect.left + window.scrollX) + 'px'; dropdown.style.minWidth = rect.width + 'px';
          Array.from(select.options).forEach(opt => {

  })();

  // ========== EFECTO TILT PARA CARDS ==========
  function aplicarTiltANuevasCards() {
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isTouch) return;
    document.querySelectorAll('.card:not([data-tilt-init])').forEach(card => {
      card.dataset.tiltInit = 'true';
      card.addEventListener('mousemove', (e) => {
        if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF);
        card.tiltRAF = requestAnimationFrame(() => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const rotX = ((y - rect.height/2) / (rect.height/2)) * -6;
          const rotY = ((x - rect.width/2) / (rect.width/2)) * 6;
          card.style.transform = `perspective(1200px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
        });
      });
      card.addEventListener('mouseleave', () => {
        if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF);
        card.style.transform = '';
      });
    });
  }

  // ========== SISTEMA DE ANIMACIONES (CHROMA KEY) + FUEGOS ARTIFICIALES MEJORADO ==========
  const fgContainer = document.getElementById('fgContainer');
  const fgVideo = document.getElementById('fgVideo');
  const fgCanvas = document.getElementById('fgCanvas');
  const fgCtx = fgCanvas.getContext('2d', { willReadFrequently: true });
  
  // Canvas para fuegos artificiales (se crea dinámicamente)
  const fireCanvas = document.createElement('canvas');
  fireCanvas.className = 'firework-canvas';
  fgContainer.appendChild(fireCanvas);
  const fctx = fireCanvas.getContext('2d');
  
  let currentAnim = videoList[Math.floor(Math.random() * videoList.length)];
  let currentAudio = null;
  let isPlayingMedia = false;
  let isTransitioning = false;
  let chromaIntervalId = null;
  let usingChroma = true;
  let visibilityPaused = false;
  let scheduledTimer = null;

  // Offscreen canvas para chroma
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d', { willReadFrequently: true });

  fgVideo.style.display = 'none';
  fgVideo.src = currentAnim.src;
  fgVideo.addEventListener('loadedmetadata', () => {
    adjustContainerToVideo(fgVideo, currentAnim);
  });

  function adjustContainerToVideo(video, infoObj) {
    const vw = video.videoWidth || 16;
    const vh = video.videoHeight || 9;
    const hints = getPerformanceHints();
    let maxW = Math.min(window.innerWidth * 0.32, 360);
    let maxH = Math.min(window.innerHeight * 0.4, 640);
    if (window.matchMedia('(max-width:767px)').matches) {
      if (infoObj && infoObj.id === 'rem') {
        maxW = Math.min(window.innerWidth * 0.30, 180);
        maxH = Math.min(window.innerHeight * 0.30, 200);
      } else if (infoObj && infoObj.id === 'hola') {
        maxW = Math.min(window.innerWidth * 0.62, 380);
        maxH = Math.min(window.innerHeight * 0.62, 520);
      } else {
        maxW = Math.min(window.innerWidth * 0.45, 260);
        maxH = Math.min(window.innerHeight * 0.45, 420);
      }
    }
    const displayScale = Math.min(maxW / vw, maxH / vh, 1.0);
    const displayW = Math.max(120, Math.round(vw * displayScale));
    const displayH = Math.max(80, Math.round(vh * displayScale));
    fgContainer.style.width = displayW + 'px';
    fgContainer.style.height = displayH + 'px';

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    fgCanvas.width = Math.round(displayW * dpr);
    fgCanvas.height = Math.round(displayH * dpr);
    fgCanvas.style.width = displayW + 'px';
    fgCanvas.style.height = displayH + 'px';
    if (fgCtx && typeof fgCtx.setTransform === 'function') {
      fgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const capHigh = 1280;
    const capMed = 720;
    const hintsScale = hints.processingScale;
    const chosenCap = hintsScale >= 0.85 ? capHigh : hintsScale >= 0.6 ? capMed : 480;
    const sourceW = vw;
    const sourceH = vh;
    const sourceRatio = sourceW / sourceH || (16/9);
    let offW = Math.min(sourceW, chosenCap);
    let offH = Math.round(offW / sourceRatio);
    if (offH > chosenCap) {
      offH = chosenCap;
      offW = Math.round(offH * sourceRatio);
    }
    off.width = Math.max(16, offW);
    off.height = Math.max(16, offH);
    resizeFireCanvas();
  }

  function resizeFireCanvas() {
    const rect = fgContainer.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.floor(rect.width * dpr));
    const h = Math.max(1, Math.floor(rect.height * dpr));
    if (fireCanvas.width !== w || fireCanvas.height !== h) {
      fireCanvas.width = w; fireCanvas.height = h;
      fireCanvas.style.width = rect.width + 'px';
      fireCanvas.style.height = rect.height + 'px';
      fctx.setTransform(dpr,0,0,dpr,0,0);
    }
  }

  function processChromaKey() {
    if (fgVideo.paused || fgVideo.ended || isTransitioning || !usingChroma || visibilityPaused) {
      requestAnimationFrame(processChromaKey);
      return;
    }
    try {
      offCtx.drawImage(fgVideo, 0, 0, off.width, off.height);
    } catch (err) {
      usingChroma = false;
      fgCanvas.style.display = 'none';
      fgVideo.style.display = 'block';
      fgVideo.play().catch(() => {});
      return;
    }
    let frame;
    try {
      frame = offCtx.getImageData(0,0,off.width,off.height);
    } catch (err) {
      usingChroma = false;
      fgCanvas.style.display = 'none';
      fgVideo.style.display = 'block';
      fgVideo.play().catch(() => {});
      return;
    }
    const settings = currentAnim.preset || { threshold:0.4, diff:30, soft:30 };
    const keyColor = currentAnim.keyColor || 'green';
    const data = frame.data;
    const thresh = settings.threshold ?? 0.4;
    const minDiff = settings.diff ?? 30;
    const soften = settings.soft ?? 30;
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
      if (a === 0) continue;
      const sum = r + g + b + 1;
      if (keyColor === 'blue') {
        const maxrg = Math.max(r, g);
        const blueScore = (b - maxrg) / sum;
        const isBlueCandidate = (b - maxrg) > minDiff && blueScore > (thresh - 0.2);
        if (!isBlueCandidate) { data[i+3] = 255; continue; }
        const diff = b - maxrg;
        if (soften <= 0) data[i+3] = (diff > minDiff) ? 0 : 255;
        else {
          const t = (diff - minDiff) / soften;
          const clamped = Math.max(0, Math.min(1, t));
          data[i+3] = Math.round((1 - clamped) * 255);
        }
      } else {
        const maxrb = Math.max(r, b);
        const greenScore = (g - maxrb) / sum;
        const isGreenCandidate = (g - maxrb) > minDiff && greenScore > (thresh - 0.2);
        if (!isGreenCandidate) { data[i+3] = 255; continue; }
        const diff = g - maxrb;
        if (soften <= 0) data[i+3] = (diff > minDiff) ? 0 : 255;
        else {
          const t = (diff - minDiff) / soften;
          const clamped = Math.max(0, Math.min(1, t));
          data[i+3] = Math.round((1 - clamped) * 255);
        }
      }
    }
    offCtx.putImageData(frame, 0, 0);
    const cw = fgCanvas.width / (window.devicePixelRatio || 1);
    const ch = fgCanvas.height / (window.devicePixelRatio || 1);
    fgCtx.clearRect(0, 0, cw, ch);
    fgCtx.drawImage(off, 0, 0, off.width, off.height, 0, 0, cw, ch);
    requestAnimationFrame(processChromaKey);
  }

  function startChromaInterval() {
    if (chromaIntervalId) clearInterval(chromaIntervalId);
    if (!usingChroma || visibilityPaused) return;
    requestAnimationFrame(processChromaKey);
  }

  function stopChromaInterval() {
    if (chromaIntervalId) {
      clearInterval(chromaIntervalId);
      chromaIntervalId = null;
    }
  }

  // Función para generar muchas chispas (mejorada)
  function createSparks(clientX, clientY) {
    const neonColors = ['#00f3ff', '#bc13fe', '#ff0055', '#f1c40f', '#ffaa00', '#00ffaa'];
    const count = 60; // más chispas

      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 250 + 60; // mayor dispersión
      spark.style.setProperty('--tx', (Math.cos(angle) * distance) + 'px');

  // Fuegos artificiales (explosión de partículas)
  async function explodeParticlesAt(x, y, colors, count = 80, duration = 700) {
    const hints = getPerformanceHints();
    const rect = fgContainer.getBoundingClientRect();
    const areaFactor = Math.min(2.2, Math.max(0.45, (rect.width * rect.height) / (360 * 640)));
    let effectiveCount = Math.round(count * areaFactor);
    if (hints.processingScale < 0.45) effectiveCount = Math.max(20, Math.round(effectiveCount * 0.30));
    else if (hints.processingScale < 0.6) effectiveCount = Math.max(30, Math.round(effectiveCount * 0.45));
    else if (hints.processingScale < 0.85) effectiveCount = Math.max(45, Math.round(effectiveCount * 0.7));
    effectiveCount = Math.min(220, effectiveCount);
    
    const targetFps = hints.processingScale >= 0.85 ? 50 : hints.processingScale >= 0.6 ? 36 : 24;
    const frameInterval = 1000 / targetFps;
    const particles = [];
    function rnd(min, max){ return Math.random()*(max-min)+min; }
    for (let i = 0; i < effectiveCount; i++) {
      const angle = rnd(0, Math.PI*2);
      const speed = rnd(1.5, 7.0);
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed * rnd(0.6, 1.2),
        vy: Math.sin(angle) * speed * rnd(0.6, 1.2) - rnd(0.8, 2.5),
        life: rnd(duration*0.65, duration*1.05),
        age: 0,
        radius: rnd(2.0, 6.0),
        color: colors[Math.floor(Math.random()*colors.length)]
      });
    }
    const safeTimeoutMs = Math.round(duration + 400);
    const start = performance.now();
    return new Promise(resolve => {
      let lastFrameTime = 0;
      let finished = false;
      const safeTimer = setTimeout(() => {
        if (!finished) {
          finished = true;
          try { fctx.clearRect(0,0,fireCanvas.width,fireCanvas.height); } catch(e){}
          resolve();
        }
      }, safeTimeoutMs);
      function frame(now){
        try {
          if (finished) return;
          if (!lastFrameTime) lastFrameTime = now;
          const dt = now - lastFrameTime;
          if (dt < frameInterval) {
            requestAnimationFrame(frame);
            return;
          }
          lastFrameTime = now;
          const t = now - start;
          fctx.clearRect(0,0,fireCanvas.width,fireCanvas.height);
          for (let p of particles) {
            p.age = t;
            const lifeRatio = Math.max(0, 1 - p.age / p.life);
            p.x += p.vx * (dt/16.67);
            p.y += p.vy * (dt/16.67);
            p.vy += 0.18 * (dt/16.67);
            const alpha = Math.max(0, Math.min(1, lifeRatio));
            fctx.globalAlpha = alpha;
            fctx.beginPath();
            fctx.fillStyle = p.color;
            fctx.arc(p.x, p.y, p.radius * (0.6 + lifeRatio * 0.8), 0, Math.PI*2);
            fctx.fill();
            fctx.globalAlpha = Math.max(0, alpha * 0.22);
            fctx.beginPath();
            fctx.fillStyle = p.color;
            fctx.arc(p.x, p.y, (p.radius * 5) * (0.22 + (1 - lifeRatio) * 0.9), 0, Math.PI*2);
            fctx.fill();
          }
          fctx.globalAlpha = 1;
          if (t < duration) {
            requestAnimationFrame(frame);
          } else {
            finished = true;
            clearTimeout(safeTimer);
            try { fctx.clearRect(0,0,fireCanvas.width,fireCanvas.height); } catch(e){}
            resolve();
          }
        } catch (err) {
          finished = true;
          clearTimeout(safeTimer);
          try { fctx.clearRect(0,0,fireCanvas.width,fireCanvas.height); } catch(e){}
          resolve();
        }
      }
      try { requestAnimationFrame(frame); } catch (err) {
        clearTimeout(safeTimer);
        try { fctx.clearRect(0,0,fireCanvas.width,fireCanvas.height); } catch(e){}
        resolve();
      }
    });
  }

  async function doFireworkThenHide() {
    if (isTransitioning) return;
    isTransitioning = true;
    try {
      fgVideo.pause();
      const rect = fgContainer.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      resizeFireCanvas();
      const palette = ['#ffcc00','#ff4d4d','#ffd700','#00fff7','#ff6ad5','#ff7f50','#8b5cf6','#ff00aa'];
      fgContainer.style.transition = 'transform .25s ease-out, opacity .25s ease';
      fgContainer.style.transform = 'scale(0.96)';
      fgContainer.style.opacity = '0.85';
      await explodeParticlesAt(cx, cy, palette, 90, 750);
      fgContainer.style.opacity = '0';
      fgContainer.style.transform = 'scale(.8) translateY(10px)';
      await new Promise(r => setTimeout(r, 200));
      fgContainer.style.display = 'none';
      fgContainer.style.transform = '';
      fgContainer.style.opacity = '';
    } catch (err) {
      console.warn('Error en fuegos artificiales:', err);
    } finally {
      isTransitioning = false;
    }
  }

  async function playVideoClip(infoObj) {
    if (!infoObj) return;
    currentAnim = infoObj;
    usingChroma = true;
    fgVideo.src = infoObj.src;
    fgVideo.load();
    const onMeta = () => {
      fgVideo.removeEventListener('loadedmetadata', onMeta);
      adjustContainerToVideo(fgVideo, infoObj);
      fgCanvas.style.display = 'block';
      fgVideo.style.display = 'none';
      fgVideo.play().catch(() => {});
      document.getElementById('bg-video').play().catch(() => {});
      startChromaInterval();
      fgContainer.style.display = 'flex';
    };
    fgVideo.addEventListener('loadedmetadata', onMeta);
    fgVideo.onerror = () => {
      usingChroma = false;
      fgCanvas.style.display = 'none';
      fgVideo.style.display = 'block';
      fgVideo.play().catch(() => {});
    };
    fgVideo.onended = () => {
      scheduleNextVideo(3, infoObj.id);
    };
  }

  function scheduleNextVideo(afterSeconds, excludeId) {
    if (scheduledTimer) clearTimeout(scheduledTimer);
    scheduledTimer = setTimeout(() => {
      let next;
      do {
        next = videoList[Math.floor(Math.random() * videoList.length)];
      } while (next.id === excludeId && videoList.length > 1);
      playVideoClip(next);
    }, afterSeconds * 1000);
  }

  fgContainer.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    if (isTransitioning) return;
    if (scheduledTimer) {
      clearTimeout(scheduledTimer);
      scheduledTimer = null;
    }
    // Generar chispas adicionales en el punto del clic (relativas a la ventana)
    createSparks(ev.clientX, ev.clientY);
    usingChroma = false;
    stopChromaInterval();
    await doFireworkThenHide();
    const currentId = currentAnim.id;
    let next;
    do {
      next = videoList[Math.floor(Math.random() * videoList.length)];
    } while (next.id === currentId && videoList.length > 1);
    setTimeout(() => playVideoClip(next), 420);
  });

  window.addEventListener('resize', () => {
    if (currentAnim && fgVideo.videoWidth) {
      adjustContainerToVideo(fgVideo, currentAnim);
    }
    resizeFireCanvas();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      visibilityPaused = true;
      stopChromaInterval();
    } else {
      visibilityPaused = false;
      if (usingChroma && fgVideo) startChromaInterval();
    }
  });

  function startVisualMedia() {
    const bgVideo = document.getElementById('bg-video');
    bgVideo.muted = true;
    bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(e => console.log('Fondo bloqueado', e));
    fgVideo.muted = true;
    playVideoClip(currentAnim);
  }

  function startAudioMedia() {
    if (isPlayingMedia) return;
    isPlayingMedia = true;
    const track = musicListGlobal[Math.floor(Math.random() * musicListGlobal.length)];
    currentAudio = new Audio(track);
    currentAudio.volume = 0.3;
    currentAudio.onended = () => { isPlayingMedia = false; startAudioMedia(); };
    currentAudio.play().catch(e => { console.log('Música bloqueada', e); isPlayingMedia = false; });
  }

  function getPerformanceHints() {
    let cores = navigator.hardwareConcurrency || 4;
    let deviceMem = navigator.deviceMemory || 4;
    let prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let processingScale = 1.0;
    if (cores >= 8 && deviceMem >= 8) processingScale = 1.0;
    else if (cores >= 4 && deviceMem >= 4) processingScale = 0.85;
    else if (cores >= 2 && deviceMem >= 2) processingScale = 0.6;
    else processingScale = 0.45;
    if (prefersReducedMotion) processingScale = Math.min(processingScale, 0.55);
    return { cores, deviceMem, processingScale, prefersReducedMotion };
  }

  window.addEventListener('DOMContentLoaded', startVisualMedia);
  document.addEventListener('click', startAudioMedia, { once: true });
  document.addEventListener('touchstart', startAudioMedia, { once: true });

  // Inicializar notificaciones y anuncios
  window.addEventListener('load', () => { if (window.startNotificationSequence) window.startNotificationSequence(); });
  inicializarAnuncio();
  cargarAnimesPaginado(true);
</script>
