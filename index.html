  <!-- Theme-color animado (optimizado) -->
  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const segments = colors.length - 1;
      
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }

      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };

      const rgbToHex = (r, g, b) => {
        return "#" + [r, g, b].map(x => {
          const hex = Math.round(x).toString(16);
          return hex.length === 1 ? "0" + hex : hex;
        }).join('');
      };

      const lerp = (start, end, t) => start + (end - start) * t;

      let startTimestamp = null;
      let lastUpdate = 0;

      function step(timestamp) {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = timestamp - startTimestamp;
        
        if (timestamp - lastUpdate > 100) {
          let currentProgress = (progress / animationDuration) * segments;
          currentProgress %= segments;
          
          const index = Math.floor(currentProgress);
          const t = currentProgress - index;
          const colorStart = hexToRgb(colors[index]);
          const colorEnd = hexToRgb(colors[index + 1]);
          
          const r = lerp(colorStart[0], colorEnd[0], t);
          const g = lerp(colorStart[1], colorEnd[1], t);
          const b = lerp(colorStart[2], colorEnd[2], t);
          
          metaTag.setAttribute('content', rgbToHex(r, g, b));
          lastUpdate = timestamp;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>

    /* ---------- LOADER ---------- */
    #page-loader {

    .loader-glitch-wrapper { position: relative; display: inline-block; filter: drop-shadow(0 0 15px var(--neon-cyan)); }
    .loader-glitch { 
      font-family: 'Orbitron', sans-serif; font-size: 3.5rem; color: white;
      font-weight: 900; letter-spacing: 8px; text-transform: uppercase; position: relative;
      text-shadow: 0 0 20px var(--neon-cyan);
    }
    .loader-glitch::before, .loader-glitch::after {
      content: 'Archinime'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent;
    }
    .loader-glitch::before {
      left: 4px; text-shadow: -3px 0 var(--neon-pink);
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
      animation: trueGlitch 2s infinite linear alternate-reverse;
    }
    .loader-glitch::after {
      left: -4px; text-shadow: 2px 0 var(--neon-cyan);
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
      animation: trueGlitch2 2.5s infinite linear alternate-reverse;

    .event-close { position: absolute; top: 15px; right: 15px; z-index: 50; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .event-close:hover { background: var(--neon-pink); border-color: var(--neon-pink); transform: rotate(90deg); }
    .event-info { background: #111; padding: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }
    .event-title { font-size: 1.3rem; font-weight: 800; color: white; margin-bottom: 5px; line-height: 1.2; }
    .event-meta { color: var(--neon-cyan); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 15px; }
    .event-desc { color: #999; font-size: 0.85rem; font-style: italic; margin-bottom: 20px; }
    .event-btn { background: white; color: black; border: none; padding: 12px; width: 100%; border-radius: 30px; font-weight: 800; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
    .event-btn:hover { background: var(--neon-cyan); box-shadow: 0 0 20px var(--neon-cyan); transform: scale(1.02); }

    /* Stage (fgContainer) */
    .stage { pointer-events: none; position: fixed; inset: 0; z-index: 8; }
    #fgContainer {
      position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center;
      right: 20px; bottom: 20px; overflow: hidden; background: transparent; border-radius: 10px;
      filter: drop-shadow(0 0 10px rgba(0,243,255,0.2));
    }
    #fgCanvas, #fgVideo { width: 100%; height: 100%; display: block; object-fit: contain; }
    .play-overlay {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      z-index: 900; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    }
    .play-btn {
      padding: 15px 40px; border-radius: 4px; border: 1px solid var(--neon-cyan);
      background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); font-weight: 800;
      font-family: 'Orbitron'; letter-spacing: 2px; cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); transition: 0.3s; text-transform: uppercase;
    }
    .play-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 40px rgba(0, 243, 255, 0.6); transform: scale(1.05); }

    /* Keyframes */
    @keyframes trueGlitch {
      0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(-2px, 1px); }
      20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(2px, -1px); }
      40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(-2px, 2px); }
      60% { clip-path: polygon(0 40%, 100% 40%, 100% 45%, 0 45%); transform: translate(2px, -2px); }
      80% { clip-path: polygon(0 30%, 100% 30%, 100% 30%, 0 30%); transform: translate(-1px, 1px); }
      100% { clip-path: polygon(0 25%, 100% 25%, 100% 35%, 0 35%); transform: translate(1px, -1px); }
    }
    @keyframes trueGlitch2 {
      0% { clip-path: polygon(0 65%, 100% 65%, 100% 70%, 0 70%); transform: translate(2px, -1px); }
      20% { clip-path: polygon(0 80%, 100% 80%, 100% 80%, 0 80%); transform: translate(-2px, 2px); }
      40% { clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%); transform: translate(2px, -2px); }
      60% { clip-path: polygon(0 90%, 100% 90%, 100% 95%, 0 95%); transform: translate(-1px, 1px); }
      80% { clip-path: polygon(0 85%, 100% 85%, 100% 85%, 0 85%); transform: translate(1px, -1px); }
      100% { clip-path: polygon(0 75%, 100% 75%, 100% 80%, 0 80%); transform: translate(-2px, 1px); }
    }
    @keyframes loadLine { to { width: 280px; } }
    @keyframes borderFlow { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    @keyframes pulseBorder { 0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); } }

    /* Responsive */
    @media (max-width: 768px) {
      .cyber-nav { padding: 10px 15px; height: auto; flex-wrap: wrap; gap: 10px; }
      .search-wrapper { order: 3; width: 100%; margin: 5px 0 0; max-width: none; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }

      .controls-container { flex-direction: row; align-items: stretch; justify-content: space-between; }
      .controls-container select { flex: 1 1 calc(33% - 10px); font-size: 13px; padding: 10px 5px; text-align: center; }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .nav-logo-text { display: none; }
      .event-card { width: 95%; }
      .controls-container select { flex: 1 1 calc(50% - 10px); }
    }
  </style>
  <!-- Fin de estilos integrados -->
</head>

      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW no registrado:', err));
    });

<!-- Inicialización rápida del loader y UI básica -->
<script>
  (function() {
    // Funciones de scroll lock
    window.disableBodyScroll = function() {
      document.body.classList.add('modal-open');
      document.documentElement.classList.add('modal-open');
    };
    window.enableBodyScroll = function() {
      document.body.classList.remove('modal-open');
      document.documentElement.classList.remove('modal-open');
    };

    // Referencias globales
    window.authModal = document.getElementById('authModal');
    window.authError = document.getElementById('authError');
    
    window.showAuthModal = function() {
      authModal.classList.add('show');
      disableBodyScroll();
    };
    window.closeAuthModal = function() {
      authModal.classList.remove('show');
      enableBodyScroll();
      if (authError) authError.innerText = '';
    };
    
    // Placeholders (se reemplazarán en app-core.js)
    window.loginWithEmail = function(){};
    window.loginWithGoogle = function(){};
    window.loginWithGitHub = function(){};
    window.registerWithEmail = function(){};
    window.logoutUser = function(){};
    window.goToProfile = function(){
      if (!window.currentUser) {
        showAuthModal();
        if (authError) authError.innerText = "⚠️ Inicia sesión para configurar tu perfil.";
        return;
      }
      location.href = 'opciones.html';
    };

    // Loader
    const loader = document.getElementById('page-loader');
    const bgVideo = document.getElementById('bg-video');
    
    function forcePlayVideo() {
      bgVideo.muted = true;
      bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(() => {
        document.body.addEventListener('click', () => bgVideo.play(), { once: true });
      });
    }
    forcePlayVideo();
    
    const isFirstVisit = !sessionStorage.getItem('archinime_loaded');
    const delay = isFirstVisit ? 1400 : 50;
    setTimeout(() => {
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.visibility = 'hidden';
        sessionStorage.setItem('archinime_loaded', 'true');
        if (window.startNotificationSequence) window.startNotificationSequence();
      }, 400);
    }, delay);

    // Tilt effect
    const gridObserver = new MutationObserver(() => {
      document.querySelectorAll('.card').forEach(card => {
        if (card.dataset.tiltInit) return;
        card.dataset.tiltInit = 'true';
        card.addEventListener('mousemove', (e) => {
          if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF);
          card.tiltRAF = requestAnimationFrame(() => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateX = ((y - rect.height/2) / (rect.height/2)) * -6;
            const rotateY = ((x - rect.width/2) / (rect.width/2)) * 6;
            card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
          });
        });
        card.addEventListener('mouseleave', () => {
          if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF);
          card.style.transform = '';
        });
      });
    });
    const gridEl = document.getElementById('grid');
    if (gridEl) gridObserver.observe(gridEl, { childList: true, subtree: true });

    // Pestañas auth
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.getAttribute('data-tab');
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('authLoginForm').style.display = tabName === 'login' ? 'flex' : 'none';
        document.getElementById('authRegisterForm').style.display = tabName === 'register' ? 'flex' : 'none';
        if (authError) authError.innerText = '';
      });
    });

    // Dropdown usuario
    const userAvatarBtn = document.getElementById('userAvatarBtn');
    const userDropdown = document.getElementById('userDropdown');
    userAvatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('active');
    });
    document.addEventListener('click', (e) => {
      if (!userAvatarBtn.contains(e.target) && !userDropdown.contains(e.target)) {
        userDropdown.classList.remove('active');
      }
    });
  })();
</script>
