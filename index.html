  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const intervalTime = 100;
      const segments = colors.length - 1;
      const step = (intervalTime / animationDuration) * segments;
      let currentProgress = 0;
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }
      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      const rgbToHex = (r, g, b) => {
        return "#" + [r, g, b].map(x => {
          const hex = Math.round(x).toString(16);
          return hex.length === 1 ? "0" + hex : hex;
        }).join('');
      };
      const lerp = (start, end, t) => start + (end - start) * t;
      setInterval(() => {
        currentProgress += step;
        if (currentProgress >= segments) currentProgress = currentProgress % segments;
        const index = Math.floor(currentProgress);
        const t = currentProgress - index;
        const colorStart = hexToRgb(colors[index]);
        const colorEnd = hexToRgb(colors[index + 1]);
        const r = lerp(colorStart[0], colorEnd[0], t);
        const g = lerp(colorStart[1], colorEnd[1], t);
        const b = lerp(colorStart[2], colorEnd[2], t);
        metaTag.setAttribute('content', rgbToHex(r, g, b));
      }, intervalTime);
    })();
  </script>

<style>

  .event-meta { color: var(--neon-cyan); font-weight: 600; margin-bottom: 15px; letter-spacing: 1px; }
  .event-desc { color: #aaa; margin-bottom: 25px; font-size: 0.9rem; }
  .event-btn { background: white; color: black; border: none; padding: 14px; width: 100%; border-radius: 40px; font-weight: 900; font-family: 'Orbitron'; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .event-btn:hover { background: var(--neon-cyan); box-shadow: 0 0 20px var(--neon-cyan); transform: scale(1.02); }

  /* Responsive */
  @media (max-width: 768px) {
    .cyber-nav { flex-wrap: wrap; height: auto; gap: 12px; padding: 12px 16px; }
    .nav-logo-text { font-size: 1.3rem; }
    .search-wrapper { order: 3; width: 100%; margin: 0; max-width: 100%; }
    .controls-container { gap: 10px; overflow-x: auto; justify-content: flex-start; padding: 12px 16px; }
    select { min-width: 130px; font-size: 0.7rem; padding: 8px 20px 8px 12px; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .notif-dropdown { position: fixed; top: 70px; left: 10px; right: 10px; width: auto; }
    .card .info { padding: 40px 8px 8px; }
    .card .info strong { font-size: 0.8rem; }
    .card .info span { font-size: 0.6rem; }
    body, a, button, .card, select, .cyber-btn-icon { cursor: auto; }
    .custom-cursor { display: none; }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .nav-logo-text { display: none; }
    .cyber-btn-icon { width: 38px; height: 38px; }
  }

  /* Animaciones clave */
  @keyframes trueGlitch { 0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(-2px, 1px); } 20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(2px, -1px); } 40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(-2px, 2px); } 60% { clip-path: polygon(0 40%, 100% 40%, 100% 45%, 0 45%); transform: translate(2px, -2px); } 80% { clip-path: polygon(0 30%, 100% 30%, 100% 30%, 0 30%); transform: translate(-1px, 1px); } 100% { clip-path: polygon(0 25%, 100% 25%, 100% 35%, 0 35%); transform: translate(1px, -1px); } }
  @keyframes trueGlitch2 { 0% { clip-path: polygon(0 65%, 100% 65%, 100% 70%, 0 70%); transform: translate(2px, -1px); } 20% { clip-path: polygon(0 80%, 100% 80%, 100% 80%, 0 80%); transform: translate(-2px, 2px); } 40% { clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%); transform: translate(2px, -2px); } 60% { clip-path: polygon(0 90%, 100% 90%, 100% 95%, 0 95%); transform: translate(-1px, 1px); } 80% { clip-path: polygon(0 85%, 100% 85%, 100% 85%, 0 85%); transform: translate(1px, -1px); } 100% { clip-path: polygon(0 75%, 100% 75%, 100% 80%, 0 80%); transform: translate(-2px, 1px); } }
  @keyframes pulseText { 0%,100% { opacity: 0.8; } 50% { opacity: 0.4; } }
  @keyframes loadLine { to { width: 280px; } }
  @keyframes borderFlow { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
</style>
</head>
<body>

  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="custom-cursor" id="customCursor"></div>
  <div id="page-loader">
    <div class="loader-glitch-wrapper">
      <div class="loader-glitch">Archinime</div>
    </div>
    <div class="loader-sub">CARGANDO SISTEMA...</div>
    <div style="width: 280px; height: 2px; background: rgba(255,255,255,0.1); margin-top: 20px; border-radius: 2px;">
      <div class="loader-line"></div>
    </div>
  </div>

  <canvas id="particles-canvas"></canvas>
  <video id="bg-video" poster="galaxia-morado1.avif" autoplay muted loop playsinline preload="auto">
    <source src="galaxia.mp4" type="video/mp4">
  </video>
  <div id="overlay" aria-hidden="true"></div>
  <div id="scanlines"></div>
  <audio id="bg-music"></audio> 

  <nav class="cyber-nav">
    <a href="https://archinime.github.io/ArchiPapu/index.html" target="_blank" class="nav-logo" title="Ir a Archinime">
      <img id="logo" src="Logo_Archinime.avif" alt="Logo Archinime">
      <h1 class="nav-logo-text" style="margin: 0; font-size: inherit; line-height: 1;">ARCHINIME</h1>
    </a>

    <div class="search-wrapper">
      <input id="search" class="search-input" placeholder="Buscar anime, género o alias..." aria-label="Buscar anime">
      <i class="fas fa-search search-icon"></i>
    </div>

    <div class="nav-actions header-actions">
      <button id="installBtn" class="cyber-btn-icon install-pulse" data-tooltip="Instalar App" aria-label="Instalar aplicación"><i class="fas fa-download"></i></button>
      <button id="adminBtn" class="cyber-btn-icon" data-tooltip="Panel Admin" style="display: none;"><img src="admin.avif" alt="Admin" style="width: 24px; border-radius: 50%;"></button>
      <div class="notif-wrapper">
        <button id="notifBtn" class="cyber-btn-icon" onclick="toggleNotifMenu()" data-tooltip="Notificaciones" aria-label="Notificaciones"><i class="fas fa-bell"></i><span id="notifBadge" class="notif-badge" style="display:none"></span></button>
        <div id="notifMenu" class="notif-dropdown"><div class="notif-header"><i class="fas fa-bell"></i> NOTIFICACIONES</div><div id="notifList" class="notif-list"><div class="empty-notif" style="padding:20px; text-align:center;">Buscando señal...</div></div></div>
      </div>
      <div class="user-menu">
        <img id="userAvatarBtn" src="invitado.avif" alt="Usuario" data-tooltip="Mi cuenta">
        <div id="userDropdown" class="user-dropdown">
          <div class="user-dropdown-header" onclick="goToProfile()">
            <img id="dropdownAvatar" src="invitado.avif"><div><div id="dropdownName" style="color: var(--neon-cyan);">Invitado</div><div style="font-size: 0.7rem; color: #aaa;"><i class="fas fa-cog"></i> Opciones</div></div>
          </div>
          <div id="userDropdownItems"><div class="user-dropdown-item" id="loginBtnItem"><i class="fas fa-sign-in-alt"></i> Iniciar sesión</div></div>
        </div>
      </div>
      <button class="cyber-btn-icon" onclick="window.open('https://www.youtube.com/@Archinime-k2g', '_blank')" data-tooltip="YouTube" aria-label="YouTube"><img src="youtube.avif" alt="YT" style="width:22px; border-radius:50%;"></button>
    </div>
  </nav>

  <div id="authModal" class="auth-modal">
    <div class="auth-card"><div class="auth-close" onclick="closeAuthModal()">&times;</div>
      <div class="auth-tabs"><div class="auth-tab active" data-tab="login">Iniciar sesión</div><div class="auth-tab" data-tab="register">Registrarse</div></div>
      <div id="authLoginForm" class="auth-form"><input type="email" id="loginEmail" placeholder="Correo electrónico"><input type="password" id="loginPassword" placeholder="Contraseña"><button onclick="loginWithEmail()">Iniciar sesión</button></div>
      <div id="authRegisterForm" class="auth-form" style="display:none;"><input type="email" id="registerEmail" placeholder="Correo electrónico"><input type="password" id="registerPassword" placeholder="Contraseña"><input type="password" id="registerConfirm" placeholder="Confirmar contraseña"><button onclick="registerWithEmail()">Registrarse</button></div>
      <div class="auth-providers"><div class="provider-btn" onclick="loginWithGoogle()"><i class="fab fa-google"></i> Continuar con Google</div><div class="provider-btn" onclick="loginWithGitHub()"><i class="fab fa-github"></i> Continuar con GitHub</div></div>
      <div id="authError" class="auth-error"></div>
    </div>
  </div>

  <div class="controls-container controls" id="controls">
    <select id="genre-select" onchange="filtro()" aria-label="Seleccionar género"><option value="">🎭 Todos los géneros</option><option>Acción</option><option>Animación</option><option>Aventura</option><option>Ciencia ficción</option><option>Comedia</option><option>Drama</option><option>Fantasía</option><option>Horror</option><option>Isekai</option><option>Mecha</option><option>Misterio</option><option>Romance</option><option>Shōnen</option><option>Sobrenatural</option><option>Terror</option><option>Thriller</option></select>
    <select id="demographic-select" onchange="filtro()" aria-label="Demografía"><option value="">👥 Todas las demografías</option><option>Josei</option><option>Kodomo</option><option>Seijin</option><option>Seinen</option><option>Shōjo</option><option>Shōnen</option></select>
    <select id="rating-select" onchange="filtro()" aria-label="Ranking"><option value="">⭐ RANKING GLOBAL</option><option value="excellent">🏆 S-TIER (4.8+)</option><option value="good">🔥 A-TIER (4.6+)</option><option value="regular">📀 B-TIER (&lt;4.5)</option></select>
  </div>

  <main class="container">
    <div class="grid" id="grid"></div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpzYARIxaJijLbbL-2S6F9MWecbAbvK_I",
      authDomain: "login-admin-archinime.firebaseapp.com",
      projectId: "login-admin-archinime",
      storageBucket: "login-admin-archinime.firebasestorage.app",
      messagingSenderId: "938164660242",
      appId: "1:938164660242:web:648e0dce0e0d18dd78d0cb"
    };
    firebase.initializeApp(firebaseConfig);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const providerGoogle = new firebase.auth.GoogleAuthProvider();
    const providerGitHub = new firebase.auth.GithubAuthProvider();
  </script>

  <script>
    const version = Date.now();
    document.write('<script src="index-data.js?v=' + version + '"><\/script>');
    document.write('<script src="animaciones.js?v=' + version + '" defer><\/script>');
    document.write('<script src="musica_fondo.js?v=' + version + '" defer><\/script>');
    document.write('<script src="notification-system.js?v=' + version + '" defer><\/script>');
    document.write('<script src="script-index.js?v=' + version + '" defer><\/script>');
  </script>

  <script>
    // Barra de progreso de scroll
    window.addEventListener('scroll', () => {
      const winScroll = document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - window.innerHeight;
      const scrolled = (winScroll / height) * 100;
      document.getElementById('scrollProgress').style.width = scrolled + '%';
    });

    // Cursor personalizado (solo desktop)
    if (window.matchMedia('(min-width: 768px)').matches) {
      const cursor = document.getElementById('customCursor');
      document.addEventListener('mousemove', (e) => {
        requestAnimationFrame(() => {
          cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        });
      });
      document.addEventListener('mouseenter', () => cursor.style.opacity = '1');
      document.addEventListener('mouseleave', () => cursor.style.opacity = '0');
      const interactive = document.querySelectorAll('a, button, .card, select, .cyber-btn-icon');
      interactive.forEach(el => {
        el.addEventListener('mouseenter', () => { cursor.style.width = '48px'; cursor.style.height = '48px'; });
        el.addEventListener('mouseleave', () => { cursor.style.width = '32px'; cursor.style.height = '32px'; });
      });
    } else {
      document.getElementById('customCursor').style.display = 'none';
    }

    // Partículas interactivas
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouseX = 0, mouseY = 0;
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    class Particle { constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2 + 1; this.speedX = Math.random() * 0.5 - 0.25; this.speedY = Math.random() * 0.5 - 0.25; } update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0; if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0; const dx = mouseX - this.x; const dy = mouseY - this.y; const dist = Math.sqrt(dx*dx + dy*dy); if (dist < 100) { const angle = Math.atan2(dy, dx); const force = (100 - dist) / 100 * 1; this.x -= Math.cos(angle) * force; this.y -= Math.sin(angle) * force; } } draw() { ctx.fillStyle = `rgba(0, 243, 255, ${Math.random() * 0.5 + 0.2})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } }
    for (let i = 0; i < 150; i++) particles.push(new Particle());
    function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
    animateParticles();
    document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

    // Asignar delay de animación a las tarjetas
    function setCardDelays() { document.querySelectorAll('.card').forEach((card, idx) => { card.style.setProperty('--index', idx); }); }
    const observerCards = new MutationObserver(setCardDelays);
    observerCards.observe(document.getElementById('grid'), { childList: true, subtree: true });
    setCardDelays();

    // Resto de funciones de autenticación y UI (igual que antes)
    let currentUser = null;
    function goToProfile() { if (!currentUser) { showAuthModal(); document.getElementById('authError').innerText = "⚠️ Inicia sesión para configurar tu perfil."; return; } location.href = 'opciones.html'; }
    function showAuthModal() { document.getElementById('authModal').classList.add('show'); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); document.getElementById('authError').innerText = ''; }
    document.querySelectorAll('.auth-tab').forEach(tab => { tab.addEventListener('click', () => { const tabName = tab.getAttribute('data-tab'); document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); document.getElementById('authLoginForm').style.display = tabName === 'login' ? 'flex' : 'none'; document.getElementById('authRegisterForm').style.display = tabName === 'register' ? 'flex' : 'none'; document.getElementById('authError').innerText = ''; }); });
    async function loginWithEmail() { const email = document.getElementById('loginEmail').value; const pass = document.getElementById('loginPassword').value; try { await auth.signInWithEmailAndPassword(email, pass); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; } }
    async function registerWithEmail() { const email = document.getElementById('registerEmail').value; const pass = document.getElementById('registerPassword').value; const confirm = document.getElementById('registerConfirm').value; if (pass !== confirm) { document.getElementById('authError').innerText = 'Las contraseñas no coinciden'; return; } try { await auth.createUserWithEmailAndPassword(email, pass); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; } }
    async function loginWithGoogle() { try { await auth.signInWithPopup(providerGoogle); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; } }
    async function loginWithGitHub() { try { await auth.signInWithPopup(providerGitHub); closeAuthModal(); updateUserUI(auth.currentUser); } catch (err) { document.getElementById('authError').innerText = err.message; } }
    function logoutUser() { auth.signOut().then(() => { location.reload(); }); }
    function getNeonColorFallback(str) { const neonColors = ['#00fff7', '#ff0055', '#bc13fe', '#00ff33', '#ffff00', '#ffaa00', '#ff00aa', '#00aaff']; let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash); return neonColors[Math.abs(hash) % neonColors.length]; }
    function updateUserUI(user) { currentUser = user; const avatarBtn = document.getElementById('userAvatarBtn'); const dropdownAvatar = document.getElementById('dropdownAvatar'); const dropdownName = document.getElementById('dropdownName'); const loginItem = document.getElementById('loginBtnItem'); if (user) { const photoURL = user.photoURL || 'invitado.avif'; avatarBtn.src = photoURL; dropdownAvatar.src = photoURL; dropdownName.innerText = user.displayName || user.email.split('@')[0]; loginItem.innerHTML = '<i class="fas fa-sign-out-alt"></i> Cerrar sesión'; loginItem.onclick = () => logoutUser(); if (user.email === 'archinime12@gmail.com') document.getElementById('adminBtn').style.display = 'flex'; else document.getElementById('adminBtn').style.display = 'none'; db.collection('users').doc(user.uid).get().then(doc => { let color = (doc.exists && doc.data().customColor) ? doc.data().customColor : getNeonColorFallback(user.uid || user.displayName || user.email); avatarBtn.style.borderColor = color; avatarBtn.style.boxShadow = `0 0 15px ${color}`; dropdownAvatar.style.borderColor = color; dropdownAvatar.style.boxShadow = `0 0 15px ${color}`; dropdownName.style.color = color; dropdownName.style.textShadow = `0 0 8px ${color}`; }).catch(e => console.log(e)); } else { avatarBtn.src = 'invitado.avif'; dropdownAvatar.src = 'invitado.avif'; dropdownName.innerText = 'Invitado'; loginItem.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión'; loginItem.onclick = () => showAuthModal(); document.getElementById('adminBtn').style.display = 'none'; avatarBtn.style.borderColor = 'var(--neon-cyan)'; avatarBtn.style.boxShadow = 'none'; dropdownAvatar.style.borderColor = 'var(--neon-cyan)'; dropdownAvatar.style.boxShadow = 'none'; dropdownName.style.color = 'var(--neon-cyan)'; dropdownName.style.textShadow = 'none'; } }
    const userAvatarBtn = document.getElementById('userAvatarBtn'); const userDropdown = document.getElementById('userDropdown'); userAvatarBtn.addEventListener('click', (e) => { e.stopPropagation(); userDropdown.classList.toggle('active'); }); document.addEventListener('click', (e) => { if (!userAvatarBtn.contains(e.target) && !userDropdown.contains(e.target)) userDropdown.classList.remove('active'); });
    auth.onAuthStateChanged(user => { updateUserUI(user); });
    document.getElementById('adminBtn').addEventListener('click', () => { window.open('Archinime%20CMS%20-%20Creador.html', '_blank'); });
    window.toggleNotifMenu = function() { const menu = document.getElementById('notifMenu'); menu.classList.toggle('active'); };
    window.addEventListener('load', () => { const loader = document.getElementById('page-loader'); const bgVideo = document.getElementById('bg-video'); const forcePlayVideo = () => { bgVideo.muted = true; bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(() => { document.body.addEventListener('click', () => bgVideo.play(), { once: true }); }); }; forcePlayVideo(); const isFirstVisit = !sessionStorage.getItem('archinime_loaded'); const delay = isFirstVisit ? 1400 : 50; setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => { loader.style.visibility = 'hidden'; sessionStorage.setItem('archinime_loaded', 'true'); if (window.startNotificationSequence) window.startNotificationSequence(); }, 400); }, delay); });
  </script>
</body>
</html>
