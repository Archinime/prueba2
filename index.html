  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const intervalTime = 100;
      const segments = colors.length - 1;
      const step = (intervalTime / animationDuration) * segments;
      let currentProgress = 0;
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }
      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      const rgbToHex = (r, g, b) => {
        return "#" + [r, g, b].map(x => {
          const hex = Math.round(x).toString(16);
          return hex.length === 1 ? "0" + hex : hex;
        }).join('');
      };
      const lerp = (start, end, t) => start + (end - start) * t;
      setInterval(() => {
        currentProgress += step;
        if (currentProgress >= segments) currentProgress = currentProgress % segments;
        const index = Math.floor(currentProgress);
        const t = currentProgress - index;
        const colorStart = hexToRgb(colors[index]);
        const colorEnd = hexToRgb(colors[index + 1]);
        const r = lerp(colorStart[0], colorEnd[0], t);
        const g = lerp(colorStart[1], colorEnd[1], t);
        const b = lerp(colorStart[2], colorEnd[2], t);
        metaTag.setAttribute('content', rgbToHex(r, g, b));
      }, intervalTime);
    })();
  </script>

<style>
  :root {
    --neon-cyan: #00f3ff;
    --neon-purple: #bc13fe;
    --neon-pink: #ff0055;
    --neon-yellow: #f1c40f;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    background-image: url('galaxia-morado1.avif');

  }
  ::-webkit-scrollbar { width: 6px; }

  /* Loader */
  #page-loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 20% 30%, #0a0a0a, #000000);
    z-index: 99999;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    transition: opacity 0.6s var(--transition-smooth), visibility 0.6s;
    backdrop-filter: blur(8px);
  }
  .loader-glitch-wrapper { position: relative; display: inline-block; filter: drop-shadow(0 0 15px var(--neon-cyan)); }
  .loader-glitch { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; color: white;
    font-weight: 900; letter-spacing: 8px; text-transform: uppercase; position: relative;
    text-shadow: 0 0 20px var(--neon-cyan);
  }
  .loader-glitch::before, .loader-glitch::after { content: 'Archinime'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; }
  .loader-glitch::before { left: 4px; text-shadow: -3px 0 var(--neon-pink); clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); animation: trueGlitch 2s infinite linear alternate-reverse; }
  .loader-glitch::after { left: -4px; text-shadow: 2px 0 var(--neon-cyan); clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); animation: trueGlitch2 2.5s infinite linear alternate-reverse; }
  .loader-sub { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--neon-purple); letter-spacing: 4px; margin-top: 20px; animation: pulseText 1.2s infinite; }
  .loader-line { width: 0; height: 2px; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); margin-top: 30px; box-shadow: 0 0 12px var(--neon-cyan); border-radius: 2px; animation: loadLine 1.2s forwards ease-out; }

  /* Fondo y overlay */
  #bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -5; opacity: 0;
    filter: contrast(1.2) brightness(0.6) saturate(1.1); transition: opacity 1.2s ease;
    background: url('galaxia-morado1.avif') no-repeat center center / cover; }
  #bg-video.loaded { opacity: 1; }
  #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%;

    z-index: -4; pointer-events: none; transition: opacity 0.8s ease; }

  /* ===== NAVBAR ===== */
  .cyber-nav {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(5, 5, 10, 0.85);
    backdrop-filter: blur(12px);
    padding: 8px 3%;
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  }
  .cyber-nav::after {
    content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
    background-size: 200% 100%; animation: borderFlow 3s linear infinite; opacity: 0.9;
  }
  /* Desktop layout (grid) */
  @media (min-width: 769px) {
    .cyber-nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 20px;
      height: var(--header-height);
      padding: 0 3%;

    .search-wrapper {
      margin: 0 auto;
      max-width: 500px;
    }
  }
  /* Mobile layout (flex wrap) */
  @media (max-width: 768px) {
    .cyber-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      gap: 12px;
    }
    .nav-logo {
      order: 1;
    }
    .nav-actions {
      order: 2;
    }
    .search-wrapper {
      order: 3;
      width: 100%;
      margin-top: 4px;
    }
  }

  /* Controles (selects) - siempre en una fila */
  .controls-container {
    padding: 20px 3%;
    display: flex;
    gap: 20px;
    flex-wrap: nowrap;
    justify-content: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
    margin-bottom: 20px;
  }
  /* Estilos base para selects (se mantienen) */
  select {
    background: rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(8px);
    color: #e0e0e0;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    padding: 12px 32px 12px 20px;
    min-width: 0;
    flex: 1;
    border: 1px solid rgba(188, 19, 254, 0.5);
    border-radius: 40px;
    transition: all 0.2s;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23bc13fe' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: calc(100% - 15px) center;
    background-size: 14px;
  }
  select:hover, select:focus {
    border-color: var(--neon-cyan);
    color: white;
    background: rgba(0,0,0,0.8);
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    transform: translateY(-2px);
  }
  /* En móviles, los selects se reemplazarán por un popup, así que los ocultamos */
  @media (max-width: 768px) {
    .controls-container select {
      display: none;
    }
    .custom-select-trigger {
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(8px);
      color: #e0e0e0;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      padding: 10px 12px;
      flex: 1;
      text-align: center;
      border: 1px solid rgba(188, 19, 254, 0.5);
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-select-trigger:hover {
      border-color: var(--neon-cyan);
      background: rgba(0,0,0,0.8);
    }
  }

  /* Popup para selects en móviles */
  .select-popup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 10001;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: 0.2s;
  }
  .select-popup-overlay.active {
    opacity: 1;
    visibility: visible;
  }
  .select-popup {
    background: #0f0f13;
    border: 1px solid var(--neon-purple);
    border-radius: 20px;
    width: 85%;
    max-width: 320px;
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: 0 0 30px rgba(188, 19, 254, 0.3);
    transform: scale(0.9);
    transition: transform 0.2s;
  }
  .select-popup-overlay.active .select-popup {
    transform: scale(1);
  }
  .select-popup-header {
    padding: 15px;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    color: var(--neon-cyan);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 1rem;
  }
  .select-popup-option {
    padding: 14px 20px;
    color: #ddd;
    font-size: 0.9rem;
    cursor: pointer;
    transition: 0.2s;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .select-popup-option:last-child {
    border-bottom: none;
  }
  .select-popup-option:hover, .select-popup-option.selected {
    background: rgba(0, 243, 255, 0.1);
    color: var(--neon-cyan);
  }

  /* Grid y Cards */
  .container { max-width: 1600px; margin: 0 auto; padding: 10px 20px 80px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px; }
  .card { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 2/3; cursor: pointer;
    transition: all 0.35s var(--transition-smooth); background: #0a0a0c; box-shadow: 0 12px 25px rgba(0,0,0,0.6);
    transform: translateZ(0); will-change: transform; }
  .card::before { content: ''; position: absolute; inset: 0; border-radius: 16px; padding: 2px;
    background: linear-gradient(135deg, rgba(0,243,255,0.3), rgba(188,19,254,0.3));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .card:hover { transform: scale(1.03) translateY(-8px); box-shadow: 0 20px 30px rgba(0,0,0,0.8); }
  .card:hover::before { opacity: 1; }
  .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
  .card:hover img { transform: scale(1.08); }
  .card .info { position: absolute; bottom: 0; left: 0; width: 100%;
    background: linear-gradient(to top, #000000e6 0%, rgba(5,5,5,0.9) 60%, transparent 100%);
    padding: 70px 15px 18px; display: flex; flex-direction: column; gap: 6px;
    transform: translateY(8px); opacity: 0.95; transition: 0.3s; }

  <!-- Script para selects personalizados en móviles -->
  <script>
    (function() {
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      if (!isMobile) return;

      // Función para crear un popup de selección
      function createSelectPopup(selectElement, triggerElement) {
        const options = Array.from(selectElement.options);
        const currentValue = selectElement.value;
        
        const overlay = document.createElement('div');
        overlay.className = 'select-popup-overlay';
        const popup = document.createElement('div');
        popup.className = 'select-popup';
        
        const header = document.createElement('div');
        header.className = 'select-popup-header';
        header.textContent = selectElement.getAttribute('aria-label') || 'Seleccionar';
        popup.appendChild(header);
        
        options.forEach(opt => {
          const optDiv = document.createElement('div');
          optDiv.className = 'select-popup-option';
          if (opt.value === currentValue) optDiv.classList.add('selected');
          optDiv.textContent = opt.textContent;
          optDiv.addEventListener('click', () => {
            selectElement.value = opt.value;
            // Disparar evento change para que filtro() se ejecute
            selectElement.dispatchEvent(new Event('change'));
            // Actualizar texto del trigger
            triggerElement.textContent = opt.textContent;
            closePopup();
          });
          popup.appendChild(optDiv);
        });
        
        overlay.appendChild(popup);
        document.body.appendChild(overlay);
        
        function closePopup() {
          overlay.classList.remove('active');
          setTimeout(() => overlay.remove(), 300);
        }
        
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closePopup();
        });
        
        setTimeout(() => overlay.classList.add('active'), 10);
      }
      
      // Reemplazar cada select por un trigger personalizado
      const selects = ['genre-select', 'demographic-select', 'rating-select'];
      selects.forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;
        const trigger = document.createElement('div');
        trigger.className = 'custom-select-trigger';
        // Obtener texto de la opción seleccionada
        const selectedOption = select.options[select.selectedIndex];
        trigger.textContent = selectedOption ? selectedOption.textContent : select.options[0].textContent;
        trigger.addEventListener('click', () => createSelectPopup(select, trigger));
        select.parentNode.insertBefore(trigger, select);
        // Ocultar el select original (ya lo hace CSS)
      });
      
      // También ajustar placeholder del buscador en móviles
      const searchInput = document.getElementById('search');
      if (searchInput) searchInput.placeholder = 'Buscar';
    })();
  </script>

    const userAvatarBtn = document.getElementById('userAvatarBtn'); const userDropdown = document.getElementById('userDropdown'); userAvatarBtn.addEventListener('click', (e) => { e.stopPropagation(); userDropdown.classList.toggle('active'); }); document.addEventListener('click', (e) => { if (!userAvatarBtn.contains(e.target) && !userDropdown.contains(e.target)) userDropdown.classList.remove('active'); });

    document.getElementById('adminBtn').addEventListener('click', () => { window.open('Archinime%20CMS%20-%20Creador.html', '_blank'); });
    window.toggleNotifMenu = function() { const menu = document.getElementById('notifMenu'); menu.classList.toggle('active'); };
    window.addEventListener('load', () => { const loader = document.getElementById('page-loader'); const bgVideo = document.getElementById('bg-video'); const forcePlayVideo = () => { bgVideo.muted = true; bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(() => { document.body.addEventListener('click', () => bgVideo.play(), { once: true }); }); }; forcePlayVideo(); const isFirstVisit = !sessionStorage.getItem('archinime_loaded'); const delay = isFirstVisit ? 1400 : 50; setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => { loader.style.visibility = 'hidden'; sessionStorage.setItem('archinime_loaded', 'true'); if (window.startNotificationSequence) window.startNotificationSequence(); }, 400); }, delay); });
    // Efecto tilt en cards
    const gridObserver = new MutationObserver(() => { document.querySelectorAll('.card').forEach(card => { if (card.dataset.tiltInit) return; card.dataset.tiltInit = 'true'; card.addEventListener('mousemove', (e) => { if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF); card.tiltRAF = requestAnimationFrame(() => { const rect = card.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top; const rotateX = ((y - rect.height/2) / rect.height/2) * -6; const rotateY = ((x - rect.width/2) / rect.width/2) * 6; card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`; }); }); card.addEventListener('mouseleave', () => { if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF); card.style.transform = ''; }); }); });
    const gridEl = document.getElementById('grid'); if (gridEl) gridObserver.observe(gridEl, { childList: true });
  </script>
</body>
