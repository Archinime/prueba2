  <!-- Theme-color animado (optimizado con requestAnimationFrame) -->
  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const segments = colors.length - 1;
      
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }

      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };

      const rgbToHex = (r, g, b) => {
        return "#" + [r, g, b].map(x => {
          const hex = Math.round(x).toString(16);
          return hex.length === 1 ? "0" + hex : hex;
        }).join('');
      };

      const lerp = (start, end, t) => start + (end - start) * t;

      let startTimestamp = null;
      let lastUpdate = 0;

      function step(timestamp) {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = timestamp - startTimestamp;
        
        if (timestamp - lastUpdate > 100) {
          let currentProgress = (progress / animationDuration) * segments;
          currentProgress %= segments;
          
          const index = Math.floor(currentProgress);
          const t = currentProgress - index;
          const colorStart = hexToRgb(colors[index]);
          const colorEnd = hexToRgb(colors[index + 1]);
          
          const r = lerp(colorStart[0], colorEnd[0], t);
          const g = lerp(colorStart[1], colorEnd[1], t);
          const b = lerp(colorStart[2], colorEnd[2], t);
          
          metaTag.setAttribute('content', rgbToHex(r, g, b));
          lastUpdate = timestamp;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>

    .loader-glitch-wrapper { position: relative; display: inline-block; filter: drop-shadow(0 0 15px var(--neon-cyan)); }

<!-- Inicialización rápida de loader y elementos críticos (sin esperar Firebase) -->
<script>
  (function() {
    // Funciones mínimas para manejo de modales y UI básica
    window.disableBodyScroll = function() {
      document.body.classList.add('modal-open');
      document.documentElement.classList.add('modal-open');
    };
    window.enableBodyScroll = function() {
      document.body.classList.remove('modal-open');
      document.documentElement.classList.remove('modal-open');
    };

    // Referencias a elementos del DOM usados globalmente
    window.authModal = document.getElementById('authModal');
    window.authError = document.getElementById('authError');
    
    // Funciones de autenticación (se sobreescribirán en app-core.js)
    window.showAuthModal = function() {
      authModal.classList.add('show');
      disableBodyScroll();
    };
    window.closeAuthModal = function() {
      authModal.classList.remove('show');
      enableBodyScroll();
      if (authError) authError.innerText = '';
    };
    
    // Placeholder para login (se reemplazará)
    window.loginWithEmail = function(){};
    window.loginWithGoogle = function(){};
    window.loginWithGitHub = function(){};
    window.registerWithEmail = function(){};
    window.logoutUser = function(){};
    window.goToProfile = function(){
      if (!window.currentUser) {
        showAuthModal();
        authError.innerText = "⚠️ Inicia sesión para configurar tu perfil.";
        return;
      }
      location.href = 'opciones.html';
    };

    // Gestión básica de loader
    const loader = document.getElementById('page-loader');
    const bgVideo = document.getElementById('bg-video');
    
    function forcePlayVideo() {
      bgVideo.muted = true;
      bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(() => {
        document.body.addEventListener('click', () => bgVideo.play(), { once: true });
      });
    }
    forcePlayVideo();
    
    const isFirstVisit = !sessionStorage.getItem('archinime_loaded');
    const delay = isFirstVisit ? 1400 : 50;
    setTimeout(() => {
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.visibility = 'hidden';
        sessionStorage.setItem('archinime_loaded', 'true');
        // Disparar notificaciones (definido en notification-system.js)
        if (window.startNotificationSequence) window.startNotificationSequence();
      }, 400);
    }, delay);

    // Tilt effect para cards (se aplicará cuando el grid se llene)
    const gridObserver = new MutationObserver(() => {
      document.querySelectorAll('.card').forEach(card => {
        if (card.dataset.tiltInit) return;
        card.dataset.tiltInit = 'true';
        card.addEventListener('mousemove', (e) => {
          if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF);
          card.tiltRAF = requestAnimationFrame(() => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateX = ((y - rect.height/2) / (rect.height/2)) * -6;
            const rotateY = ((x - rect.width/2) / (rect.width/2)) * 6;
            card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
          });
        });
        card.addEventListener('mouseleave', () => {
          if (card.tiltRAF) cancelAnimationFrame(card.tiltRAF);
          card.style.transform = '';
        });
      });
    });
    const gridEl = document.getElementById('grid');
    if (gridEl) gridObserver.observe(gridEl, { childList: true, subtree: true });

    // Manejo de pestañas de auth
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.getAttribute('data-tab');
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('authLoginForm').style.display = tabName === 'login' ? 'flex' : 'none';
        document.getElementById('authRegisterForm').style.display = tabName === 'register' ? 'flex' : 'none';
        if (authError) authError.innerText = '';
      });
    });

    // Dropdown de usuario
    const userAvatarBtn = document.getElementById('userAvatarBtn');
    const userDropdown = document.getElementById('userDropdown');
    userAvatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('active');
    });
    document.addEventListener('click', (e) => {
      if (!userAvatarBtn.contains(e.target) && !userDropdown.contains(e.target)) {
        userDropdown.classList.remove('active');
      }
    });
  })();
</script>
