  <!-- Carga diferida de Firebase (solo cuando se necesite) -->
  <script>
    window.FIREBASE_LOADED = false;
    window.loadFirebase = function() {
      if (window.FIREBASE_LOADED) return Promise.resolve();
      return new Promise((resolve) => {
        const script1 = document.createElement('script');
        script1.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js";
        script1.onload = () => {
          const script2 = document.createElement('script');
          script2.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js";
          script2.onload = () => {
            const script3 = document.createElement('script');
            script3.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js";
            script3.onload = () => {
              window.FIREBASE_LOADED = true;
              resolve();
            };
            document.head.appendChild(script3);
          };
          document.head.appendChild(script2);
        };
        document.head.appendChild(script1);
      });
    };
  </script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --neon-yellow: #f1c40f;
      --dark-bg: #050505;
      --glass-bg: rgba(10, 12, 16, 0.65);
      --text: #ffffff;
      --header-height: 72px;
      --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background-color: var(--dark-bg);
      background-image: url('galaxia-morado1.avif');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Poppins', sans-serif;
      color: white;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }
    body.modal-open, html.modal-open {
      overflow: hidden !important;
      position: relative;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020202; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--neon-purple), var(--neon-cyan)); border-radius: 4px; }

    /* Loader optimizado */
    #page-loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 30%, #0a0a0a, #000000);
      z-index: 99999;
      display: flex; justify-content: center; align-items: center; flex-direction: column;
      transition: opacity 0.4s var(--transition-smooth), visibility 0.4s;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .loader-glitch-wrapper { position: relative; display: inline-block; filter: drop-shadow(0 0 15px var(--neon-cyan)); }
    .loader-glitch { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; color: white;
      font-weight: 900; letter-spacing: 8px; text-transform: uppercase; position: relative;
      text-shadow: 0 0 20px var(--neon-cyan);
    }
    .loader-glitch::before, .loader-glitch::after { content: 'Archinime'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; }
    .loader-glitch::before { left: 4px; text-shadow: -3px 0 var(--neon-pink); clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); animation: trueGlitch 2s infinite linear alternate-reverse; }
    .loader-glitch::after { left: -4px; text-shadow: 2px 0 var(--neon-cyan); clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); animation: trueGlitch2 2.5s infinite linear alternate-reverse; }
    .loader-sub { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--neon-purple); letter-spacing: 4px; margin-top: 20px; animation: pulseText 1.2s infinite; }
    .loader-line { width: 0; height: 2px; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); margin-top: 30px; box-shadow: 0 0 12px var(--neon-cyan); border-radius: 2px; animation: loadLine 1.2s forwards ease-out; }

    /* Fondo y overlay - optimizado para móviles */
    #bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -5; opacity: 0;
      filter: contrast(1.2) brightness(0.6) saturate(1.1); transition: opacity 1.2s ease;
      background: url('galaxia-morado1.avif') no-repeat center center / cover; }
    #bg-video.loaded { opacity: 1; }
    /* En móviles y dispositivos lentos, desactivamos el video */

    }
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%;

    /* ===== NAVBAR ===== */
    .cyber-nav {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(5, 5, 10, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 3%;
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    .cyber-nav::after {
      content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
      background-size: 200% 100%;
      animation: borderFlow 3s linear infinite;
      opacity: 0.9;
    }
    @media (min-width: 769px) {

    @media (max-width: 768px) {

        align-items: center;
        justify-content: space-between;

    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; transition: transform 0.2s; }

    @media (max-width: 480px) {

    .nav-actions {

    .user-menu { position: relative; display: flex; align-items: center; }

      transition: all 0.2s ease; z-index: 2000; }
    .user-dropdown.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .user-dropdown-header { padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 14px;
      cursor: pointer; transition: 0.2s; border-radius: 16px 16px 0 0; }
    .user-dropdown-header:hover { background: rgba(188, 19, 254, 0.15); }
    .user-dropdown-header img { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--neon-cyan); }

    /* Notificaciones */
    .notif-wrapper { position: relative; display: flex; align-items: center; }
    .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--neon-pink); min-width: 18px; height: 18px;
      padding: 0 4px; font-size: 10px; border-radius: 30px; box-shadow: 0 0 8px var(--neon-pink); border: 1px solid white;
      color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .notif-dropdown {

      top: 60px;

      background: rgba(15, 15, 20, 0.98);
      border: 1px solid var(--neon-purple);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 35px rgba(0,0,0,0.8);

      transition: all 0.2s ease;
      z-index: 2000;
      overflow: hidden;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 768px) {
      .notif-dropdown {
        position: fixed;
        top: 85px;
        left: 5% !important;
        right: 5% !important;
        width: 90% !important;
        max-width: none;
        transform: translateY(-15px);

      }
      .notif-dropdown.active { transform: translateY(0); }

    }
    .notif-dropdown.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .notif-header { padding: 15px; background: linear-gradient(135deg, rgba(188, 19, 254, 0.2), transparent);
      color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 0.9rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);
      letter-spacing: 2px; flex-shrink: 0; }
    .notif-list { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .notif-item { display: flex; gap: 15px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s; cursor: pointer; align-items: center; width: 100%; box-sizing: border-box; }
    .notif-item:hover { background: rgba(0, 243, 255, 0.08); }
    .notif-img-box { width: 55px; height: 75px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: #000;
      border: 1px solid rgba(255,255,255,0.15); }
    .notif-img-box img { width: 100%; height: 100%; object-fit: cover; }
    .notif-img-box.rounded-avatar { width: 50px; height: 50px; border-radius: 50% !important; }
    .notif-content { flex: 1; min-width: 0; overflow: hidden; }
    .n-title { font-size: 0.9rem; font-weight: 700; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .n-type { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .n-meta { font-size: 0.7rem; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .tag-final { background: #ff0000; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; }

    /* Selects personalizados unificados */
    .controls-container {
      padding: 20px 3%;
      display: flex;
      gap: 20px;
      flex-wrap: nowrap;
      justify-content: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
      margin-bottom: 20px;
      position: relative;
    }
    .controls-container select { display: none; }
    .custom-select-trigger {
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(8px);
      color: #e0e0e0;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      padding: 12px 32px 12px 20px;
      min-width: 0;
      flex: 1;
      text-align: center;
      border: 1px solid rgba(188, 19, 254, 0.5);
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }
    .custom-select-trigger::after {
      content: '\f0d7';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: var(--neon-purple);
      transition: transform 0.2s;
    }
    .custom-select-trigger:hover {
      border-color: var(--neon-cyan);
      background: rgba(0,0,0,0.8);
      color: white;
    }
    .custom-select-dropdown {
      position: absolute;
      background: #0f0f13;
      border: 1px solid var(--neon-purple);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 10001;
      max-height: 300px;
      overflow-y: auto;
      min-width: 180px;
      backdrop-filter: blur(12px);
      transform-origin: top center;
      animation: dropdownFade 0.2s ease;
    }
    .custom-select-option {
      padding: 12px 20px;
      color: #ddd;
      font-size: 0.85rem;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }
    .custom-select-option:hover {
      background: rgba(0, 243, 255, 0.15);
      color: var(--neon-cyan);
    }
    .select-popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }
    .select-popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .select-popup {
      background: #0f0f13;
      border: 1px solid var(--neon-purple);
      border-radius: 20px;
      width: 85%;
      max-width: 320px;
      max-height: 70vh;
      overflow-y: auto;
      box-shadow: 0 0 30px rgba(188, 19, 254, 0.3);
      transform: scale(0.9);
      transition: transform 0.2s;
    }
    .select-popup-overlay.active .select-popup {
      transform: scale(1);
    }
    .select-popup-header {
      padding: 15px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      color: var(--neon-cyan);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 1rem;
    }
    .select-popup-option {
      padding: 14px 20px;
      color: #ddd;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .select-popup-option:last-child { border-bottom: none; }
    .select-popup-option:hover, .select-popup-option.selected {
      background: rgba(0, 243, 255, 0.1);
      color: var(--neon-cyan);
    }
    @keyframes dropdownFade {
      from { opacity: 0; transform: scaleY(0.9); }
      to { opacity: 1; transform: scaleY(1); }
    }

    /* Grid y Cards - optimizado con content-visibility y hover simple */
    .container { max-width: 1600px; margin: 0 auto; padding: 10px 20px 80px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px; }
    .card { 
      position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 2/3; cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      background: #0a0a0c; box-shadow: 0 12px 25px rgba(0,0,0,0.6);
      content-visibility: auto;
      contain: content;
    }
    .card::before {
      content: ''; position: absolute; inset: 0; border-radius: 16px; padding: 2px;
      background: linear-gradient(135deg, rgba(0,243,255,0.3), rgba(188,19,254,0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.25s; pointer-events: none;
    }
    .card:hover { transform: scale(1.02) translateY(-5px); box-shadow: 0 20px 30px rgba(0,0,0,0.8); }
    .card:hover::before { opacity: 1; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; will-change: transform; }
    .card:hover img { transform: scale(1.05); }
    .card .info {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: linear-gradient(to top, #000000e6 0%, rgba(5,5,5,0.9) 60%, transparent 100%);
      padding: 70px 15px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transform: translateY(0);
      opacity: 0.95;
      transition: opacity 0.25s;
    }

  <!-- Sistema de caché manual para recursos estáticos -->
  <script>
    (function() {
      // Cache de recursos JS/CSS usando Cache API
      const CACHE_NAME = 'archinime-static-v1';
      const STATIC_ASSETS = [
        'index-data.js',
        'animaciones.js',
        'musica_fondo.js',
        'script-index.js',
        'https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap',
        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'
      ];
      
      async function cacheStaticAssets() {
        if (!('caches' in window)) return;
        try {
          const cache = await caches.open(CACHE_NAME);
          await cache.addAll(STATIC_ASSETS.filter(asset => asset.startsWith(window.location.origin) || asset.startsWith('https')));
        } catch(e) { console.warn('Cache preload error:', e); }
      }
      
      // Función para cargar scripts con caché
      function loadScriptWithCache(src, callback) {
        if ('caches' in window) {
          caches.match(src).then(response => {
            if (response) {
              response.text().then(code => {
                const script = document.createElement('script');
                script.textContent = code;
                document.body.appendChild(script);
                if (callback) callback();
              });
              return;
            }
            fetchAndCache(src, callback);
          }).catch(() => fetchAndCache(src, callback));
        } else {
          fetchAndCache(src, callback);
        }
      }
      
      function fetchAndCache(src, callback) {
        const script = document.createElement('script');
        script.src = src + '?v=' + Date.now();
        script.onload = () => {
          if ('caches' in window) {
            fetch(src).then(res => {
              if (res.ok) caches.open(CACHE_NAME).then(cache => cache.put(src, res));
            }).catch(e => console.warn);
          }
          if (callback) callback();
        };
        document.body.appendChild(script);
      }
      
      // Carga diferida de scripts principales
      window.addEventListener('load', () => {
        cacheStaticAssets();
        // Cargar index-data.js primero
        loadScriptWithCache('index-data.js', () => {
          // Luego los demás
          loadScriptWithCache('animaciones.js');
          loadScriptWithCache('musica_fondo.js');
          loadScriptWithCache('script-index.js');
        });
      });
    })();
  </script>

  <!-- Lógica principal de autenticación y UI -->
  <script>
    let currentUser = null;
    function goToProfile() { if (!currentUser) { showAuthModal(); document.getElementById('authError').innerText = "⚠️ Inicia sesión para configurar tu perfil."; return; } location.href = 'opciones.html'; }
    function showAuthModal() { 
      document.getElementById('authModal').classList.add('show');
      disableBodyScroll();
    }
    function closeAuthModal() { 
      document.getElementById('authModal').classList.remove('show');
      enableBodyScroll();
      document.getElementById('authError').innerText = '';
    }
    
    async function loginWithEmail() { 
      await window.initFirebase();
      const email = document.getElementById('loginEmail').value; 
      const pass = document.getElementById('loginPassword').value; 
      try { await auth.signInWithEmailAndPassword(email, pass); closeAuthModal(); updateUserUI(auth.currentUser); } 
      catch (err) { document.getElementById('authError').innerText = err.message; } 
    }
    async function registerWithEmail() { 
      await window.initFirebase();
      const email = document.getElementById('registerEmail').value; 
      const pass = document.getElementById('registerPassword').value; 
      const confirm = document.getElementById('registerConfirm').value; 
      if (pass !== confirm) { document.getElementById('authError').innerText = 'Las contraseñas no coinciden'; return; } 
      try { await auth.createUserWithEmailAndPassword(email, pass); closeAuthModal(); updateUserUI(auth.currentUser); } 
      catch (err) { document.getElementById('authError').innerText = err.message; } 
    }
    async function loginWithGoogle() { 
      await window.initFirebase();
      try { await auth.signInWithPopup(providerGoogle); closeAuthModal(); updateUserUI(auth.currentUser); } 
      catch (err) { document.getElementById('authError').innerText = err.message; } 
    }
    async function loginWithGitHub() { 
      await window.initFirebase();
      try { await auth.signInWithPopup(providerGitHub); closeAuthModal(); updateUserUI(auth.currentUser); } 
      catch (err) { document.getElementById('authError').innerText = err.message; } 
    }
    function logoutUser() { auth.signOut().then(() => { location.reload(); }); }
    
    function getNeonColorFallback(str) { 
      const neonColors = ['#00fff7', '#ff0055', '#bc13fe', '#00ff33', '#ffff00', '#ffaa00', '#ff00aa', '#00aaff']; 
      let hash = 0; 
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash); 
      return neonColors[Math.abs(hash) % neonColors.length]; 
    }
    
    function updateUserUI(user) { 
      currentUser = user; 
      const avatarBtn = document.getElementById('userAvatarBtn'); 
      const dropdownAvatar = document.getElementById('dropdownAvatar'); 
      const dropdownName = document.getElementById('dropdownName'); 
      const loginItem = document.getElementById('loginBtnItem'); 
      if (user) { 
        const photoURL = user.photoURL || 'invitado.avif'; 
        avatarBtn.src = photoURL; 
        dropdownAvatar.src = photoURL; 
        dropdownName.innerText = user.displayName || user.email.split('@')[0]; 
        loginItem.innerHTML = '<i class="fas fa-sign-out-alt"></i> Cerrar sesión'; 
        loginItem.onclick = () => logoutUser(); 
        if (db) {
          db.collection('users').doc(user.uid).get().then(doc => { 
            let color = (doc.exists && doc.data().customColor) ? doc.data().customColor : getNeonColorFallback(user.uid || user.displayName || user.email); 
            avatarBtn.style.borderColor = color; 
            avatarBtn.style.boxShadow = `0 0 15px ${color}`; 
            dropdownAvatar.style.borderColor = color; 
            dropdownAvatar.style.boxShadow = `0 0 15px ${color}`; 
            dropdownName.style.color = color; 
            dropdownName.style.textShadow = `0 0 8px ${color}`; 
          }).catch(e => console.log(e));
        }
      } else { 
        avatarBtn.src = 'invitado.avif'; 
        dropdownAvatar.src = 'invitado.avif'; 
        dropdownName.innerText = 'Invitado'; 
        loginItem.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión'; 
        loginItem.onclick = () => showAuthModal(); 
        avatarBtn.style.borderColor = 'var(--neon-cyan)'; 
        avatarBtn.style.boxShadow = 'none'; 
        dropdownAvatar.style.borderColor = 'var(--neon-cyan)'; 
        dropdownAvatar.style.boxShadow = 'none'; 
        dropdownName.style.color = 'var(--neon-cyan)'; 
        dropdownName.style.textShadow = 'none'; 
      } 
    }
    
    function setupAuthListener() {
      if (!auth) return;
      auth.onAuthStateChanged(user => { updateUserUI(user); });
    }
    
    const userAvatarBtn = document.getElementById('userAvatarBtn'); 
    const userDropdown = document.getElementById('userDropdown'); 
    userAvatarBtn.addEventListener('click', (e) => { e.stopPropagation(); userDropdown.classList.toggle('active'); }); 
    document.addEventListener('click', (e) => { if (!userAvatarBtn.contains(e.target) && !userDropdown.contains(e.target)) userDropdown.classList.remove('active'); });
    
    // Asignar eventos de autenticación después de que los elementos existan
    document.querySelectorAll('.auth-tab').forEach(tab => { 
      tab.addEventListener('click', () => { 
        const tabName = tab.getAttribute('data-tab'); 
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active')); 
        tab.classList.add('active'); 
        document.getElementById('authLoginForm').style.display = tabName === 'login' ? 'flex' : 'none'; 
        document.getElementById('authRegisterForm').style.display = tabName === 'register' ? 'flex' : 'none'; 
        document.getElementById('authError').innerText = ''; 
      }); 
    });
    document.querySelector('#authLoginForm button').onclick = loginWithEmail;
    document.querySelector('#authRegisterForm button').onclick = registerWithEmail;
    document.querySelectorAll('.provider-btn')[0].onclick = loginWithGoogle;
    document.querySelectorAll('.provider-btn')[1].onclick = loginWithGitHub;
    document.querySelector('.auth-close').onclick = closeAuthModal;
    
    // Loader y video
    window.addEventListener('load', () => { 
      const loader = document.getElementById('page-loader'); 
      const bgVideo = document.getElementById('bg-video'); 
      if (bgVideo) {
        bgVideo.muted = true; 
        bgVideo.play().then(() => bgVideo.classList.add('loaded')).catch(() => {});
      }
      const isFirstVisit = !sessionStorage.getItem('archinime_loaded'); 
      const delay = isFirstVisit ? 1400 : 50; 
      setTimeout(() => { 
        loader.style.opacity = '0'; 
        setTimeout(() => { 
          loader.style.visibility = 'hidden'; 
          sessionStorage.setItem('archinime_loaded', 'true'); 
          if (window.startNotificationSequence) window.startNotificationSequence(); 
        }, 400); 
      }, delay); 
    });
    
    // Selects personalizados
    (function() {
      const selects = ['genre-select', 'demographic-select', 'rating-select'];
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      function updateTriggerText(trigger, selectEl) {
        const selected = selectEl.options[selectEl.selectedIndex];
        trigger.textContent = selected ? selected.textContent : selectEl.options[0].textContent;
      }
      selects.forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;
        const trigger = document.createElement('div');
        trigger.className = 'custom-select-trigger';
        updateTriggerText(trigger, select);
        select.parentNode.insertBefore(trigger, select);
        const openSelector = () => {
          if (isMobile) {
            const overlay = document.createElement('div');
            overlay.className = 'select-popup-overlay';
            const popup = document.createElement('div');
            popup.className = 'select-popup';
            const header = document.createElement('div');
            header.className = 'select-popup-header';
            header.textContent = select.getAttribute('aria-label') || 'Seleccionar';
            popup.appendChild(header);
            Array.from(select.options).forEach(opt => {
              const optDiv = document.createElement('div');
              optDiv.className = 'select-popup-option';
              if (opt.value === select.value) optDiv.classList.add('selected');
              optDiv.textContent = opt.textContent;
              optDiv.addEventListener('click', () => {
                select.value = opt.value;
                select.dispatchEvent(new Event('change'));
                updateTriggerText(trigger, select);
                closePopup();
              });
              popup.appendChild(optDiv);
            });
            overlay.appendChild(popup);
            document.body.appendChild(overlay);
            function closePopup() {
              overlay.classList.remove('active');
              enableBodyScroll();
              setTimeout(() => overlay.remove(), 300);
            }
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closePopup(); });
            disableBodyScroll();
            setTimeout(() => overlay.classList.add('active'), 10);
          } else {
            const existing = document.querySelector('.custom-select-dropdown');
            if (existing) existing.remove();
            const rect = trigger.getBoundingClientRect();
            const dropdown = document.createElement('div');
            dropdown.className = 'custom-select-dropdown';
            dropdown.style.top = (rect.bottom + window.scrollY) + 'px';
            dropdown.style.left = (rect.left + window.scrollX) + 'px';
            dropdown.style.minWidth = rect.width + 'px';
            Array.from(select.options).forEach(opt => {
              const optDiv = document.createElement('div');
              optDiv.className = 'custom-select-option';
              optDiv.textContent = opt.textContent;
              if (opt.value === select.value) {
                optDiv.style.background = 'rgba(0, 243, 255, 0.15)';
                optDiv.style.color = 'var(--neon-cyan)';
              }
              optDiv.addEventListener('click', () => {
                select.value = opt.value;
                select.dispatchEvent(new Event('change'));
                updateTriggerText(trigger, select);
                dropdown.remove();
              });
              dropdown.appendChild(optDiv);
            });
            document.body.appendChild(dropdown);
            const closeDropdown = (e) => {
              if (!dropdown.contains(e.target) && e.target !== trigger) {
                dropdown.remove();
                document.removeEventListener('click', closeDropdown);
                document.removeEventListener('scroll', closeDropdown);
              }
            };
            setTimeout(() => {
              document.addEventListener('click', closeDropdown);
              document.addEventListener('scroll', closeDropdown);
            }, 10);
          }
        };
        trigger.addEventListener('click', openSelector);
      });
    })();
    
    // Intersection Observer para lazy loading de imágenes en cards (mejora adicional)
    if ('IntersectionObserver' in window) {
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            if (img.dataset.src) {
              img.src = img.dataset.src;
              img.removeAttribute('data-src');
            }
            observer.unobserve(img);
          }
        });
      });
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('img[data-src]').forEach(img => imageObserver.observe(img));
      });
    }
    
    // Función para habilitar/deshabilitar scroll
    window.disableBodyScroll = function() { document.body.classList.add('modal-open'); document.documentElement.classList.add('modal-open'); };
    window.enableBodyScroll = function() { document.body.classList.remove('modal-open'); document.documentElement.classList.remove('modal-open'); };
    
    // Reemplazar el enlace de YouTube
    document.querySelector('.cyber-btn-icon[title="YouTube"]').onclick = () => window.open('https://www.youtube.com/@Archinime-k2g', '_blank');
  </script>

  <!-- Script para sobrescribir ratings desde Firestore -->
  <script>
    (async function updateRatingsFromFirestore() {
        if (typeof animes === 'undefined') {
            setTimeout(() => updateRatingsFromFirestore(), 500);
            return;
        }
        await window.initFirebase();
        if (!db) return;
        const snapshot = await db.collection('animeRatings').get();
        const ratingsMap = new Map();
        snapshot.forEach(doc => {
            const data = doc.data();
            ratingsMap.set(parseInt(doc.id), { avg: data.avg, count: data.count });
        });
        function updateCards() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const animeId = card.dataset.id;
                if (animeId && ratingsMap.has(parseInt(animeId))) {
                    const ratingObj = ratingsMap.get(parseInt(animeId));
                    const ratingSpan = card.querySelector('.rating-value');
                    if (ratingSpan) ratingSpan.innerHTML = `⭐ ${ratingObj.avg.toFixed(1)}`;
                }
            });
        }
        const observer = new MutationObserver(() => {
            if (document.querySelector('.card')) {
                updateCards();
                observer.disconnect();
            }
        });
        observer.observe(document.getElementById('grid'), { childList: true, subtree: true });
        setTimeout(updateCards, 500);
    })();
  </script>
