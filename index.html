<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archinime | Next Gen Platform</title>
  
  <link rel="icon" href="Logo_Archinime.avif" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8c52ff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
  /* --- VARIABLES CYBERPUNK --- */
  :root {
    --neon-cyan: #00f3ff;
    --neon-purple: #bc13fe;
    --neon-pink: #ff0055;
    --dark-bg: #050505;
    --glass-bg: rgba(20, 20, 30, 0.6);
    --text: #ffffff;
    --header-height: 80px;
  }

  /* --- RESET & BASICOS --- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    background-color: var(--dark-bg);
    font-family: 'Poppins', sans-serif;
    color: white;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* --- SCROLLBAR --- */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }

  /* --- LOADER --- */
  #page-loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 99999;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    transition: opacity 0.5s ease-out, visibility 0.5s;
  }
  .loader-glitch {
    font-family: 'Orbitron', sans-serif; font-size: 2rem; color: white;
    animation: glitch 1s infinite;
  }
  .loader-line {
    width: 0; height: 2px; background: var(--neon-cyan); margin-top: 10px;
    animation: loadLine 2s forwards ease-in-out;
  }

  /* --- FONDO (Video y Overlay) --- */
  #bg-video {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -5; opacity: 0; /* Se maneja con script-index.js */
    filter: contrast(1.2) saturate(1.2);
    transition: opacity 1s ease;
  }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(82, 0, 255, 0.15) 0%, #000 90%);
    z-index: -4; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #scanlines {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
    background-size: 100% 4px;
    z-index: -3; pointer-events: none; opacity: 0.6;
  }

  /* --- NAVBAR CYBERPUNK (Reemplaza al cuadrado opaco) --- */
  .cyber-nav {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(5, 5, 5, 0.6); /* Transparente/Glass */
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding: 10px 5%;
    display: flex; justify-content: space-between; align-items: center;
    transition: 0.3s;
    height: var(--header-height);
  }
  .cyber-nav.scrolled {
    background: rgba(0,0,0,0.95);
    box-shadow: 0 5px 20px rgba(0, 243, 255, 0.1);
  }

  /* LOGO */
  .nav-logo { 
    display: flex; align-items: center; gap: 10px; 
    font-family: 'Orbitron', sans-serif; font-weight: 800; 
    font-size: 1.5rem; color: white; letter-spacing: 2px;
    text-decoration: none; cursor: pointer;
  }
  .nav-logo img { height: 45px; filter: drop-shadow(0 0 5px var(--neon-cyan)); border-radius: 8px;}

  /* BARRA DE BÚSQUEDA CYBERPUNK */
  .search-wrapper { position: relative; margin: 0 20px; flex-grow: 1; max-width: 400px; }
  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50px; padding: 10px 20px 10px 45px;
    color: white; outline: none; transition: 0.3s;
    font-family: 'Poppins'; font-size: 0.95rem;
  }
  .search-input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    background: rgba(0,0,0,0.4);
  }
  .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--neon-cyan); }

  /* BOTONES DE ACCIÓN (Instalar, Notificaciones, Social) */
  .nav-actions { display: flex; align-items: center; gap: 15px; }
  
  .cyber-btn-icon {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.3s; position: relative;
    font-size: 1.1rem;
  }
  .cyber-btn-icon:hover {
    background: var(--neon-purple); border-color: var(--neon-purple);
    box-shadow: 0 0 15px var(--neon-purple); transform: scale(1.1);
  }
  
  /* Botón Instalar (PWA) */
  #installBtn { display: none; } /* Controlado por JS */
  .install-pulse { animation: pulseGlow 2s infinite; color: var(--neon-cyan); border-color: var(--neon-cyan); }

  /* Notificaciones Badge */
  .notif-badge {
    position: absolute; top: 0; right: 0;
    background: var(--neon-pink); width: 12px; height: 12px;
    border-radius: 50%; box-shadow: 0 0 8px var(--neon-pink);
  }

  /* --- CONTROLES / FILTROS (Debajo del Header) --- */
  .controls-container {
    padding: 20px 5%;
    display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    margin-bottom: 20px;
  }
  
  /* Selects estilo Cyberpunk */
  select {
    background: rgba(0, 0, 0, 0.6);
    color: #ccc;
    border: 1px solid var(--neon-purple);
    padding: 8px 15px;
    border-radius: 12px;
    font-family: 'Poppins'; font-size: 0.9rem;
    cursor: pointer; outline: none;
    backdrop-filter: blur(5px);
    transition: 0.3s;
    appearance: none; /* Quita estilo por defecto */
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23bc13fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
    padding-right: 35px;
  }
  select:hover, select:focus {
    color: white;
    box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
    background-color: rgba(20, 20, 30, 0.9);
  }

  /* --- GRID DE ANIME (Lógica de index, Estilo de Move) --- */
  .container { max-width: 1400px; margin: 0 auto; padding: 0 20px 80px; }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 25px;
  }

  /* ESTILO DE TARJETA (Adaptando la clase .card que genera el JS antiguo al estilo 3D nuevo) */
  .card {
    position: relative; border-radius: 16px; overflow: hidden;
    aspect-ratio: 2/3; cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    border-color: var(--neon-cyan);
  }
  .card img {
    width: 100%; height: 100%; object-fit: cover;
    transition: 0.5s;
  }
  .card:hover img { transform: scale(1.1); }

  /* Info superpuesta (Generada por JS como .info) */
  .card .info {
    position: absolute; bottom: 0; left: 0; width: 100%;
    background: linear-gradient(to top, #000 10%, rgba(0,0,0,0.8) 80%, transparent 100%);
    padding: 60px 15px 15px;
    transform: translateY(0); /* Siempre visible o animado según gusto */
    display: flex; flex-direction: column; gap: 5px;
  }
  .card .info strong {
    font-size: 1rem; color: white; line-height: 1.2;
    text-shadow: 0 2px 4px black;
  }
  .card .info span {
    font-size: 0.8rem; color: var(--neon-cyan); font-weight: 600;
  }

  /* --- PANTALLA VERDE / ANIMACIONES (Lógica Index) --- */
  #fgContainer {
    position: fixed; z-index: 8; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    right: 20px; bottom: 20px; overflow: hidden;
    min-width: 120px; min-height: 80px; max-width: 360px; max-height: 640px;
    background: transparent; border-radius: 10px;
  }
  #fgCanvas, #fgVideo { width: 100%; height: 100%; display: block; pointer-events: none; object-fit: contain; }
  .play-overlay { 
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 9; background: rgba(0,0,0,0.8); 
  }
  .play-btn {
    padding: 15px 40px; border-radius: 50px; border: none;
    background: var(--neon-cyan); color: #000; font-weight: 800;
    cursor: pointer; box-shadow: 0 0 20px var(--neon-cyan);
    font-family: 'Orbitron'; text-transform: uppercase;
  }

  /* --- NOTIFICACIONES DROPDOWN (Estilo adaptado) --- */
  .notif-wrapper { position: relative; }
  .notif-dropdown {
    position: absolute; top: 60px; right: -10px; width: 320px;
    background: rgba(10, 10, 15, 0.95); border: 1px solid var(--neon-purple);
    border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.8);
    opacity: 0; pointer-events: none; transform: translateY(-10px);
    transition: 0.2s; z-index: 2000; overflow: hidden;
    backdrop-filter: blur(10px);
  }
  .notif-dropdown.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .notif-header { 
    padding: 15px; background: rgba(188, 19, 254, 0.1); 
    color: var(--neon-cyan); font-family: 'Orbitron'; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .notif-list { max-height: 350px; overflow-y: auto; }
  .notif-item { 
    padding: 12px; display: flex; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); 
    transition: 0.2s; cursor: pointer; color: #ddd;
  }
  .notif-item:hover { background: rgba(255,255,255,0.05); }
  .notif-item img { width: 50px; height: 70px; object-fit: cover; border-radius: 4px; }
  
  /* --- MODAL DE NOTIFICACION (POPUP) --- */
  #eventModal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
    z-index: 99999; display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: 0.3s;
  }
  #eventModal.show { opacity: 1; pointer-events: auto; }
  .event-card {
    background: #0b0c10; width: 90%; max-width: 400px;
    border: 1px solid var(--neon-cyan); border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
    position: relative;
  }
  /* Estilos internos del modal definidos en notification-system.js pero forzamos CSS aquí para asegurar */
  .event-visuals { position: relative; height: 220px; overflow: hidden; }
  .bg-blur-cover { width: 100%; height: 100%; object-fit: cover; filter: blur(10px); opacity: 0.5; }
  .covers-wrapper { position: absolute; bottom: 0; width: 100%; display: flex; justify-content: center; gap: 10px; padding-bottom: 10px; }
  .main-cover-img { width: 100px; height: 150px; border-radius: 6px; border: 1px solid white; transform: rotate(-5deg); }
  .season-cover-img { width: 110px; height: 160px; border-radius: 6px; border: 1px solid var(--neon-cyan); transform: rotate(5deg) translateY(10px); z-index: 2; }
  .event-close { 
    position: absolute; top: 10px; right: 10px; z-index: 100;
    background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer;
  }
  .event-inner { padding: 20px; text-align: center; background: linear-gradient(to bottom, #101014, #000); }
  .event-title { font-family: 'Orbitron'; font-size: 1.2rem; color: white; margin-bottom: 5px; }
  .event-btn {
    margin-top: 15px; width: 100%; padding: 12px; border-radius: 30px;
    background: var(--neon-purple); color: white; font-weight: bold; border: none;
    box-shadow: 0 0 15px rgba(188, 19, 254, 0.5); cursor: pointer;
  }

  /* --- MODAL iOS --- */
  .ios-modal { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 320px; background: rgba(30,30,30,0.95); border: 1px solid #444; border-radius: 12px; padding: 20px; z-index: 10000; text-align: center; color: #fff; }
  .ios-close { position: absolute; top: 5px; right: 10px; font-size: 1.5rem; cursor: pointer; }

  /* --- ANIMACIONES GLITCH --- */
  @keyframes glitch {
    0% { text-shadow: 2px 2px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan); }
    50% { text-shadow: -2px 2px 0px var(--neon-purple), 2px -2px 0px var(--neon-cyan); }
    100% { text-shadow: 2px 2px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan); }
  }
  @keyframes loadLine { to { width: 100%; } }
  @keyframes pulseGlow {
    0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
  }

  /* --- RESPONSIVE --- */
  @media (max-width: 768px) {
    .cyber-nav { flex-wrap: wrap; height: auto; padding: 15px; gap: 10px; }
    .nav-logo { order: 1; flex: 1; }
    .nav-actions { order: 2; }
    .search-wrapper { order: 3; width: 100%; max-width: 100%; margin: 10px 0 0; }
    .controls-container { flex-direction: column; padding: 10px 20px; }
    select { width: 100%; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .notif-dropdown { position: fixed; top: 70px; left: 10px; right: 10px; width: auto; }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

</style>
</head>

  <script>
    // --- SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(registration => console.log('SW registrado: ', registration.scope))
                .catch(err => console.log('SW fallo: ', err));
        });
    }

    // --- LOGICA DE INSTALACION (PWA HANDLER) ---
    // (Integrada aquí para no depender de archivo externo extra)
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const iosModal = document.getElementById('iosInstallModal');
    
    const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);
    const isMobile = () => window.matchMedia('(max-width: 780px)').matches;

    function checkInstallButtonVisibility() {
        if (isMobile() && !isInStandaloneMode()) {
            installBtn.style.display = 'flex';
        } else {
            installBtn.style.display = 'none';
        }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      checkInstallButtonVisibility();
    });

    installBtn.addEventListener('click', () => {
        if (isIos()) {
            iosModal.style.display = 'block';
        } else if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                deferredPrompt = null;
            });
        } else {
            alert("¡Ya la tienes! 😄\nLa app ya está instalada o tu navegador no soporta instalación directa.");
        }
    });

    function closeIosModal() { iosModal.style.display = 'none'; }
    window.addEventListener('DOMContentLoaded', checkInstallButtonVisibility);

    // --- LOADER HIDE ---
    window.addEventListener('load', () => {
      const loader = document.getElementById('page-loader');
      setTimeout(() => { 
        loader.style.opacity = '0'; 
        setTimeout(() => loader.style.visibility = 'hidden', 500);
      }, 800);
    });

    // --- FUNCION EXTRA PARA EFECTO TILT EN CARTAS GENERADAS POR JS ---
    // Como el script-index.js inserta las cards dinámicamente, observamos el grid
    const gridObserver = new MutationObserver(() => {
       document.querySelectorAll('.card').forEach(card => {
          if(card.dataset.tiltInitialized) return;
          card.dataset.tiltInitialized = "true";
          
          card.addEventListener('mousemove', (e) => {
             const rect = card.getBoundingClientRect();
             const x = e.clientX - rect.left;
             const y = e.clientY - rect.top;
             const centerX = rect.width / 2;
             const centerY = rect.height / 2;
             const rotateX = ((y - centerY) / centerY) * -10;
             const rotateY = ((x - centerX) / centerX) * 10;
             card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
          });
          card.addEventListener('mouseleave', () => {
             card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
          });
       });
    });
    const gridEl = document.getElementById('grid');
    if(gridEl) gridObserver.observe(gridEl, { childList: true });
  </script>

</body>
</html>
