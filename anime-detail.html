  <script>
    (function() {
      const colors = ["#00f3ff", "#0066ff", "#bc13fe", "#ff0055", "#bc13fe", "#0066ff", "#00f3ff"];
      const animationDuration = 20000;
      const segments = colors.length - 1;
      
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = "theme-color";
        document.head.appendChild(metaTag);
      }

      const hexToRgb = (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      };
      
      const rgbToHex = (r, g, b) => "#" + [r, g, b].map(x => Math.round(x).toString(16).padStart(2,'0')).join('');
      const lerp = (start, end, t) => start + (end - start) * t;

      let startTimestamp = null;
      let lastUpdate = 0;

      function step(timestamp) {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = timestamp - startTimestamp;
        
        // Limitar la actualización del DOM (meta tag) a ~10 fps para evitar lag en dispositivos móviles
        if (timestamp - lastUpdate > 100) {
          let currentProgress = (progress / animationDuration) * segments;
          currentProgress %= segments;
          
          const index = Math.floor(currentProgress);
          const t = currentProgress - index;
          const colorStart = hexToRgb(colors[index]);
          const colorEnd = hexToRgb(colors[index + 1]);
          
          const r = lerp(colorStart[0], colorEnd[0], t);
          const g = lerp(colorStart[1], colorEnd[1], t);
          const b = lerp(colorStart[2], colorEnd[2], t);
          
          metaTag.setAttribute('content', rgbToHex(r, g, b));
          lastUpdate = timestamp;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>

  <style>
    /* ---------------------------

    --------------------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --neon-yellow: #f1c40f;

      --header-height: 72px;
      --glow-intensity: 0.6;
      --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      background: transparent;
      scroll-behavior: smooth;
    }

    /* Fondo vídeo - Optimizado con Hardware Acceleration */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      background: url('galaxia-morado1.avif') center/cover no-repeat;
      opacity: 1;
      transition: opacity 1.2s ease;
      pointer-events: none;
      filter: contrast(1.2) brightness(0.7) saturate(1.1);
      /* Forzar GPU */
      transform: translateZ(0); 
      will-change: opacity;
    }
    #bg-video.loaded { opacity: 1; }
    
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 30% 40%, rgba(188, 19, 254, 0.12) 0%, rgba(0,0,0,0.85) 90%);
      z-index: -1;
      pointer-events: none;
      transform: translateZ(0);
    }
    
    #scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 6px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.25;
      transform: translateZ(0);
    }

    /* Pantalla de carga */
    #loading-screen {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: #000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: opacity 0.5s;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      will-change: opacity;
    }
    .loader-glitch {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 8px;
      color: white;
      text-shadow: 0 0 20px var(--neon-cyan);
      animation: pulseText 1.2s infinite;
      transform: translateZ(0);
    }
    .loader-sub {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--neon-purple);
      letter-spacing: 4px;
      margin-top: 20px;
    }
    @keyframes pulseText {
      0%,100% { opacity: 0.8; text-shadow: 0 0 20px var(--neon-cyan); }
      50% { opacity: 0.4; text-shadow: 0 0 5px var(--neon-purple); }
    }

    /* --- CONTENEDOR PRINCIPAL --- */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 100px auto 60px;
      padding: 25px 30px;
      background: rgba(5, 5, 10, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 0 1px rgba(0, 243, 255, 0.1) inset;
      transition: all 0.3s ease;
      animation: fadeInUp 0.6s var(--transition-smooth);
      transform: translateZ(0); /* Forzar aceleración GPU en móvil */
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- TOP BUTTONS (mejorado para móvil) --- */
    .top-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin: -25px -30px 25px -30px;

      background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(188, 19, 254, 0.1));

      border-radius: 24px 24px 0 0;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

      align-items: center;
      gap: 8px;

    /* Recomendaciones */

      margin-top: 40px;

      border-top: 1px solid rgba(0,243,255,0.3);
    }
    .rec-title {

      margin-bottom: 20px;

      letter-spacing: 1px;
      border-left: 4px solid var(--neon-pink);
      padding-left: 15px;
    }
    .rec-grid {
      display: grid;
      gap: 15px;
    }
    @media (min-width: 1200px) {
      .rec-grid { grid-template-columns: repeat(6, 1fr); }
    }
    @media (min-width: 768px) and (max-width: 1199px) {
      .rec-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 767px) {
      .rec-grid { grid-template-columns: repeat(2, 1fr); }
      .video-list { grid-template-columns: repeat(2, 1fr); }

      .star { font-size: 1.5rem; }

      border-radius: 12px;
      overflow: hidden;
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid rgba(188,19,254,0.3);
      will-change: transform;

    .rec-card p {

      font-size: 0.8rem;
      font-weight: 500;
      color: #eee;
    }
    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0a0a0f;
      border: 1px solid var(--neon-cyan);
      border-radius: 40px;
      padding: 10px 24px;
      color: var(--neon-cyan);
      font-weight: bold;
      display: none;
      z-index: 9999;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0,243,255,0.3);
    }

<script>
  // ---------- SONIDOS UI ----------
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playUISound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'hover') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now+0.05);
      gain.gain.setValueAtTime(0.02, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.05);
      osc.start(now);
      osc.stop(now+0.05);
    } else if (type === 'click') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(100, now+0.1);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.1);
      osc.start(now);
      osc.stop(now+0.1);
    }
  }

  // ---------- CARGA INICIAL ----------
  window.addEventListener('load', () => {
    if (typeof audioPlaylists === 'undefined' && typeof musica !== 'undefined') window.audioPlaylists = musica;
    const screen = document.getElementById('loading-screen');
    screen.style.opacity = '0';
    setTimeout(() => screen.style.display = 'none', 500);
    const bgVideo = document.getElementById('bg-video');
    bgVideo.play().catch(()=>{});
  });

  // ---------- MÚSICA DE FONDO ----------
  let currentAudio = null, playlist = [], currentTrackIndex = -1;
  function playTrack(idx) {
    if (currentAudio) { currentAudio.pause(); currentAudio.onended = null; }
    currentAudio = new Audio(playlist[idx]);
    currentAudio.volume = 0.3;
    currentAudio.loop = false;
    currentAudio.onended = () => {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      playTrack(currentTrackIndex);
    };
    currentAudio.play().catch(e=>console.log);
  }
  document.addEventListener('click', () => {
    if (typeof audioPlaylists === 'undefined' && typeof musica !== 'undefined') window.audioPlaylists = musica;
    if (typeof audioPlaylists !== 'undefined' && !currentAudio) {
      const id = new URLSearchParams(location.search).get('id');
      if (audioPlaylists[id]?.length) {
        playlist = audioPlaylists[id];
        currentTrackIndex = Math.floor(Math.random() * playlist.length);
        playTrack(currentTrackIndex);
      }
    }
  }, { once: true });

  // ---------- HISTORIAL DE VISUALIZACIÓN ----------
  let currentUserId = null, currentAnimeId = null, authReady = false;
  function getLocalKey(animeId, s, e) { return `watched_${animeId}_${s}_${e}`; }
  function showToast(msg, isError = false) {
    let toast = document.getElementById('toast');
    if (!toast) { toast = document.createElement('div'); toast.id = 'toast'; toast.className = 'toast'; document.body.appendChild(toast); }
    toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
  }
  async function markEpisodeWatched(animeId, s, e) {
    if (currentUserId) {
      const docRef = db.collection('watchHistory').doc(currentUserId);
      const doc = await docRef.get();
      let data = doc.exists ? doc.data() : {};
      if (!data[animeId]) data[animeId] = {};
      if (!data[animeId][s]) data[animeId][s] = [];
      if (!data[animeId][s].includes(e)) data[animeId][s].push(e);
      await docRef.set(data, { merge: true });
      showToast('Episodio marcado como visto');
    } else {
      localStorage.setItem(getLocalKey(animeId, s, e), 'true');
      showToast('Episodio marcado (local)');
    }
  }
  async function removeEpisodeWatched(animeId, s, e) {
    if (currentUserId) {
      const docRef = db.collection('watchHistory').doc(currentUserId);
      const doc = await docRef.get();
      if (doc.exists) {
        let data = doc.data();
        if (data[animeId]?.[s]) {
          data[animeId][s] = data[animeId][s].filter(n => n !== e);
          if (data[animeId][s].length === 0) delete data[animeId][s];
          if (Object.keys(data[animeId]).length === 0) delete data[animeId];
          await docRef.set(data);
          showToast('Episodio eliminado');
        }
      }
    } else {
      localStorage.removeItem(getLocalKey(animeId, s, e));
      showToast('Episodio eliminado (local)');
    }
  }
  async function loadWatchedEpisodes(animeId) {
    if (currentUserId) {
      const doc = await db.collection('watchHistory').doc(currentUserId).get();
      return doc.exists ? (doc.data()[animeId] || {}) : {};
    } else {
      const watched = {};
      const len = localStorage.length;
      for (let i=0; i<len; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(`watched_${animeId}_`)) {
          const parts = key.split('_');
          const s = parseInt(parts[2]), e = parseInt(parts[3]);
          if (!watched[s]) watched[s] = [];
          watched[s].push(e);
        }
      }
      return watched;
    }
  }
  async function reloadSeason(details, animeId, seasonIdx) {
    if (!details || !details.open) return;
    const list = details.querySelector('.video-list');
    if (list) { list.innerHTML = ''; await toggleSeason(details, animeId, seasonIdx); }
  }

  // ---------- RENDERIZADO PRINCIPAL ----------
  if (typeof data === 'undefined') {
    document.getElementById('contenido').innerHTML = "<h2 style='text-align:center;padding:50px;color:red;'>Error: No se pudo cargar anime-detail-data.js</h2>";
  } else {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const anime = data[id];
    const container = document.getElementById('contenido');
    currentAnimeId = id;
    if (anime) {
      document.title = `${anime.title} - Archinime OS`;
      let genreHtml = '';
      let initialRating = 0;
      if (typeof animes !== 'undefined') {
        const info = animes.find(a => String(a.id) === String(id));
        if (info?.genres) genreHtml = info.genres.map(g => `<span class="genre-chip">${escapeHtml(g)}</span>`).join('');
        if (info?.rating) initialRating = info.rating;
      }
      let ratingDisplay = initialRating ? initialRating.toFixed(1) : '--';
      let voteCountDisplay = '(0 votos)';
      
      let html = `
        <div class="anime-cover"><img src="${anime.cover}" alt="cover" loading="lazy" decoding="async"></div>
        <h1>${anime.title}</h1>
        <div class="genres-wrap">${genreHtml || '<span class="genre-chip">Sin géneros</span>'}</div>
        <p class="desc">${anime.desc}</p>
        <div class="rating-section">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
            <div class="rating-stats">
              <span id="ratingLabel">Valoración media:</span>
              <span id="averageRatingDisplay">${ratingDisplay}</span>
              <span id="voteCountDisplay">${voteCountDisplay}</span>
            </div>
            <div id="starRatingWidget" style="display:flex; gap:8px;"></div>
          </div>
          <div id="ratingMessage"></div>
        </div>
      `;
      if (anime.seasons) {
        anime.seasons.forEach((s, idx) => {
          html += `
            <details data-season-index="${idx}" data-anime-id="${id}">
              <summary>${s.name || 'Temporada ' + s.num}</summary>
              <div class="season-content">
                ${s.cover ? `<img src="${s.cover}" style="width:100%; border-radius:12px; margin-bottom:15px;" loading="lazy" decoding="async">` : ''}
                <div class="video-list" id="list-${idx}"></div>
                <div id="loading-${idx}" style="display:none; text-align:center; padding:10px;">Cargando...</div>
              </div>
            </details>
          `;
        });
      }
      container.innerHTML = html;
      renderRecommendations(id);
      (async () => {
        await loadAnimeRating(id);
        if (currentUserId) await loadUserRating(id, currentUserId);
        if (animeRatingData.avg !== initialRating) updateRatingDisplay();
      })();
    } else {
      container.innerHTML = "<h2 style='text-align:center;padding:50px;'>Anime no encontrado</h2>";
    }
  }

  // Función para actualizar el texto de valoración según el promedio
  function updateRatingLabel(avg) {
    const labelSpan = document.getElementById('ratingLabel');
    if (!labelSpan) return;
    let text = 'Valoración media:';
    let color = '#ccc';
    if (avg >= 1 && avg <= 2.9) {
      text = '⭐ Valoración baja';
      color = '#ff8888';
    } else if (avg >= 3 && avg <= 4.0) {
      text = '👍 Valoración media';
      color = '#ffcc88';
    } else if (avg >= 4.1 && avg <= 5) {
      text = '🔥 Valoración alta';
      color = '#ffaa44';
    }
    labelSpan.innerHTML = text;
    labelSpan.style.color = color;
  }

  window.toggleSeason = async function(details, animeId, seasonIdx) {
    if (!details.open) return;
    playUISound('click');
    const list = details.querySelector('.video-list');
    if (list.children.length) return;
    const loading = details.querySelector(`#loading-${seasonIdx}`);
    if (loading) loading.style.display = 'block';
    const episodes = data[animeId].seasons[seasonIdx].eps;
    const total = episodes.length;
    const seasonNum = data[animeId].seasons[seasonIdx].num;
    let watched = await loadWatchedEpisodes(animeId);
    let processed = 0;
    const CHUNK = 30;
    
    function chunk() {
      const frag = document.createDocumentFragment();
      const end = Math.min(processed+CHUNK, total);
      for (let i=processed; i<end; i++) {
        const ep = episodes[i];
        const epNum = i+1;
        const isWatched = watched[seasonNum]?.includes(epNum);
        const btn = document.createElement('a');
        btn.href = `video-player.html?anime=${animeId}&s=${seasonNum}&e=${epNum}`;
        btn.className = 'ep-btn' + (isWatched ? ' watched' : '');
        btn.onmouseenter = () => playUISound('hover');
        
        const action = document.createElement('button');
        action.className = 'ep-action-btn';
        action.innerHTML = isWatched ? '<i class="fas fa-trash-alt"></i>' : '<i class="fas fa-check-circle"></i>';
        action.onclick = async (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (isWatched) await removeEpisodeWatched(animeId, seasonNum, epNum);
          else await markEpisodeWatched(animeId, seasonNum, epNum);
          await reloadSeason(details, animeId, seasonIdx);
        };
        btn.appendChild(action);
        
        const span = document.createElement('span');
        span.textContent = `▶ ${ep.title}`;
        btn.appendChild(span);
        if (isWatched) {
          const tag = document.createElement('div');
          tag.className = 'watched-tag';
          tag.innerHTML = '<i class="fas fa-check"></i> VISTO';
          btn.appendChild(tag);
        }
        frag.appendChild(btn);
      }
      list.appendChild(frag);
      processed += CHUNK;
      if (processed < total) requestAnimationFrame(chunk);
      else if (loading) loading.style.display = 'none';
    }
    requestAnimationFrame(chunk);
  };

  function attachDetails() {
    document.querySelectorAll('details').forEach(d => {
      if (d.hasAttribute('data-listener')) return;
      d.setAttribute('data-listener', 'true');
      const animeId = d.dataset.animeId;
      const idx = d.dataset.seasonIndex;
      if (animeId && idx) d.ontoggle = () => toggleSeason(d, animeId, parseInt(idx));
    });
  }
  const observer = new MutationObserver(attachDetails);
  observer.observe(document.getElementById('contenido'), { childList: true, subtree: true });
  attachDetails();

  document.getElementById('share-detail')?.addEventListener('click', () => {
    playUISound('click');
    navigator.clipboard.writeText(location.href);
    showToast('Enlace copiado');
  });

  function renderRecommendations(currentId) {
    const grid = document.getElementById('rec-grid');
    const keys = Object.keys(data).filter(k => k != currentId);
    const random = keys.sort(()=>0.5-Math.random()).slice(0,12);
    if (!random.length) { grid.innerHTML = '<p style="color:#666;">Sin recomendaciones</p>'; return; }
    grid.innerHTML = random.map(k => `
      <div class="rec-card" onclick="playUISound('click'); location.href='anime-detail.html?id=${k}'" onmouseenter="playUISound('hover')">
        <img src="${data[k].cover}" alt="${data[k].title}" loading="lazy" decoding="async">
        <p>${data[k].title}</p>
      </div>
    `).join('');
  }
  function escapeHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---------- BÚSQUEDA RÁPIDA CON DROPDOWN FLOTANTE (FIX MÓVIL Y OPTIMIZADA) ----------
  if (typeof data !== 'undefined') {
    const searchInput = document.getElementById('quick-search');
    let floatingDropdown = null;
    let isScrolling = false;

    function createFloatingDropdown() {
      if (floatingDropdown) floatingDropdown.remove();
      floatingDropdown = document.createElement('div');
      floatingDropdown.className = 'floating-dropdown';
      document.body.appendChild(floatingDropdown);
      return floatingDropdown;
    }

    function updateDropdownPosition() {
      if (!floatingDropdown || floatingDropdown.style.display === 'none') return;
      const rect = searchInput.getBoundingClientRect();
      let top = rect.bottom + window.scrollY + 5;
      let left = rect.left + window.scrollX;
      
      const dropdownWidth = floatingDropdown.offsetWidth;
      const viewportWidth = window.innerWidth;
      
      if (left + dropdownWidth > viewportWidth - 10) {
        left = viewportWidth - dropdownWidth - 10;
      }
      if (left < 10) left = 10;
      
      floatingDropdown.style.top = top + 'px';
      floatingDropdown.style.left = left + 'px';
      
      if (window.innerWidth <= 768) {
        floatingDropdown.style.width = '90%';
        floatingDropdown.style.left = '5%';
        floatingDropdown.style.right = '5%';
      } else {
        floatingDropdown.style.width = rect.width + 'px';
      }
    }

    function showDropdown(results) {
      if (!floatingDropdown) createFloatingDropdown();
      if (!results.length) {
        floatingDropdown.style.display = 'none';
        return;
      }
      floatingDropdown.innerHTML = results.map(item => `
        <div class="search-item" data-id="${item.id}">
          <img src="${item.cover}" loading="lazy" decoding="async">
          <div class="search-item-info">
            <span class="search-item-title">${item.title}</span>
          </div>
        </div>
      `).join('');
      
      floatingDropdown.querySelectorAll('.search-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          window.location.href = `anime-detail.html?id=${id}`;
        });
        el.addEventListener('mouseenter', () => playUISound('hover'));
      });
      
      updateDropdownPosition();
      floatingDropdown.style.display = 'block';
    }

    function hideDropdown() {
      if (floatingDropdown) floatingDropdown.style.display = 'none';
    }

    searchInput.addEventListener('input', function() {
      const q = this.value.toLowerCase().trim();
      if (!q) {
        hideDropdown();
        return;
      }
      const currentId = new URLSearchParams(location.search).get('id');
      const matches = Object.entries(data)
        .filter(([id, a]) => a.title.toLowerCase().startsWith(q) && id !== currentId)
        .map(([id, a]) => ({ id, title: a.title, cover: a.cover }));
      showDropdown(matches);
    });

    // Eventos pasivos y debounced con requestAnimationFrame para evitar lag al scrollear
    const scrollHandler = () => {
      if (!isScrolling) {
        window.requestAnimationFrame(() => {
          updateDropdownPosition();
          isScrolling = false;
        });
        isScrolling = true;
      }
    };

    window.addEventListener('resize', scrollHandler, { passive: true });
    window.addEventListener('scroll', scrollHandler, { passive: true });
    
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !floatingDropdown?.contains(e.target)) {
        hideDropdown();
      }
    });
    
    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim()) searchInput.dispatchEvent(new Event('input'));
    });
  }

  // ---------- AUTENTICACIÓN Y RECARGA ----------
  auth.onAuthStateChanged(async (user) => {
    currentUserId = user ? user.uid : null;
    authReady = true;
    if (currentAnimeId && data[currentAnimeId]) {
      const details = document.querySelectorAll('details');
      for (let d of details) {
        if (d.open) {
          const aid = d.dataset.animeId;
          const sidx = d.dataset.seasonIndex;
          if (aid && sidx) await reloadSeason(d, aid, parseInt(sidx));
        }
      }
      if (typeof loadUserRating === 'function') {
        await loadUserRating(currentAnimeId, currentUserId);
        if (typeof renderStars === 'function') renderStars(currentUserRating || 0);
      }
    }
  });

  window.addEventListener('pageshow', async () => {
    if (currentAnimeId && data[currentAnimeId]) {
      const details = document.querySelectorAll('details');
      for (let d of details) {
        if (d.open) {
          const aid = d.dataset.animeId;
          const sidx = d.dataset.seasonIndex;
          if (aid && sidx) await reloadSeason(d, aid, parseInt(sidx));
        }
      }
    }
  });

  // ---------- SISTEMA DE VOTACIÓN CON TOGGLE Y VALORACIÓN DINÁMICA ----------
  let currentUserRating = null;
  let animeRatingData = { avg: 0, count: 0 };
  
  async function loadAnimeRating(animeId) {
    const doc = await db.collection('animeRatings').doc(String(animeId)).get();
    if (doc.exists) {
      animeRatingData = doc.data();
    } else {
      if (typeof animes !== 'undefined') {
        const info = animes.find(a => String(a.id) === String(animeId));
        if (info?.rating) {
          animeRatingData = { avg: info.rating, count: 1 };
          await db.collection('animeRatings').doc(String(animeId)).set({ avg: info.rating, count: 1, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        }
      }
    }
    updateRatingDisplay();
    updateRatingLabel(animeRatingData.avg);
  }

  function updateRatingDisplay() {
    const avgSpan = document.getElementById('averageRatingDisplay');
    const countSpan = document.getElementById('voteCountDisplay');
    if (avgSpan) avgSpan.textContent = animeRatingData.avg.toFixed(1);
    if (countSpan) countSpan.textContent = `(${animeRatingData.count} ${animeRatingData.count === 1 ? 'voto' : 'votos'})`;
    updateRatingLabel(animeRatingData.avg);
  }

  function renderStars(currentValue = 0) {
    const container = document.getElementById('starRatingWidget');
    if (!container) return;
    container.innerHTML = '';
    for (let i=1; i<=5; i++) {
      const star = document.createElement('i');
      star.className = 'fas fa-star star';
      if (currentValue >= i) star.classList.add('selected');
      star.setAttribute('data-value', i);
      if (!currentUserId) star.classList.add('disabled');
      else {
        star.addEventListener('mouseenter', () => highlightStars(i));
        star.addEventListener('mouseleave', () => resetStars(currentUserRating || 0));
        star.addEventListener('click', () => voteAnime(i));
      }
      container.appendChild(star);
    }
  }

  function highlightStars(val) {
    document.querySelectorAll('#starRatingWidget .star').forEach((s, idx) => { if (idx < val) s.classList.add('hover'); else s.classList.remove('hover'); });
  }

  function resetStars(val) {
    document.querySelectorAll('#starRatingWidget .star').forEach((s, idx) => {
      s.classList.remove('hover');
      if (idx < val) s.classList.add('selected'); else s.classList.remove('selected');
    });
  }

  async function voteAnime(newVal) {
    if (!currentUserId) {
      document.getElementById('ratingMessage').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Inicia sesión para votar.';
      return;
    }
    const animeId = currentAnimeId;
    const ratingRef = db.collection('animeRatings').doc(String(animeId));
    const userRef = ratingRef.collection('userRatings').doc(currentUserId);
    
    try {
      await db.runTransaction(async (t) => {
        const ratingDoc = await t.get(ratingRef);
        const userDoc = await t.get(userRef);
        let oldValue = userDoc.exists ? userDoc.data().value : null;
        let newAvg = animeRatingData.avg;
        let newCount = animeRatingData.count;
        
        if (oldValue !== null && oldValue === newVal) {
          if (newCount > 1) {
            newAvg = (newAvg * newCount - oldValue) / (newCount - 1);
            newCount--;
          } else {
            newAvg = 0;
            newCount = 0;
          }
          t.delete(userRef);
          if (newCount === 0) {
            t.delete(ratingRef);
            animeRatingData = { avg: 0, count: 0 };
            currentUserRating = null;
          } else {
            t.set(ratingRef, { avg: newAvg, count: newCount, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
            animeRatingData = { avg: newAvg, count: newCount };
            currentUserRating = null;
          }
          document.getElementById('ratingMessage').innerHTML = '<i class="fas fa-info-circle"></i> Has eliminado tu voto.';
        } 
        else {
          if (oldValue !== null) {
            newAvg = (newAvg * newCount - oldValue + newVal) / newCount;
          } else {
            newAvg = (newAvg * newCount + newVal) / (newCount + 1);
            newCount++;
          }
          t.set(ratingRef, { avg: newAvg, count: newCount, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          t.set(userRef, { value: newVal, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
          animeRatingData = { avg: newAvg, count: newCount };
          currentUserRating = newVal;
          document.getElementById('ratingMessage').innerHTML = '<i class="fas fa-check-circle"></i> ¡Gracias por tu voto!';
        }
      });
      updateRatingDisplay();
      renderStars(currentUserRating || 0);
      setTimeout(() => {
        const msg = document.getElementById('ratingMessage');
        if (msg.innerHTML.includes('Gracias') || msg.innerHTML.includes('eliminado')) {
          msg.innerHTML = '';
        }
      }, 3000);
    } catch(e) { 
      console.error(e); 
      document.getElementById('ratingMessage').innerHTML = '<i class="fas fa-times-circle"></i> Error al procesar el voto.';
    }
  }

  async function loadUserRating(animeId, userId) {
    if (!userId) return;
    const doc = await db.collection('animeRatings').doc(String(animeId)).collection('userRatings').doc(userId).get();
    currentUserRating = doc.exists ? doc.data().value : null;
    renderStars(currentUserRating || 0);
  }
</script>
</body>
