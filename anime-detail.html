<script>
  (function() {
    // PALETA "SYNTHWAVE": Solo colores fríos y neones que combinan con la galaxia
    const colors = [
      "#00f3ff", "#0066ff", "#bc13fe", 
      "#ff0055", "#bc13fe", "#0066ff", "#00f3ff" 
    ];

    const animationDuration = 20000; 
    const intervalTime = 20; 
    const segments = colors.length - 1;
    const step = (intervalTime / animationDuration) * segments;

    let currentProgress = 0;
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if (!metaTag) {
      metaTag = document.createElement('meta');
      metaTag.name = "theme-color";
      document.head.appendChild(metaTag);
    }

    const hexToRgb = (hex) => {
      const bigint = parseInt(hex.slice(1), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    };
    const rgbToHex = (r, g, b) => {
      return "#" + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join('');
    };

    const lerp = (start, end, t) => start + (end - start) * t;
    setInterval(() => {
      currentProgress += step;
      if (currentProgress >= segments) {
        currentProgress = currentProgress % segments;
      }

      const index = Math.floor(currentProgress);
      const t = currentProgress - index;
      const colorStart = hexToRgb(colors[index]);
      const colorEnd = hexToRgb(colors[index + 1]);

      const r = lerp(colorStart[0], colorEnd[0], t);
      const g = lerp(colorStart[1], colorEnd[1], t);
      const b = lerp(colorStart[2], colorEnd[2], t);

      metaTag.setAttribute('content', rgbToHex(r, g, b));
    }, intervalTime);
  })();
</script>

  <script>
    /* ----------------------------------------------------
       0. SINTETIZADOR WEB AUDIO API (Sonidos UI)
       ---------------------------------------------------- */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playUISound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'hover') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, now);
            oscillator.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
            gainNode.gain.setValueAtTime(0.02, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            oscillator.start(now);
            oscillator.stop(now + 0.05);
        } else if (type === 'click') {
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(300, now);
            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            oscillator.start(now);
            oscillator.stop(now + 0.1);
        }
    }

    /* ----------------------------------------------------
       1. Gestión de Carga
       ---------------------------------------------------- */
    window.addEventListener('load', () => {
        if (typeof audioPlaylists === 'undefined' && typeof musica !== 'undefined') 
        {
            window.audioPlaylists = musica;
        }
 
        const screen = document.getElementById('loading-screen');
        screen.style.opacity = '0';
        setTimeout(() => { screen.style.display = 'none'; }, 500);
    });

    /* ----------------------------------------------------
       2. Lógica de Audio (BGM)
       ---------------------------------------------------- */
    let currentAudio = null;
    let playlist = [];
    let currentTrackIndex = -1;

    function playTrack(index) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.onended = null;
        }

        const trackUrl = playlist[index];
        currentAudio = new Audio(trackUrl);
        currentAudio.volume = 0.4;
        currentAudio.loop = false;

        currentAudio.onended = () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(currentTrackIndex);
        };

        currentAudio.play().catch(e => console.log("Reproducción automática bloqueada o error:", e));
    }

    document.addEventListener('click', () => {
        if (typeof audioPlaylists === 'undefined' && typeof musica !== 'undefined') {
            window.audioPlaylists = musica;
        }

        if (typeof audioPlaylists === 'undefined' || currentAudio) return;
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        
         if (audioPlaylists[id] && audioPlaylists[id].length > 0) {
            playlist = audioPlaylists[id];
            currentTrackIndex = Math.floor(Math.random() * playlist.length);
            playTrack(currentTrackIndex);
        }
    }, { once: true });

    /* ----------------------------------------------------
       3. FUNCIONES DE HISTORIAL (Firestore + LocalStorage) - CORREGIDAS
       ---------------------------------------------------- */
    let currentUserId = null;        // uid del usuario logueado, null si invitado
    let currentAnimeId = null;       // id del anime actual
    let authReady = false;            // Para saber si ya se resolvió la autenticación inicial

    // Obtener la clave local para un episodio (invitado)
    function getLocalKey(animeId, seasonNum, epNum) {
        return `watched_${animeId}_${seasonNum}_${epNum}`;
    }

    // Mostrar toast (asegurar que existe)
    function showToast(msg, isError = false) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    // Marcar como visto (local o cloud)
    async function markEpisodeWatched(animeId, seasonNum, epNum) {
        console.log('markEpisodeWatched called', { animeId, seasonNum, epNum, currentUserId });
        if (currentUserId) {
            try {
                const docRef = db.collection('watchHistory').doc(currentUserId);
                const doc = await docRef.get();
                let data = doc.exists ? doc.data() : {};
                let animeData = data[animeId] || {};
                let seasonData = animeData[seasonNum] || [];
                if (!seasonData.includes(epNum)) {
                    seasonData.push(epNum);
                    animeData[seasonNum] = seasonData;
                    data[animeId] = animeData;
                    await docRef.set(data, { merge: true });
                    console.log('Marcado en Firestore');
                    showToast('Episodio marcado como visto', false);
                } else {
                    console.log('Ya estaba marcado en Firestore');
                    showToast('Ya estaba marcado', false);
                }
            } catch (err) {
                console.error('Error al marcar en Firestore:', err);
                showToast('Error al marcar: ' + err.message, true);
            }
        } else {
            const key = getLocalKey(animeId, seasonNum, epNum);
            localStorage.setItem(key, 'true');
            console.log('Marcado en localStorage');
            showToast('Episodio marcado como visto (local)', false);
        }
    }

    // Eliminar un episodio del historial (local o cloud)
    async function removeEpisodeWatched(animeId, seasonNum, epNum) {
        console.log('removeEpisodeWatched called', { animeId, seasonNum, epNum, currentUserId });
        if (currentUserId) {
            try {
                const docRef = db.collection('watchHistory').doc(currentUserId);
                const doc = await docRef.get();
                if (doc.exists) {
                    let data = doc.data();
                    if (data[animeId]?.[seasonNum]) {
                        data[animeId][seasonNum] = data[animeId][seasonNum].filter(n => n !== epNum);
                        if (data[animeId][seasonNum].length === 0) {
                            delete data[animeId][seasonNum];
                        }
                        if (Object.keys(data[animeId]).length === 0) {
                            delete data[animeId];
                        }
                        await docRef.set(data, { merge: true });
                        console.log('Eliminado de Firestore');
                        showToast('Episodio eliminado del historial', false);
                    }
                }
            } catch (err) {
                console.error('Error al eliminar de Firestore:', err);
                showToast('Error al eliminar: ' + err.message, true);
            }
        } else {
            const key = getLocalKey(animeId, seasonNum, epNum);
            localStorage.removeItem(key);
            console.log('Eliminado de localStorage');
            showToast('Episodio eliminado del historial (local)', false);
        }
    }

    // Cargar episodios vistos con timeout mejorado
    async function loadWatchedEpisodes(animeId) {
        if (currentUserId) {
            try {
                const docRef = db.collection('watchHistory').doc(currentUserId);
                // Timeout de 8 segundos
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('Timeout cargando historial')), 8000)
                );
                const doc = await Promise.race([docRef.get(), timeoutPromise]);
                if (doc.exists) {
                    const data = doc.data();
                    return data[animeId] || {};
                }
                return {};
            } catch (error) {
                console.warn('Error loading watched episodes from Firestore:', error);
                showToast('No se pudo cargar el historial desde la nube, usando modo local', true);
                return {};
            }
        } else {
            const watched = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(`watched_${animeId}_`)) {
                    const parts = key.split('_');
                    const season = parseInt(parts[2]);
                    const ep = parseInt(parts[3]);
                    if (!watched[season]) watched[season] = [];
                    watched[season].push(ep);
                }
            }
            return watched;
        }
    }

    // Función para recargar una temporada específica (sin cerrar/abrir, solo vacía y vuelve a cargar)
    async function reloadSeason(detailsElement, animeId, seasonIndex) {
        if (!detailsElement) return;
        const listContainer = detailsElement.querySelector('.video-list');
        if (listContainer) {
            // Guardar estado abierto
            const wasOpen = detailsElement.open;
            // Vaciar contenido
            listContainer.innerHTML = '';
            // Si estaba abierto, recargar llamando a toggleSeason manualmente
            if (wasOpen) {
                // Simular la apertura para que cargue de nuevo
                await toggleSeason(detailsElement, animeId, seasonIndex);
            }
        }
    }

    /* ----------------------------------------------------
       4. Renderizado y Lógica Visual (con botones dinámicos)
       ---------------------------------------------------- */
    
    if (typeof data === 'undefined') {
        document.getElementById('contenido').innerHTML = "<h2 style='text-align:center; padding:50px; color:red;'>Error: No se pudo cargar el archivo de datos (anime-detail-data.js).</h2>";
    } else {
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        const anime = data[id];
        const container = document.getElementById('contenido');
        currentAnimeId = id;

        if (anime) {
            document.title = `Ver ${anime.title} Online - Archinime OS`;
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
                metaDesc.setAttribute('content', `Disfruta de ${anime.title} en HD. ${anime.desc.substring(0, 140)}... Véalo gratis en Archinime.`);
            }

            const ogTitle = document.querySelector('meta[property="og:title"]');
            const ogDesc = document.querySelector('meta[property="og:description"]');
            const ogImage = document.querySelector('meta[property="og:image"]');
            const ogUrl = document.querySelector('meta[property="og:url"]');

            if (ogTitle) ogTitle.setAttribute('content', `Ver ${anime.title} - Archinime`);
            if (ogDesc) ogDesc.setAttribute('content', anime.desc.substring(0, 200) + "...");
            if (ogImage) ogImage.setAttribute('content', anime.cover);
            if (ogUrl) ogUrl.setAttribute('content', window.location.href);

            let genreHtml = '';
            if (typeof animes !== 'undefined') {
                const animeInfo = animes.find(a => String(a.id) === String(id));
                if (animeInfo && animeInfo.genres && animeInfo.genres.length > 0) {
                    genreHtml = animeInfo.genres.map(g => 
                        `<span class="genre-chip">${escapeHtml(g)}</span>`
                    ).join('');
                } else {
                    genreHtml = '<span style="color:#aaa; font-size:0.8rem;">Sin géneros</span>';
                }
            }

            let html = `
                <div class="anime-cover"><img src="${anime.cover}" alt="cover"></div>
                <h1>${anime.title}</h1>
                <div class="genres-wrap" id="genres-container">${genreHtml}</div>
                <p class="desc">${anime.desc}</p>
                <div class="uploader-container"></div>
            `;
            if(anime.seasons){
                anime.seasons.forEach((s, index) => {
                    html += `
                    <details data-season-index="${index}" data-anime-id="${id}">
                        <summary>${s.name || 'Temporada ' + s.num}</summary>
                         <div class="season-content">
                            ${s.cover ? `<img src="${s.cover}" loading="lazy" style="width:100%; border-radius:5px; margin-bottom:10px; display:block;">` : ''}
                            <div class="video-list" id="list-${index}"></div>
                             <div id="loading-${index}" style="display:none; text-align:center; padding:10px; color:#aaa;">Cargando...</div>
                        </div>
                    </details>`;
                });
            }
            container.innerHTML = html;
            renderRecommendations(id);
        } else {
            container.innerHTML = "<h2 style='text-align:center; padding:50px;'>Anime no encontrado o ID incorrecto.</h2>";
            document.title = "Anime No Encontrado - Archinime";
        }
    }

    // Función toggleSeason (se llama desde el atributo ontoggle o desde reloadSeason)
    window.toggleSeason = async function(details, animeId, seasonIndex) {
        if (!details.open) return;
        
        playUISound('click');

        const listContainer = details.querySelector('.video-list');
        if (listContainer.children.length > 0) return; 

        const loadingMsg = details.querySelector(`#loading-${seasonIndex}`);
        if (loadingMsg) loadingMsg.style.display = 'block';

        const episodes = data[animeId].seasons[seasonIndex].eps;
        const total = episodes.length;
        const seasonNum = data[animeId].seasons[seasonIndex].num;
        
        let watchedData = {};
        try {
            // Esperar a que la autenticación esté lista (si no, esperar un poco)
            if (!authReady && currentUserId === null) {
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            watchedData = await loadWatchedEpisodes(animeId);
            console.log('Watched data loaded:', watchedData);
        } catch (err) {
            console.warn('Error loading watched episodes:', err);
        }
        
        let processed = 0;
        const CHUNK_SIZE = 40;
        function processChunk() {
            const fragment = document.createDocumentFragment();
            const limit = Math.min(processed + CHUNK_SIZE, total);

            for (let i = processed; i < limit; i++) {
                const ep = episodes[i];
                const epNum = i+1;
                const a = document.createElement('a');
                a.href = `video-player.html?anime=${animeId}&s=${seasonNum}&e=${epNum}`;
                a.className = 'ep-btn';
                a.addEventListener('mouseenter', () => playUISound('hover'));
                
                const isWatched = watchedData[seasonNum] && watchedData[seasonNum].includes(epNum);
                console.log(`Episodio ${epNum} visto: ${isWatched}`);
                
                const actionBtn = document.createElement('button');
                actionBtn.className = 'ep-action-btn';
                if (isWatched) {
                    actionBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                    actionBtn.title = 'Borrar del historial';
                } else {
                    actionBtn.innerHTML = '<i class="fas fa-check-circle"></i>';
                    actionBtn.title = 'Marcar como visto';
                }
                
                actionBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    try {
                        if (isWatched) {
                            await removeEpisodeWatched(animeId, seasonNum, epNum);
                        } else {
                            await markEpisodeWatched(animeId, seasonNum, epNum);
                        }
                        // Recargar solo esta temporada
                        await reloadSeason(details, animeId, seasonIndex);
                    } catch (err) {
                        console.error(err);
                        showToast('Error al actualizar estado', true);
                    }
                });
                
                a.appendChild(actionBtn);
                const span = document.createElement('span');
                span.textContent = `▶ ${ep.title}`;
                a.appendChild(span);
                if (isWatched) {
                    a.classList.add('watched');
                    const tag = document.createElement('div');
                    tag.className = 'watched-tag';
                    tag.innerHTML = '<i class="fas fa-check"></i> VISTO';
                    a.appendChild(tag);
                }
                
                fragment.appendChild(a);
            }

            listContainer.appendChild(fragment);
            processed += CHUNK_SIZE;
            if (processed < total) {
                requestAnimationFrame(processChunk);
            } else {
                if (loadingMsg) loadingMsg.style.display = 'none';
            }
        }
        requestAnimationFrame(processChunk);
    };

    // Asignar event listeners a los details después de cargar
    function attachDetailsListeners() {
        const detailsList = document.querySelectorAll('details');
        detailsList.forEach(details => {
            if (details.hasAttribute('data-listener')) return;
            details.setAttribute('data-listener', 'true');
            const animeId = details.getAttribute('data-anime-id');
            const seasonIndex = details.getAttribute('data-season-index');
            if (animeId && seasonIndex) {
                details.ontoggle = () => toggleSeason(details, animeId, parseInt(seasonIndex));
            }
        });
    }

    // Esperar a que el DOM se actualice
    const observer = new MutationObserver(() => {
        attachDetailsListeners();
    });
    observer.observe(document.getElementById('contenido'), { childList: true, subtree: true });
    attachDetailsListeners();

    document.getElementById('share-detail').addEventListener('click', () => {
        playUISound('click');
        navigator.clipboard.writeText(window.location.href);
        showToast('Enlace copiado al portapapeles');
    });

    function renderRecommendations(currentId) {
        const grid = document.getElementById('rec-grid');
        const keys = Object.keys(data).filter(k => k != currentId);
        const randomKeys = keys.sort(() => 0.5 - Math.random()).slice(0, 12);
        if(randomKeys.length === 0) {
             grid.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No hay más animes cargados.</p>';
             return;
        }

        grid.innerHTML = randomKeys.map(k => `
            <div class="rec-card" onclick="playUISound('click'); location.href='anime-detail.html?id=${k}'" style="cursor:pointer" onmouseenter="playUISound('hover')">
                <img src="${data[k].cover}" alt="${data[k].title}">
                <p>${data[k].title}</p>
            </div>
        `).join('');
    }

    function escapeHtml(str){
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ----------------------------------------------------
       5. Lógica de Búsqueda Rápida
       ---------------------------------------------------- */
    if (typeof data !== 'undefined') {
        const searchInput = document.getElementById('quick-search');
        const searchResults = document.getElementById('quick-search-results');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            searchResults.innerHTML = ''; 

            if (query.length === 0) {
                searchResults.style.display = 'none';
                return;
            }

            const currentParams = new URLSearchParams(location.search);
            const currentId = currentParams.get('id');

            const matches = Object.entries(data).filter(([id, anime]) => {
                return anime.title.toLowerCase().startsWith(query) && id !== currentId;
            });

            if (matches.length > 0) {
                const html = matches.map(([id, anime]) => `
                    <a href="anime-detail.html?id=${id}" class="search-item" onmouseenter="playUISound('hover')" onclick="playUISound('click')">
                        <img src="${anime.cover}" alt="${anime.title}">
                         <div class="search-item-info">
                            <span class="search-item-title">${anime.title}</span>
                        </div>
                     </a>
                `).join('');
                searchResults.innerHTML = html;
            } else {
                searchResults.innerHTML = '<div class="search-no-results">No se encontró ningún anime.</div>';
            }
            searchResults.style.display = 'block';
        });

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.style.display = 'none';
            }
        });

        searchInput.addEventListener('focus', function() {
            if (this.value.trim().length > 0) {
                searchResults.style.display = 'block';
            }
        });
    }

    /* ----------------------------------------------------
       6. Autenticación y recarga de temporadas abiertas (MEJORADO)
       ---------------------------------------------------- */
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUserId = user.uid;
            console.log('Usuario autenticado:', currentUserId);
        } else {
            currentUserId = null;
            console.log('Usuario invitado');
        }
        authReady = true;
        
        // Si ya hay un anime cargado, recargar todas las temporadas abiertas
        if (currentAnimeId && typeof data !== 'undefined' && data[currentAnimeId]) {
            const detailsList = document.querySelectorAll('details');
            for (let detail of detailsList) {
                if (detail.open) {
                    const animeId = detail.getAttribute('data-anime-id');
                    const seasonIndex = detail.getAttribute('data-season-index');
                    if (animeId && seasonIndex) {
                        await reloadSeason(detail, animeId, parseInt(seasonIndex));
                    }
                }
            }
        }
    });
  </script>
