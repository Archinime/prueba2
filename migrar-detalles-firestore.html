<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Migración de detalles a Firestore</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Archivos de datos originales -->
    <script src="anime-detail-data.js"></script>
    <script src="video-player-data.js"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: monospace; padding: 20px; }
        button { background: #00f3ff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #log { background: #111; padding: 20px; border-radius: 8px; height: 400px; overflow-y: auto; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🚀 Migrar detalles (temporadas y episodios) a Firestore</h1>
    <button onclick="iniciarMigracion()">Iniciar Migración</button>
    <pre id="log"></pre>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBpzYARIxaJijLbbL-2S6F9MWecbAbvK_I",
            authDomain: "login-admin-archinime.firebaseapp.com",
            projectId: "login-admin-archinime",
            storageBucket: "login-admin-archinime.firebasestorage.app",
            messagingSenderId: "938164660242",
            appId: "1:938164660242:web:648e0dce0e0d18dd78d0cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const logEl = document.getElementById('log');
        function log(msg, tipo = 'info') {
            const clase = tipo === 'error' ? 'color: #ff4757' : (tipo === 'success' ? 'color: #00ff9d' : '');
            logEl.innerHTML += `<span style="${clase}">${msg}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function iniciarMigracion() {
            log('=== INICIANDO MIGRACIÓN DE DETALLES ===');
            
            if (typeof data === 'undefined') {
                log('❌ ERROR: No se encontró la variable "data" (anime-detail-data.js).', 'error');
                return;
            }
            if (typeof players === 'undefined') {
                log('❌ ERROR: No se encontró la variable "players" (video-player-data.js).', 'error');
                return;
            }

            const ids = Object.keys(data);
            log(`📦 Total de animes a procesar: ${ids.length}`);

            let procesados = 0;
            let exitos = 0;
            let errores = 0;

            for (const id of ids) {
                try {
                    const detalle = data[id];
                    const player = players[id] || {};
                    
                    // Construir el array de seasons con los episodios completos
                    const seasons = (detalle.seasons || []).map(season => {
                        const seasonPlayer = player[season.num] || {};
                        const eps = (season.eps || []).map((ep, idx) => {
                            const epNum = idx + 1;
                            const epData = seasonPlayer[epNum] || {};
                            return {
                                title: ep.title,
                                link: epData.link || '',
                                link2: epData.link2 || ''
                            };
                        });
                        return {
                            num: season.num,
                            name: season.name || `Temporada ${season.num}`,
                            cover: season.cover || '',
                            eps: eps
                        };
                    });

                    // Actualizar el documento en Firestore (merge: true para no sobrescribir otros campos)
                    await db.collection('catalogo').doc(id).set({
                        desc: detalle.desc || '',
                        seasons: seasons
                    }, { merge: true });

                    exitos++;
                    log(`✅ ID ${id}: "${detalle.title}" - ${seasons.length} temporadas actualizadas`, 'success');
                } catch (e) {
                    errores++;
                    log(`❌ Error en ID ${id}: ${e.message}`, 'error');
                }
                procesados++;
                if (procesados % 10 === 0) {
                    log(`⏳ Procesados: ${procesados}/${ids.length}`);
                }
            }

            log(`🎉 MIGRACIÓN COMPLETADA. Éxitos: ${exitos}, Errores: ${errores}`, 'success');
            log('👉 Ya puedes cerrar esta página.');
        }

        window.iniciarMigracion = iniciarMigracion;
    </script>
</body>
</html>
