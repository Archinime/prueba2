<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video</title>
    <style>
        /* Estilos generales de la página */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Fondo oscuro */
            color: #ffffff; /* Texto claro */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Contenedor del video para mantener proporciones (16:9) y hacerlo responsivo */
        .video-container {
            position: relative;
            width: 90%;
            max-width: 960px;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }

        /* Estilo del iframe incrustado */
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Visualizador de Video</h1>
    
    <div class="video-container">
        <!-- El enlace de Drive se inserta directamente en el atributo 'src' -->
        <iframe 
            src="https://drive.google.com/file/d/1pdzPraW0MjYPI-GaP6tbW_NPrtvL6rRx/preview" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
