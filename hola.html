<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Reproductor de Video - Tamaño Completo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal ocupa todo el ancho posible */
        .main-container {
            width: 100%;
            max-width: 100%;
            background: #000;
            margin: 0;
            padding: 0;
        }

        /* El video ocupa todo el ancho de la pantalla */
        .video-full-width {
            position: relative;
            width: 100%;
            background: #000;
            /* Relación 16:9 para que no se deforme */
            aspect-ratio: 16 / 9;
        }

        .video-full-width iframe,
        .video-full-width video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Tarjeta de información debajo (opcional) */
        .info-card {
            background: #111;
            color: #eee;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #333;
            width: 100%;
        }

        .info-card h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .info-card p {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #2c2c2c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #1e6fdf;
        }

        .btn-primary:active {
            background: #0f5bc0;
        }

        /* Para móviles muy pequeños, aseguramos que no haya bordes blancos */
        @media (max-width: 640px) {
            .info-card {
                padding: 16px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="main-container">
    <!-- Reproductor de video a ancho completo -->
    <div class="video-full-width">
        <!-- MÉTODO 1: Iframe mejorado (recomendado) -->
        <iframe 
            src="https://drive.google.com/file/d/1pdzPraW0MjYPI-GaP6tbW_NPrtvL6rRx/preview"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

    <div class="info-card">
        <h2>🎬 Video en alta definición</h2>
        <p>El reproductor se adapta automáticamente al tamaño de tu pantalla. Toca el video para ver los controles táctiles.</p>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.open('https://drive.google.com/file/d/1pdzPraW0MjYPI-GaP6tbW_NPrtvL6rRx/view', '_blank')">
                🔗 Abrir en Google Drive
            </button>
            <button class="btn" onclick="copyVideoLink()">
                📋 Copiar enlace
            </button>
        </div>
    </div>
</div>

<script>
    function copyVideoLink() {
        const url = 'https://drive.google.com/file/d/1pdzPraW0MjYPI-GaP6tbW_NPrtvL6rRx/view';
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('✅ Enlace copiado');
            }).catch(() => fallbackCopy(url));
        } else {
            fallbackCopy(url);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('✅ Enlace copiado');
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '30px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = 'rgba(0,0,0,0.8)';
        toast.style.color = 'white';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '40px';
        toast.style.fontSize = '0.9rem';
        toast.style.zIndex = '10000';
        toast.style.backdropFilter = 'blur(8px)';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
</script>
</body>
</html>
