<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportar Catálogo de Firestore → JS</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0a0a0f; color: #eee; font-family: 'Segoe UI', system-ui, monospace; padding: 30px; }
        h1 { color: #00f3ff; font-weight: 400; letter-spacing: 1px; }
        .card { background: #151520; border-radius: 20px; padding: 25px; max-width: 700px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #2a2a3a; }
        button { background: #00f3ff; color: #000; border: none; padding: 14px 28px; border-radius: 40px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; border: 1px solid #00f3ff; }
        button:hover { background: transparent; color: #00f3ff; box-shadow: 0 0 15px #00f3ff66; }
        button:disabled { opacity: 0.5; pointer-events: none; }
        #log { background: #0b0b12; border-radius: 16px; padding: 20px; margin-top: 25px; height: 350px; overflow-y: auto; font-family: 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 0.9rem; border: 1px solid #2e2e44; }
        .success { color: #2ecc71; }
        .error { color: #ff6b6b; }
        .info { color: #aaa; }
        .highlight { color: #f1c40f; }
    </style>
</head>
<body>
<div class="card">
    <h1>📤 Exportar Colección "catalogo" → archivo JS</h1>
    <p style="margin-bottom: 25px; color: #ccc;">Este proceso <strong>no incluye ratings</strong> ni otras colecciones. Solo descarga los documentos de <code>catalogo</code> y genera un archivo <code>catalogo-export.js</code> listo para respaldo.</p>
    
    <button id="exportBtn" onclick="exportarCatalogo()">⬇️ Iniciar Exportación</button>
    <div id="log">
        <span class="info">⏳ Esperando acción...</span>
    </div>
</div>

<script>
    // Configuración de Firebase (misma que tu proyecto)
    const firebaseConfig = {
        apiKey: "AIzaSyBpzYARIxaJijLbbL-2S6F9MWecbAbvK_I",
        authDomain: "login-admin-archinime.firebaseapp.com",
        projectId: "login-admin-archinime",
        storageBucket: "login-admin-archinime.firebasestorage.app",
        messagingSenderId: "938164660242",
        appId: "1:938164660242:web:648e0dce0e0d18dd78d0cb"
    };

    // Inicializar Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const logEl = document.getElementById('log');
    const exportBtn = document.getElementById('exportBtn');

    // Función para loguear mensajes
    function log(msg, tipo = 'info') {
        const clase = tipo === 'error' ? 'error' : (tipo === 'success' ? 'success' : 'info');
        logEl.innerHTML += `<div class="${clase}">${msg}</div>`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    // Función para limpiar el log (opcional)
    function clearLog() {
        logEl.innerHTML = '';
    }

    // Función principal de exportación
    async function exportarCatalogo() {
        exportBtn.disabled = true;
        exportBtn.textContent = '⏳ Exportando...';
        clearLog();
        log('🔍 Conectando a Firestore y leyendo colección "catalogo"...');
        
        try {
            // Obtener todos los documentos de la colección 'catalogo'
            const snapshot = await db.collection('catalogo').get();
            
            if (snapshot.empty) {
                log('⚠️ La colección "catalogo" está vacía. No hay nada que exportar.', 'error');
                exportBtn.disabled = false;
                exportBtn.textContent = '⬇️ Iniciar Exportación';
                return;
            }

            const docs = snapshot.docs;
            log(`📦 Se encontraron ${docs.length} documentos. Procesando...`);

            // Convertir cada documento a un objeto plano (incluyendo el ID)
            const catalogoData = {};
            let count = 0;
            
            docs.forEach(doc => {
                const data = doc.data();
                // Guardamos el ID como clave (o podemos usar un array, pero objeto es más fácil para búsquedas)
                catalogoData[doc.id] = {
                    id: doc.id,        // incluimos el id por comodidad
                    ...data
                };
                count++;
            });

            log(`✅ ${count} documentos procesados. Preparando archivo JS...`, 'success');

            // Convertir timestamps de Firestore a números (milliseconds) para que sea serializable y fácil de leer
            // También podemos mantenerlos como Timestamp pero en JSON se perdería el tipo.
            const datosParaExportar = {};
            for (const [id, anime] of Object.entries(catalogoData)) {
                const animeLimpio = { ...anime };
                
                // Convertir campos Timestamp a número (milisegundos)
                if (animeLimpio.lastUpdate && typeof animeLimpio.lastUpdate.toMillis === 'function') {
                    animeLimpio.lastUpdate = animeLimpio.lastUpdate.toMillis();
                }
                // Si hay otros campos Timestamp, se pueden tratar aquí.
                
                // También podríamos dejar seasons tal cual, ya que es un array de objetos simple.
                datosParaExportar[id] = animeLimpio;
            }

            // Crear el contenido del archivo JS
            const fecha = new Date().toISOString().split('T')[0];
            const contenidoJS = `// Archivo exportado de Firestore - Colección "catalogo"\n` +
                `// Fecha de exportación: ${new Date().toLocaleString()}\n` +
                `// Total de animes: ${Object.keys(datosParaExportar).length}\n` +
                `// ⚠️ Este archivo NO incluye ratings ni otras colecciones.\n\n` +
                `const catalogoExport = ${JSON.stringify(datosParaExportar, null, 2)};\n\n` +
                `// Si necesitas usarlo como array:\n` +
                `// const catalogoArray = Object.values(catalogoExport);\n`;

            // Crear blob y descargar
            const blob = new Blob([contenidoJS], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `catalogo-export-${fecha}.js`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            log(`🎉 ¡Exportación completada! Archivo "catalogo-export-${fecha}.js" generado.`, 'success');
            log(`💾 Puedes usar este archivo como respaldo o para migrar a otro proyecto.`, 'info');
            
        } catch (error) {
            console.error(error);
            log(`❌ Error durante la exportación: ${error.message}`, 'error');
            if (error.message.includes('permission-denied')) {
                log(`🔐 Verifica que las reglas de Firestore permitan lectura en "catalogo".`, 'error');
            }
        } finally {
            exportBtn.disabled = false;
            exportBtn.textContent = '⬇️ Iniciar Exportación';
        }
    }

    // Exponer función global
    window.exportarCatalogo = exportarCatalogo;
</script>
</body>
</html>
