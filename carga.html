<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cargando Archinime...</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --dark-bg: #050505;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--dark-bg);
      background-image: radial-gradient(circle at center, #111116 0%, #020202 100%);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      color: white;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: 1;
    }
    /* CONTENIDO CENTRAL */
    .loader-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 95vw;
      padding: 20px;
    }
    .gif-wrapper {
      position: relative;
      width: 190px; height: 190px;
      margin-bottom: 25px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      animation: spinGradient 4s linear infinite, floatAnim 2s ease-in-out infinite alternate;
      box-shadow: 0 0 30px rgba(188,19,254,0.4), inset 0 0 20px rgba(0,243,255,0.5);
    }
    .gif-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
    }
    .gif-inner img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .loader-text-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .loader-title {
      font-size: 1.6rem;
      letter-spacing: 8px;
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
      animation: glitchText 4s infinite;
    }
    .loader-percentage {
      font-size: 1rem;
      color: var(--neon-purple);
      letter-spacing: 3px;
      font-weight: 900;
      text-shadow: 0 0 8px var(--neon-purple);
    }
    .loader-line-container {
      width: 320px;
      height: 6px;
      background: rgba(255,255,255,0.05);
      margin-top: 30px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
      border: 1px solid rgba(0,243,255,0.3);
    }
    .loader-line {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-purple), var(--neon-cyan), #fff);
      box-shadow: 0 0 20px var(--neon-cyan), 0 0 10px var(--neon-purple);
      border-radius: 10px;
      animation: loadProgress 3s forwards cubic-bezier(0.8,0,0.2,1);
    }
    /* ===== BANNERS EN LAS 4 ESQUINAS ===== */
    .corner-banner {
      position: fixed;
      z-index: 1000;
      background: rgba(0,0,0,0.5);
      border-radius: 12px;
      padding: 6px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(0,243,255,0.4);
      max-width: 35vw;
      max-height: 35vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }
    .corner-banner iframe {
      max-width: 100%;
      max-height: 100%;
      border: none;
    }
    .corner-tl { top: 12px; left: 12px; }
    .corner-tr { top: 12px; right: 12px; }
    .corner-bl { bottom: 12px; left: 12px; }
    .corner-br { bottom: 12px; right: 12px; }
    @media (max-width: 768px) {
      .corner-banner { max-width: 40vw; max-height: 30vh; padding: 4px; }
    }
    @media (max-width: 480px) {
      .corner-banner { max-width: 45vw; max-height: 25vh; }
    }
    @keyframes loadProgress {
      0% { width: 0%; opacity: 0; }
      10% { opacity: 1; }
      100% { width: 100%; }
    }
    @keyframes floatAnim {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }
    @keyframes spinGradient {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    @keyframes glitchText {
      0%,100% { opacity: 1; transform: skewX(0deg); }
      94% { opacity: 1; transform: skewX(0deg); }
      96% { opacity: 0.8; transform: skewX(6deg); text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan); }
      98% { opacity: 0.9; transform: skewX(-6deg); text-shadow: -2px 0 var(--neon-pink), 2px 0 var(--neon-cyan); }
    }
  </style>
</head>
<body>

<div class="loader-content">
  <div class="gif-wrapper">
    <div class="gif-inner">
      <img id="personaje-gif" src="" alt="Cargando sistema">
    </div>
  </div>
  <div class="loader-text-container">
    <div class="loader-title">ARCHINIME</div>
    <div class="loader-percentage" id="loading-percentage">0%</div>
  </div>
  <div class="loader-line-container">
    <div class="loader-line"></div>
  </div>
</div>

<!-- 4 ESQUINAS PARA BANNERS -->
<div id="bannerTL" class="corner-banner corner-tl"></div>
<div id="bannerTR" class="corner-banner corner-tr"></div>
<div id="bannerBL" class="corner-banner corner-bl"></div>
<div id="bannerBR" class="corner-banner corner-br"></div>

<script src="gifs.js"></script>
<script>
  // ========== GIF ALEATORIO ==========
  if (typeof listaDeGifs !== 'undefined' && listaDeGifs.length) {
    const gifElegido = listaDeGifs[Math.floor(Math.random() * listaDeGifs.length)];
    document.getElementById('personaje-gif').src = gifElegido;
  }

  // ========== PROGRESO Y REDIRECCIÓN (3 segundos) ==========
  const percentageEl = document.getElementById('loading-percentage');
  const duration = 3000;
  const intervalTime = 30;
  const step = (100 / (duration / intervalTime));
  let progress = 0;

  const counterInterval = setInterval(() => {
    progress += step;
    let displayProgress = progress + (Math.random() * 5 - 2.5);
    if (progress >= 100) {
      displayProgress = 100;
      clearInterval(counterInterval);
      percentageEl.innerText = "SISTEMA LISTO";
      percentageEl.style.color = "var(--neon-cyan)";
    } else {
      percentageEl.innerText = Math.max(0, Math.min(99, Math.floor(displayProgress))) + '%';
    }
  }, intervalTime);

  setTimeout(() => {
    window.location.href = 'index.html';
  }, duration);

  // ========== BANNERS EN LAS 4 ESQUINAS (cada uno con un banner aleatorio de los 6) ==========
  const bannerOptionsList = [
    { key: '1904483365c7a7ab9f83e49d32b7d237', width: 468, height: 60 },
    { key: '49281ce83eb56f120e34ad617cfd6996', width: 160, height: 300 },
    { key: '6ecb40404fef8f9daf755244f9c4d753', width: 320, height: 50 },
    { key: '1f072201cddab551b2b65315f6c1643e', width: 728, height: 90 },
    { key: 'c80e9060ab41f7adc2b2ccc358ef6c65', width: 300, height: 250 },
    { key: '190984de4e16fc6eded87c1cb7a9bc83', width: 160, height: 600 }
  ];

  function loadBanner(container, banner) {
    if (!container) return;
    container.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.justifyContent = 'center';
    wrapper.style.alignItems = 'center';
    wrapper.style.width = '100%';
    wrapper.style.height = '100%';
    window.atOptions = {
      key: banner.key,
      format: 'iframe',
      height: banner.height,
      width: banner.width,
      params: {}
    };
    const script = document.createElement('script');
    script.src = `https://www.highperformanceformat.com/${banner.key}/invoke.js`;
    script.async = true;
    script.onerror = () => { console.warn('Error banner:', banner.key); };
    wrapper.appendChild(script);
    container.appendChild(wrapper);
  }

  // Seleccionar 4 banners aleatorios (pueden repetirse si hay pocos, pero con 6 es raro)
  function getRandomBanners(count) {
    const shuffled = [...bannerOptionsList];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, count);
  }

  const corners = ['bannerTL', 'bannerTR', 'bannerBL', 'bannerBR'];
  const selectedBanners = getRandomBanners(4);

  function init() {
    corners.forEach((id, idx) => {
      const container = document.getElementById(id);
      if (container && selectedBanners[idx]) loadBanner(container, selectedBanners[idx]);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
</body>
</html>
