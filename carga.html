<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Archinime...</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --dark-bg: #050505;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--dark-bg);
      background-image: radial-gradient(circle at center, #111116 0%, #020202 100%);
      height: 100vh;
      display: flex; 
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      color: white; 
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1;
    }
    
    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .gif-wrapper {
      position: relative;
      width: 190px; 
      height: 190px;
      margin-bottom: 25px;
      border-radius: 50%; 
      padding: 4px;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      animation: spinGradient 4s linear infinite, floatAnim 2s ease-in-out infinite alternate;
      box-shadow: 0 0 30px rgba(188, 19, 254, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.5);
    }

    .gif-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background-color: #000;
    }

    .gif-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .loader-text-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loader-title {
      font-size: 1.6rem;
      color: white;
      letter-spacing: 8px;
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
      animation: glitchText 4s infinite;
    }

    .loader-percentage {
      font-size: 1rem;
      color: var(--neon-purple);
      letter-spacing: 3px;
      font-weight: 900;
      text-shadow: 0 0 8px var(--neon-purple);
    }

    .loader-line-container {
      width: 320px;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      margin-top: 30px; 
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      position: relative;
    }

    .loader-line {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-purple), var(--neon-cyan), #fff);
      box-shadow: 0 0 20px var(--neon-cyan), 0 0 10px var(--neon-purple);
      border-radius: 10px;
      animation: loadProgress 4.5s forwards cubic-bezier(0.8, 0, 0.2, 1);
    }

    /* ===== CONTENEDOR DEL PATROCINADOR (ADS) ===== */
    .sponsor-container {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100vw;
      overflow: hidden;
      opacity: 0;
      animation: fadeInSponsor 1s ease 0.5s forwards; /* Aparece suavemente después del loader */
    }

    .sponsor-text {
      font-family: 'Poppins', sans-serif;
      font-size: 0.65rem;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
    }

    .ad-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 100%;
      overflow: hidden;
      border-radius: 8px;
    }

    /* Fuerza a que el iframe del anuncio no rompa la pantalla */
    .ad-wrapper iframe {
      max-width: 100% !important;
      object-fit: contain;
    }

    @keyframes loadProgress { 
      0% { width: 0%; opacity: 0;} 
      10% { opacity: 1; }
      100% { width: 100%; } 
    }
    
    @keyframes floatAnim { 
      0% { transform: translateY(0); } 
      100% { transform: translateY(-12px); } 
    }

    @keyframes spinGradient {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    @keyframes glitchText {
      0%, 100% { opacity: 1; transform: skewX(0deg); }
      92% { opacity: 1; transform: skewX(0deg); }
      94% { opacity: 0.8; transform: skewX(10deg); text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan); }
      96% { opacity: 0.9; transform: skewX(-10deg); text-shadow: -2px 0 var(--neon-pink), 2px 0 var(--neon-cyan); }
      98% { opacity: 1; transform: skewX(0deg); }
    }

    @keyframes fadeInSponsor {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="loader-content">
    
    <div class="gif-wrapper">
      <div class="gif-inner">
        <img id="personaje-gif" src="" alt="Cargando sistema" class="character-gif">
      </div>
    </div>
    
    <div class="loader-text-container">
      <div class="loader-title">ARCHINIME</div>
      <div class="loader-percentage" id="loading-percentage">0%</div>
    </div>
    
    <div class="loader-line-container">
      <div class="loader-line"></div>
    </div>

    <div class="sponsor-container">
      <div class="sponsor-text"><i class="fas fa-bolt"></i> Servidores potenciados por</div>
      <div id="ad-wrapper" class="ad-wrapper">
        <script>
          // Lógica para elegir el banner perfecto sin deformar la pantalla
          (function() {
            var banners = [
              { key: '1904483365c7a7ab9f83e49d32b7d237', height: 60, width: 468 },
              { key: '49281ce83eb56f120e34ad617cfd6996', height: 300, width: 160 },
              { key: '6ecb40404fef8f9daf755244f9c4d753', height: 50, width: 320 },
              { key: '1f072201cddab551b2b65315f6c1643e', height: 90, width: 728 },
              { key: 'c80e9060ab41f7adc2b2ccc358ef6c65', height: 250, width: 300 },
              { key: '190984de4e16fc6eded87c1cb7a9bc83', height: 600, width: 160 }
            ];

            var screenW = window.innerWidth;
            var screenH = window.innerHeight;

            // Filtrar banners: solo se muestran los que son más pequeños que el ancho de la pantalla actual (con un margen de seguridad) y que no ocupen toda la altura
            var validBanners = banners.filter(function(ad) { 
              return ad.width <= (screenW * 0.95) && ad.height <= (screenH * 0.4); 
            });

            // Si por alguna razón la pantalla es diminuta, forzamos el banner de móvil (320x50)
            if (validBanners.length === 0) {
              validBanners = [{ key: '6ecb40404fef8f9daf755244f9c4d753', height: 50, width: 320 }];
            }

            // Elegir uno aleatorio entre los que son seguros para esta pantalla
            var chosenAd = validBanners[Math.floor(Math.random() * validBanners.length)];

            // Imprimir la configuración de Adsterra
            window.atOptions = {
              'key' : chosenAd.key,
              'format' : 'iframe',
              'height' : chosenAd.height,
              'width' : chosenAd.width,
              'params' : {}
            };
            
            document.write('<scr' + 'ipt src="https://www.highperformanceformat.com/' + chosenAd.key + '/invoke.js"></scr' + 'ipt>');
          })();
        </script>
      </div>
    </div>

  </div>

  <script src="gifs.js"></script>

  <script>
    // Leemos la lista que está en el otro documento (gifs.js)
    if (typeof listaDeGifs !== 'undefined' && listaDeGifs.length > 0) {
      const gifElegido = listaDeGifs[Math.floor(Math.random() * listaDeGifs.length)];
      document.getElementById('personaje-gif').src = gifElegido;
    }

    // Lógica del contador y redirección
    const percentageEl = document.getElementById('loading-percentage');
    // Aumentado a 4.5s (4500ms) para darle tiempo al anuncio de cargar y contabilizar la impresión
    const duration = 4500; 
    const intervalTime = 30; 
    const step = (100 / (duration / intervalTime));
    let progress = 0;

    const counterInterval = setInterval(() => {
      progress += step;
      let displayProgress = progress + (Math.random() * 5 - 2.5); 
      
      if (progress >= 100) {
        displayProgress = 100;
        clearInterval(counterInterval);
        percentageEl.innerText = "SISTEMA LISTO";
        percentageEl.style.color = "var(--neon-cyan)";
      } else {
        percentageEl.innerText = Math.max(0, Math.min(99, Math.floor(displayProgress))) + '%';
      }
    }, intervalTime);

    setTimeout(() => {
      window.location.href = 'index.html';
    }, duration);
  </script>
</body>
</html>
