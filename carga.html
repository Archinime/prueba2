<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Archinime...</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --dark-bg: #050505;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--dark-bg);
      background-image: radial-gradient(circle at center, #111116 0%, #020202 100%);
      height: 100vh;
      display: flex; 
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      color: white; 
      overflow: hidden;
      position: relative;
    }

    /* Efecto de líneas de escaneo Cyberpunk de fondo */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1;
    }
    
    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Contenedor Holográfico para el GIF con fondo animado */
    .gif-wrapper {
      position: relative;
      width: 190px; 
      height: 190px;
      margin-bottom: 25px;
      border-radius: 50%; /* Corte circular para disimular bordes duros del gif */
      padding: 4px;
      /* Borde de gradiente animado que no afecta los colores del gif */
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      animation: spinGradient 4s linear infinite, floatAnim 2s ease-in-out infinite alternate;
      box-shadow: 0 0 30px rgba(188, 19, 254, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.5);
    }

    .gif-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background-color: #000;
    }

    .gif-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Asegura que la imagen llene el círculo perfectamente */
    }

    /* Textos y contadores */
    .loader-text-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loader-title {
      font-size: 1.6rem;
      color: white;
      letter-spacing: 8px;
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
      animation: glitchText 4s infinite;
    }

    .loader-percentage {
      font-size: 1rem;
      color: var(--neon-purple);
      letter-spacing: 3px;
      font-weight: 900;
      text-shadow: 0 0 8px var(--neon-purple);
    }

    /* Barra de progreso */
    .loader-line-container {
      width: 320px;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      margin-top: 30px; 
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      position: relative;
    }

    .loader-line {
      width: 0; 
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-purple), var(--neon-cyan), #fff);
      box-shadow: 0 0 20px var(--neon-cyan), 0 0 10px var(--neon-purple);
      border-radius: 10px;
      animation: loadProgress 3s forwards cubic-bezier(0.8, 0, 0.2, 1);
    }

    /* Animaciones */
    @keyframes loadProgress { 
      0% { width: 0%; opacity: 0;} 
      10% { opacity: 1; }
      100% { width: 100%; } 
    }
    
    @keyframes floatAnim { 
      0% { transform: translateY(0); } 
      100% { transform: translateY(-12px); } 
    }

    /* Rota el color únicamente del borde holográfico exterior */
    @keyframes spinGradient {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    /* Efecto glitch esporádico en el texto */
    @keyframes glitchText {
      0%, 100% { opacity: 1; transform: skewX(0deg); }
      92% { opacity: 1; transform: skewX(0deg); }
      94% { opacity: 0.8; transform: skewX(10deg); text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan); }
      96% { opacity: 0.9; transform: skewX(-10deg); text-shadow: -2px 0 var(--neon-pink), 2px 0 var(--neon-cyan); }
      98% { opacity: 1; transform: skewX(0deg); }
    }
  </style>
</head>
<body>

  <div class="loader-content">
    
    <div class="gif-wrapper">
      <div class="gif-inner">
        <img src="chica_corriendo.gif" alt="Cargando sistema" class="character-gif">
      </div>
    </div>
    
    <div class="loader-text-container">
      <div class="loader-title">ARCHINIME</div>
      <div class="loader-percentage" id="loading-percentage">0%</div>
    </div>
    
    <div class="loader-line-container">
      <div class="loader-line"></div>
    </div>

  </div>

  <script>
    // Lógica para sincronizar el porcentaje numérico con la animación de 3 segundos
    const percentageEl = document.getElementById('loading-percentage');
    const duration = 3000; // 3 segundos
    const intervalTime = 30;
    // Actualizar cada 30ms para fluidez
    const step = (100 / (duration / intervalTime));
    let progress = 0;

    // Simular la carga numérica
    const counterInterval = setInterval(() => {
      progress += step;
      // Añadir un ligero efecto de "pausa/carga irregular" típica de las UI Cyberpunk
      let displayProgress = progress + (Math.random() * 5 - 2.5); 
      
      if (progress >= 100) {
        displayProgress = 100;
        clearInterval(counterInterval);
        
        percentageEl.innerText = "SISTEMA LISTO";
        percentageEl.style.color = "var(--neon-cyan)";
      } else {
        percentageEl.innerText = Math.max(0, Math.min(99, Math.floor(displayProgress))) + '%';
      }
    }, intervalTime);

    // Redirigir al finalizar
    setTimeout(() => {
      window.location.href = 'index.html';
    }, duration);
  </script>
</body>
</html>
